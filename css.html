<style>
/* ============================================================
   LessonLen — gaya global
   Palet resmi KESEPAKATAN-SISTEM.md §1
   ============================================================ */

:root {
  --hijau:        #7BC96F;
  --hijau-tua:    #4E9A4A;
  --hijau-muda:   #D9F2D4;
  --permukaan:    #F6FBF5;
  --sukses:       #3FA34D;
  --peringatan:   #E0A82E;
  --bahaya:       #D9534F;
  --terkunci:     #B8C4B6;
  --teks:         #233524;
  --teks-lembut:  #5A6B5B;
  --garis:        #DDE7DC;
  --putih:        #FFFFFF;

  --radius:    12px;
  --radius-sm: 8px;
  --bayang:    0 1px 3px rgba(35,53,36,.08);
  --bayang-mn: 0 4px 12px rgba(35,53,36,.12);
  --bayang-bs: 0 8px 28px rgba(35,53,36,.16);
  --sela:      16px;
  --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont,
          'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font);
  color: var(--teks);
  background: var(--permukaan);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;

  /* JARING PENGAMAN (v1.6.6).

     Satu elemen yang meluber cukup untuk membuat SELURUH halaman
     bisa digeser ke samping di ponsel — dan sebabnya nyaris
     mustahil ditemukan dengan mata, karena gejalanya muncul di
     semua halaman sekaligus.

     `overflow-x: hidden` memotong luberan itu di tingkat halaman.
     Ia TIDAK menghalangi penggulir yang disengaja: `.tabel-gulir`
     dan `.konten-kaya` punya overflow sendiri, dan elemen ber-
     overflow tetap bisa digulir di dalam kotaknya.

     Dipasang pada html DAN body: sebagian peramban seluler
     mengabaikannya bila hanya salah satu. */
  overflow-x: hidden;
  width: 100%;
}

/* Gambar & media tidak boleh melebihi induknya — penyebab overflow
   paling sering setelah margin negatif. */
img, video, iframe, svg, canvas { max-width: 100%; }

/* ---------------------------------------------- tipografi */
h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
a  { color: var(--hijau-tua); text-decoration: none; }
a:hover { text-decoration: underline; }
.lembut { color: var(--teks-lembut); }
.kecil  { font-size: .85rem; }
.tebal  { font-weight: 700; }
.tengah { text-align: center; }

/* ---------------------------------------------- tata letak */
.wadah { max-width: 1080px; margin: 0 auto; padding: 0 var(--sela); }
/* flex-wrap WAJIB di sini. Tanpa ini, "judul panjang + tombol" pada
   .kepala-halaman berdesakan di layar 360px: tombolnya tergencet
   sampai tulisannya terpotong. Sebelum v1.6.0 gejalanya ditambal
   satu per satu dengan style="flex-wrap:wrap" inline — sebelas kali
   di enam berkas, dan tetap tidak menutup semua kasus. */
.baris { display: flex; flex-wrap: wrap; gap: var(--sela); align-items: center; }
.baris-antara { display: flex; flex-wrap: wrap; gap: var(--sela);
                align-items: center; justify-content: space-between; }
.kolom { display: flex; flex-direction: column; gap: var(--sela); }

/* min-width:0 memungkinkan anak flex MENYUSUT di bawah lebar isinya.
   Tanpa ini, judul panjang tanpa spasi mendorong tetangganya keluar
   layar — penyebab paling sering gulir mendatar yang tak diinginkan. */
.tumbuh { flex: 1; min-width: 0; }
.sela-kecil { gap: 8px; }

/* ---------------------------------------------- kartu */
.kartu {
  background: var(--putih);
  border: 1px solid var(--garis);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--bayang);
}
.kartu-rapat { padding: 14px 16px; }

/* ---------------------------------------------- tombol */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  min-height: 44px; padding: 10px 18px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  background: var(--hijau); color: #fff;
  font-family: var(--font); font-size: .95rem; font-weight: 600;
  cursor: pointer; transition: background .15s, transform .05s, opacity .15s;
  white-space: nowrap;
}
.btn:hover:not(:disabled)  { background: var(--hijau-tua); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.btn-hantu {
  background: transparent; color: var(--hijau-tua);
  border-color: var(--garis);
}
.btn-hantu:hover:not(:disabled) { background: var(--hijau-muda); }

.btn-teks {
  background: transparent; color: var(--teks-lembut);
  border: none; min-height: 36px; padding: 6px 10px;
}
.btn-teks:hover:not(:disabled) { background: var(--hijau-muda); color: var(--teks); }

.btn-bahaya { background: var(--bahaya); }
.btn-bahaya:hover:not(:disabled) { background: #C0403C; }

.btn-penuh { width: 100%; }
.btn-kecil { min-height: 36px; padding: 6px 12px; font-size: .87rem; }

/* `.btn` juga dipakai pada <a> — mis. tombol "Hubungi Guru" yang
   membuka WhatsApp (v1.11.1). Tanpa ini ia tampil bergaris bawah
   dan warnanya diambil alih gaya tautan bawaan. */
a.btn, a.btn:hover, a.btn:visited { text-decoration: none; }
a.btn-hantu:visited { color: var(--hijau-tua); }

/* Nama murid di topbar dapat diklik — beri isyarat bahwa ia tombol,
   bukan sekadar label. */
.tombol-profil { font-weight: 600; }
.tombol-profil:hover { color: var(--hijau-tua); }

/* Enam kelas di bawah ini dipakai 30 kali di sembilan berkas tetapi
   TIDAK PERNAH didefinisikan (audit v1.6.0) — pola yang sama dengan
   `.konten-kaya` pada v1.5.6. Tombolnya tetap muncul karena mewarisi
   `.btn`, sehingga cacatnya tidak kentara: `btn-bahaya-hantu` tampil
   HIJAU seperti tombol biasa, padahal dipakai untuk menghapus. */

/* alias eksplisit — `.btn` sendiri sudah berwarna hijau utama */
.btn-utama { background: var(--hijau); color: #fff; }
.btn-utama:hover:not(:disabled) { background: var(--hijau-tua); }

.btn-sukses { background: var(--sukses); color: #fff; }
.btn-sukses:hover:not(:disabled) { background: #35893F; }

/* Tombol merusak bergaya hantu: tepi & teks merah, latar bening.
   Dipakai "Lepas kelompok" dan "🗑" pada kartu soal. */
.btn-bahaya-hantu {
  background: transparent; color: var(--bahaya);
  border-color: var(--garis);
}
.btn-bahaya-hantu:hover:not(:disabled) {
  background: #FBE3E2; border-color: var(--bahaya); color: var(--bahaya);
}

/* Tombol ikon dalam baris padat (↑ ↓ ✏️ 🗑).
   36px tetap dipertahankan sebagai target sentuh minimum yang wajar
   untuk kendali sekunder; tombol aksi utama tetap 44px. */
.btn-mini {
  min-height: 36px; min-width: 36px;
  padding: 4px 8px; font-size: .82rem;
}

.judul-kartu {
  font-size: .95rem; font-weight: 700;
  margin-bottom: 10px; color: var(--teks);
}

/* ---------------------------------------------- formulir */
.grup { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.grup label { font-size: .88rem; font-weight: 600; color: var(--teks); }

/* `.input` adalah ALIAS `.isian`.

   js_quiz.html memakai class="input" di 16 tempat — termasuk kotak
   jawaban esai murid dan form nilai esai guru — sementara kelas yang
   didefinisikan bernama `.isian`. Akibatnya seluruh kotak itu tampil
   TANPA GAYA: tanpa tepi, tanpa tinggi sentuh 44px, dan tanpa
   font 16px yang mencegah auto-zoom iOS.

   Dijadikan alias, bukan disunting satu per satu, supaya penamaan
   lama tetap sah dan tidak ada yang terlewat. */
.isian, .input {
  width: 100%; min-height: 44px; padding: 10px 14px;
  border: 1px solid var(--garis); border-radius: var(--radius-sm);
  background: var(--putih); color: var(--teks);
  font-family: var(--font); font-size: .95rem;
  transition: border-color .15s, box-shadow .15s;
}

/* iOS Safari MEMPERBESAR halaman otomatis saat pengguna menyentuh
   isian ber-font < 16px, lalu tidak mengembalikannya. Murid yang
   mengetik jawaban esai di ponsel terjebak pada tampilan zoom.
   16px hanya dipasang di layar sentuh sempit supaya tata letak
   desktop tidak berubah. */
@media (max-width: 640px) {
  .isian, textarea.isian, select.isian,
  .input, textarea.input, select.input { font-size: 16px; }
}
.isian:focus, .input:focus {
  outline: none; border-color: var(--hijau);
  box-shadow: 0 0 0 3px rgba(123,201,111,.22);
}
.isian::placeholder, .input::placeholder { color: #9AAB9B; }
.isian.salah, .input.salah { border-color: var(--bahaya); }
textarea.isian, textarea.input {
  min-height: 90px; resize: vertical; line-height: 1.5;
}

.bantuan { font-size: .8rem; color: var(--teks-lembut); }
.pesan-salah { font-size: .82rem; color: var(--bahaya); min-height: 1em; }

/* ---------------------------------------------- lencana */
.lencana {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 999px;
  font-size: .78rem; font-weight: 700;
  background: var(--hijau-muda); color: var(--hijau-tua);
}
.lencana-sukses   { background: #DFF3E2; color: var(--sukses); }
.lencana-peringatan { background: #FBF0D8; color: #9A7414; }
.lencana-bahaya   { background: #FBE3E2; color: var(--bahaya); }
.lencana-terkunci { background: #ECF0EB; color: #74836F; }

/* ---------------------------------------------- header aplikasi */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--putih); border-bottom: 1px solid var(--garis);
  box-shadow: var(--bayang);
}
.topbar-isi {
  max-width: 1080px; margin: 0 auto;
  padding: 10px var(--sela);
  display: flex; align-items: center; gap: 12px;
}
.merek { display: flex; align-items: center; gap: 9px; font-weight: 800;
         color: var(--hijau-tua); font-size: 1.05rem; }
.merek-ikon { font-size: 1.3rem; }

.lonceng { position: relative; }
.lonceng-titik {
  position: absolute; top: 2px; right: 2px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 999px; background: var(--bahaya); color: #fff;
  font-size: .68rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* ---------------------------------------------- layar login */
.layar-login {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: linear-gradient(160deg, var(--hijau-muda) 0%, var(--permukaan) 55%);
}
.kotak-login {
  width: 100%; max-width: 400px;
  background: var(--putih);
  border-radius: 18px; padding: 32px 28px;
  box-shadow: var(--bayang-bs);
}
.login-merek { text-align: center; margin-bottom: 26px; }
.login-merek .ikon { font-size: 2.6rem; line-height: 1; }
.login-merek h1 { color: var(--hijau-tua); margin-top: 6px; }
.login-merek p  { color: var(--teks-lembut); font-size: .88rem; }

/* ---------------------------------------------- toast */
#toast-wadah {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  z-index: 90; display: flex; flex-direction: column; gap: 8px;
  width: calc(100% - 32px); max-width: 420px;
}
.toast {
  padding: 12px 16px; border-radius: var(--radius-sm);
  background: var(--teks); color: #fff;
  font-size: .9rem; box-shadow: var(--bayang-bs);
  animation: naik .22s ease;
}
.toast-sukses { background: var(--sukses); }
.toast-bahaya { background: var(--bahaya); }
.toast-peringatan { background: var(--peringatan); color: #2B2100; }
@keyframes naik { from { opacity: 0; transform: translateY(12px); } }

/* ---------------------------------------------- memuat */
#tirai-muat {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(246,251,245,.72);
  display: none; align-items: center; justify-content: center;
}
#tirai-muat.tampil { display: flex; }

/* Operasi tulis Apps Script butuh 3–10 detik. Pemutar tanpa teks
   membuat murid mengira aplikasinya menggantung lalu mengklik ulang
   tombolnya, jadi tirai bisa membawa keterangan. */
.kotak-muat {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 24px 28px; max-width: 300px; text-align: center;
}
.pesan-muat {
  font-size: .92rem; font-weight: 700; color: var(--hijau-tua);
  line-height: 1.5;
}
.pesan-muat:empty { display: none; }

.putar {
  width: 34px; height: 34px;
  border: 3px solid var(--hijau-muda); border-top-color: var(--hijau);
  border-radius: 50%; animation: berputar .8s linear infinite;
}
.putar-kecil { width: 16px; height: 16px; border-width: 2px; }
@keyframes berputar { to { transform: rotate(360deg); } }

.rangka {
  background: linear-gradient(90deg, #EDF3EC 25%, #F7FAF6 50%, #EDF3EC 75%);
  background-size: 200% 100%;
  animation: kilau 1.3s infinite; border-radius: var(--radius-sm);
}
@keyframes kilau { to { background-position: -200% 0; } }

/* ---------------------------------------------- keadaan kosong */
.kosong { text-align: center; padding: 46px 20px; color: var(--teks-lembut); }
.kosong .ikon { font-size: 2.6rem; opacity: .5; }
.kosong h3 { margin: 10px 0 4px; color: var(--teks); }

/* ---------------------------------------------- dialog */
.tirai-dialog {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(35,53,36,.42);
  display: none; align-items: center; justify-content: center; padding: 20px;

  /* Tirai ikut digulir bila dialognya tetap lebih tinggi dari layar
     (mis. ponsel mendatar, tinggi < 400px). Tanpa ini tombol Simpan
     bisa berada di luar jangkauan. */
  overflow-y: auto;
}
.tirai-dialog.tampil { display: flex; }

.dialog {
  background: var(--putih); border-radius: var(--radius);
  padding: 24px; width: 100%; max-width: 420px;
  box-shadow: var(--bayang-bs);

  /* WAJIB di sini, bukan hanya di .dialog-lebar.

     Sebelum v1.6.2 hanya `.dialog-lebar` yang punya batas tinggi,
     dan kelas itu dipasang manual dari JS — hanya pada 1 dari 24
     dialog. Dua puluh tiga dialog sisanya, termasuk "Buat Soal
     dengan AI" yang berisi 6 medan, TERPOTONG di layar pendek
     tanpa bisa digulir sama sekali (laporan guru v1.6.2).

     Batas dipasang di elemen dialognya sendiri supaya isinya yang
     bergulir, sementara tepi & bayangannya tetap utuh. */
  max-height: calc(100vh - 40px);
  overflow-y: auto;

  /* momentum scroll iOS — tanpa ini gulir terasa macet */
  -webkit-overflow-scrolling: touch;
}
.dialog h3 { margin-bottom: 8px; }

/* Tombol aksi menempel di dasar dialog saat isinya digulir, supaya
   Simpan/Batal selalu terlihat tanpa harus menggulir sampai bawah. */
.dialog-aksi {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: flex-end; margin-top: 20px;
  position: sticky; bottom: -24px;
  background: var(--putih);
  padding: 12px 0 0;
  margin-bottom: -24px;
  padding-bottom: 24px;
}

@media (max-width: 640px) {
  /* Di ponsel dialog memakai hampir seluruh layar; padding tirai
     dikurangi supaya ruang isi tidak terbuang. */
  .tirai-dialog { padding: 10px; align-items: flex-start; }
  .dialog {
    padding: 18px;
    max-height: calc(100vh - 20px);
  }
  .dialog-aksi {
    bottom: -18px; margin-bottom: -18px;
    padding-bottom: 18px;
  }
  /* tombol dialog memenuhi lebar agar mudah disentuh */
  .dialog-aksi .btn { flex: 1 1 auto; }
}

/* ---------------------------------------------- utilitas */
.sembunyi { display: none !important; }
.mt-4  { margin-top: 4px; }
.mt-8  { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.p-16  { padding: 16px; }

/* mt-4, mt-12 & mb-12 dipakai 19 kali tetapi TIDAK PERNAH
   didefinisikan sampai v1.6.0 — elemennya menempel tanpa jarak,
   dan cacatnya sulit terlihat karena hanya "agak rapat". */

.kotak-kode {
  font-family: 'SF Mono', Consolas, monospace;
  background: var(--hijau-muda); color: var(--hijau-tua);
  padding: 14px; border-radius: var(--radius-sm);
  font-size: 1.2rem; font-weight: 700; letter-spacing: .12em;
  text-align: center; user-select: all;
}

/* ---------------------------------------------- responsif */
@media (max-width: 640px) {
  body { font-size: 14.5px; }
  .wadah { padding: 0 12px; }
  .kartu { padding: 16px; }
  .kotak-login { padding: 26px 20px; }
  h1 { font-size: 1.35rem; }
  .sembunyi-hp { display: none !important; }
}

/* ============================================================
   TAHAP 3 — dashboard, pertemuan, progres
   ============================================================ */

/* ---------------------------------------------- kisi statistik */
.kisi-statistik {
  display: grid; gap: 12px; margin-bottom: 20px;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
}
.kartu-statistik { display: flex; flex-direction: column; gap: 2px; }
.kartu-statistik .ikon  { font-size: 1.5rem; }
.kartu-statistik .angka { font-size: 1.75rem; font-weight: 800; line-height: 1.15; }

/* ---------------------------------------------- bilah progres */
.bilah {
  height: 8px; border-radius: 999px;
  background: var(--hijau-muda); overflow: hidden;
}
.bilah-isi {
  height: 100%; border-radius: 999px;
  background: var(--hijau); transition: width .4s ease;
}
.bilah-isi.penuh { background: var(--sukses); }
.bilah-tipis { height: 6px; }

/* ---------------------------------------------- kartu kelas */
.kartu-kelas {
  display: block; width: 100%; text-align: left;
  background: var(--putih); border: 1px solid var(--garis);
  border-radius: var(--radius); padding: 18px;
  box-shadow: var(--bayang); cursor: pointer;
  font-family: var(--font); color: var(--teks);
  transition: box-shadow .15s, transform .08s, border-color .15s;
}
.kartu-kelas:hover {
  box-shadow: var(--bayang-mn); border-color: var(--hijau);
}
.kartu-kelas:active { transform: translateY(1px); }
.kartu-kelas .judul { font-weight: 700; font-size: 1.05rem; }
.kartu-kelas .mapel {
  font-size: .84rem; color: var(--teks-lembut);
  display: -webkit-box; -webkit-line-clamp: 1;
  -webkit-box-orient: vertical; overflow: hidden;
}

/* ---------------------------------------------- daftar pertemuan */
.baris-pertemuan {
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left;
  padding: 14px 16px; border: 1px solid var(--garis);
  border-radius: var(--radius); background: var(--putih);
  font-family: var(--font); color: var(--teks);
  cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.baris-pertemuan:hover:not(.terkunci) {
  border-color: var(--hijau); box-shadow: var(--bayang);
}
.baris-pertemuan.terkunci {
  background: #FAFBFA; color: var(--terkunci); cursor: not-allowed;
}
.baris-pertemuan.selesai { border-left: 3px solid var(--sukses); }
.baris-pertemuan.berjalan { border-left: 3px solid var(--hijau); }

/* ---------------------------------------------- item di bawah pertemuan
   v1.14.0 — permintaan guru: item tampil langsung di Daftar Isi supaya
   murid tidak perlu dua klik. Sengaja lebih ringan daripada baris
   pertemuan: tanpa bingkai, sedikit menjorok, agar hierarkinya terbaca
   sekilas dan halaman tidak terasa penuh kotak. */
/* Pelipatan per pertemuan (v1.14.2) — permintaan guru: hanya
   pertemuan yang SEDANG DIKERJAKAN yang terbuka; yang selesai dan
   terkunci dilipat supaya halaman tidak sepanjang 8x5 item. */
.blok-pertemuan { display: block; position: relative; }

/* Ruang untuk panah. Hanya diberikan bila pertemuannya memang punya
   item — pertemuan kosong tidak boleh ikut menjorok tanpa alasan. */
.blok-pertemuan.punya-lipat .baris-pertemuan { padding-left: 40px; }

/* Tombol tersendiri yang menumpang di atas baris: <button> di dalam
   <button> tidak sah dan tidak dapat dijangkau papan ketik. */
.btn-lipat-ptm {
  position: absolute; left: 4px; top: 10px; z-index: 1;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border: 0; background: none; cursor: pointer;
  border-radius: var(--radius-sm); padding: 0;
}
.btn-lipat-ptm:hover { background: var(--permukaan); }

.item-ptm {
  list-style: none; margin: 2px 0 0; padding: 0 0 0 30px;
  border-left: 1px dashed var(--garis); margin-left: 18px;
}

.item-baris {
  display: flex; align-items: center; gap: 9px;
  width: 100%; text-align: left;
  padding: 7px 10px; margin: 1px 0;
  border: 0; background: none; cursor: pointer;
  border-radius: var(--radius-sm);
  font-family: var(--font); color: var(--teks);
  font-size: .88rem; line-height: 1.3;
}
.item-baris:hover:not(.terkunci) { background: var(--permukaan); }
.item-baris.terkunci { color: var(--terkunci); cursor: not-allowed; }

.item-ikon { flex: none; width: 18px; text-align: center; }

/* Judul item bisa panjang — dipotong satu baris supaya daftar tetap
   terbaca sebagai daftar, bukan paragraf. */
.item-judul {
  display: inline-block; max-width: 100%; vertical-align: bottom;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.item-opsional {
  flex: none; font-size: .72rem; color: var(--teks-lembut);
  border: 1px solid var(--garis); border-radius: 999px;
  padding: 1px 7px;
}

@media (max-width: 600px) {
  /* Layar sempit: kurangi jorokan supaya judul item tidak tergencet. */
  .item-ptm { padding-left: 16px; margin-left: 12px; }
}

.nomor-pertemuan {
  flex: 0 0 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: .95rem;
  background: var(--hijau-muda); color: var(--hijau-tua);
}
.baris-pertemuan.selesai  .nomor-pertemuan { background: var(--sukses); color: #fff; }
.baris-pertemuan.berjalan .nomor-pertemuan { background: var(--hijau);  color: #fff; }
.baris-pertemuan.terkunci .nomor-pertemuan { background: #E8ECE7; color: var(--terkunci); }

/* ---------------------------------------------- sidebar: Materi Pokok */

.sisi-mp { margin-bottom: 6px; }

.sisi-mp-judul {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 10px;
  border: 0; background: var(--permukaan); cursor: pointer;
  text-align: left; border-radius: var(--radius-sm);
  font-family: var(--font); color: var(--teks);
}
.sisi-mp-judul:hover { background: var(--hijau-muda); }
.sisi-mp.terkunci .sisi-mp-judul { opacity: .62; }
.sisi-mp-judul .tumbuh { min-width: 0; display: block; }
.sisi-mp-teks {
  display: block; font-size: .88rem; font-weight: 800; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Pertemuan menjorok ke dalam dengan garis penghubung, supaya jelas
   ia milik materi pokok di atasnya dan bukan sejajar dengannya. */
.sisi-mp-isi {
  border-left: 2px solid var(--garis);
  margin: 2px 0 2px 14px; padding-left: 6px;
}

/* ---------------------------------------------- panel tindakan */
.panel-tindakan {
  border-left: 3px solid var(--peringatan);
  background: #FFFBF0;
}
.btn-tindakan {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left; padding: 10px 12px;
  border: 1px solid var(--garis); border-radius: var(--radius-sm);
  background: var(--putih); font-family: var(--font);
  color: var(--teks); cursor: pointer; transition: border-color .15s;
}
.btn-tindakan:hover { border-color: var(--peringatan); }
.btn-tindakan .jml {
  margin-left: auto; font-weight: 800; color: var(--peringatan);
}

/* ---------------------------------------------- daftar notifikasi */
.notif-baris {
  display: flex; gap: 12px; padding: 12px;
  border-radius: var(--radius-sm); cursor: pointer;
  transition: background .12s;
}
.notif-baris:hover { background: var(--permukaan); }
.notif-baris.belum { background: #FFFDF6; }
.notif-baris .ikon { font-size: 1.15rem; flex: 0 0 auto; }
.notif-titik {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--peringatan); flex: 0 0 auto; margin-top: 7px;
}

/* ---------------------------------------------- konten materi */
.isi-materi { line-height: 1.75; font-size: 1rem; }
.isi-materi h3 { margin: 22px 0 8px; color: var(--hijau-tua); }
.isi-materi h4 { margin: 18px 0 6px; }
.isi-materi p  { margin-bottom: 12px; }
.isi-materi ul, .isi-materi ol { margin: 0 0 12px 22px; }
.isi-materi li { margin-bottom: 5px; }
.isi-materi img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }
.isi-materi table {
  width: 100%; border-collapse: collapse; margin: 14px 0; font-size: .92rem;
}
.isi-materi th, .isi-materi td {
  border: 1px solid var(--garis); padding: 9px 12px; text-align: left;
}
.isi-materi th { background: var(--hijau-muda); font-weight: 700; }
.isi-materi pre {
  background: #F2F6F1; border: 1px solid var(--garis);
  border-radius: var(--radius-sm); padding: 14px;
  overflow-x: auto; font-size: .87rem; line-height: 1.55;
  font-family: 'SF Mono', Consolas, monospace;
}
.isi-materi code {
  background: var(--hijau-muda); padding: 2px 6px;
  border-radius: 4px; font-size: .89em;
  font-family: 'SF Mono', Consolas, monospace;
}
.isi-materi pre code { background: none; padding: 0; }
.isi-materi blockquote {
  border-left: 3px solid var(--hijau);
  padding-left: 14px; margin: 14px 0; color: var(--teks-lembut);
}
.isi-materi iframe {
  width: 100%; aspect-ratio: 16/9; border: 0;
  border-radius: var(--radius-sm);
}

/* Bingkai video YouTube (v1.9.8).

   `aspect-ratio` sudah menangani rasio di peramban baru, tetapi
   bingkai ini tetap perlu: ia memberi jarak antar-paragraf dan
   menjadi penanda blok yang tidak dapat disunting di dalam editor —
   tanpa itu kursor bisa masuk ke dalam iframe dan merusaknya. */
.bingkai-video {
  margin: 16px 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #000;
}
.bingkai-video iframe {
  display: block;
  width: 100%; aspect-ratio: 16/9; border: 0;
}

/* penanda saran gambar dari AI */
.isi-materi [data-saran-gambar] {
  border: 2px dashed var(--terkunci); border-radius: var(--radius-sm);
  padding: 18px; text-align: center; color: var(--teks-lembut);
  font-size: .85rem; margin: 14px 0;
}
.isi-materi [data-saran-gambar]::before { content: "🖼 " attr(data-saran-gambar); }

/* ---------------------------------------------- navigasi bagian */
.titik-bagian { display: flex; gap: 6px; align-items: center; }
.titik {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--garis); transition: background .2s;
}
.titik.aktif  { background: var(--hijau); transform: scale(1.25); }
.titik.lewat  { background: var(--sukses); }

/* ---------------------------------------------- kepala halaman */
.kepala-halaman { margin-bottom: 18px; }
.kepala-halaman h1 { margin-bottom: 2px; }
.tautan-balik {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .87rem; color: var(--teks-lembut);
  background: none; border: none; cursor: pointer;
  font-family: var(--font); padding: 4px 0; margin-bottom: 8px;
}
.tautan-balik:hover { color: var(--hijau-tua); }

@media (max-width: 640px) {
  .kisi-statistik { grid-template-columns: repeat(2, 1fr); }
  .kartu-statistik .angka { font-size: 1.45rem; }
}


/* ============================================================
   TAHAP 4 — CRUD, editor, tabel
   ============================================================ */

/* ---------------------------------------------- tab */
.tab-baris {
  display: flex; gap: 4px; border-bottom: 1px solid var(--garis);
  margin-bottom: 18px; overflow-x: auto;
}
.tab {
  padding: 10px 16px; border: none; background: none;
  font-family: var(--font); font-size: .92rem; font-weight: 600;
  color: var(--teks-lembut); cursor: pointer; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--teks); }
.tab.aktif { color: var(--hijau-tua); border-bottom-color: var(--hijau); }

/* ---------------------------------------------- tabel */
.tabel { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tabel th {
  text-align: left; padding: 10px 12px; font-weight: 700;
  color: var(--teks-lembut); font-size: .82rem;
  border-bottom: 1px solid var(--garis); white-space: nowrap;
}
.tabel td { padding: 11px 12px; border-bottom: 1px solid var(--garis); }
.tabel tr:last-child td { border-bottom: none; }
.tabel tbody tr:hover { background: var(--permukaan); }
/* Margin negatif SENGAJA DIBUANG (v1.6.6).

   Dulu dipakai margin mendatar bernilai minus (dan padding sebesar
   itu) agar tabel bisa "menembus" padding induknya sehingga terasa
   penuh selebar layar.

   Tetapi trik itu melebarkan elemen 32px MELEWATI induknya. Bila
   induknya sudah selebar layar — atau berpadding lebih kecil dari
   16px, seperti kartu `padding:6px` pada tabel murid — kelebihannya
   mendorong seluruh halaman dan MEMBUAT SELURUH APLIKASI BISA
   DIGESER ke samping di ponsel (laporan guru v1.6.6).

   Gejalanya muncul di SEMUA halaman karena pembungkus ini dipakai
   delapan kali di lima berkas. */
.tabel-gulir {
  overflow-x: auto;
  max-width: 100%;
  -webkit-overflow-scrolling: touch;
}

/* ---------------------------------------------- baris item */
.baris-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border: 1px solid var(--garis);
  border-radius: var(--radius-sm); background: var(--putih);
  transition: border-color .15s;
}
.baris-item:hover { border-color: var(--hijau); }
.baris-item.draf { border-style: dashed; background: #FCFDFB; }

.ikon-tipe {
  flex: 0 0 34px; height: 34px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem; background: var(--hijau-muda);
}
.ikon-tipe.lkpd { background: #FBF0D8; }
.ikon-tipe.quiz { background: #E3EDFB; }

.pegangan {
  cursor: grab; color: var(--terkunci); font-size: 1.1rem;
  padding: 0 2px; user-select: none;
}
.pegangan:active { cursor: grabbing; }
.seret-atas { opacity: .4; }

/* ---------------------------------------------- editor konten */
.editor-bar {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 8px;
  border: 1px solid var(--garis); border-bottom: none;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  background: var(--permukaan);
}
.editor-bar .pisah {
  width: 1px; background: var(--garis); margin: 2px 4px;
}
.btn-alat {
  min-width: 34px; height: 34px; padding: 0 8px;
  border: 1px solid transparent; border-radius: 6px;
  background: none; cursor: pointer;
  font-family: var(--font); font-size: .88rem; color: var(--teks);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.btn-alat:hover { background: var(--hijau-muda); }
.btn-alat.utama { color: var(--hijau-tua); font-weight: 700; }

.editor-isi {
  min-height: 320px; max-height: 60vh; overflow-y: auto;
  padding: 16px; border: 1px solid var(--garis);
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  background: var(--putih); line-height: 1.7;
  font-size: .96rem; outline: none;
}
.editor-isi:focus { border-color: var(--hijau); }
.editor-isi:empty::before {
  content: attr(data-placeholder); color: #9AAB9B;
}
.editor-isi h3 { margin: 18px 0 8px; color: var(--hijau-tua); }
.editor-isi p  { margin-bottom: 10px; }
.editor-isi ul, .editor-isi ol { margin: 0 0 10px 22px; }
.editor-isi img { max-width: 100%; border-radius: var(--radius-sm); }
.editor-isi pre {
  background: #F2F6F1; padding: 12px; border-radius: 6px;
  overflow-x: auto; font-size: .87rem;
}
/* Mode HTML (v1.9.10) — menggantikan .editor-isi di tempat yang
   sama, bukan dialog terpisah. Ukurannya disamakan supaya tinggi
   layar tidak melompat saat berpindah mode. */
.editor-html {
  width: 100%;
  min-height: 320px;
  padding: 14px;
  border: 0;
  border-radius: 0;
  resize: vertical;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .84rem;
  line-height: 1.6;
  color: var(--teks);
  background: var(--permukaan);
  tab-size: 2;
  white-space: pre-wrap;      /* baris panjang membungkus, tidak menggulir mendatar */
  word-break: break-word;
}
.editor-html:focus { outline: none; }

/* Tombol mode yang sedang menyala.

   🔴 v1.9.11 — semula memakai `var(--utama)`, nama yang TIDAK PERNAH
   ada di :root. Variabel CSS yang tidak terdefinisi tidak melahirkan
   galat, ia hanya diabaikan: `background` tetap tembus pandang
   sementara `color: #fff` TETAP berlaku, sehingga tombol "👁 Visual"
   menjadi tulisan putih di atas toolbar putih — lenyap dari layar.
   Palet proyek ini bernama --hijau*, bukan --utama (§6.2 no. 67). */
.btn-alat.aktif {
  background: var(--hijau-tua); color: #fff; border-color: var(--hijau-tua);
}

.editor-isi table { width: 100%; border-collapse: collapse; margin: 12px 0; }
.editor-isi th, .editor-isi td {
  border: 1px solid var(--garis); padding: 8px 10px;
  min-width: 44px;          /* sel kosong tetap dapat diklik */
}
.editor-isi th { background: var(--hijau-muda); font-weight: 700; }

/* Sel yang sedang disunting diberi tanda — tombol baris/kolom
   bekerja pada sel tempat kursor berada, jadi guru perlu melihat
   sel mana itu (v1.9.9). */
.editor-isi td:focus, .editor-isi th:focus,
.editor-isi table *:focus { outline: 2px solid var(--hijau-tua); }

/* Alat tabel dikelompokkan supaya tidak tampak seperti tombol lepas
   yang berdiri sendiri. */
.alat-tabel {
  display: inline-flex; gap: 2px;
  padding: 0 4px; margin: 0 2px;
  border-left: 1px solid var(--garis);
  border-right: 1px solid var(--garis);
}
.alat-tabel .btn-alat { font-size: .8rem; padding: 4px 6px; }

/* pemisah bagian */
.pisah-bagian {
  display: flex; align-items: center; gap: 10px;
  margin: 18px 0; user-select: none;
}
.pisah-bagian::before, .pisah-bagian::after {
  content: ''; flex: 1; height: 2px;
  background: repeating-linear-gradient(90deg,
    var(--hijau) 0 8px, transparent 8px 14px);
}
.pisah-bagian span {
  font-size: .74rem; font-weight: 700; color: var(--hijau-tua);
  background: var(--hijau-muda); padding: 3px 10px; border-radius: 999px;
}

/* ---------------------------------------------- panel geser */
.tirai-panel {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(35,53,36,.42);
  display: none; justify-content: flex-end;
}
.tirai-panel.tampil { display: flex; }
.panel {
  width: 100%; max-width: 520px; height: 100%;
  background: var(--putih); overflow-y: auto;
  box-shadow: var(--bayang-bs);
  animation: geser .22s ease;
}
@keyframes geser { from { transform: translateX(30px); opacity: .6; } }
.panel-kepala {
  position: sticky; top: 0; z-index: 2;
  background: var(--putih); border-bottom: 1px solid var(--garis);
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.panel-isi { padding: 20px; }
.panel-kaki {
  position: sticky; bottom: 0;
  background: var(--putih); border-top: 1px solid var(--garis);
  padding: 14px 20px; display: flex; gap: 10px; justify-content: flex-end;
}

/* ---------------------------------------------- pilih ganda */
.kotak-pilih {
  max-height: 300px; overflow-y: auto;
  border: 1px solid var(--garis); border-radius: var(--radius-sm);
  padding: 6px;
}
.pilih-baris {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
}
.pilih-baris:hover { background: var(--permukaan); }
.pilih-baris.baris-terpakai { opacity: .5; cursor: not-allowed; }
.pilih-baris input { width: 17px; height: 17px; accent-color: var(--hijau); }

/* ---------------------------------------------- lain-lain */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pil {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  background: var(--permukaan); border: 1px solid var(--garis);
  font-size: .78rem; color: var(--teks-lembut); margin: 2px 3px 2px 0;
}
.bar-aksi {
  position: sticky; bottom: 0; z-index: 20;
  background: linear-gradient(transparent, var(--permukaan) 22%);
  padding: 18px 0 12px; display: flex; gap: 10px; justify-content: flex-end;
}

@media (max-width: 640px) {
  .grid-2 { grid-template-columns: 1fr; }
  .panel { max-width: 100%; }
  .editor-isi { min-height: 240px; }
}


/* ---------------------------------------------- tag kelas & salin */
.pil-kelas {
  background: var(--hijau-muda);
  border-color: var(--hijau);
  color: var(--hijau-tua);
  font-weight: 600;
}

/* Deretan pil kelas pada baris pilih murid. Membungkus supaya murid
   yang ikut beberapa kelas tidak melebarkan panelnya. */
.baris-pil { display: flex; flex-wrap: wrap; gap: 2px; }
code.salin {
  cursor: pointer;
  border-bottom: 1px dashed var(--terkunci);
  transition: background .12s;
}
code.salin:hover { background: var(--hijau-muda); border-bottom-color: var(--hijau); }
code.salin:active { transform: translateY(1px); }

/* ============================================================
   TAHAP 5 — layar belajar murid
   ============================================================ */

/* ---------------------------------------------- kartu item murid */
.item-murid {
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left; padding: 14px 16px;
  border: 1px solid var(--garis); border-radius: var(--radius);
  background: var(--putih); font-family: var(--font); color: var(--teks);
  cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.item-murid:hover:not(.terkunci) {
  border-color: var(--hijau); box-shadow: var(--bayang);
}
.item-murid.terkunci {
  background: #FAFBFA; color: var(--terkunci); cursor: not-allowed;
}
.item-murid.selesai { border-left: 3px solid var(--sukses); }
.item-murid.berjalan { border-left: 3px solid var(--hijau); }

/* ---------------------------------------------- pembaca materi */
.baca-kepala {
  position: sticky; top: 0; z-index: 30;
  background: var(--putih); border-bottom: 1px solid var(--garis);
  padding: 12px 0;
}
.baca-judul { font-weight: 700; font-size: 1.02rem; }

.jejak-bagian {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
}
.jejak-titik {
  width: 26px; height: 6px; border-radius: 999px;
  background: var(--garis); transition: background .25s;
}
.jejak-titik.lewat { background: var(--sukses); }
.jejak-titik.aktif { background: var(--hijau); }

.isi-baca {
  min-height: 40vh; padding: 22px 0;
  font-size: 1.02rem; line-height: 1.85;
}
.isi-baca h3 { margin: 24px 0 10px; color: var(--hijau-tua); }
.isi-baca h4 { margin: 18px 0 8px; }
.isi-baca p  { margin-bottom: 14px; }
.isi-baca ul, .isi-baca ol { margin: 0 0 14px 24px; }
.isi-baca li { margin-bottom: 6px; }
.isi-baca img { max-width: 100%; border-radius: var(--radius-sm); margin: 10px 0; }
.isi-baca table {
  width: 100%; border-collapse: collapse; margin: 16px 0; font-size: .94rem;
}
.isi-baca th, .isi-baca td {
  border: 1px solid var(--garis); padding: 10px 12px; text-align: left;
}
.isi-baca th { background: var(--hijau-muda); font-weight: 700; }
.isi-baca pre {
  background: #F2F6F1; border: 1px solid var(--garis);
  border-radius: var(--radius-sm); padding: 15px;
  overflow-x: auto; font-size: .88rem; line-height: 1.6;
  font-family: 'SF Mono', Consolas, monospace;
}
.isi-baca code {
  background: var(--hijau-muda); padding: 2px 6px;
  border-radius: 4px; font-size: .9em;
  font-family: 'SF Mono', Consolas, monospace;
}
.isi-baca pre code { background: none; padding: 0; }
.isi-baca blockquote {
  border-left: 3px solid var(--hijau); padding-left: 16px;
  margin: 16px 0; color: var(--teks-lembut);
}
.isi-baca iframe {
  width: 100%; aspect-ratio: 16/9; border: 0; border-radius: var(--radius-sm);
}
.isi-baca [data-saran-gambar] {
  border: 2px dashed var(--terkunci); border-radius: var(--radius-sm);
  padding: 20px; text-align: center; color: var(--teks-lembut);
  font-size: .86rem; margin: 16px 0;
}
.isi-baca [data-saran-gambar]::before { content: "🖼 " attr(data-saran-gambar); }

/* ---------------------------------------------- bilah navigasi baca */
.baca-kaki {
  position: sticky; bottom: 0; z-index: 30;
  background: var(--putih); border-top: 1px solid var(--garis);
  padding: 12px 0; margin-top: 20px;
  display: flex; gap: 10px; align-items: center;
}

/* hitung mundur durasi baca */
.durasi-bar {
  height: 3px; background: var(--garis);
  border-radius: 999px; overflow: hidden; flex: 1;
}
.durasi-isi {
  height: 100%; background: var(--hijau);
  width: 0%; transition: width 1s linear;
}

/* ---------------------------------------------- perayaan selesai */
.rayakan {
  text-align: center; padding: 30px 20px;
  background: linear-gradient(160deg, var(--hijau-muda), var(--permukaan));
  border-radius: var(--radius); border: 1px solid var(--hijau);
}
.rayakan .ikon { font-size: 3rem; }
.rayakan h2 { color: var(--hijau-tua); margin: 8px 0 4px; }

@media (max-width: 640px) {
  .isi-baca { font-size: .98rem; padding: 16px 0; }
  .jejak-titik { width: 18px; }
}

/* ============================================================
   TAHAP 6A — LKPD
   ============================================================ */

.kotak-tautan {
  display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
}
.kotak-tautan .isian { flex: 1; }
.btn-hapus-tautan {
  flex: 0 0 auto; width: 38px; height: 38px; padding: 0;
  border: 1px solid var(--garis); border-radius: var(--radius-sm);
  background: var(--putih); color: var(--bahaya);
  cursor: pointer; font-size: 1rem;
}
.btn-hapus-tautan:hover { background: #FBE3E2; border-color: var(--bahaya); }

.tautan-baca {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin-bottom: 8px;
  border: 1px solid var(--garis); border-radius: var(--radius-sm);
  background: var(--permukaan); font-size: .9rem;
}
.tautan-baca a {
  flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}

/* status pengumpulan */
.status-lkpd {
  padding: 14px 16px; border-radius: var(--radius);
  border-left: 3px solid var(--garis); margin-bottom: 16px;
}
.status-lkpd.menunggu   { background: #FFFBF0; border-left-color: var(--peringatan); }
.status-lkpd.diterima   { background: #F2FAF3; border-left-color: var(--sukses); }
.status-lkpd.ditolak    { background: #FDF2F2; border-left-color: var(--bahaya); }
.status-lkpd.dinilai_proses { background: #FFFBF0; border-left-color: var(--peringatan); }

.kotak-feedback {
  background: var(--hijau-muda); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-top: 10px;
}
.kotak-feedback .label {
  font-size: .75rem; font-weight: 700; color: var(--hijau-tua);
  text-transform: uppercase; letter-spacing: .04em;
}

/* antrean guru */
.baris-antrean {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border: 1px solid var(--garis);
  border-radius: var(--radius); background: var(--putih);
  cursor: pointer; transition: border-color .15s;
}
.baris-antrean:hover { border-color: var(--hijau); }
.baris-antrean.terlambat { border-left: 3px solid var(--peringatan); }

.nilai-besar {
  font-size: 1.9rem; font-weight: 800; line-height: 1;
  color: var(--hijau-tua);
}

/* ============================================================
   QUIZ — Tahap 6B
   ============================================================ */

/* Tanda medan wajib. Dipakai form soal & reset percobaan. */
.wajib { color: #dc2626; font-weight: 700; }

/* Form soal memuat 5 baris opsi + beberapa medan; 420px terlalu
   sempit. Kelas ini dipasang dari JS saat dialog memuat form.
   Sengaja TIDAK memakai :has() — belum didukung browser lama.

   Sejak v1.6.2 kelas ini HANYA mengatur lebar; batas tinggi &
   gulir sudah menjadi milik `.dialog` sendiri. */
.dialog.dialog-lebar {
  max-width: 620px;
}

/* Untuk MEMBACA, bukan mengisi form: pratinjau item, materi
   panjang, daftar soal. 420px memaksa tabel & daftar terlipat
   sehingga sulit dinilai (laporan guru v1.9.4).

   Batasnya `min()` — di layar sempit tetap mengikuti lebar layar,
   tidak memaksa gulir mendatar. */
.dialog.dialog-penuh {
  max-width: min(900px, 100%);
}

/* Wadah gulir isi pratinjau. Dulu ditulis sebagai gaya sebaris di
   js_editor; dipindah ke sini supaya bisa disesuaikan per lebar
   layar (§6.2 no. 30 — gaya milik CSS, bukan JS). */
.pv-gulir {
  max-height: 70vh;
  overflow-y: auto;
  text-align: left;
  -webkit-overflow-scrolling: touch;
}
/* Materi & soal sering memuat tabel lebar; biarkan tabelnya sendiri
   yang bergulir mendatar, bukan seluruh dialog. */
.pv-gulir table { display: block; overflow-x: auto; max-width: 100%; }
.dialog label {
  display: block;
  margin-top: 12px;
  font-size: .88rem;
  font-weight: 600;
}
.dialog label .lembut { font-weight: 400; }

/* -------- jam hitung mundur -------- */
.jam-quiz {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  font-size: 1.25rem;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--abu-100, #f1f5f9);
  white-space: nowrap;
}
.jam-quiz .jam-hampir { color: #b45309; }
.jam-quiz .jam-kritis { color: #b91c1c; animation: denyut 1s infinite; }
.jam-quiz .jam-habis  { color: #b91c1c; }
@keyframes denyut { 50% { opacity: .45; } }

/* -------- peta soal -------- */
.peta-soal { display: flex; flex-wrap: wrap; gap: 6px; }
.titik-soal {
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1.5px solid var(--garis, #e2e8f0);
  background: #fff;
  font-weight: 600; font-size: .82rem;
  cursor: pointer;
  transition: all .15s;
}
.titik-soal:hover  { border-color: var(--utama, #16a34a); }
.titik-soal.terisi { background: #dcfce7; border-color: #86efac; }
.titik-soal.ragu   { background: #fef3c7; border-color: #fcd34d; }
.titik-soal.aktif  {
  border-color: var(--utama, #16a34a);
  box-shadow: 0 0 0 2px rgba(22,163,74,.22);
}

/* -------- opsi jawaban -------- */
.daftar-opsi { display: flex; flex-direction: column; gap: 8px; }
.opsi {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px;
  border: 1.5px solid var(--garis, #e2e8f0);
  border-radius: 10px;
  cursor: pointer;
  transition: all .15s;
}
.opsi:hover { border-color: var(--utama, #16a34a); background: #f8fafc; }
.opsi.terpilih {
  border-color: var(--utama, #16a34a);
  background: #f0fdf4;
}
.opsi input[type="radio"] { margin-top: 3px; }
.huruf-opsi {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px;
  border-radius: 6px;
  background: var(--abu-100, #f1f5f9);
  font-weight: 700; font-size: .8rem;
}

.baris-opsi-form {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.baris-opsi-form .input { flex: 1; }

.daftar-opsi-ringkas {
  list-style: none; padding: 0; margin: 0;
  font-size: .88rem; line-height: 1.7;
}
.daftar-opsi-ringkas .opsi-benar {
  color: #15803d; font-weight: 600;
}

/* -------- kartu soal & koreksi -------- */
.kartu-soal { border-left: 3px solid var(--garis, #e2e8f0); }
.kartu-koreksi { border-left: 3px solid #f59e0b; background: #fffbeb; }

.gambar-soal      { max-width: 100%; border-radius: 10px; }
.gambar-soal-kecil { max-height: 140px; border-radius: 8px; }

.kotak-jawaban {
  padding: 10px 12px;
  background: var(--abu-50, #f8fafc);
  border-radius: 8px;
  white-space: pre-wrap;
}
.kotak-pembahasan {
  padding: 10px 12px;
  background: #eff6ff;
  border-left: 3px solid #60a5fa;
  border-radius: 6px;
  font-size: .9rem;
}
.kotak-feedback {
  padding: 10px 12px;
  background: #fef9c3;
  border-left: 3px solid #facc15;
  border-radius: 6px;
  font-size: .9rem;
}
.kotak-info {
  padding: 10px 12px;
  background: #f1f5f9;
  border-radius: 8px;
  color: #475569;
}

/* -------- panel hasil -------- */
.sorot-lulus    { border-left: 4px solid #16a34a; background: #f0fdf4; }
.sorot-gagal    { border-left: 4px solid #dc2626; background: #fef2f2; }
.sorot-menunggu { border-left: 4px solid #f59e0b; background: #fffbeb; }

.angka-raksasa {
  font-size: 3rem; font-weight: 800; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.angka-besar {
  font-size: 1.8rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.grid-info {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 14px;
}
.baris-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}
.baris-tombol { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.peringatan-teks { color: #b45309; }
.mr-8 { margin-right: 8px; }
.ml-8 { margin-left: 8px; }

@media (max-width: 640px) {
  .titik-soal { width: 30px; height: 30px; font-size: .75rem; }
  .angka-raksasa { font-size: 2.2rem; }
}


/* ============================================================
   SIDEBAR NAVIGASI KELAS (js_nav)
   ============================================================ */

.tata-nav {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}
.isi-nav { min-width: 0; }

.sisi-nav {
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  background: var(--putih);
  border: 1px solid var(--garis);
  border-radius: var(--radius);
  box-shadow: var(--bayang);
}

.sisi-kepala {
  position: relative;
  padding: 14px 16px;
  border-bottom: 1px solid var(--garis);
}
.tutup-laci {
  display: none;
  position: absolute; top: 10px; right: 10px;
  width: 30px; height: 30px;
  border: 0; border-radius: 8px;
  background: var(--permukaan);
  font-size: 1rem; cursor: pointer;
}

.sisi-progres { padding: 12px 16px; border-bottom: 1px solid var(--garis); }
.mb-4 { margin-bottom: 4px; }

.sisi-daftar { padding: 6px; }

/* -------- baris pertemuan -------- */
.sisi-ptm { border-radius: var(--radius-sm); margin-bottom: 2px; }
.sisi-ptm.aktif { background: var(--permukaan); }

.sisi-ptm-judul {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 9px 10px;
  border: 0; background: none; cursor: pointer;
  text-align: left; border-radius: var(--radius-sm);
  font-family: var(--font); color: var(--teks);
}
.sisi-ptm-judul:hover { background: var(--hijau-muda); }
.sisi-ptm.terkunci .sisi-ptm-judul { cursor: not-allowed; opacity: .62; }
.sisi-ptm-judul .tumbuh { min-width: 0; display: block; }
.sisi-ptm-teks {
  display: block; font-size: .86rem; font-weight: 600; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.panah {
  flex: 0 0 auto; font-size: 1rem; color: var(--teks-lembut);
  transition: transform .15s; display: inline-block;
}
.panah.turun { transform: rotate(90deg); }

.tanda-beres { color: var(--sukses); font-weight: 700; flex: 0 0 auto; }
.tanda-kunci { flex: 0 0 auto; opacity: .7; }
.tanda-angka {
  flex: 0 0 auto; font-size: .72rem; font-weight: 700;
  color: var(--teks-lembut); background: var(--permukaan);
  padding: 2px 6px; border-radius: 999px;
}

.sisi-kunci-ket {
  padding: 4px 12px 10px 30px;
  font-size: .76rem; color: var(--teks-lembut); font-style: italic;
}

/* -------- baris item -------- */
.sisi-item { list-style: none; margin: 0; padding: 0 0 6px 0; }

.sisi-item-baris {
  display: flex; align-items: flex-start; gap: 8px;
  width: 100%; padding: 7px 10px 7px 28px;
  border: 0; background: none; cursor: pointer;
  text-align: left; border-radius: var(--radius-sm);
  font-family: var(--font); color: var(--teks);
  border-left: 2px solid transparent;
}
.sisi-item-baris:hover { background: var(--hijau-muda); }
.sisi-item-baris.aktif {
  background: var(--hijau-muda);
  border-left-color: var(--utama, #3FA34D);
  font-weight: 700;
}
.sisi-item-baris.terkunci { cursor: not-allowed; opacity: .55; }
.sisi-item-baris .tumbuh { min-width: 0; }
.sisi-ikon { flex: 0 0 auto; font-size: .9rem; line-height: 1.4; }
.sisi-item-teks {
  display: block; font-size: .82rem; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sisi-ket {
  display: block; font-size: .72rem; color: var(--teks-lembut);
  font-weight: 400;
}
.sisi-opsional {
  flex: 0 0 auto; font-size: .66rem; color: var(--teks-lembut);
  background: var(--permukaan); padding: 1px 5px; border-radius: 999px;
}

/* -------- kerangka muat sidebar -------- */
.sisi-nav .rangka {
  background: linear-gradient(90deg,
    var(--permukaan) 25%, var(--hijau-muda) 37%, var(--permukaan) 63%);
  background-size: 400% 100%;
  border-radius: 6px;
  animation: rangka-geser 1.3s ease-in-out infinite;
}
@keyframes rangka-geser {
  0%   { background-position: 100% 50%; }
  100% { background-position: 0 50%; }
}

/* -------- bilah Sebelumnya / Berikutnya -------- */
.bilah-nav {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-top: 24px; padding-top: 16px;
  border-top: 1px solid var(--garis);
}
.bilah-nav .btn { max-width: 45%; }

/* ============================================================
   SIDEBAR MENU GURU (js_menu, v1.13.0)

   Sengaja menumpang kelas yang sudah ada — `.tata-nav`, `.sisi-nav`,
   `.sisi-kepala`, `.sisi-daftar`, laci HP, dan tirai. Yang baru
   hanya baris tautannya. Menambah tata letak kedua berarti dua
   perilaku responsif yang harus dirawat, dan hanya salah satu yang
   akan teruji (§6.2 no. 29).
   ============================================================ */

/* Elemennya <button>, bukan <a> (v1.13.1) — tautan hash tidak bekerja
   di dalam iframe sandbox Apps Script. Karena itu bawaan tombol wajib
   dibersihkan: border, background, lebar, dan perataan teks. Tanpa
   `width:100%` + `text-align:left`, menu tampil menciut di tengah. */
.menu-tautan {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 9px 10px; margin-bottom: 2px;
  border: 0; background: none; cursor: pointer;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  color: var(--teks); text-decoration: none;
  font-size: .92rem; line-height: 1.3;
}
.menu-tautan:hover { background: var(--permukaan); }

/* Penanda halaman yang sedang dibuka. Tanpa ini guru kehilangan
   jejak setelah beberapa kali berpindah. */
.menu-tautan.aktif {
  background: var(--permukaan);
  font-weight: 700;
  box-shadow: inset 3px 0 0 var(--hijau);
}

.menu-ikon { flex: none; width: 20px; text-align: center; }

/* Nama kelas bisa sangat panjang ("XI TJKT 1 - Pemasangan dan
   Konfigurasi Peralatan Jaringan"). Dipotong satu baris; nama
   utuhnya tetap terbaca lewat atribut title. */
.menu-teks {
  min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}

.menu-kelas-baris { font-size: .88rem; }

/* ---------------------------------------------- bentangan kelas (v1.15.0)
   Sidebar guru dapat dibentangkan: kelas → bab → pertemuan → item,
   supaya guru tidak bolak-balik ke halaman utama kelas. Tiap tingkat
   dibedakan lewat JOROKAN dan ukuran, bukan bingkai — empat tingkat
   berkotak membuat sidebar sesak. */
.menu-kelas-blok { position: relative; }
.menu-kelas-blok.bentang { margin-bottom: 6px; }

/* Panah tersendiri: judul kelas untuk berpindah, panah untuk
   membentangkan. Menumpang di atas baris, jadi baris kelas diberi
   ruang di kiri. */
.btn-bentang-kelas {
  position: absolute; left: 0; top: 3px; z-index: 1;
  width: 22px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border: 0; background: none; cursor: pointer; padding: 0;
  border-radius: var(--radius-sm);
}
.btn-bentang-kelas:hover { background: var(--permukaan); }
.menu-kelas-blok .menu-kelas-baris { padding-left: 26px; }

.menu-bentang {
  margin: 2px 0 4px 12px; padding-left: 8px;
  border-left: 1px dashed var(--garis);
}

.menu-bab {
  font-size: .74rem; font-weight: 700; letter-spacing: .02em;
  color: var(--teks-lembut); text-transform: uppercase;
  padding: 6px 8px 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.menu-ptm { margin-bottom: 1px; }
.menu-ptm-judul {
  display: flex; align-items: center; gap: 6px;
  width: 100%; text-align: left;
  padding: 5px 8px; border: 0; background: none; cursor: pointer;
  border-radius: var(--radius-sm);
  font-family: var(--font); color: var(--teks);
  font-size: .82rem; line-height: 1.25;
}
.menu-ptm-judul:hover { background: var(--permukaan); }

.menu-item-baris {
  display: flex; align-items: center; gap: 7px;
  width: 100%; text-align: left;
  padding: 4px 8px 4px 22px; border: 0; background: none;
  cursor: pointer; border-radius: var(--radius-sm);
  font-family: var(--font); color: var(--teks);
  font-size: .79rem; line-height: 1.25;
}
.menu-item-baris:hover:not(.mati) { background: var(--permukaan); }
/* Materi tidak punya layar penilaian tersendiri — ditampilkan supaya
   susunannya utuh, tetapi tidak dapat diklik (§6.2 no. 84). */
.menu-item-baris.mati { color: var(--teks-lembut); cursor: default; }

.menu-kosong {
  font-size: .76rem; color: var(--teks-lembut); padding: 3px 8px 3px 22px;
}
.menu-draf {
  flex: none; font-size: .68rem; color: var(--peringatan);
  border: 1px solid var(--peringatan); border-radius: 999px;
  padding: 0 6px; opacity: .85;
}

/* -------- laci pada layar sempit -------- */
.tombol-laci { display: none; }
.tirai-sisi { display: none; }

@media (max-width: 900px) {
  .tata-nav { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .tombol-laci { display: inline-flex; margin-bottom: 12px; }
  .tutup-laci  { display: block; }

  .sisi-nav {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 84%; max-width: 320px; max-height: none;
    z-index: 60; border-radius: 0;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: var(--bayang-bs);
  }
  .sisi-nav.tampil { transform: translateX(0); }

  .tirai-sisi {
    display: block; position: fixed; inset: 0;
    background: rgba(35,53,36,.42);
    opacity: 0; pointer-events: none;
    transition: opacity .22s; z-index: 55;
  }
  .tirai-sisi.tampil { opacity: 1; pointer-events: auto; }

  .bilah-nav .btn { max-width: 42%; }
}

@media (max-width: 640px) {
  .bilah-nav { flex-wrap: wrap; }
  .bilah-nav .btn { max-width: none; flex: 1 1 100%; }
  .bilah-nav > span { order: 3; width: 100%; text-align: center; }
}

/* ============================================================
   Hierarki tiga tingkat — halaman guru (v1.1)
   KELAS → MATERI POKOK → PERTEMUAN → item
   ============================================================ */

.kartu-mp { padding: 16px 18px; }
.kartu-mp.draf {
  border-style: dashed;
  background: #FCFDFB;
}

/* Tombol lipat menutupi seluruh kepala kartu supaya sasaran
   sentuh di ponsel lebar, bukan cuma segitiga kecilnya. */
.btn-lipat-mp {
  display: flex; align-items: center; gap: 12px;
  flex: 1 1 auto; min-width: 0;
  background: none; border: 0; padding: 0;
  font-family: var(--font); color: var(--teks);
  cursor: pointer; text-align: left;
}
.btn-lipat-mp:hover .nomor-mp {
  background: var(--hijau); color: #fff;
}
.kaki-lipat {
  flex: 0 0 14px; color: var(--teks-lembut);
  font-size: .85rem; line-height: 1;
}
.nomor-mp {
  flex: 0 0 34px; height: 34px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 1rem;
  background: var(--hijau-muda); color: var(--hijau-tua);
  transition: background .15s, color .15s;
}

/* Garis penghubung di kiri menegaskan pertemuan berada DI DALAM
   materi pokok — tanpa itu tiga tingkat terlihat rata. */
.isi-mp {
  border-left: 2px solid var(--garis);
  padding-left: 14px; margin-left: 16px;
}

.kartu-ptm {
  border: 1px solid var(--garis);
  border-radius: var(--radius-sm);
  background: var(--putih);
  padding: 12px 14px;
}
.kartu-ptm.draf { border-style: dashed; background: #FCFDFB; }
.kartu-ptm.jenis-ujian    { border-left: 3px solid var(--peringatan); }
.kartu-ptm.jenis-refleksi { border-left: 3px solid #8E7CC3; }

.nomor-ptm {
  flex: 0 0 auto; min-width: 38px; height: 26px; padding: 0 8px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .82rem;
  background: var(--permukaan); color: var(--hijau-tua);
  border: 1px solid var(--garis);
}

.ikon-tipe.refleksi { background: #EDE8F7; }

@media (max-width: 640px) {
  .isi-mp { padding-left: 10px; margin-left: 8px; }
  .kartu-mp { padding: 14px; }
}

/* ============================================================
   Refleksi (v1.2) — pertanyaan terbuka + skala pemahaman diri
   ============================================================ */

.kartu-tanya { padding: 14px 16px; }
.wajib-tanda { color: var(--bahaya); font-weight: 800; }

.jawaban-terkunci {
