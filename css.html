<style>
:root {
  --hijau: #3d8b40;
  --hijau-tua: #2f6b32;
  --hijau-muda: #e8f5e9;
  --bg: #f4f1ea;
  --kertas: #fffcf7;
  --teks: #1c241c;
  --lembut: #5c675c;
  --garis: #ddd6c8;
  --bahaya: #b42318;
  --tunggu: #b45309;
  --ok: #3d8b40;
  --bayang: 0 1px 2px rgba(28,36,28,.06), 0 8px 24px rgba(28,36,28,.06);
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--teks);
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif; line-height: 1.45; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
h1,h2,h3 { margin: 0 0 .4em; letter-spacing: -.02em; }
p { margin: 0 0 .6em; }
a { color: var(--hijau-tua); }

.sembunyi { display: none !important; }
.sembunyi-hp { }
@media (max-width: 720px) { .sembunyi-hp { display: none !important; } }
.tumbuh { flex: 1; }
.mb-8 { margin-bottom: 8px; } .mb-16 { margin-bottom: 16px; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; }
.kecil { font-size: .85rem; } .lembut { color: var(--lembut); }
.tebal { font-weight: 700; }
.baris { display: flex; align-items: center; gap: 10px; }
.baris-antara { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.kolom { display: flex; flex-direction: column; gap: 10px; }

.btn { background: var(--hijau); color: #fff; border: 0; border-radius: 10px;
  padding: 10px 16px; font-weight: 700; }
.btn:hover { background: var(--hijau-tua); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-hantu { background: transparent; color: var(--teks); border: 1px solid var(--garis); }
.btn-hantu:hover { background: #fff; }
.btn-teks { background: transparent; color: var(--teks); border: 0; font-weight: 600; padding: 8px 10px; }
.btn-penuh { width: 100%; }
.btn-kecil { padding: 6px 10px; font-size: .85rem; }
.btn-bahaya { background: var(--bahaya); }

.kartu { background: var(--kertas); border: 1px solid var(--garis); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--bayang); }
.lencana { display: inline-block; background: var(--hijau-muda); color: var(--hijau-tua);
  border-radius: 999px; padding: 2px 8px; font-size: .75rem; font-weight: 700; }
.lencana-abu { background: #eee; color: var(--lembut); }
.lencana-tunggu { background: #fef3c7; color: var(--tunggu); }

.topbar { position: sticky; top: 0; z-index: 20; background: var(--kertas);
  border-bottom: 1px solid var(--garis); }
.topbar-isi { max-width: 1100px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
.merek { display: flex; align-items: center; gap: 8px; background: none; border: 0; font-weight: 800; font-size: 1.05rem; }
.merek-ikon { font-size: 1.3rem; }
.isi { max-width: 1100px; margin: 0 auto; padding: 22px 20px 64px; }

.layar-masuk { min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: radial-gradient(1200px 500px at 20% -10%, #d9efda, transparent), var(--bg); }
.kartu-masuk { width: min(420px, 100%); padding: 28px 26px; }
.merek-besar { display: flex; align-items: center; gap: 10px; font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }

label { display: block; font-size: .82rem; font-weight: 700; margin: 12px 0 4px; }
input[type=text], input[type=password], input[type=number], input[type=datetime-local],
textarea, select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--garis); border-radius: 10px;
  background: #fff; }
textarea { min-height: 120px; resize: vertical; }
.bantuan { font-size: .78rem; color: var(--lembut); margin-top: 4px; }

#tirai-muat { position: fixed; inset: 0; background: rgba(244,241,234,.72); display: none;
  align-items: center; justify-content: center; z-index: 80; }
#tirai-muat.tampil { display: flex; }
.kotak-muat { text-align: center; }
.putar { width: 28px; height: 28px; border: 3px solid var(--garis); border-top-color: var(--hijau);
  border-radius: 50%; animation: putar .7s linear infinite; margin: 0 auto 8px; }
.putar-kecil { width: 14px; height: 14px; border-width: 2px; display: inline-block; vertical-align: middle; }
@keyframes putar { to { transform: rotate(360deg); } }

#toast-wadah { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--teks); color: #fff; padding: 10px 14px; border-radius: 10px; font-size: .9rem; max-width: 320px; }
.toast-bahaya { background: var(--bahaya); }
.toast-sukses { background: var(--hijau-tua); }

.tirai-dialog { position: fixed; inset: 0; background: rgba(28,36,28,.35); display: none;
  align-items: center; justify-content: center; z-index: 70; padding: 16px; }
.tirai-dialog.tampil { display: flex; }
.dialog { background: var(--kertas); border-radius: 16px; padding: 22px; width: min(480px, 100%);
  box-shadow: var(--bayang); }
.dialog-lebar { width: min(720px, 100%); }
.dialog-aksi { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.kisi { display: grid; gap: 14px; }
.kisi-2 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

.kartu-kelas { cursor: pointer; transition: transform .12s; }
.kartu-kelas:hover { transform: translateY(-2px); }
.kartu-bab { cursor: pointer; }
.kartu-bab.tertutup { opacity: .7; cursor: default; }
.kartu-bab.tertutup:hover { transform: none; }

.bilah { height: 8px; background: #ece7dc; border-radius: 99px; overflow: hidden; }
.bilah-isi { height: 100%; background: var(--hijau); border-radius: 99px; }

.tata-bab { display: grid; grid-template-columns: 280px 1fr; gap: 18px; align-items: start; }
@media (max-width: 840px) { .tata-bab { grid-template-columns: 1fr; } }

.daftar-item { position: sticky; top: 64px; }
.item-baris { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
  background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; }
.item-baris.aktif { background: var(--hijau-muda); border-color: #cfe8d0; }
.item-baris.mati { opacity: .55; }
.item-ikon { width: 1.4em; }
.grup-nama { font-size: .75rem; font-weight: 800; color: var(--lembut); text-transform: uppercase;
  letter-spacing: .06em; margin: 12px 4px 4px; }

.baca { font-size: 1.05rem; }
.baca h3 { margin-top: 1.2em; }
.baca ul { padding-left: 1.2em; }
.baca pre { background: #1c241c; color: #e8f5e9; padding: 12px 14px; border-radius: 10px; overflow: auto; }
.baca table { border-collapse: collapse; width: 100%; }
.baca td, .baca th { border: 1px solid var(--garis); padding: 6px 8px; }

.tab { display: flex; gap: 6px; border-bottom: 1px solid var(--garis); margin-bottom: 16px; }
.tab button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font-weight: 700; color: var(--lembut); }
.tab button.aktif { color: var(--hijau-tua); border-bottom-color: var(--hijau); }

.tabel { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tabel th, .tabel td { border-bottom: 1px solid var(--garis); padding: 8px 10px; text-align: left; }
.tabel th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--lembut); }
.rekap-bungkus { overflow: auto; max-height: 70vh; border: 1px solid var(--garis); border-radius: 12px; background: var(--kertas); }
.rekap-bungkus th, .rekap-bungkus td { white-space: nowrap; }
.sel-ok { color: var(--ok); font-weight: 700; }
.sel-kurang { color: var(--bahaya); font-weight: 700; }
.sel-tunggu { color: var(--tunggu); }

.soal-opsi { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 20px; }
.soal-opsi label { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; margin: 0;
  background: #fff; border: 1px solid var(--garis); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.soal-opsi label:has(input:checked) { border-color: var(--hijau); background: var(--hijau-muda); }

.tautan-balik { background: none; border: 0; color: var(--lembut); font-weight: 600; padding: 0 0 12px; }

.aksi-baris { display: flex; flex-wrap: wrap; gap: 6px; }
.saklar { display: flex; gap: 4px; }
.saklar button { font-size: .75rem; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--garis); background: #fff; }
.saklar button.aktif { background: var(--hijau); color: #fff; border-color: var(--hijau); }
</style>
