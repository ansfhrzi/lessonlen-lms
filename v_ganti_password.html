<template id="tpl-ganti-password">
  <div class="layar-login">
    <div class="kotak-login">

      <div class="login-merek">
        <div class="ikon">🔑</div>
        <h1>Ganti Kata Sandi</h1>
        <p id="teks-alasan">Buat kata sandi baru untuk melanjutkan</p>
      </div>

      <form id="form-ganti">
        <div class="grup">
          <label for="in-lama">Kata Sandi Saat Ini</label>
          <input class="isian" id="in-lama" type="password"
                 autocomplete="current-password" required>
        </div>

        <div class="grup">
          <label for="in-baru">Kata Sandi Baru</label>
          <input class="isian" id="in-baru" type="password"
                 autocomplete="new-password" required>
          <span class="bantuan">Minimal 6 karakter, memuat huruf dan angka.</span>
        </div>

        <div class="grup">
          <label for="in-ulang">Ulangi Kata Sandi Baru</label>
          <input class="isian" id="in-ulang" type="password"
                 autocomplete="new-password" required>
        </div>

        <div class="pesan-salah" id="salah-ganti"></div>

        <button class="btn btn-penuh mt-8" type="submit" id="btn-simpan-pwd">
          Simpan Kata Sandi
        </button>
      </form>

      <div class="tengah mt-16">
        <button class="btn btn-teks kecil" id="btn-batal-ganti">Keluar</button>
      </div>

    </div>
  </div>
</template>
