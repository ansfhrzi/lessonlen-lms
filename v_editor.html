<template id="tpl-editor">
  <div>
    <div id="topbar-slot"></div>
    <div class="wadah" style="padding-top:16px;padding-bottom:40px">

      <button class="tautan-balik" id="ed-balik">‹ Kembali ke Pertemuan</button>
      <h1 class="mb-16" id="ed-judul-layar">Editor</h1>

      <div class="kartu mb-16">
        <div class="grup">
          <label>Judul *</label>
          <input class="isian" id="ed-judul" placeholder="mis. Apa itu VLAN">
        </div>
        <div class="grup">
          <label>Tujuan Pembelajaran</label>
          <textarea class="isian" id="ed-tujuan" rows="2"
                    placeholder="Peserta didik mampu…"></textarea>
          <span class="bantuan">Dipakai AI saat membuat konten (Tahap 7).</span>
        </div>
        <div class="grid-2">
          <div class="grup">
            <label class="baris sela-kecil" style="cursor:pointer">
              <input type="checkbox" id="ed-wajib" checked> Wajib diselesaikan
            </label>
          </div>
          <div class="grup">
            <label>Status</label>
            <select class="isian" id="ed-status">
              <option value="draft">Draf</option>
              <option value="publish">Terbit</option>
            </select>
          </div>
        </div>
      </div>

      <div id="ed-khusus"></div>

      <!-- generator AI (hanya untuk materi) -->
      <div class="kartu mb-16 sembunyi" id="ed-gen">
        <div class="baris-antara">
          <div style="min-width:0">
            <b id="ed-gen-judul">✨ Susun Materi dengan AI</b>
            <p class="bantuan mt-4" id="ed-gen-bantu">
              AI menyusun draf berdasarkan Tujuan Pembelajaran dan konteks
              kelas. Hasilnya selalu perlu Anda tinjau sebelum diterbitkan.
            </p>
          </div>
          <button class="btn btn-hantu btn-kecil" id="ed-gen-btn">✨ Generate</button>
        </div>
        <div class="grup mt-12">
          <label>Catatan tambahan <span class="lembut">(opsional)</span></label>
          <input class="isian" id="ed-gen-catatan" maxlength="500"
                 placeholder="mis. lebih sederhana, tambah contoh jaringan sekolah">
        </div>
        <div id="ed-gen-status" class="bantuan mt-8"></div>
      </div>

      <div class="kartu mb-16 sembunyi" id="ed-ai">
        <label class="baris sela-kecil" style="cursor:pointer">
          <input type="checkbox" id="ed-ai-tinjau">
          <span><b>✨ Materi hasil AI — saya sudah meninjau isinya</b></span>
        </label>
        <p class="bantuan mt-8">
          Materi hasil AI tidak dapat diterbitkan sebelum kotak ini dicentang.
        </p>
      </div>

      <div id="ed-blok-konten">
      <div class="baris-antara mb-8">
        <h3>Konten</h3>
        <span class="lencana" id="ed-cacah">1 bagian</span>
      </div>

      <div class="editor-bar" id="ed-alat">
        <button class="btn-alat" data-cmd="bold" title="Tebal"><b>B</b></button>
        <button class="btn-alat" data-cmd="italic" title="Miring"><i>I</i></button>
        <button class="btn-alat" data-cmd="underline" title="Garis bawah"><u>U</u></button>
        <span class="pisah"></span>
        <button class="btn-alat" data-cmd="h3" title="Judul">H3</button>
        <button class="btn-alat" data-cmd="h4" title="Subjudul">H4</button>
        <span class="pisah"></span>
        <button class="btn-alat" data-cmd="insertUnorderedList" title="Daftar poin">•</button>
        <button class="btn-alat" data-cmd="insertOrderedList" title="Daftar nomor">1.</button>
        <span class="pisah"></span>
        <button class="btn-alat" data-cmd="link" title="Tautan">🔗</button>
        <button class="btn-alat" data-cmd="gambar" title="Gambar">🖼</button>
        <button class="btn-alat" data-cmd="video"
                title="Sisipkan video YouTube">▶</button>
        <button class="btn-alat" data-cmd="tabel"
                title="Sisipkan tabel — pilih jumlah baris &amp; kolom">▦</button>
        <span class="alat-tabel">
          <button class="btn-alat" data-cmd="baris-tambah"
                  title="Tambah baris di bawah kursor">+↓</button>
          <button class="btn-alat" data-cmd="baris-hapus"
                  title="Hapus baris tempat kursor">−↓</button>
          <button class="btn-alat" data-cmd="kolom-tambah"
                  title="Tambah kolom di kanan kursor">+→</button>
          <button class="btn-alat" data-cmd="kolom-hapus"
                  title="Hapus kolom tempat kursor">−→</button>
        </span>
        <button class="btn-alat" data-cmd="kode" title="Blok kode">&lt;/&gt;</button>
        <button class="btn-alat" data-cmd="rumus" title="Rumus MathJax">∑</button>
        <span class="pisah"></span>
        <button class="btn-alat utama" data-cmd="bagian"
                title="Pisahkan menjadi bagian baru">⁃ Pisah Bagian</button>
        <span class="pisah"></span>
        <button class="btn-alat" id="ed-mode-html"
                title="Sunting kode HTML">&lt;/&gt; HTML</button>
      </div>
      <div class="editor-isi" id="ed-isi" contenteditable="true"
           data-placeholder="Tulis konten di sini…"></div>
      <textarea class="editor-html sembunyi" id="ed-html" spellcheck="false"
                data-placeholder="Kode HTML…"></textarea>
      </div>

      <div class="bar-aksi">
        <button class="btn btn-hantu" id="ed-pratinjau">Pratinjau</button>
        <button class="btn btn-hantu" id="ed-simpan-draf">Simpan Draf</button>
        <button class="btn" id="ed-simpan-terbit">Simpan &amp; Terbitkan</button>
      </div>

    </div>
  </div>
</template>
