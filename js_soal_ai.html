<script>
/* ============================================================
   LessonLen — js_soal_ai
   Generator soal AI: guru menentukan komposisi, meninjau hasil,
   lalu menyimpan hanya soal yang disetujui.

   Alur sengaja TIGA langkah, bukan langsung simpan:

     komposisi → tinjau → simpan terpilih

   Soal buatan AI tidak pernah masuk bank soal tanpa dibaca guru.
   Ini aturan yang sama dengan materi AI (§8.4 "AI wajib ditinjau"),
   hanya di sini peninjauannya per butir: guru bisa membuang soal
   yang keliru tanpa membuang seluruh hasil.
   ============================================================ */

/* Hasil generate terakhir — hidup selama halaman bank soal terbuka.
   Tidak disimpan ke server sampai guru menekan Simpan. */
var SoalAI = { itemId: null, soal: [], pilih: [] };

/* ---------------------------------------------- langkah 1: komposisi */

function dialogGenerateSoal(itemId) {
  SoalAI = { itemId: itemId, soal: [], pilih: [] };

  dialog({
    judul: '✨ Buat Soal dengan AI',
    pesan: 'AI menyusun soal berdasarkan judul pertemuan, tujuan ' +
           'pembelajaran, dan materi yang sudah ada di pertemuan ini. ' +
           'Anda meninjau dulu sebelum apa pun tersimpan.',
    html:
      '<div class="grid-2">' +
        _isianJml('ai-pg', 'Pilihan ganda', 5) +
        _isianJml('ai-bs', 'Benar / Salah', 0) +
      '</div>' +
      '<div class="grid-2">' +
        _isianJml('ai-isian', 'Isian singkat', 0) +
        _isianJml('ai-esai', 'Uraian', 2) +
      '</div>' +
      '<div class="grup"><label>Tingkat kesulitan</label>' +
        '<select class="isian" id="ai-tingkat">' +
          '<option value="mudah">Mudah</option>' +
          '<option value="sedang" selected>Sedang</option>' +
          '<option value="sulit">Sulit</option>' +
        '</select></div>' +

      /* Soal bercerita (v1.5.5). Ditaruh dalam kotak sendiri karena
         angkanya mudah disalahpahami sebagai TAMBAHAN — padahal ia
         bagian dari komposisi di atas. */
      '<div class="kotak-cerita">' +
        '<div class="kecil tebal mb-8">📖 Soal bercerita (opsional)</div>' +
        '<div class="grid-2">' +
          '<div class="grup" style="margin:0"><label for="ai-cerita">' +
            'Berapa soal memakai satu wacana</label>' +
            '<input class="isian" id="ai-cerita" type="number" min="0" ' +
              'max="20" value="0"></div>' +
          '<div class="grup" style="margin:0"><label for="ai-jenis">' +
            'Jenis wacana</label>' +
            '<select class="isian" id="ai-jenis">' +
              '<option value="kasus">Studi kasus dunia kerja</option>' +
              '<option value="narasi">Narasi / cerita</option>' +
              '<option value="data">Data, tabel, spesifikasi</option>' +
              '<option value="dialog">Dialog / percakapan</option>' +
              '<option value="kutipan">Kutipan teks bacaan</option>' +
            '</select></div>' +
        '</div>' +
        '<span class="bantuan">Diambil <b>dari</b> jumlah di atas, ' +
          'bukan tambahan. Misal 8 pilihan ganda dengan 4 bercerita ' +
          '= tetap 8 soal, 4 di antaranya berbagi satu wacana. ' +
          'Isi 0 bila tidak perlu; minimal 2 bila dipakai.</span>' +
      '</div>' +
      '<div class="grup"><label>Catatan tambahan (opsional)</label>' +
        '<input class="isian" id="ai-catatan" maxlength="500" ' +
          'placeholder="mis. fokus pada konfigurasi MikroTik">' +
        '<span class="bantuan">Maksimal 20 soal sekali buat, agar ' +
          'hasilnya tetap berkualitas.</span></div>',
    labelYa: 'Buat Soal'
  }).then(function (ya) {
    if (!ya) return;

    var komposisi = {
      pg:          _angka('#ai-pg'),
      benar_salah: _angka('#ai-bs'),
      isian:       _angka('#ai-isian'),
      esai:        _angka('#ai-esai')
    };
    var total = komposisi.pg + komposisi.benar_salah +
                komposisi.isian + komposisi.esai;

    /* Diperiksa juga di server; di sini hanya supaya pesannya cepat
       dan guru tidak menunggu 20 detik untuk ditolak. */
    if (total === 0) {
      toast('Tentukan jumlah soal untuk minimal satu tipe.', 'peringatan');
      return;
    }
    if (total > 20) {
      toast('Maksimal 20 soal sekali buat (diminta ' + total + ').',
            'peringatan');
      return;
    }

    var cerita = _angka('#ai-cerita');
    if (cerita === 1) {
      toast('Soal bercerita minimal 2 — satu wacana untuk satu soal ' +
            'tidak perlu dikelompokkan.', 'peringatan', 5);
      return;
    }
    if (cerita > total) {
      toast('Soal bercerita (' + cerita + ') melebihi jumlah soal (' +
            total + '). Angka itu diambil DARI komposisi, bukan tambahan.',
            'peringatan', 6);
      return;
    }

    var el = $('#ai-tingkat'), elc = $('#ai-catatan'), elj = $('#ai-jenis');
    _jalankanGenerateSoal(itemId, {
      item_id: itemId,
      komposisi: komposisi,
      tingkat: el ? el.value : 'sedang',
      catatan: elc ? elc.value.trim() : '',
      jml_bercerita: cerita,
      jenis_stimulus: elj ? elj.value : 'kasus'
    }, total);
  });
}

function _isianJml(id, label, awal) {
  return '<div class="grup"><label>' + label + '</label>' +
    '<input class="isian" id="' + id + '" type="number" min="0" max="20" ' +
      'value="' + awal + '"></div>';
}

function _angka(sel) {
  var el = $(sel);
  var n = el ? Math.round(Number(el.value)) : 0;
  return (isFinite(n) && n > 0) ? n : 0;
}

/* ---------------------------------------------- langkah 2: memanggil AI */

function _jalankanGenerateSoal(itemId, payload, total) {
  var isi = $('#isi-halaman');
  var t0 = Date.now();

  /* Panggilan AI bisa 15–45 detik. Tanpa penanda waktu berjalan, guru
     mengira aplikasinya menggantung — pelajaran dari generator materi. */
  isi.innerHTML =
    '<div class="kartu" style="text-align:center;padding:40px 20px">' +
      '<div class="putar" style="margin:0 auto 16px"></div>' +
      '<div class="tebal">AI sedang menyusun ' + total + ' soal…</div>' +
      '<p class="kecil lembut" id="ai-jam">biasanya 15–45 detik</p>' +
    '</div>';

  var jam = setInterval(function () {
    var el = document.getElementById('ai-jam');
    if (!el) { clearInterval(jam); return; }
    el.textContent = Math.round((Date.now() - t0) / 1000) + ' detik…';
  }, 1000);

  callApi('generateSoalAI', [payload], { diam: true })
    .then(function (d) {
      clearInterval(jam);
      SoalAI.itemId = itemId;
      SoalAI.soal = d.soal || [];
      /* semua tercentang di awal — guru membuang yang keliru,
         bukan memilih satu per satu dari nol */
      SoalAI.pilih = SoalAI.soal.map(function () { return true; });
      gambarTinjauSoalAI(isi, d);
    })
    .catch(function () {
      clearInterval(jam);
      /* pesan galat sudah ditampilkan callApi; kembalikan halaman
         supaya guru tidak terjebak di layar tunggu */
      muatBankSoal(isi, itemId);
    });
}

/* ---------------------------------------------- langkah 3: tinjau */

function gambarTinjauSoalAI(isi, d) {
  var n = SoalAI.soal.length;

  var html =
    '<button class="tautan-balik" onclick="batalTinjauSoalAI()">' +
      '‹ Batal, kembali ke bank soal</button>' +
    '<div class="kepala-halaman">' +
      '<h1>✨ Tinjau Soal Buatan AI</h1>' +
      '<p class="lembut kecil">' + n + ' soal dihasilkan' +
        (d && d.diminta && d.diminta !== n
          ? ' dari ' + d.diminta + ' yang diminta' : '') +
        (d && d.durasi_ms
          ? ' · ' + Math.round(d.durasi_ms / 1000) + ' detik' : '') +
      '</p>' +
    '</div>';

  if (!n) {
    isi.innerHTML = html + kosongkan('🤔', 'AI tidak menghasilkan soal',
      'Coba ulangi, atau perkecil jumlah soal yang diminta.',
      '<button class="btn btn-hantu btn-kecil mt-16" ' +
      'onclick="batalTinjauSoalAI()">Kembali</button>');
    return;
  }

  html +=
    '<div class="kartu panel-tindakan mb-16">' +
      '<b>Periksa dulu sebelum menyimpan.</b> AI bisa keliru — terutama ' +
      'pada kunci jawaban dan angka. Hapus centang pada soal yang tidak ' +
      'ingin dipakai; yang tersimpan hanya yang tercentang.' +
    '</div>';

  /* Laporan soal bercerita. Bila AI tidak menuruti permintaan, guru
     WAJIB diberi tahu — bukan dirapikan diam-diam (§6.2 no. 20). */
  var bc = d && d.bercerita;
  if (bc && bc.diminta >= 2) {
    html += bc.peringatan
      ? '<div class="kartu kotak-peringatan mb-16">' +
          '<b>⚠️ Hasilnya menyimpang dari permintaan</b><br>' +
          esc(bc.peringatan) +
          '<div class="kecil lembut mt-8">Periksa apakah soal yang ' +
            'dikelompokkan benar-benar merujuk wacananya. Anda masih ' +
            'bisa memperbaiki kelompoknya setelah tersimpan, lewat ' +
            'tombol 📖 di bank soal.</div>' +
        '</div>'
      : '<p class="kecil lembut mb-16">📖 ' + bc.jadi +
        ' soal berbagi satu wacana, sesuai permintaan.</p>';
  }

  html +=
    '<div class="baris-antara mb-16" style="flex-wrap:wrap;gap:8px">' +
      '<span class="kecil lembut" id="ai-cacah"></span>' +
      '<div class="baris sela-kecil">' +
        '<button class="btn btn-hantu btn-kecil" ' +
          'onclick="pilihSemuaSoalAI(true)">Centang semua</button>' +
        '<button class="btn btn-hantu btn-kecil" ' +
          'onclick="pilihSemuaSoalAI(false)">Hapus semua centang</button>' +
      '</div>' +
    '</div>' +
    '<div class="kolom" id="ai-daftar">' +
      _daftarTinjauAI(SoalAI.soal) +
    '</div>' +
    '<div class="baris sela-kecil mt-16" style="flex-wrap:wrap">' +
      '<button class="btn btn-hantu" onclick="batalTinjauSoalAI()">' +
        'Batal</button>' +
      '<button class="btn" id="ai-simpan" onclick="simpanSoalAI()">' +
        'Simpan Soal Terpilih</button>' +
    '</div>';

  isi.innerHTML = html;
  _perbaruiCacahAI();
  renderRumus(isi);
}

/**
 * Daftar tinjau: soal sekelompok DIBUNGKUS bersama wacananya.
 *
 * Wacana tampil SEKALI di atas kelompoknya — sama seperti bank soal
 * dan sama seperti yang akan dilihat murid. Guru tetap bisa mencentang
 * per soal; membuang sebagian anggota tidak merusak kelompoknya
 * selama pemegang bacaan ikut tersimpan (dijaga server).
 */
function _daftarTinjauAI(soal) {
  var html = '';
  var grupTerbuka = '';

  /* bacaan hanya ada pada SATU anggota — cari lintas anggota */
  var teksGrup = {};
  soal.forEach(function (s) {
    if (s.grup_id && s.stimulus && !teksGrup[s.grup_id]) {
      teksGrup[s.grup_id] = s.stimulus;
    }
  });

  var jml = {};
  soal.forEach(function (s) {
    if (s.grup_id) jml[s.grup_id] = (jml[s.grup_id] || 0) + 1;
  });

  soal.forEach(function (s, i) {
    var g = s.grup_id || '';
    if (g !== grupTerbuka) {
      if (grupTerbuka) html += '</div>';
      grupTerbuka = '';
      if (g) {
        grupTerbuka = g;
        html += '<div class="blok-grup mb-16">' +
          '<div class="kepala-grup">' +
            '<span class="lencana lencana-grup">📖 Wacana bersama</span>' +
            '<span class="kecil lembut tumbuh">' + jml[g] +
              ' soal di bawah ini mengacu pada teks berikut</span>' +
          '</div>' +
          '<div class="kotak-stimulus mb-8">' +
            '<div class="isi-stimulus konten-kaya">' +
              (teksGrup[g] || '<span class="lembut">(wacana kosong)</span>') +
            '</div>' +
          '</div>';
      }
    }
    html += _kartuSoalAI(s, i);
  });
  if (grupTerbuka) html += '</div>';
  return html;
}

function _kartuSoalAI(s, i) {
  var opsi = '';
  if (s.tipe === 'pg' && s.opsi && s.opsi.length) {
    opsi = '<ul class="opsi-tinjau">' + s.opsi.map(function (o, j) {
      var huruf = 'ABCDE'.charAt(j);
      var benar = String(s.kunci).toUpperCase() === huruf;
      return '<li' + (benar ? ' class="opsi-benar"' : '') + '>' +
        '<b>' + huruf + '.</b> ' + esc(o) +
        (benar ? ' <span class="lencana lencana-sukses">kunci</span>' : '') +
        '</li>';
    }).join('') + '</ul>';
  } else if (s.kunci) {
    opsi = '<div class="kecil mt-8">Kunci: <b>' + esc(s.kunci) + '</b></div>';
  } else if (s.tipe === 'esai') {
    opsi = '<div class="kecil lembut mt-8">Uraian — dinilai manual guru</div>';
  }

  return '<div class="kartu kartu-soal-ai' +
    (s.grup_id ? ' dalam-grup' : '') + '" id="ai-kartu-' + i + '">' +
    '<div class="baris" style="gap:10px;align-items:flex-start">' +
      '<input type="checkbox" class="ai-cek" data-i="' + i + '" ' +
        (SoalAI.pilih[i] ? 'checked' : '') +
        ' onchange="togglePilihSoalAI(' + i + ', this.checked)">' +
      '<div class="tumbuh" style="min-width:0">' +
        '<div class="kecil lembut mb-4">' +
          (i + 1) + '. ' + esc(LABEL_TIPE[s.tipe] || s.tipe) +
          ' · bobot ' + esc(s.bobot) +
          ' · ' + esc(s.tingkat || 'sedang') +
          (s.grup_id ? ' · <b>📖 memakai wacana</b>' : '') + '</div>' +
        /* Pertanyaan AI boleh memuat HTML (tabel, daftar, <b>) — sama
           seperti bank soal dan tampilan murid. esc() di sini membuat
           tabel tampil sebagai kode mentah. Isinya sudah disanitasi
           Util.sanitasi() saat disimpan; sebelum itu berasal dari
           Gemini yang skemanya kita tentukan sendiri. */
        '<div class="tebal konten-kaya">' + s.pertanyaan + '</div>' +
        opsi +
        (s.pembahasan
          ? '<div class="kecil lembut mt-8">💡 ' + esc(s.pembahasan) + '</div>'
          : '') +
      '</div>' +
    '</div></div>';
}

function togglePilihSoalAI(i, nilai) {
  SoalAI.pilih[i] = !!nilai;
  var kartu = document.getElementById('ai-kartu-' + i);
  if (kartu) kartu.classList.toggle('tak-dipilih', !nilai);
  _perbaruiCacahAI();
}

function pilihSemuaSoalAI(nilai) {
  SoalAI.pilih = SoalAI.soal.map(function () { return !!nilai; });
  $$('.ai-cek').forEach(function (c) { c.checked = !!nilai; });
  SoalAI.soal.forEach(function (s, i) {
    var kartu = document.getElementById('ai-kartu-' + i);
    if (kartu) kartu.classList.toggle('tak-dipilih', !nilai);
  });
  _perbaruiCacahAI();
}

function _perbaruiCacahAI() {
  var n = SoalAI.pilih.filter(Boolean).length;
  var el = document.getElementById('ai-cacah');
  if (el) {
    el.textContent = n + ' dari ' + SoalAI.soal.length + ' soal dipilih';
  }
  var tombol = document.getElementById('ai-simpan');
  if (tombol) {
    tombol.disabled = n === 0;
    tombol.textContent = n ? 'Simpan ' + n + ' Soal' : 'Tidak ada yang dipilih';
  }
}

function batalTinjauSoalAI() {
  var itemId = SoalAI.itemId;
  SoalAI = { itemId: null, soal: [], pilih: [] };
  muatBankSoal($('#isi-halaman'), itemId);
}

/* ---------------------------------------------- langkah 4: simpan */

function simpanSoalAI() {
  var terpilih = SoalAI.soal.filter(function (s, i) {
    return SoalAI.pilih[i];
  });
  if (!terpilih.length) {
    toast('Centang minimal satu soal.', 'peringatan');
    return;
  }

  var itemId = SoalAI.itemId;
  var tombol = document.getElementById('ai-simpan');

  konfirmasi('Simpan Soal Terpilih',
    terpilih.length + ' soal akan ditambahkan ke bank soal quiz ini. ' +
    'Anda masih dapat menyuntingnya setelah tersimpan.',
    { labelYa: 'Simpan' }).then(function (ya) {
      if (!ya) return;
      callApi('simpanSoalTerpilih', [itemId, terpilih], { tombol: tombol })
        .then(function (r) {
          toast(r.jml + ' soal ditambahkan.', 'sukses');
          SoalAI = { itemId: null, soal: [], pilih: [] };
          muatBankSoal($('#isi-halaman'), itemId);
        })
        .catch(function () {
          /* Validasi server menolak salah satu soal — hasil generate
             TIDAK dibuang supaya guru bisa membetulkan pilihannya. */
        });
    });
}
</script>
