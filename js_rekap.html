<script>
/* ============================================================
   js_rekap.html — Rekap Nilai (Tahap 8, guru)

   Satu tabel: murid (baris) × item bernilai (kolom), ditapis per
   Materi Pokok, plus tombol ekspor ke Google Sheet.

   Kolomnya bisa banyak, jadi tabel digulir mendatar sementara kolom
   Nama DIBEKUKAN di kiri — tanpa itu guru kehilangan jejak baris
   siapa yang sedang dibacanya.
   ============================================================ */

var RK = {
  kelasId: null,
  mpId: 'semua',
  data: null
};

/* label & warna sel — dipakai tabel dan legenda */
var CATATAN_SEL = {
  belum:            { teks: 'belum mengerjakan',      kelas: 'sel-belum' },
  menunggu:         { teks: 'menunggu penilaian Anda', kelas: 'sel-menunggu' },
  dinilai_proses:   { teks: 'sedang Anda nilai',      kelas: 'sel-menunggu' },
  menunggu_koreksi: { teks: 'menunggu koreksi Anda',  kelas: 'sel-menunggu' },
  sebagian_koreksi: { teks: 'ada percobaan menunggu koreksi', kelas: 'sel-menunggu' },
  berjalan:         { teks: 'sedang dikerjakan',      kelas: 'sel-menunggu' },
  draft:            { teks: 'masih draf murid',       kelas: 'sel-belum' },
  ditolak:          { teks: 'ditolak, menunggu revisi', kelas: 'sel-tolak' },
  diterima:         { teks: 'diterima',               kelas: 'sel-ok' },
  terlambat:        { teks: 'diterima (terlambat)',   kelas: 'sel-lambat' },
  lulus:            { teks: 'mencapai KKM',           kelas: 'sel-ok' },
  belum_lulus:      { teks: 'di bawah KKM',           kelas: 'sel-tolak' }
};

daftarRute('rekap', function (arg) {
  if (!State.user || State.user.role !== 'guru') { pergiKe('#/beranda'); return; }

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  /* Sidebar menu guru (v1.13.0) — penjaga typeof (§6.2 no. 82). */
  var isi = (typeof menuRangka === 'function')
    ? menuRangka(app, 'rekap') : $('#isi-halaman', app);

  var kelasId = arg && arg[0];
  if (!kelasId) { gambarPilihKelas(isi); return; }

  RK.kelasId = kelasId;
  RK.mpId = (arg && arg[1]) || 'semua';
  isi.innerHTML = rangkaMuat(90, 4);
  muatRekap(isi);
});

/* ---------------------------------------------- pilih kelas */

function gambarPilihKelas(isi) {
  isi.innerHTML = rangkaMuat(84, 3);

  (typeof daftarKelasBersama === 'function'
    ? daftarKelasBersama()
    : callApi('getDaftarKelas', [], { diam: true })).then(function (list) {
    var html =
      '<button class="tautan-balik" onclick="pergiKe(\'#/beranda\')">‹ Beranda</button>' +
      '<div class="kepala-halaman">' +
        '<h1>📊 Rekap Nilai</h1>' +
        '<p class="lembut kecil">Pilih kelas untuk melihat seluruh nilai ' +
        'LKPD dan Quiz dalam satu tabel.</p>' +
      '</div>';

    if (!list.length) {
      html += kosongkan('📭', 'Belum ada kelas',
        'Buat kelas terlebih dahulu di menu Kelola Kelas.');
    } else {
      html += '<div class="kolom">' + list.map(function (k) {
        return '<button class="kartu kartu-klik baris-antara" ' +
          'onclick="pergiKe(\'#/rekap/' + esc(k.kelas_id) + '\')">' +
          '<div><div class="tebal">' + esc(namaKelasLengkap(k)) + '</div>' +
          '<div class="kecil lembut">' +
            (k.jml_murid !== undefined
              ? esc(k.jml_murid) + ' murid' : '') + '</div></div>' +
          '<span class="lembut">›</span></button>';
      }).join('') + '</div>';
    }
    isi.innerHTML = html;
  }).catch(function () {
    isi.innerHTML = kosongkan('⚠️', 'Tidak dapat memuat daftar kelas', '');
  });
}

/* ---------------------------------------------- tabel rekap */

function muatRekap(isi) {
  /* SATU panggilan, bukan dua (v1.12.6).
   *
   * Sebelumnya `Promise.all` menembakkan `getPilihanBabRekap` dan
   * `getRekapKelas` berbarengan. Terlihat di log lapangan keduanya
   * berangkat pada detik yang sama (10.34.36) dengan 4,5 dan 8,5
   * detik. Di Apps Script tiap panggilan adalah eksekusi terpisah —
   * masing-masing membayar biaya lantai ±0,9 detik untuk mem-parse
   * 760 KB kode, dan keduanya berebut sumber daya yang sama. */
  callApi('getRekapLengkap', [RK.kelasId, RK.mpId], { diam: true })
  .then(function (r) {
    RK.data = r.rekap;
    gambarRekap(isi, r.pilihan, r.rekap);
  }).catch(function (res) {
    isi.innerHTML = kosongkan('⚠️', 'Tidak dapat memuat rekap',
      (res && res.pesan) || 'Kelas tidak ditemukan.');
  });
}

function gambarRekap(isi, pilihan, d) {
  var html =
    '<button class="tautan-balik" onclick="pergiKe(\'#/rekap\')">' +
      '‹ Pilih kelas lain</button>' +
    '<div class="kepala-halaman baris-antara">' +
      '<div><h1>📊 ' + esc(d.kelas.nama_kelas) + '</h1>' +
      '<p class="lembut kecil">' + esc(d.kelas.mapel || '') + ' · ' +
        esc(d.rekap.jml_murid) + ' murid · ' +
        esc(d.rekap.jml_item) + ' item bernilai</p></div>' +
      '<div class="baris sela-kecil">' +
        /* Pembersih ditaruh BERSAMA tombol Ekspor — di sinilah berkas
           itu dibuat, jadi di sini pula tempat paling masuk akal untuk
           membereskannya (v1.12.1). */
        '<button class="btn btn-hantu" id="btn-bersih">🧹 Bersihkan</button>' +
        '<button class="btn" id="btn-ekspor">📤 Ekspor ke Sheet</button>' +
      '</div>' +
    '</div>';

  /* penapis bab */
  html += '<div class="grup mb-16"><label for="filter-bab">Materi Pokok</label>' +
    '<select class="isian" id="filter-bab">' +
      '<option value="semua"' + (RK.mpId === 'semua' ? ' selected' : '') +
        '>Semua bab (' + pilihan.total_item + ' item)</option>' +
      pilihan.bab.map(function (b) {
        return '<option value="' + esc(b.mp_id) + '"' +
          (RK.mpId === b.mp_id ? ' selected' : '') + '>' +
          esc(b.judul) + ' (' + b.jml_item + ' item)</option>';
      }).join('') +
    '</select></div>';

  /* ringkasan */
  html += '<div class="kartu mb-16"><div class="grid-info">' +
    _infoRk('Rata-rata kelas', d.rekap.rata_kelas === '' ? '—' : d.rekap.rata_kelas) +
    _infoRk('LKPD', d.rekap.jml_lkpd) +
    _infoRk('Quiz', d.rekap.jml_quiz) +
    '</div>';

  /* Refleksi sengaja tidak ada di sini (ralat guru v1.5.1): skalanya
     penilaian diri murid, bukan nilai guru. Disebutkan terang-terangan
     supaya guru tidak mengira kolomnya hilang karena rusak. */
  html += '<p class="kecil lembut mt-12">💭 Item refleksi ' +
    '<b>tidak termasuk penilaian</b> — skalanya penilaian diri murid. ' +
    'Lihat sebarannya lewat tombol Penilaian pada item refleksi.</p>';

  if (d.rekap.terlalu_lebar) {
    html += '<p class="kecil peringatan-teks mt-8">⚠️ ' + d.rekap.jml_item +
      ' kolom cukup banyak untuk dibaca di layar. Pilih satu bab, ' +
      'atau ekspor ke Sheet.</p>';
  }
  html += '</div>';

  if (!d.rekap.jml_murid) {
    html += kosongkan('👥', 'Belum ada murid',
      'Daftarkan murid ke kelas ini terlebih dahulu.');
  } else if (!d.rekap.jml_item) {
    html += kosongkan('📋', 'Belum ada item bernilai',
      'Rekap menampilkan LKPD dan Quiz yang sudah terbit. ' +
      'Item berstatus draf tidak dihitung.');
  } else {
    html += _tabelRekap(d) + _legenda();
  }

  isi.innerHTML = html;

  var sel = $('#filter-bab');
  if (sel) {
    sel.onchange = function () {
      pergiKe('#/rekap/' + RK.kelasId + '/' + this.value);
    };
  }
  var btn = $('#btn-ekspor');
  if (btn) btn.onclick = function () { eksporRekap(btn); };
  var bb = $('#btn-bersih');
  if (bb) bb.onclick = function () { bersihkanEksporLama(bb); };
}

function _infoRk(label, nilai) {
  return '<div><div class="kecil lembut">' + esc(label) + '</div>' +
    '<div class="tebal">' + esc(nilai) + '</div></div>';
}

function _tabelRekap(d) {
  var h = '<div class="tabel-gulir tabel-rekap-bungkus"><table class="tabel tabel-rekap">' +
    '<thead><tr>' +
      '<th class="kol-beku kol-no">#</th>' +
      '<th class="kol-beku kol-nama">Nama</th>';

  d.item.forEach(function (it) {
    var ikon = it.tipe === 'quiz' ? '🎯' : '📝';
    var ket = it.kkm ? 'KKM ' + it.kkm : '';
    h += '<th class="kol-nilai" title="' + esc(it.pertemuan_judul) + '">' +
      '<div class="kecil lembut th-asal">' + esc(it.mp_judul) + '</div>' +
      ikon + ' ' + esc(it.judul) +
      (ket ? '<div class="kecil lembut">' + esc(ket) + '</div>' : '') +
      '</th>';
  });

  h += '<th class="kol-rata">Rata-rata</th></tr></thead><tbody>';

  d.murid.forEach(function (m, i) {
    h += '<tr>' +
      '<td class="kol-beku kol-no lembut kecil">' + (i + 1) + '</td>' +
      '<td class="kol-beku kol-nama">' +
        '<div class="tebal">' + esc(m.nama) + '</div>' +
        '<div class="kecil lembut">' + esc(m.username) + '</div></td>';

    m.nilai.forEach(function (v, k) {
      var c = CATATAN_SEL[m.catatan[k]] ||
              { teks: m.catatan[k] || '', kelas: '' };
      var tampil = (v === '' || v === null || v === undefined)
        ? '<span class="lembut">—</span>' : esc(v);
      h += '<td class="kol-nilai ' + c.kelas + '" title="' +
        esc(m.nama + ' — ' + c.teks) + '">' + tampil + '</td>';
    });

    h += '<td class="kol-rata tebal">' +
      (m.rata === '' ? '<span class="lembut">—</span>' : esc(m.rata)) +
      '</td></tr>';
  });

  /* baris ringkasan */
  h += '</tbody><tfoot>' +
    '<tr><td class="kol-beku kol-no"></td>' +
    '<td class="kol-beku kol-nama kecil">Rata-rata butir</td>';
  d.per_item.forEach(function (p) {
    h += '<td class="kol-nilai kecil">' +
      (p.rata === '' ? '—' : esc(p.rata)) + '</td>';
  });
  h += '<td class="kol-rata tebal">' +
    (d.rekap.rata_kelas === '' ? '—' : esc(d.rekap.rata_kelas)) + '</td></tr>';

  h += '<tr><td class="kol-beku kol-no"></td>' +
    '<td class="kol-beku kol-nama kecil">Belum mengerjakan</td>';
  d.per_item.forEach(function (p) {
    h += '<td class="kol-nilai kecil' + (p.belum ? ' sel-belum' : '') + '">' +
      esc(p.belum) + '</td>';
  });
  h += '<td class="kol-rata"></td></tr>';

  h += '<tr><td class="kol-beku kol-no"></td>' +
    '<td class="kol-beku kol-nama kecil">Mencapai KKM</td>';
  d.per_item.forEach(function (p) {
    h += '<td class="kol-nilai kecil">' +
      (p.tuntas === '' ? '—' : esc(p.tuntas)) + '</td>';
  });
  h += '<td class="kol-rata"></td></tr>';

  return h + '</tfoot></table></div>';
}

function _legenda() {
  return '<div class="kartu mt-16"><div class="kecil tebal mb-8">Keterangan warna</div>' +
    '<div class="legenda">' +
      '<span class="legenda-item"><i class="sel-ok"></i> sudah tuntas / diterima</span>' +
      '<span class="legenda-item"><i class="sel-menunggu"></i> menunggu tindakan Anda</span>' +
      '<span class="legenda-item"><i class="sel-tolak"></i> di bawah KKM / ditolak</span>' +
      '<span class="legenda-item"><i class="sel-lambat"></i> diterima tetapi terlambat</span>' +
      '<span class="legenda-item"><i class="sel-belum"></i> murid belum mengerjakan</span>' +
    '</div>' +
    '<p class="kecil lembut mt-8">Tanda — berarti belum ada nilai. ' +
    'Arahkan kursor ke sel untuk melihat keterangannya.</p></div>';
}

/* ---------------------------------------------- ekspor */

/**
 * Ekspor ke Google Sheet baru.
 *
 * Operasi ini MEMBUAT BERKAS di Drive dan bisa memakan 5–15 detik
 * untuk kelas penuh. Mengikuti aturan §6.2 no. 21: tombolnya dikunci
 * dan tirai menyala dengan keterangan sejak klik.
 */
var _sedangEkspor = false;

function eksporRekap(tombol) {
  if (_sedangEkspor) return;
  _sedangEkspor = true;
  if (tombol) tombol.disabled = true;
  tampilkanMuat(true, 'Menyusun berkas di Google Drive…');

  callApi('eksporRekapKelas', [RK.kelasId, RK.mpId], { diam: true })
    .then(function (r) {
      tampilkanMuat(false);
      _sedangEkspor = false;
      if (tombol) tombol.disabled = false;

      dialog({
        judul: '✅ Berkas siap',
        pesan: r.jml_murid + ' murid × ' + r.jml_item +
               ' item tersimpan sebagai Google Sheet di Drive Anda.',
        html: '<div class="kotak-tautan-ekspor">' +
          '<a href="' + esc(r.url) + '" target="_blank" rel="noopener" ' +
            'class="btn btn-utama lebar">📂 Buka berkas</a>' +
          '<p class="kecil lembut mt-8">' + esc(r.nama) + '</p></div>',
        labelYa: 'Selesai', tanpaBatal: true
      });
    })
    .catch(function () {
      tampilkanMuat(false);
      _sedangEkspor = false;
      if (tombol) tombol.disabled = false;
    });
}

/**
 * Bersihkan berkas ekspor lama dari Drive.
 *
 * Tiap ekspor membuat satu berkas. Tanpa ini Drive guru penuh berkas
 * serupa setelah satu semester.
 */
function bersihkanEksporLama(tombol) {
  konfirmasi('Bersihkan berkas ekspor lama?',
    'Berkas rekap yang dibuat <b>lebih dari 30 hari lalu</b> akan ' +
    'dipindahkan ke tong sampah Drive — masih dapat dipulihkan dari ' +
    'sana selama 30 hari.<br><br>' +
    'Berkas lain milik Anda tidak tersentuh, dan <b>data di LessonLen ' +
    'tidak berubah sama sekali</b>.',
    { labelYa: 'Bersihkan' }).then(function (ya) {
      if (!ya) return;
      callApi('hapusEksporRekapLama', [30], { tombol: tombol })
        .then(function (r) {
          /* Nol berkas bukan kegagalan — tetapi "0 berkas dipindahkan"
             terbaca seperti tombol yang rusak. Bedakan pesannya
             (§6.2 no. 84). */
          if (!r.dibuang) {
            toast(r.disimpan
              ? 'Tidak ada berkas lebih dari 30 hari. ' +
                r.disimpan + ' berkas terbaru dipertahankan.'
              : 'Belum ada berkas ekspor di Drive Anda.',
              'sukses', 5);
            return;
          }
          toast(r.dibuang + ' berkas lama dipindahkan ke tong sampah (' +
            r.disimpan + ' dipertahankan).', 'sukses', 5);
        });
    });
}
</script>
