<script>
var State = {
  token: localStorage.getItem('ll_token') || '',
  user: null,
  beranda: null,
  bab: null,
  isiGuru: null
};

function simpanToken(t) {
  State.token = t || '';
  if (t) localStorage.setItem('ll_token', t);
  else localStorage.removeItem('ll_token');
}

function callApi(fn, args, opsi) {
  args = args || [];
  opsi = opsi || {};
  if (!opsi.diam) tampilkanMuat(true, opsi.pesanMuat);
  var labelAsli = null;
  if (opsi.tombol) {
    opsi.tombol.disabled = true;
    labelAsli = opsi.tombol.innerHTML;
    opsi.tombol.innerHTML = '<span class="putar putar-kecil"></span>';
  }
  function bereskan() {
    if (!opsi.diam) tampilkanMuat(false);
    if (opsi.tombol) {
      opsi.tombol.disabled = false;
      if (labelAsli !== null) opsi.tombol.innerHTML = labelAsli;
    }
  }
  return new Promise(function (resolve, reject) {
    var param = opsi.tanpaToken ? args : [State.token].concat(args);
    google.script.run
      .withSuccessHandler(function (res) {
        bereskan();
        if (res && res.ok) return resolve(res.data);
        if (res && res.error === 'SESI_INVALID') {
          simpanToken(''); State.user = null; State.beranda = null; State.bab = null;
          toast('Sesi berakhir. Silakan masuk kembali.', 'peringatan');
          pergiKe('#/login');
          return reject(res);
        }
        toast((res && res.pesan) || 'Terjadi kesalahan.', 'bahaya');
        reject(res || { error: 'KOSONG' });
      })
      .withFailureHandler(function (err) {
        bereskan();
        toast('Gangguan jaringan. Coba lagi.', 'bahaya');
        reject({ error: 'JARINGAN', pesan: String(err) });
      })[fn].apply(null, param);
  });
}

function tampilkanMuat(tampil, pesan) {
  var el = document.getElementById('tirai-muat');
  if (!el) return;
  var p = document.getElementById('pesan-muat');
  if (p) p.textContent = tampil ? (pesan || '') : '';
  el.classList.toggle('tampil', !!tampil);
}

function toast(pesan, jenis) {
  var wadah = document.getElementById('toast-wadah');
  if (!wadah) return;
  var d = document.createElement('div');
  d.className = 'toast' + (jenis === 'bahaya' ? ' toast-bahaya' : jenis === 'sukses' ? ' toast-sukses' : '');
  d.textContent = pesan;
  wadah.appendChild(d);
  setTimeout(function () { d.remove(); }, 3200);
}

function dialog(opsi) {
  return new Promise(function (resolve) {
    var tirai = document.getElementById('tirai-dialog');
    var isi = document.getElementById('isi-dialog');
    isi.classList.toggle('dialog-lebar', opsi.lebar === 'sedang');
    isi.innerHTML = '<h3>' + esc(opsi.judul) + '</h3>' +
      '<div class="lembut">' + (opsi.pesan || '') + '</div>' +
      (opsi.html || '') +
      '<div class="dialog-aksi">' +
        (opsi.tanpaBatal ? '' : '<button class="btn btn-hantu" data-aksi="batal">' +
          esc(opsi.labelBatal || 'Batal') + '</button>') +
        '<button class="btn' + (opsi.bahaya ? ' btn-bahaya' : '') + '" data-aksi="ya">' +
          esc(opsi.labelYa || 'Ya') + '</button></div>';
    function tutup(hasil) { tirai.classList.remove('tampil'); resolve(hasil); }
    isi.onclick = function (e) {
      var b = e.target.closest('[data-aksi]');
      if (!b) return;
      tutup(b.dataset.aksi === 'ya');
    };
    tirai.classList.add('tampil');
  });
}

function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function $(sel, induk) { return (induk || document).querySelector(sel); }
function $$(sel, induk) { return Array.prototype.slice.call((induk || document).querySelectorAll(sel)); }

function ambilTemplate(id) {
  var t = document.getElementById(id);
  if (!t) throw new Error('Template tidak ada: ' + id);
  return t.content.cloneNode(true);
}
function render(id) {
  var app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(ambilTemplate(id));
  window.scrollTo(0, 0);
  return app;
}

var RUTE = {};
function daftarRute(pola, fn) { RUTE[pola] = fn; }
function pergiKe(hash) {
  if (location.hash === hash) router();
  else location.hash = hash;
}

function router() {
  var hash = location.hash || '#/';
  var bagian = hash.slice(2).split('/').filter(function (x) { return x !== ''; });
  if (!State.token && bagian[0] !== 'login') {
    if (location.hash !== '#/login') { location.hash = '#/login'; return; }
  }
  if (State.user && State.user.harus_ganti_password && bagian[0] !== 'ganti-password') {
    if (location.hash !== '#/ganti-password') { location.hash = '#/ganti-password'; return; }
  }
  var kunci = bagian[0] || (State.token ? 'beranda' : 'login');
  var fn = RUTE[kunci];
  if (!fn) { location.hash = State.token ? '#/beranda' : '#/login'; return; }
  fn(bagian.slice(1));
}
window.addEventListener('hashchange', router);

function pasangShell() {
  var app = render('tpl-app');
  $('.merek-ikon', app).textContent = APP_IKON || '🌱';
  $('.merek-nama', app).textContent = APP_NAMA || 'LessonLen';
  $('#top-nama', app).textContent = State.user ? State.user.nama : '';
  $('#btn-merek', app).onclick = function () { pergiKe('#/beranda'); };
  $('#btn-keluar', app).onclick = keluarAkun;
  return $('#isi-halaman', app);
}

function keluarAkun() {
  dialog({ judul: 'Keluar', pesan: 'Keluar dari LessonLen?', labelYa: 'Keluar', bahaya: true })
    .then(function (ya) {
      if (!ya) return;
      callApi('logout', [], { diam: true }).catch(function () {})
        .then(function () {
          simpanToken(''); State.user = null; State.beranda = null; State.bab = null;
          location.hash = '#/login'; router();
        });
    });
}

function bilah(persen) {
  persen = Math.max(0, Math.min(100, Number(persen) || 0));
  return '<div class="bilah"><div class="bilah-isi" style="width:' + persen + '%"></div></div>';
}

function mulai() {
  if (!State.token) { router(); return; }
  tampilkanMuat(true);
  callApi('cekSesi', [], { diam: true })
    .then(function (d) {
      State.user = d.user;
      State.user.harus_ganti_password = d.harus_ganti_password;
      tampilkanMuat(false);
      router();
    })
    .catch(function () {
      tampilkanMuat(false); simpanToken(''); location.hash = '#/login'; router();
    });
}
document.addEventListener('DOMContentLoaded', mulai);
</script>
