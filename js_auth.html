<script>
daftarRute('login', function () {
  var app = render('tpl-login');
  $('#login-ikon', app).textContent = APP_IKON || '🌱';
  $('#login-nama', app).textContent = APP_NAMA || 'LessonLen';
  $('#form-masuk', app).onsubmit = function (e) {
    e.preventDefault();
    var u = $('#in-user').value, p = $('#in-sandi').value;
    callApi('login', [u, p], { tanpaToken: true, tombol: e.submitter })
      .then(function (d) {
        simpanToken(d.token);
        State.user = d.user;
        State.user.harus_ganti_password = d.harus_ganti_password;
        pergiKe(d.harus_ganti_password ? '#/ganti-password' : '#/beranda');
      });
  };
});

daftarRute('ganti-password', function () {
  if (!State.token) { pergiKe('#/login'); return; }
  var app = render('tpl-ganti');
  $('#form-ganti', app).onsubmit = function (e) {
    e.preventDefault();
    callApi('gantiPassword', [$('#in-lama').value, $('#in-baru').value], { tombol: e.submitter })
      .then(function () {
        State.user.harus_ganti_password = false;
        toast('Kata sandi diganti.', 'sukses');
        pergiKe('#/beranda');
      });
  };
});

daftarRute('beranda', function () {
  if (!State.user) { pergiKe('#/login'); return; }
  if (State.user.role === 'guru') { layarBerandaGuru(); return; }
  layarBerandaMurid();
});
</script>
