<script>
/* ============================================================
   LessonLen — js_auth
   Layar login, ganti password, dashboard sementara
   ============================================================ */

/* ---------------------------------------------- LOGIN */
daftarRute('login', function () {
  if (State.token && State.user) { pergiKe('#/beranda'); return; }

  var app = render('tpl-login');

  /* Ikon & nama dari Code.gs (v1.15.6) — satu tempat untuk seluruh
     layar. Template memuat nilai cadangan, jadi bila Code.gs belum
     tersalin layar masuk tetap utuh. */
  if (typeof APP_IKON !== 'undefined') {
    var elIkon = $('#merek-ikon-login', app);
    if (elIkon) elIkon.textContent = APP_IKON;
  }
  if (typeof APP_NAMA !== 'undefined') {
    var elNama = $('#merek-nama-login', app);
    if (elNama) elNama.textContent = APP_NAMA;
  }

  var form = $('#form-login', app);
  var salah = $('#salah-login', app);

  setTimeout(function () {
    var u = $('#in-username', app);
    if (u) u.focus();
  }, 80);

  form.onsubmit = function (e) {
    e.preventDefault();
    salah.textContent = '';

    var u = $('#in-username', app).value.trim();
    var p = $('#in-password', app).value;

    if (!u || !p) { salah.textContent = 'Isi nama pengguna dan kata sandi.'; return; }

    callApi('login', [u, p], { tombol: $('#btn-masuk', app), tanpaToken: true })
      .then(function (d) {
        simpanToken(d.token);
        State.user = d.user;
        State.user.harus_ganti_password = d.harus_ganti_password;

        State.user.biodata_kurang = d.biodata_kurang === true;

        if (d.harus_ganti_password) {
          toast('Silakan ganti kata sandi Anda.', 'peringatan');
          pergiKe('#/ganti-password');
          return;
        }

        /* Login BARU menghapus penundaan sesi sebelumnya: murid yang
           menekan "Nanti Saja" kemarin tetap diingatkan hari ini. */
        if (State.user.biodata_kurang) lupakanTundaBiodata();

        var perluBio = State.user.biodata_kurang;
        var bioAwal = d.biodata || {};
        State.ringkasan = { notif_belum_dibaca: 0, versi: APP_VERSI };
        toast('Selamat datang, ' + d.user.nama + '.', 'sukses');
        pergiKe('#/beranda');

        /* Dialog dimunculkan SESUDAH beranda tergambar (v1.10.1).

           `pergiKe()` memicu router yang menimpa isi halaman. Bila
           dialog dibuka sebelum itu, tirai memang tampil tetapi murid
           melihatnya di atas layar login yang sedang berganti —
           berkedip, dan pada perpindahan tertentu ikut tertutup.
           Jeda kecil membuatnya muncul di atas beranda yang sudah
           tenang. */
        if (perluBio) {
          setTimeout(function () { dialogBiodata(bioAwal); }, 350);
        }
      })
      .catch(function (res) {
        salah.textContent = (res && res.pesan) || 'Gagal masuk.';
        var ip = $('#in-password', app);
        if (ip) { ip.value = ''; ip.focus(); }
      });
  };

  $('#btn-lupa', app).onclick = function () { dialogLupaSandi(''); };

  /* v1.17.0 — pemulihan username lewat email + nomor WA. */
  $('#btn-pulihkan', app).onclick = function () {
    var tpl = document.getElementById('tpl-pulihkan');
    var html = tpl ? tpl.innerHTML : '';
    dialog({ judul: 'Lupa Nama Pengguna', html: html, lebar: 'sedang',
             labelYa: 'Cari Nama Pengguna' })
      .then(function (ya) {
        if (!ya) return;
        var elEm = document.getElementById('in-pulih-email');
        var elWa = document.getElementById('in-pulih-wa');
        var vEm = elEm ? elEm.value.trim() : '';
        var vWa = elWa ? elWa.value.trim() : '';

        if (!vEm || !vWa) {
          toast('Isi email dan nomor WhatsApp dulu.', 'peringatan');
          return;
        }

        callApi('pulihkanAkun', [vEm, vWa], { tanpaToken: true })
          .then(function (d) { gambarHasilPulih(d); });
      });
  };
});

/**
 * Dialog "Lupa Kata Sandi" (v1.17.0 — diangkat dari badan rute login).
 *
 * Dipakai DUA tempat: tombol di layar masuk, dan tombol "Lupa Kata
 * Sandi Juga" pada hasil pemulihan username. Tempat kedua inilah
 * alasannya diangkat — murid yang baru menemukan username-nya tidak
 * perlu mengetiknya ulang, dan dua salinan dialog yang harus dirawat
 * sendiri pasti berbeda kalimat suatu saat nanti (§6.2 no. 30).
 *
 * @param {string} nilaiAwal isian awal kotak username; '' = kosong
 */
function dialogLupaSandi(nilaiAwal) {
  var tpl = document.getElementById('tpl-lupa');
  var html = tpl ? tpl.innerHTML : '';

  var janji = dialog({ judul: 'Lupa Kata Sandi', html: html,
                       labelYa: 'Kirim Permintaan' });

  /* `dialog()` mengisi DOM secara sinkron di dalam executor Promise,
     jadi saat fungsi itu kembali isian-nya SUDAH ada dan bisa langsung
     diisi — tidak perlu menunggu, tidak ada kedipan. */
  if (nilaiAwal) {
    var isi = document.getElementById('in-lupa');
    if (isi) isi.value = nilaiAwal;
  }

  janji.then(function (ya) {
    if (!ya) return;
    var el = document.getElementById('in-lupa');
    var v = el ? el.value.trim() : '';
    if (!v) { toast('Isi nama pengguna dulu.', 'peringatan'); return; }

    callApi('ajukanReset', [v], { tanpaToken: true }).then(function () {
      /* respons sengaja seragam — tidak membocorkan username yang valid */
      dialog({
        judul: 'Permintaan Diterima',
        pesan: 'Bila akun ditemukan, guru akan segera memproses ' +
               'permintaan Anda. Silakan hubungi guru untuk menerima ' +
               'kata sandi sementara.',
        tanpaBatal: true, labelYa: 'Mengerti'
      });
    });
  });
}

/**
 * Gambar hasil pemulihan username (v1.17.0).
 *
 * TIGA cabang, dan bentuknya disengaja:
 *
 *   tunggu_menit  → batas percobaan tercapai. Dijelaskan apa adanya;
 *                   menyembunyikannya membuat murid menekan berulang
 *                   kali tanpa tahu kenapa tidak berhasil.
 *   !ketemu       → SATU pesan untuk SEMUA sebab: pasangan salah,
 *                   biodata belum lengkap, akun tidak ada, akun
 *                   nonaktif. Membedakannya mengubah dialog ini jadi
 *                   alat memastikan email + nomor WA milik orang yang
 *                   sama — bocoran privasi walau tanpa username.
 *                   Karena murid yang datanya kurang MEMANG harus
 *                   bertemu guru, satu pesan ini sudah benar.
 *   ketemu        → tampilkan username + dua jalur minta reset.
 */
function gambarHasilPulih(d) {
  if (d && d.tunggu_menit) {
    dialog({
      judul: 'Terlalu Banyak Percobaan',
      pesan: 'Pencarian dibatasi untuk melindungi data murid. Coba lagi ' +
             'dalam ' + d.tunggu_menit + ' menit, atau temui guru Anda.',
      tanpaBatal: true, labelYa: 'Mengerti'
    });
    return;
  }

  if (!d || !d.ketemu) {
    dialog({
      judul: 'Data Tidak Ditemukan',
      pesan: 'Email dan nomor WhatsApp tidak cocok dengan data murid, ' +
             'atau biodata Anda belum lengkap. Silakan temui guru Anda ' +
             'untuk mendapatkan nama pengguna dan kata sandi.',
      tanpaBatal: true, labelYa: 'Mengerti'
    });
    return;
  }

  var daftar = d.akun.map(function (a) {
    return '<div class="kotak-kode mt-8">' + esc(a.username) + '</div>' +
           '<p class="bantuan">' + esc(a.nama) +
             (a.label_kelas ? ' · ' + esc(a.label_kelas) : '') + '</p>';
  }).join('');

  /* Tombol WA mengikuti pola `dialogHasilReset()`: hanya digambar bila
     tautannya ada. `tautanPulihWa()` mengembalikan '' bila tidak ada
     guru bernomor sah — jangan pernah menampilkan wa.me/ yang mati. */
  var tombolWa = d.tautan_wa_guru
    ? '<a class="btn btn-hantu btn-penuh mt-16" href="' +
        esc(d.tautan_wa_guru) + '" target="_blank" rel="noopener">' +
        '💬 Beri Tahu Guru lewat WhatsApp</a>'
    : '';

  dialog({
    judul: 'Nama Pengguna Ditemukan',
    pesan: d.akun.length > 1
      ? 'Data Anda cocok dengan lebih dari satu akun. Pakai yang sesuai ' +
        'kelasnya:'
      : 'Nama pengguna Anda:',
    html: daftar + tombolWa +
          '<p class="bantuan mt-16">Masih bisa masuk? Selesai. Lupa kata ' +
          'sandinya juga? Tekan tombol di bawah.</p>',
    lebar: 'sedang',
    labelBatal: 'Selesai',
    labelYa: 'Lupa Kata Sandi Juga'
  }).then(function (mintaReset) {
    if (!mintaReset) return;
    /* Satu akun → username-nya sudah pasti, isikan langsung.
       Lebih dari satu → biarkan murid memilih sendiri; menebak akan
       mengajukan reset untuk akun yang salah. */
    dialogLupaSandi(d.akun.length === 1 ? d.akun[0].username : '');
  });
}

/* ---------------------------------------------- GANTI PASSWORD */
daftarRute('ganti-password', function () {
  if (!State.token) { pergiKe('#/login'); return; }

  var app = render('tpl-ganti-password');
  var salah = $('#salah-ganti', app);
  var wajib = State.user && State.user.harus_ganti_password;

  if (wajib) {
    $('#teks-alasan', app).textContent =
      'Kata sandi Anda baru direset. Buat yang baru untuk melanjutkan.';
  }

  $('#form-ganti', app).onsubmit = function (e) {
    e.preventDefault();
    salah.textContent = '';

    var lama  = $('#in-lama', app).value;
    var baru  = $('#in-baru', app).value;
    var ulang = $('#in-ulang', app).value;

    if (baru !== ulang) { salah.textContent = 'Ulangan kata sandi tidak sama.'; return; }
    if (baru.length < 6) { salah.textContent = 'Minimal 6 karakter.'; return; }
    if (!/[a-zA-Z]/.test(baru) || !/[0-9]/.test(baru)) {
      salah.textContent = 'Harus memuat huruf dan angka.'; return;
    }

    callApi('gantiPassword', [lama, baru], { tombol: $('#btn-simpan-pwd', app) })
      .then(function () {
        if (State.user) State.user.harus_ganti_password = false;
        toast('Kata sandi berhasil diganti.', 'sukses');
        pergiKe('#/beranda');
      })
      .catch(function (res) {
        salah.textContent = (res && res.pesan) || 'Gagal mengganti kata sandi.';
      });
  };

  $('#btn-batal-ganti', app).onclick = keluarAkun;
});


/* ---------------------------------------------- BIODATA MURID (v1.10.0)

   Guru memilih "diingatkan, boleh ditunda" — jadi layar ini TIDAK
   memaksa seperti ganti kata sandi. Tombol "Nanti Saja" mengembalikan
   murid ke beranda, bukan mengeluarkannya.

   Penundaan disimpan di localStorage, BUKAN di server. Bila disimpan
   di server, murid yang menunda sekali tidak akan pernah diingatkan
   lagi. Dengan localStorage spanduk muncul kembali pada sesi
   berikutnya — mengganggu secukupnya, tanpa mengunci. */

var KUNCI_TUNDA_BIO = 'lessonlen_tunda_biodata';

/** Murid menunda pengisian pada sesi ini? */
function biodataDitunda() {
  try { return localStorage.getItem(KUNCI_TUNDA_BIO) === '1'; }
  catch (e) { return false; }
}

function tundaBiodata() {
  try { localStorage.setItem(KUNCI_TUNDA_BIO, '1'); } catch (e) {}
}

/** Dipanggil setelah biodata tersimpan — spanduk tidak perlu lagi. */
function lupakanTundaBiodata() {
  try { localStorage.removeItem(KUNCI_TUNDA_BIO); } catch (e) {}
}

/**
 * Dialog "Lengkapi Biodata" — muncul LANGSUNG setelah login.
 *
 * Kenapa dialog, bukan langsung melempar ke layar `#/biodata`:
 * murid tetap sampai di beranda. Menutup dialog berarti ia sudah
 * berada di halaman yang benar, bukan terlempar bolak-balik.
 *
 * @param {Object} awal  isi biodata yang sudah ada, dari respons login
 *                       (ikut terkirim supaya tidak ada panggilan API
 *                       tambahan saat 36 murid masuk bersamaan)
 */
/**
 * Dialog "Profil Saya" — dibuka dari nama murid di topbar (v1.11.1).
 *
 * Berbeda dari `dialogBiodata()` yang muncul otomatis saat login:
 * yang ini SUKARELA, dipanggil murid sendiri ketika ingin mengganti
 * nomor WA atau email. Karena itu ia menampilkan data yang sudah ada
 * lebih dulu, bukan langsung form kosong.
 */
function dialogProfil() {
  callApi('getProfilSaya', [], { diam: true })
    .then(function (d) { gambarDialogProfil(d || {}); })
    .catch(function () {
      toast('Gagal memuat profil.', 'peringatan');
    });
}

function gambarDialogProfil(d) {
  var guru = d.guru || {};

  function baris(label, nilai, kosong) {
    return '<div class="baris-antara" style="padding:7px 0;' +
      'border-bottom:1px solid var(--garis)">' +
      '<span class="kecil lembut">' + label + '</span>' +
      (nilai
        ? '<span class="tebal kecil">' + esc(nilai) + '</span>'
        : '<span class="lencana lencana-peringatan">' +
          esc(kosong || 'belum diisi') + '</span>') +
      '</div>';
  }

  var isi =
    '<div class="mb-16">' +
      baris('Nama', d.nama) +
      baris('Nama pengguna', d.username) +
      (d.rombel ? baris('Rombel', d.rombel) : '') +
      baris('NISN', d.nisn, 'belum ada') +
      baris('Email', d.email) +
      baris('Nomor WhatsApp',
            d.no_wa ? '+' + d.no_wa : '') +
    '</div>' +
    (guru.ada
      ? '<a class="btn btn-hantu btn-penuh mb-8" href="' + esc(guru.tautan) +
        '" target="_blank" rel="noopener">💬 Hubungi Guru' +
        (guru.nama ? ' (' + esc(guru.nama) + ')' : '') + '</a>'
      : '<p class="bantuan mb-8">Guru belum mencantumkan nomor ' +
        'WhatsApp.</p>');

  dialog({
    judul: '👤 Profil Saya',
    pesan: d.lengkap
      ? 'Data ini dipakai guru untuk menghubungi Anda.'
      : 'Biodata Anda belum lengkap.',
    html: isi,
    lebar: 'sedang',
    labelYa: 'Ubah Biodata',
    labelBatal: 'Tutup'
  }).then(function (ya) {
    if (!ya) return;
    /* Memakai dialog yang SAMA dengan yang muncul saat login —
       satu bentuk isian saja yang perlu dirawat. */
    dialogBiodata({ nisn: d.nisn, email: d.email, no_wa: d.no_wa });
  });
}

/**
 * Dialog "Profil Guru" — dibuka dari nama guru di topbar (v1.11.2).
 *
 * Satu-satunya tempat guru mengisi nomor WhatsApp-nya. Nomor itulah
 * yang dipakai tombol "Hubungi Guru" pada dialog profil murid, jadi
 * selama kosong tombolnya tidak muncul sama sekali.
 */
function dialogProfilGuru(awal) {
  if (!awal) {
    callApi('getProfilGuru', [], { diam: true })
      .then(function (d) { dialogProfilGuru(d || {}); })
      .catch(function () { toast('Gagal memuat profil.', 'peringatan'); });
    return;
  }

  var isiForm =
    '<div class="grup"><label for="g-nama">Nama</label>' +
      '<input class="isian" id="g-nama" value="' +
      esc(awal.nama || '') + '"></div>' +
    '<div class="grup"><label for="g-email">Email</label>' +
      '<input class="isian" id="g-email" type="email" value="' +
      esc(awal.email || '') + '" placeholder="nama@gmail.com"></div>' +
    '<div class="grup"><label for="g-wa">Nomor WhatsApp</label>' +
      '<input class="isian" id="g-wa" type="tel" inputmode="tel" value="' +
      esc(awal.no_wa || '') + '" placeholder="081234567890">' +
      '<span class="bantuan">Dipakai tombol <b>Hubungi Guru</b> pada ' +
      'profil murid. Kosongkan bila tidak ingin dihubungi lewat ' +
      'WhatsApp.</span></div>' +
    '<div class="pesan-salah" id="g-salah"></div>';

  dialog({
    judul: '👤 Profil Guru',
    pesan: 'Nomor WhatsApp Anda ditampilkan kepada murid.',
    html: isiForm,
    lebar: 'sedang',
    labelYa: 'Simpan',
    labelBatal: 'Tutup'
  }).then(function (ya) {
    if (!ya) return;

    var el = function (id) { return document.getElementById(id); };
    var d = {
      nama:  el('g-nama')  ? el('g-nama').value.trim()  : '',
      email: el('g-email') ? el('g-email').value.trim() : '',
      no_wa: el('g-wa')    ? el('g-wa').value.trim()    : ''
    };
    if (!d.nama) {
      toast('Nama tidak boleh kosong.', 'peringatan');
      dialogProfilGuru(d);
      return;
    }

    callApi('simpanProfilGuru', [d], { diam: true })
      .then(function () {
        if (State.user) State.user.nama = d.nama;
        toast('Profil tersimpan.', 'sukses');
        router();                     /* nama di topbar ikut segar */
      })
      .catch(function (res) {
        toast((res && res.pesan) || 'Gagal menyimpan profil.', 'bahaya');
        /* Dialog dibuka ulang beserta isinya — §6.2 no. 57. */
        dialogProfilGuru(d);
      });
  });
}

function dialogBiodata(awal) {
  /* Dipanggil TANPA data awal (mis. dari tombol spanduk) → ambil dulu
     isinya, baru buka dialog. Saat login datanya sudah ikut terkirim
     sehingga jalur ini tidak terpakai — itulah sebabnya pengambilan
     hanya terjadi di sini, bukan selalu. */
  if (!awal) {
    callApi('getBiodataSaya', [], { diam: true })
      .then(function (d) { dialogBiodata(d || {}); })
      .catch(function () { dialogBiodata({}); });
    return;
  }

  var isiForm =
    '<div class="grup"><label for="d-nisn">NISN</label>' +
      '<input class="isian" id="d-nisn" type="text" inputmode="numeric" ' +
      'value="' + esc(awal.nisn || '') + '" placeholder="mis. 0098765432">' +
      '<span class="bantuan">Angka saja. Kosongkan bila NISN Anda ' +
      'belum terbit.</span></div>' +
    '<div class="grup"><label for="d-email">Email ' +
      '<span class="wajib">*</span></label>' +
      '<input class="isian" id="d-email" type="email" ' +
      'value="' + esc(awal.email || '') + '" placeholder="nama@gmail.com">' +
      '</div>' +
    '<div class="grup"><label for="d-wa">Nomor WhatsApp ' +
      '<span class="wajib">*</span></label>' +
      '<input class="isian" id="d-wa" type="tel" inputmode="tel" ' +
      'value="' + esc(awal.no_wa || '') + '" placeholder="081234567890">' +
      '<span class="bantuan">Boleh ditulis 0812… atau +62812… ' +
      'Nomor akan dirapikan otomatis.</span></div>' +
    '<div class="pesan-salah" id="d-salah-bio"></div>';

  dialog({
    judul: '🪪 Lengkapi Biodata',
    pesan: 'Data ini dipakai guru untuk menghubungi Anda.',
    html: isiForm,
    lebar: 'sedang',
    labelYa: 'Simpan',
    labelBatal: 'Nanti Saja'
  }).then(function (ya) {
    if (!ya) { tundaBiodata(); return; }

    /* `dialog()` menyembunyikan tirai tetapi TIDAK menghapus isinya,
       jadi nilai yang diketik masih terbaca di sini. */
    var el = function (id) { return document.getElementById(id); };
    var d = {
      nisn:  el('d-nisn')  ? el('d-nisn').value.trim()  : '',
      email: el('d-email') ? el('d-email').value.trim() : '',
      no_wa: el('d-wa')    ? el('d-wa').value.trim()    : ''
    };

    if (!d.email || !d.no_wa) {
      toast('Email dan nomor WhatsApp wajib diisi.', 'peringatan');
      /* Dialog DIBUKA ULANG dengan isian yang tadi diketik.

         Tanpa ini murid kehilangan seluruh ketikannya begitu ada satu
         medan keliru — dan karena dialog ini muncul otomatis saat
         login, ia tidak punya cara mudah membukanya kembali
         (§6.2 no. 57: jangan hapus pekerjaan orang sebelum
         dipastikan tersimpan). */
      dialogBiodata(d);
      return;
    }

    callApi('simpanBiodataSaya', [d], { diam: true })
      .then(function () {
        lupakanTundaBiodata();
        if (State.user) State.user.biodata_kurang = false;
        toast('Biodata tersimpan. Terima kasih.', 'sukses');
        router();                       /* spanduk beranda ikut hilang */
      })
      .catch(function (res) {
        toast((res && res.pesan) || 'Gagal menyimpan biodata.', 'bahaya');
        dialogBiodata(d);               /* pesan server + isian utuh */
      });
  });
}

daftarRute('biodata', function () {
  if (!State.token) { pergiKe('#/login'); return; }

  var app = render('tpl-biodata');
  var salah = $('#salah-biodata', app);

  callApi('getBiodataSaya', [], { diam: true }).then(function (d) {
    d = d || {};
    var sapa = $('#bio-sapaan', app);
    if (sapa && d.nama) {
      sapa.textContent = d.nama + (d.rombel ? ' · ' + d.rombel : '');
    }
    /* Isian diisi nilai yang sudah ada supaya murid yang sekadar
       memperbarui tidak perlu mengetik ulang semuanya. */
    $('#in-nisn', app).value  = d.nisn  || '';
    $('#in-email', app).value = d.email || '';
    $('#in-wa', app).value    = d.no_wa || '';
  });

  $('#form-biodata', app).onsubmit = function (e) {
    e.preventDefault();
    salah.textContent = '';

    var d = {
      nisn:  $('#in-nisn', app).value.trim(),
      email: $('#in-email', app).value.trim(),
      no_wa: $('#in-wa', app).value.trim()
    };
    if (!d.email || !d.no_wa) {
      salah.textContent = 'Email dan nomor WhatsApp wajib diisi.';
      return;
    }

    /* Pemeriksaan bentuk TETAP di server — di sini hanya supaya murid
       tahu lebih cepat, tanpa menunggu perjalanan bolak-balik. */
    callApi('simpanBiodataSaya', [d], { tombol: $('#btn-simpan-bio', app) })
      .then(function (r) {
        lupakanTundaBiodata();
        if (State.user) State.user.biodata_kurang = false;
        toast('Biodata tersimpan. Terima kasih.', 'sukses');
        pergiKe('#/beranda');
      })
      .catch(function (res) {
        salah.textContent = (res && res.pesan) || 'Gagal menyimpan biodata.';
      });
  };

  $('#btn-nanti-bio', app).onclick = function () {
    tundaBiodata();
    pergiKe('#/beranda');
  };
});

/* ---------------------------------------------- PERMINTAAN RESET (guru) */
daftarRute('reset', function () {
  if (!State.user || State.user.role !== 'guru') { pergiKe('#/beranda'); return; }

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  /* Sidebar menu guru (v1.13.2). */
  var isi = (typeof menuRangka === 'function')
    ? menuRangka(app, 'murid') : $('#isi-halaman', app);
  isi.innerHTML = rangkaMuat(72, 2);

  callApi('getPermintaanReset', [], { diam: true }).then(function (list) {
    var kepala =
      '<button class="tautan-balik" onclick="pergiKe(\'#/beranda\')">‹ Beranda</button>' +
      '<div class="kepala-halaman"><h1>Permintaan Reset</h1>' +
      '<p class="lembut kecil">Murid yang mengajukan lupa kata sandi.</p></div>';

    if (!list.length) {
      isi.innerHTML = kepala + kosongkan('✅', 'Tidak ada permintaan',
        'Semua permintaan reset sudah diproses.');
      return;
    }

    isi.innerHTML = kepala + '<div class="kolom">' + list.map(function (r) {
      return '<div class="kartu baris-antara" data-uid="' + esc(r.user_id) +
             '" data-rid="' + esc(r.request_id) + '">' +
        '<div style="min-width:0">' +
          '<div class="tebal">' + esc(r.nama) + '</div>' +
          '<div class="kecil lembut">' + esc(r.username) + ' · ' + esc(r.dibuat_at) + '</div>' +
        '</div>' +
        '<button class="btn btn-kecil" data-aksi="reset">Reset</button>' +
      '</div>';
    }).join('') + '</div>';

    isi.onclick = function (e) {
      var btn = e.target.closest('[data-aksi="reset"]');
      if (!btn) return;
      var kartu = btn.closest('[data-uid]');
      var uid = kartu.dataset.uid, rid = kartu.dataset.rid;

      konfirmasi('Reset Kata Sandi',
                 'Kata sandi baru akan dibuat dan seluruh sesi murid ini diakhiri.',
                 { labelYa: 'Reset Sekarang' })
        .then(function (ya) {
          if (!ya) return;
          callApi('resetPasswordMurid', [uid, rid], { tombol: btn }).then(function (d) {
            if (typeof dialogHasilReset === 'function') {
              dialogHasilReset(d, function () { router(); });
            } else { toast('Sandi: ' + d.password_sementara, 'sukses', 12); }
          });
        });
    };
  });
});
</script>
