<script>
/* ============================================================
   LessonLen — js_kelompok
   Guru: menyusun kelompok, menerima hasil, menilai (v1.7.0)

   Satu layar untuk dua pekerjaan yang saling bergantung:
   susunan kelompok dan penilaiannya. Memisahkannya menjadi dua
   rute memaksa guru bolak-balik hanya untuk melihat siapa yang
   ia nilai.

   Nama kelompok DIKETIK GURU (keputusan guru, v1.7.0). Bagi
   Otomatis hanya memberi nama sementara "Kelompok 1, 2, 3…"
   yang boleh diubah lewat tombol Ubah.
   ============================================================ */

var LENCANA_KLP = {
  belum:          ['lencana-terkunci',   'belum mengumpulkan'],
  draft:          ['lencana',            'sedang dikerjakan'],
  menunggu:       ['lencana-peringatan', 'menunggu dinilai'],
  dinilai_proses: ['lencana-peringatan', 'sedang dinilai'],
  diterima:       ['lencana-sukses',     'diterima'],
  ditolak:        ['lencana-bahaya',     'perlu revisi']
};

/* ---------------------------------------------- RUTE: murid */

var LABEL_KLP_MURID = {
  belum:          ['Belum dikumpulkan', ''],
  draft:          ['Draf', ''],
  menunggu:       ['Menunggu penilaian', 'menunggu'],
  dinilai_proses: ['Sedang dinilai guru', 'dinilai_proses'],
  diterima:       ['Diterima', 'diterima'],
  ditolak:        ['Perlu diperbaiki', 'ditolak']
};

daftarRute('tugas-kelompok', function (arg) {
  if (!State.user || State.user.role !== 'murid') { pergiKe('#/beranda'); return; }
  var id = arg && arg[0];
  if (!id) { pergiKe('#/beranda'); return; }

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var luar = $('#isi-halaman', app);

  /* Kerangka + sidebar digambar SEKARANG, tidak menunggu server —
     pola sama dengan js_lkpd. */
  Nav.aktifItem = id;
  var isi = navRangka(luar);
  isi.innerHTML = rangkaMuat(80, 3);
  if (Nav.kelasId) navMuat(Nav.kelasId).then(navGambar);

  callApi('bukaTugasKelompok', [id], { diam: true })
    .then(function (d) {
      gambarTugasKelompok(isi, d);
      navPasangItem(d.item.kelas_id, d.item.pertemuan_id, id);
    })
    .catch(function (res) {
      isi.innerHTML = kosongkan('🔒', 'Tugas terkunci',
        (res && res.pesan) || 'Anda belum dapat membukanya.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
        'onclick="pergiKe(\'#/beranda\')">Kembali</button>');
    });
});

function gambarTugasKelompok(isi, d) {
  var it = d.item;

  var html =
    navTombolLaci() +
    '<button class="tautan-balik" onclick="pergiKe(\'#/belajar/' +
      esc(it.pertemuan_id) + '\')">‹ ' + esc(it.pertemuan_judul) + '</button>' +
    '<div class="kepala-halaman">' +
      '<h1>👥 ' + esc(it.judul) + '</h1>' +
      (it.tujuan_pembelajaran
        ? '<p class="lembut kecil">🎯 ' + esc(it.tujuan_pembelajaran) + '</p>'
        : '') +
    '</div>';

  /* --- murid belum masuk kelompok mana pun --- */
  if (!d.punya_kelompok) {
    isi.innerHTML = html +
      kosongkan('🙋', 'Anda belum masuk kelompok',
        d.pesan || 'Hubungi guru Anda.') +
      /* Isi kegiatan TETAP boleh dibaca — ia bisa mempersiapkan diri
         sambil menunggu dimasukkan ke kelompok. */
      '<div class="kartu mb-16"><h3 class="mb-8">Isi Kegiatan</h3>' +
      '<div class="isi-materi konten-kaya" id="isi-tk">' +
      (it.konten || '<p class="lembut">Belum ada isi kegiatan.</p>') +
      '</div></div>' +
      navBilahItem(it.item_id);
    renderRumus($('#isi-tk', isi));
    return;
  }

  var kel = d.kelompok, p = d.pengumpulan;
  var lbl = LABEL_KLP_MURID[p.status] || LABEL_KLP_MURID.belum;

  /* --- status & nilai --- */
  if (p.status !== 'belum' && p.status !== 'draft') {
    html += '<div class="status-lkpd ' + lbl[1] + '">' +
      '<div class="baris-antara">' +
        '<span class="tebal">' + lbl[0] + '</span>' +
        (p.nilai_saya !== '' && p.nilai_saya !== null
          ? '<span class="nilai-besar">' + esc(p.nilai_saya) + '</span>' : '') +
      '</div>' +
      (p.waktu_kumpul
        ? '<div class="kecil lembut">Dikumpulkan ' + esc(p.waktu_kumpul) +
          (p.terlambat ? ' · <b>terlambat</b>' : '') +
          (p.revisi_ke > 1 ? ' · revisi ke-' + p.revisi_ke : '') + '</div>'
        : '') +
      /* Nilai kelompok DAN nilai sendiri ditampilkan berdampingan bila
         berbeda. Menampilkan satu angka saja membuat murid mengira
         guru salah menilai (§6.2 no. 22 — nyatakan satuannya). */
      (p.nilai_kelompok !== '' && p.nilai_kelompok !== null
        ? '<div class="kecil lembut mt-4">Nilai kelompok: <b>' +
          esc(p.nilai_kelompok) + '</b>' +
          (String(p.nilai_saya) !== String(p.nilai_kelompok)
            ? ' · nilai Anda disesuaikan guru menjadi <b>' +
              esc(p.nilai_saya) + '</b>'
            : ' · berlaku sama untuk seluruh anggota') + '</div>'
        : '') +
      (p.catatan_guru
        ? '<div class="kotak-feedback"><div class="label">Catatan Guru</div>' +
          '<div class="kecil">' + esc(p.catatan_guru) + '</div></div>'
        : '') +
      '</div>';
  }

  /* --- kartu kelompok --- */
  html += '<div class="kartu kartu-kelompok mb-16">' +
    '<div class="baris-antara" style="flex-wrap:wrap;gap:8px">' +
      '<div class="tumbuh" style="min-width:0">' +
        '<div class="tebal">' + esc(kel.nama) + '</div>' +
        '<div class="kecil lembut">' + kel.anggota.length + ' anggota</div>' +
      '</div>' +
      (d.aku_ketua
        ? '<span class="lencana lencana-sukses">👑 Anda ketua</span>' : '') +
    '</div>' +
    '<div class="baris-pil mt-8">' +
      kel.anggota.map(function (a) {
        return '<span class="pil' + (a.ketua ? ' pil-kelas' : '') + '">' +
          (a.ketua ? '👑 ' : '') + esc(a.nama) +
          (a.aku ? ' (Anda)' : '') + '</span>';
      }).join('') +
    '</div></div>';

  /* --- batas waktu --- */
  if (it.batas_waktu) {
    html += '<div class="kartu kartu-rapat mb-16' +
      (it.terlambat ? '" style="border-color:var(--peringatan)' : '') + '">' +
      '<span class="kecil ' + (it.terlambat ? '' : 'lembut') + '">' +
      (it.terlambat ? '⚠ Batas waktu terlewat: ' : '🗓 Batas waktu: ') +
      esc(it.batas_waktu) +
      (it.terlambat ? ' — masih dapat dikumpulkan, ditandai terlambat' : '') +
      '</span></div>';
  }

  /* --- isi kegiatan --- */
  html += '<div class="kartu mb-16"><h3 class="mb-8">Isi Kegiatan</h3>' +
    '<div class="isi-materi konten-kaya" id="isi-tk">' +
    (it.konten || '<p class="lembut">Belum ada isi kegiatan.</p>') +
    '</div></div>';

  /* --- area pengumpulan --- */
  html += '<div class="kartu"><h3 class="mb-8">Pengumpulan</h3>';

  if (!d.aku_ketua) {
    /* Anggota biasa TIDAK diberi kotak isian yang nanti ditolak
       server. Ia diberi tahu siapa ketuanya, supaya tahu harus
       menghubungi siapa (§6.2 no. 20). */
    var ketua = '';
    kel.anggota.forEach(function (a) { if (a.ketua) ketua = a.nama; });
    html += '<p class="bantuan">Yang mengumpulkan tautan hasil kerja ' +
      'adalah <b>ketua kelompok</b>' +
      (ketua ? ', yaitu <b>' + esc(ketua) + '</b>' : '') + '. ' +
      'Anda tetap ikut menerima nilainya.</p>' +
      (p.links.length
        ? '<div class="mt-12"><div class="kecil lembut mb-8">Tautan yang ' +
          'sudah dikumpulkan ketua:</div>' +
          p.links.map(function (l) {
            return '<div class="tautan-baca">🔗<a href="' + esc(l) +
              '" target="_blank" rel="noopener">' + esc(l) + '</a></div>';
          }).join('') + '</div>'
        : '<p class="kecil lembut mt-8">Ketua belum menempelkan tautan.</p>');

  } else if (p.terkunci) {
    html += '<p class="bantuan mb-16">Tugas sudah diserahkan. ' +
      (p.bisa_batalkan
        ? 'Batalkan penyerahan bila ingin mengubah.'
        : 'Guru sedang menilai — tidak dapat diubah.') + '</p>' +
      p.links.map(function (l) {
        return '<div class="tautan-baca">🔗<a href="' + esc(l) +
          '" target="_blank" rel="noopener">' + esc(l) + '</a></div>';
      }).join('') +
      (p.catatan_murid
        ? '<div class="kecil lembut mt-8">Catatan kelompok: ' +
          esc(p.catatan_murid) + '</div>' : '') +
      (p.bisa_batalkan
        ? '<button class="btn btn-hantu mt-16" id="btn-batal-tk">' +
          'Batalkan Penyerahan</button>' : '');

  } else {
    html += '<p class="bantuan mb-16">Unggah hasil kerja kelompok ke ' +
      'Google Drive, atur berbagi menjadi <b>Siapa saja yang memiliki ' +
      'tautan</b>, lalu tempel tautannya di sini. Maksimal ' +
      d.item.maks_link + ' tautan.</p>' +
      '<div id="daftar-tautan-tk"></div>' +
      '<button class="btn btn-hantu btn-kecil" id="btn-tambah-tautan-tk">' +
        '+ Tambah Tautan</button>' +
      '<div class="grup mt-16"><label>Catatan untuk guru (opsional)</label>' +
        '<textarea class="isian" id="catatan-tk" rows="3">' +
        esc(p.catatan_murid) + '</textarea></div>' +
      '<div class="baris sela-kecil mt-16">' +
        '<button class="btn btn-hantu" id="btn-simpan-tk">Simpan Draf</button>' +
        '<button class="btn" id="btn-kumpul-tk">Kumpulkan</button>' +
      '</div>';
  }
  html += '</div>' + navBilahItem(it.item_id);

  isi.innerHTML = html;
  renderRumus($('#isi-tk', isi));

  if (!d.aku_ketua) return;

  if (p.terkunci) {
    var bb = $('#btn-batal-tk', isi);
    if (bb) bb.onclick = function () {
      konfirmasi('Batalkan Penyerahan',
        'Hasil kerja kembali menjadi draf dan dapat diubah. ' +
        'Progres seluruh anggota ikut kembali berjalan.',
        { labelYa: 'Batalkan' }).then(function (ya) {
          if (!ya) return;
          callApi('batalkanTugasKelompok', [it.item_id]).then(function () {
            toast('Penyerahan dibatalkan.', 'sukses');
            navSegarkan();
            router();
          });
        });
    };
    return;
  }

  /* --- editor tautan --- */
  var wadah = $('#daftar-tautan-tk', isi);

  function barisTautan(nilai) {
    var div = document.createElement('div');
    div.className = 'kotak-tautan';
    div.innerHTML =
      '<input class="isian" type="url" placeholder="https://drive.google.com/…" ' +
        'value="' + esc(nilai || '') + '">' +
      '<button class="btn-hapus-tautan" title="Hapus">✕</button>';
    div.querySelector('button').onclick = function () {
      div.remove();
      if (!wadah.children.length) barisTautan('');
    };
    wadah.appendChild(div);
    return div;
  }

  if (p.links.length) p.links.forEach(function (l) { barisTautan(l); });
  else barisTautan('');

  $('#btn-tambah-tautan-tk', isi).onclick = function () {
    if (wadah.children.length >= d.item.maks_link) {
      toast('Maksimal ' + d.item.maks_link + ' tautan.', 'peringatan');
      return;
    }
    barisTautan('').querySelector('input').focus();
  };

  function kumpulTautan() {
    return $$('input', wadah)
      .map(function (i) { return i.value.trim(); })
      .filter(function (v) { return v.length > 0; });
  }

  $('#btn-simpan-tk', isi).onclick = function () {
    callApi('simpanDrafKelompok',
            [it.item_id, kumpulTautan(), $('#catatan-tk', isi).value],
            { tombol: this })
      .then(function () { toast('Draf tersimpan.', 'sukses'); });
  };

  $('#btn-kumpul-tk', isi).onclick = function () {
    var links = kumpulTautan();
    if (!links.length) {
      toast('Tempelkan minimal satu tautan.', 'peringatan');
      return;
    }
    var tombol = this;
    konfirmasi('Kumpulkan Hasil Kelompok',
      'Seluruh anggota akan tercatat sudah mengumpulkan. ' +
      'Tautan terkunci sampai guru menilai — Anda masih dapat ' +
      'membatalkan selama guru belum mulai menilai.',
      { labelYa: 'Kumpulkan' }).then(function (ya) {
        if (!ya) return;
        /* Dua panggilan berurutan: simpan draf dahulu supaya tautan
           terakhir tidak hilang (bug v1.4.3 pada quiz). Tirai menyala
           sejak klik lewat opsi tombol. */
        callApi('simpanDrafKelompok',
                [it.item_id, links, $('#catatan-tk', isi).value],
                { diam: true })
          .then(function () {
            return callApi('kumpulkanTugasKelompok', [it.item_id],
                           { tombol: tombol });
          })
          .then(function (r) {
            toast('Hasil kelompok dikumpulkan' +
                  (r.terlambat ? ' (terlambat)' : '') + '.', 'sukses');
            navSegarkan();
            router();
          });
      });
  };
}

/* ---------------------------------------------- RUTE: guru */

daftarRute('nilai-kelompok', function (arg) {
  if (!State.user || State.user.role !== 'guru') { pergiKe('#/beranda'); return; }
  var id = arg && arg[0];
  /* Tanpa item_id → antrean SELURUH tugas kelompok, sejajar dengan
     #/nilai-lkpd. Beranda menunjukkan angka "N menunggu"; angka itu
     butuh layar yang memuat semuanya, bukan hanya satu item. */
  if (!id) { muatAntreanKelompok(); return; }
  muatLayarKelompok(id);
});

/* ---------------------------------------------- antrean semua item */

function muatAntreanKelompok() {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  /* Sidebar menu guru (v1.13.2) — layar ini dijangkau DARI sidebar,
     jadi tanpa ini sidebarnya lenyap begitu guru sampai di sini.
     Penjaga typeof: tetap bekerja bila js_menu belum tersalin. */
  var isi = (typeof menuRangka === 'function')
    ? menuRangka(app, 'kelompok') : $('#isi-halaman', app);
  isi.innerHTML = rangkaMuat(76, 3);

  callApi('getAntreanKelompokSemua', [''], { diam: true })
    .then(function (d) { gambarAntreanKelompok(isi, d); })
    .catch(function (res) {
      isi.innerHTML = kosongkan('⚠️', 'Tidak dapat dibuka',
        (res && res.pesan) || 'Antrean gagal dimuat.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
        'onclick="pergiKe(\'#/beranda\')">Kembali</button>');
    });
}

function gambarAntreanKelompok(isi, d) {
  /* Tombol segarkan (v1.14.3) — antrean berubah karena kelompok
     mengumpulkan, bukan karena guru. */
  var kepala =
    '<button class="tautan-balik" onclick="pergiKe(\'#/beranda\')">' +
      '‹ Beranda</button>' +
    '<div class="kepala-halaman baris-antara">' +
      '<div><h1>👥 Penilaian Tugas Kelompok</h1>' +
      '<p class="lembut kecil">' +
        (d.total_kelompok
          ? d.total_kelompok + ' kelompok menunggu, tersebar di ' +
            d.total_item + ' tugas'
          : 'Tidak ada yang menunggu') +
      '</p></div>' +
      (typeof btnSegarkan === 'function' ? btnSegarkan('btn-segar-klp') : '') +
    '</div>';

  if (!d.item.length) {
    isi.innerHTML = kepala + kosongkan('✅', 'Tidak ada yang menunggu',
      'Semua tugas kelompok sudah dinilai.');
    if (typeof pasangSegarkan === 'function') {
      pasangSegarkan(isi, 'btn-segar-klp');
    }
    return;
  }

  /* Dikelompokkan per tugas, bukan daftar rata: penilaian dikerjakan
     per tugas — guru membuka satu layar lalu menilai seluruh
     kelompoknya sekaligus. */
  isi.innerHTML = kepala + '<div class="kolom sela-kecil">' +
    d.item.map(function (it) {
      return '<div class="kartu kartu-kelompok" data-buka-item="' +
        esc(it.item_id) + '" style="cursor:pointer">' +

        '<div class="baris-antara" style="flex-wrap:wrap;gap:8px">' +
          '<div class="tumbuh" style="min-width:0">' +
            '<div class="tebal">' + esc(it.judul) + '</div>' +
            '<div class="kecil lembut">' +
              labelKelas({ nama_kelas: it.nama_kelas, mapel: it.mapel }) +
              (it.pertemuan_urutan
                ? ' · Pertemuan ' + it.pertemuan_urutan : '') +
            '</div>' +
          '</div>' +
          '<span class="lencana lencana-peringatan">' +
            it.jml_menunggu + ' menunggu</span>' +
        '</div>' +

        '<div class="baris-pil mt-8">' +
          it.kelompok.map(function (k) {
            return '<span class="pil">' + esc(k.nama) +
              (k.terlambat ? ' · terlambat' : '') +
              (k.status === 'dinilai_proses' ? ' · dibuka' : '') +
            '</span>';
          }).join('') +
        '</div>' +

        '<div class="baris sela-kecil mt-12" style="flex-wrap:wrap">' +
          '<button class="btn btn-kecil" data-buka-item="' +
            esc(it.item_id) + '">Buka & Nilai</button>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';

  if (typeof pasangSegarkan === 'function') {
    pasangSegarkan(isi, 'btn-segar-klp');
  }

  isi.onclick = function (e) {
    var b = e.target.closest('[data-buka-item]');
    if (b) pergiKe('#/nilai-kelompok/' + b.dataset.bukaItem);
  };
}

function muatLayarKelompok(itemId) {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  /* 🔴 v1.15.1 — DILAPORKAN LAPANGAN: "sidebar menghilang saat klik
     item LKPD dan tugas kelompok". Layar ini terlewat pada audit
     v1.13.2 karena audit itu memindai `daftarRute(` saja, sedangkan
     rute `nilai-kelompok` MENDELEGASIKAN penggambarannya ke sini. */
  var isi = (typeof menuRangka === 'function')
    ? menuRangka(app, 'kelompok') : $('#isi-halaman', app);
  isi.innerHTML = rangkaMuat(72, 4);

  callApi('getKelompok', [itemId], { diam: true })
    .then(function (d) { gambarLayarKelompok(isi, itemId, d); })
    .catch(function (res) {
      isi.innerHTML = kosongkan('⚠️', 'Tidak dapat dibuka',
        (res && res.pesan) || 'Tugas kelompok tidak ditemukan.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
        'onclick="pergiKe(\'#/beranda\')">Kembali</button>');
    });
}

function gambarLayarKelompok(isi, itemId, d) {
  var it = d.item, r = d.rekap;
  var perlu = d.kelompok.filter(function (k) {
    return k.status === 'menunggu' || k.status === 'dinilai_proses';
  }).length;
  var dinilai = d.kelompok.filter(function (k) {
    return k.status === 'diterima';
  }).length;

  isi.innerHTML =
    '<button class="tautan-balik" onclick="pergiKe(\'#/pertemuan/' +
      esc(it.pertemuan_id) + '\')">‹ Kembali ke pertemuan</button>' +

    /* Tombol segarkan (v1.14.4) — kelompok mengumpulkan selagi guru
       menilai kelompok lain di layar yang sama. */
    '<div class="kepala-halaman baris-antara">' +
      '<div><h1>👥 ' + esc(it.judul) + '</h1>' +
      '<p class="lembut kecil">Tugas Kelompok' +
        (it.status !== 'publish' ? ' · <b>masih draf</b>' : '') + '</p></div>' +
      (typeof btnSegarkan === 'function'
        ? btnSegarkan('btn-segar-klp-item') : '') +
    '</div>' +

    (it.status !== 'publish'
      ? '<div class="kartu kartu-rapat mb-16" ' +
        'style="border-color:var(--peringatan)">' +
        '<span class="kecil">⚠ Item ini <b>belum diterbitkan</b>. ' +
        'Murid belum bisa membukanya walaupun kelompok sudah ' +
        'dibentuk.</span></div>'
      : '') +

    '<div class="kisi-statistik">' +
      kartuStat('👥', r.jml_kelompok, 'Kelompok') +
      kartuStat('📥', r.jml_terkumpul + '/' + r.jml_kelompok, 'Mengumpulkan') +
      kartuStat('⏳', perlu, 'Menunggu dinilai') +
      kartuStat('✅', dinilai, 'Sudah dinilai') +
    '</div>' +

    '<div class="baris sela-kecil mb-16" style="flex-wrap:wrap">' +
      '<button class="btn" id="btn-kelompok-baru">+ Kelompok</button>' +
      '<button class="btn btn-hantu" id="btn-bagi-otomatis">' +
        '🎲 Bagi Otomatis</button>' +
    '</div>' +

    (d.kelompok.length
      ? '<div class="kolom sela-kecil mb-16">' +
        d.kelompok.map(kartuKelompokGuru).join('') + '</div>'
      : kosongkan('👥', 'Belum ada kelompok',
          'Bentuk kelompok satu per satu, atau pakai Bagi Otomatis ' +
          'untuk membagi seluruh murid sekaligus.')) +

    blokBelumBerkelompok(d.belum_berkelompok);

  if (typeof pasangSegarkan === 'function') {
    pasangSegarkan(isi, 'btn-segar-klp-item');
  }

  isi.onclick = function (e) {
    var b;
    if ((b = e.target.closest('[data-ubah-klp]'))) {
      panelFormKelompok(itemId, cariKlp(d, b.dataset.ubahKlp), d);
    } else if ((b = e.target.closest('[data-hapus-klp]'))) {
      hapusKelompokKonfirmasi(itemId, cariKlp(d, b.dataset.hapusKlp));
    } else if ((b = e.target.closest('[data-nilai-klp]'))) {
      panelNilaiKelompok(itemId, b.dataset.nilaiKlp);
    }
  };

  $('#btn-kelompok-baru', isi).onclick = function () {
    panelFormKelompok(itemId, null, d);
  };
  $('#btn-bagi-otomatis', isi).onclick = function () {
    dialogBagiOtomatis(itemId, d);
  };
}

function cariKlp(d, id) {
  var hasil = null;
  d.kelompok.forEach(function (k) {
    if (k.kelompok_id === id) hasil = k;
  });
  return hasil;
}

function kartuKelompokGuru(k) {
  var l = LENCANA_KLP[k.status] || LENCANA_KLP.belum;
  var bisaDinilai = k.status === 'menunggu' || k.status === 'dinilai_proses' ||
                    k.status === 'diterima' || k.status === 'ditolak';

  /* Kelompok yang sudah dinilai TIDAK boleh diubah susunannya —
     backend menolaknya. Tombolnya dikelabukan supaya guru tahu
     sebabnya sebelum menekan (KONVENSI §6.2 no. 20). */
  var terkunciSusun = k.status === 'diterima' || k.status === 'ditolak';

  return '<div class="kartu kartu-kelompok" data-klp="' +
    esc(k.kelompok_id) + '">' +

    '<div class="baris-antara" style="flex-wrap:wrap;gap:8px">' +
      '<div class="tumbuh" style="min-width:0">' +
        '<div class="tebal">' + esc(k.nama) + '</div>' +
        '<div class="kecil lembut">' + k.jml_anggota + ' anggota · ' +
          '<span class="lencana ' + l[0] + '">' + l[1] + '</span>' +
          (k.jml_link ? ' · ' + k.jml_link + ' tautan' : '') +
          (k.terlambat ? ' · <b>terlambat</b>' : '') +
          (k.waktu_kumpul ? ' · ' + esc(k.waktu_kumpul) : '') +
        '</div>' +
      '</div>' +
      (k.nilai !== '' && k.nilai !== null
        ? '<span class="lencana lencana-sukses">Nilai ' + esc(k.nilai) + '</span>'
        : '') +
    '</div>' +

    '<div class="baris-pil mt-8">' +
      k.anggota.map(function (a) {
        return '<span class="pil' + (a.ketua ? ' pil-kelas' : '') +
          (a.keluar ? ' pil-keluar' : '') + '">' +
          (a.ketua ? '👑 ' : '') + esc(a.nama) +
          (a.keluar ? ' · keluar kelas' : '') + '</span>';
      }).join('') +
    '</div>' +

    /* Ketua yang sudah keluar kelas membuat kelompok ini BUNTU: tidak
       ada seorang pun yang bisa mengumpulkan. Guru wajib diberi tahu
       beserta cara membetulkannya (KONVENSI §6.2 no. 20). */
    (k.ketua_keluar
      ? '<div class="kartu kartu-rapat mt-8" ' +
        'style="border-color:var(--bahaya)">' +
        '<span class="kecil">⚠ <b>Ketua sudah keluar dari kelas.</b> ' +
        'Kelompok ini tidak dapat mengumpulkan tugas. Tekan ' +
        '<b>Ubah</b>, lepas centang namanya, lalu tunjuk ketua baru.' +
        '</span></div>'
      : (k.jml_aktif !== undefined && k.jml_aktif < k.jml_anggota
          ? '<div class="kecil lembut mt-8">⚠ ' +
            (k.jml_anggota - k.jml_aktif) + ' anggota sudah keluar dari ' +
            'kelas dan tidak lagi menerima nilai. Perbarui susunannya ' +
            'lewat <b>Ubah</b>.</div>'
          : '')) +

    '<div class="baris sela-kecil mt-12" style="flex-wrap:wrap">' +
      (bisaDinilai
        ? '<button class="btn btn-kecil" data-nilai-klp="' +
          esc(k.kelompok_id) + '">📥 ' +
          (k.status === 'diterima' ? 'Lihat Penilaian' : 'Nilai') + '</button>'
        : '') +
      '<button class="btn btn-hantu btn-kecil" data-ubah-klp="' +
        esc(k.kelompok_id) + '"' + (terkunciSusun ? ' disabled' : '') +
        '>Ubah</button>' +
      '<button class="btn btn-bahaya-hantu btn-kecil" data-hapus-klp="' +
        esc(k.kelompok_id) + '"' + (terkunciSusun ? ' disabled' : '') +
        '>Bubarkan</button>' +
      (terkunciSusun
        ? '<span class="kecil lembut">🔒 sudah dinilai — susunan terkunci</span>'
        : '') +
    '</div>' +
  '</div>';
}

function blokBelumBerkelompok(list) {
  if (!list.length) {
    return '<div class="kartu kartu-rapat">' +
      '<span class="kecil lembut">✅ Semua murid kelas ini sudah ' +
      'masuk kelompok.</span></div>';
  }
  return '<div class="kartu">' +
    '<h3 class="mb-8">Belum berkelompok <span class="lencana ' +
      'lencana-peringatan">' + list.length + ' murid</span></h3>' +
    '<p class="bantuan mb-8">Mereka tetap dapat membuka tugas ini, ' +
      'tetapi hanya melihat pesan bahwa mereka belum dimasukkan ke ' +
      'kelompok.</p>' +
    '<div class="baris-pil">' +
      list.map(function (m) {
        return '<span class="pil">' + esc(m.nama) + '</span>';
      }).join('') +
    '</div></div>';
}

/* ---------------------------------------------- form kelompok */

/**
 * Panel tambah/ubah kelompok.
 *
 * Daftar pilihan berisi murid yang belum berkelompok DITAMBAH
 * anggota kelompok yang sedang diubah — tanpa itu guru tidak bisa
 * melihat, apalagi mempertahankan, anggotanya sendiri.
 */
function panelFormKelompok(itemId, klp, d) {
  var terpilih = {};
  var kandidat = d.belum_berkelompok.map(function (m) {
    return { user_id: m.user_id, nama: m.nama, username: m.username };
  });

  if (klp) {
    klp.anggota.forEach(function (a) {
      terpilih[a.user_id] = true;
      kandidat.push({ user_id: a.user_id, nama: a.nama,
                      username: a.username, keluar: a.keluar === true });
    });
  }
  kandidat.sort(function (a, b) {
    return String(a.nama).localeCompare(String(b.nama), 'id');
  });

  var ketuaAwal = klp ? klp.ketua_user_id : '';

  panel(klp ? 'Ubah ' + klp.nama : 'Kelompok Baru',
    '<div class="grup"><label>Nama kelompok</label>' +
      '<input class="isian" id="klp-nama" maxlength="60" ' +
      'placeholder="mis. Kelompok Router" value="' +
      (klp ? esc(klp.nama) : '') + '">' +
      '<span class="bantuan">Bebas — nama tim, topik, atau sekadar ' +
      '"Kelompok 1".</span></div>' +

    (kandidat.length
      ? '<div class="grup"><label>Anggota <span class="lembut kecil" ' +
          'id="klp-jml">0 dipilih</span></label>' +
        '<input class="isian mb-8" id="klp-cari" ' +
          'placeholder="Cari nama murid…">' +
        '<div class="kotak-pilih" id="klp-kotak">' +
          kandidat.map(function (m) {
            return '<label class="pilih-baris" data-nama="' +
              esc((m.nama + ' ' + m.username).toLowerCase()) + '">' +
              '<input type="checkbox" value="' + esc(m.user_id) + '"' +
              (terpilih[m.user_id] ? ' checked' : '') + '>' +
              '<span class="tumbuh"><span class="kecil tebal">' +
                esc(m.nama) +
                /* Server MENOLAK simpan bila ia masih tercentang.
                   Tanpa penanda ini guru menekan Simpan berulang kali
                   tanpa tahu nama siapa yang jadi penyebabnya. */
                (m.keluar
                  ? ' <span class="lencana lencana-bahaya">keluar kelas</span>'
                  : '') +
              '</span><br>' +
                '<span class="kecil lembut">' + esc(m.username) +
                (m.keluar ? ' · lepas centang untuk mengeluarkannya' : '') +
              '</span></span></label>';
          }).join('') +
        '</div></div>' +

        '<div class="grup"><label>Ketua kelompok</label>' +
          '<select class="isian" id="klp-ketua"></select>' +
          '<span class="bantuan">Hanya ketua yang mengumpulkan tautan ' +
          'hasil kerja. Pilihan mengikuti anggota yang dicentang.</span>' +
        '</div>'
      : '<div class="kosong"><div class="ikon">🙋</div>' +
        '<p class="kecil">Tidak ada murid yang belum berkelompok. ' +
        'Bubarkan salah satu kelompok dahulu.</p></div>'),

    '<button class="btn btn-hantu" data-tutup="1">Batal</button>' +
    (kandidat.length
      ? '<button class="btn" id="klp-simpan">Simpan</button>' : '')
  );

  if (!kandidat.length) return;

  var kotak = $('#klp-kotak');
  var selKetua = $('#klp-ketua');

  function idsTerpilih() {
    return $$('input:checked', kotak).map(function (c) { return c.value; });
  }

  /* Daftar ketua SELALU dibangun ulang dari centang. Bila dibiarkan
     statis, guru bisa menyimpan ketua yang sudah tidak jadi anggota —
     backend menolaknya dan pesan galatnya membingungkan. */
  function segarkanKetua() {
    var ids = idsTerpilih();
    var pilihanLama = selKetua.value || ketuaAwal;
    var petaNama = {};
    $$('input', kotak).forEach(function (c) {
      petaNama[c.value] = c.closest('.pilih-baris')
        .querySelector('.tebal').textContent;
    });

    selKetua.innerHTML = ids.length
      ? ids.map(function (u) {
          return '<option value="' + esc(u) + '">' +
            esc(petaNama[u] || u) + '</option>';
        }).join('')
      : '<option value="">— pilih anggota dahulu —</option>';

    if (ids.indexOf(pilihanLama) !== -1) selKetua.value = pilihanLama;

    $('#klp-jml').textContent = ids.length + ' dipilih';
  }

  kotak.onchange = segarkanKetua;
  segarkanKetua();

  $('#klp-cari').oninput = function () {
    var q = (this.value || '').toLowerCase();
    $$('.pilih-baris', kotak).forEach(function (l) {
      l.style.display = l.dataset.nama.indexOf(q) !== -1 ? '' : 'none';
    });
  };

  $('#klp-simpan').onclick = function () {
    var nama = $('#klp-nama').value.trim();
    var ids = idsTerpilih();
    var ketua = selKetua.value;

    if (!nama) { toast('Nama kelompok wajib diisi.', 'peringatan');
                 $('#klp-nama').focus(); return; }
    if (!ids.length) { toast('Pilih minimal satu anggota.', 'peringatan');
                       return; }
    if (!ketua) { toast('Pilih ketua kelompok.', 'peringatan'); return; }

    callApi('simpanKelompok', [{
      item_id: itemId,
      kelompok_id: klp ? klp.kelompok_id : '',
      nama: nama,
      anggota: ids,
      ketua_user_id: ketua
    }], { tombol: this }).then(function () {
      _panelKotor = false;
      tutupPanel(false);
      toast(klp ? 'Kelompok diperbarui.' : 'Kelompok dibuat.', 'sukses');
      muatLayarKelompok(itemId);
    });
  };
}

function hapusKelompokKonfirmasi(itemId, klp) {
  if (!klp) return;
  konfirmasi('Bubarkan Kelompok',
    '<b>' + esc(klp.nama) + '</b> (' + klp.jml_anggota + ' anggota) ' +
    'akan dibubarkan. Tautan yang sudah dikumpulkan ikut dihapus dan ' +
    'anggotanya kembali berstatus belum berkelompok.',
    { labelYa: 'Bubarkan', bahaya: true }).then(function (ya) {
      if (!ya) return;
      callApi('hapusKelompok', [itemId, klp.kelompok_id]).then(function () {
        toast('Kelompok dibubarkan.', 'sukses');
        muatLayarKelompok(itemId);
      });
    });
}

/* ---------------------------------------------- bagi otomatis */

function dialogBagiOtomatis(itemId, d) {
  var sisa = d.belum_berkelompok.length;
  if (!sisa) {
    toast('Semua murid sudah masuk kelompok.', 'peringatan');
    return;
  }

  dialog({
    judul: 'Bagi Otomatis',
    pesan: '<b>' + sisa + ' murid</b> yang belum berkelompok akan dibagi ' +
           'rata. Kelompok yang sudah ada tidak diubah.',
    html: '<div class="grup"><label>Anggota per kelompok</label>' +
      '<input class="isian" id="bagi-n" type="number" min="2" max="12" ' +
      'value="4"><span class="bantuan">Anggota pertama tiap kelompok ' +
      'ditetapkan sebagai ketua sementara, dan namanya "Kelompok 1, 2, ' +
      '3…" — keduanya dapat Anda ubah setelahnya.</span></div>',
    labelYa: 'Bagi Sekarang'
  }).then(function (ya) {
    if (!ya) return;
    var n = Number($('#bagi-n') ? $('#bagi-n').value : 4) || 4;
    callApi('bagiKelompokOtomatis', [itemId, n]).then(function (r) {
      toast(r.dibuat + ' kelompok dibentuk dari ' + r.jml_murid +
            ' murid.', 'sukses');
      muatLayarKelompok(itemId);
    });
  });
}

/* ---------------------------------------------- penilaian */

/**
 * Panel penilaian satu kelompok.
 *
 * Nilai kelompok berlaku untuk semua anggota. Kotak penyesuaian
 * yang DIKOSONGKAN berarti "ikut nilai kelompok" — bukan nol
 * (KONVENSI §6.2 no. 22), sehingga label bawaannya menyebut itu
 * secara eksplisit.
 */
function panelNilaiKelompok(itemId, kelompokId) {
  callApi('getDetailKelompok', [itemId, kelompokId], { diam: true })
    .then(function (d) {
      var k = d.kelompok, s = d.pengumpulan;
      var sudah = s.status === 'diterima';

      panel('Nilai — ' + k.nama,
        '<div class="kartu kartu-rapat mb-16">' +
          '<div class="kecil lembut">' + esc(d.item.judul) + '</div>' +
          '<div class="kecil lembut">' +
            (s.waktu_kumpul
              ? 'Dikumpulkan ' + esc(s.waktu_kumpul)
              : 'Belum ada waktu pengumpulan') +
            (s.terlambat
              ? ' · <b style="color:var(--peringatan)">terlambat</b>' : '') +
            (s.revisi_ke > 1 ? ' · revisi ke-' + s.revisi_ke : '') +
          '</div>' +
        '</div>' +

        '<h3 class="mb-8">Tautan Hasil Kerja</h3>' +
        (s.links.length
          ? s.links.map(function (l) {
              return '<div class="tautan-baca">🔗<a href="' + esc(l) +
                '" target="_blank" rel="noopener">' + esc(l) + '</a></div>';
            }).join('')
          : '<p class="bantuan">Belum ada tautan.</p>') +

        (s.catatan_murid
          ? '<div class="kartu kartu-rapat mt-16">' +
            '<div class="kecil lembut">Catatan kelompok</div>' +
            '<div class="kecil">' + esc(s.catatan_murid) + '</div></div>'
          : '') +

        '<div class="grup mt-16"><label>Nilai kelompok (0–100)</label>' +
          '<input class="isian" id="klp-nilai" type="number" min="0" ' +
          'max="100" value="' + (s.nilai !== '' ? esc(s.nilai) : '') +
          '"><span class="bantuan">Berlaku untuk semua anggota, kecuali ' +
          'yang Anda sesuaikan di bawah.</span></div>' +

        '<h3 class="mb-8 mt-16">Penyesuaian per Anggota</h3>' +
        '<p class="bantuan mb-8">Kosongkan bila anggota itu mengikuti ' +
          'nilai kelompok. Kotak kosong <b>bukan berarti nol</b>.</p>' +
        '<div class="kolom sela-kecil">' +
          k.anggota.map(function (a) {
            return '<div class="baris sela-kecil" ' +
              'style="align-items:center;flex-wrap:wrap">' +
              '<span class="tumbuh kecil" style="min-width:0">' +
                (a.ketua ? '👑 ' : '') + esc(a.nama) +
                (a.ketua ? ' <span class="lencana">ketua</span>' : '') +
              '</span>' +
              '<input class="isian isian-nilai" type="number" min="0" ' +
                'max="100" data-anggota="' + esc(a.user_id) + '" ' +
                'placeholder="ikut kelompok" value="' +
                (a.nilai_penyesuaian !== '' ? esc(a.nilai_penyesuaian) : '') +
                '">' +
            '</div>';
          }).join('') +
        '</div>' +

        '<div class="grup mt-16"><label>Catatan untuk kelompok</label>' +
          '<textarea class="isian" id="klp-catatan" rows="4">' +
          esc(s.catatan_guru) + '</textarea>' +
          '<span class="bantuan">Wajib diisi bila meminta perbaikan. ' +
          'Semua anggota membaca catatan yang sama.</span></div>',

        '<button class="btn btn-hantu" data-tutup="1">Tutup</button>' +
        (sudah
          ? '<button class="btn" id="klp-perbarui">Perbarui Nilai</button>'
          : '<button class="btn btn-bahaya" id="klp-tolak">' +
              'Minta Perbaikan</button>' +
            '<button class="btn" id="klp-terima">Terima</button>')
      );

      function kirim(keputusan, tombol) {
        var catatan = $('#klp-catatan').value.trim();
        if (keputusan === 'ditolak' && !catatan) {
          toast('Catatan wajib diisi saat meminta perbaikan.', 'peringatan');
          $('#klp-catatan').focus();
          return;
        }

        var per = {}, salah = null;
        $$('[data-anggota]').forEach(function (el) {
          var v = el.value.trim();
          if (v === '') return;
          var n = Number(v);
          if (isNaN(n) || n < 0 || n > 100) salah = el;
          else per[el.dataset.anggota] = n;
        });
        if (salah) {
          toast('Nilai anggota harus antara 0 dan 100.', 'peringatan');
          salah.focus();
          return;
        }

        callApi('nilaiKelompok',
                [itemId, kelompokId, keputusan, $('#klp-nilai').value,
                 catatan, per],
                { tombol: tombol })
          .then(function (r) {
            _panelKotor = false;
            tutupPanel(false);
            /* Antrean "tugas kelompok menunggu" di beranda berubah
               (v1.12.8). */
            if (typeof bataliBeranda === 'function') bataliBeranda();
            toast(keputusan === 'diterima'
              ? 'Nilai tersimpan untuk ' + r.jml_anggota + ' anggota' +
                (r.jml_disesuaikan
                  ? ' (' + r.jml_disesuaikan + ' disesuaikan)' : '') + '.'
              : 'Dikembalikan untuk diperbaiki.', 'sukses');
            /* Penerimanya KETUA kelompok — lihat dialogPerbaikanWa.
               Dijaga `typeof` supaya penilaian tetap selesai bila
               js_core belum tersalin (v1.11.4). */
            var lanjut = function () { muatLayarKelompok(itemId); };
            if (typeof dialogPerbaikanWa === 'function') {
              dialogPerbaikanWa(r && r.wa, lanjut);
            } else lanjut();
          });
      }

      var bT = $('#klp-terima');
      if (bT) bT.onclick = function () { kirim('diterima', this); };
      var bK = $('#klp-tolak');
      if (bK) bK.onclick = function () { kirim('ditolak', this); };
      var bP = $('#klp-perbarui');
      if (bP) bP.onclick = function () { kirim('diterima', this); };
    });
}
</script>
