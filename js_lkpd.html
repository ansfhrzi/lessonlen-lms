<script>
/* ============================================================
   LessonLen — js_lkpd
   Murid: mengerjakan & mengumpulkan LKPD
   Guru : antrean penilaian
   ============================================================ */

var LABEL_LKPD = {
  draft:          ['Draf', ''],
  menunggu:       ['Menunggu penilaian', 'menunggu'],
  dinilai_proses: ['Sedang dinilai guru', 'dinilai_proses'],
  diterima:       ['Diterima', 'diterima'],
  ditolak:        ['Perlu diperbaiki', 'ditolak']
};

/* ---------------------------------------------- RUTE: murid */

daftarRute('lkpd', function (arg) {
  if (!State.user || State.user.role !== 'murid') { pergiKe('#/beranda'); return; }
  var id = arg && arg[0];
  if (!id) { pergiKe('#/beranda'); return; }

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var luar = $('#isi-halaman', app);
  /* Kerangka + sidebar digambar SEKARANG, tidak menunggu bukaLkpd.
     Bila indeks kelas sudah ada di memori (murid datang dari daftar
     pertemuan), sidebar tampil seketika. */
  Nav.aktifItem = id;
  var isi = navRangka(luar);
  isi.innerHTML = rangkaMuat(80, 3);
  if (Nav.kelasId) navMuat(Nav.kelasId).then(navGambar);

  callApi('bukaLkpd', [id], { diam: true })
    .then(function (d) {
      gambarLkpd(isi, d);
      navPasangItem(d.kelas_id, d.pertemuan_id, id);
    })
    .catch(function (res) {
      /* tulis ke kolom isi saja — sidebar tetap berguna untuk
         berpindah ke item lain yang terbuka */
      isi.innerHTML = kosongkan('🔒', 'LKPD terkunci',
        (res && res.pesan) || 'Anda belum dapat membukanya.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
        'onclick="pergiKe(\'#/beranda\')">Kembali</button>');
    });
});

function gambarLkpd(isi, d) {
  var lbl = LABEL_LKPD[d.status] || LABEL_LKPD.draft;
  var kunci = d.terkunci;

  var html =
    navTombolLaci() +
    '<button class="tautan-balik" onclick="pergiKe(\'#/belajar/' +
      esc(d.pertemuan_id) + '\')">‹ ' + esc(d.pertemuan_judul) + '</button>' +
    '<div class="kepala-halaman">' +
      '<h1>📝 ' + esc(d.judul) + '</h1>' +
      (d.tujuan_pembelajaran
        ? '<p class="lembut kecil">🎯 ' + esc(d.tujuan_pembelajaran) + '</p>' : '') +
    '</div>';

  /* status pengumpulan */
  if (d.status !== 'draft') {
    html += '<div class="status-lkpd ' + lbl[1] + '">' +
      '<div class="baris-antara">' +
        '<span class="tebal">' + lbl[0] + '</span>' +
        (d.nilai !== '' && d.nilai !== null
          ? '<span class="nilai-besar">' + d.nilai + '</span>' : '') +
      '</div>' +
      (d.waktu_kumpul
        ? '<div class="kecil lembut">Dikumpulkan ' + esc(d.waktu_kumpul) +
          (d.terlambat ? ' · <b>terlambat</b>' : '') +
          (d.revisi_ke > 1 ? ' · revisi ke-' + d.revisi_ke : '') + '</div>'
        : '') +
      (d.catatan_guru
        ? '<div class="kotak-feedback"><div class="label">Catatan Guru</div>' +
          '<div class="kecil">' + esc(d.catatan_guru) + '</div></div>'
        : '') +
      '</div>';
  }

  /* batas waktu */
  if (d.batas_waktu) {
    html += '<div class="kartu kartu-rapat mb-16' +
      (d.lewat_batas ? '" style="border-color:var(--peringatan)' : '') + '">' +
      '<span class="kecil ' + (d.lewat_batas ? '' : 'lembut') + '">' +
      (d.lewat_batas ? '⚠ Batas waktu terlewat: ' : '🗓 Batas waktu: ') +
      esc(d.batas_waktu) +
      (d.lewat_batas ? ' — masih dapat dikumpulkan, ditandai terlambat' : '') +
      '</span></div>';
  }

  /* petunjuk */
  html += '<div class="kartu mb-16">' +
    '<h3 class="mb-8">Petunjuk Kerja</h3>' +
    '<div class="isi-materi" id="petunjuk-lkpd">' + d.petunjuk + '</div>' +
    '</div>';

  /* area pengumpulan */
  html += '<div class="kartu"><h3 class="mb-8">Pengumpulan</h3>';

  if (kunci) {
    html += '<p class="bantuan mb-16">Pekerjaan sudah diserahkan. ' +
      (d.bisa_batalkan
        ? 'Batalkan penyerahan bila ingin mengubah.'
        : 'Guru sedang menilai — tidak dapat diubah.') + '</p>' +
      d.links.map(function (l) {
        return '<div class="tautan-baca">🔗<a href="' + esc(l) +
          '" target="_blank" rel="noopener">' + esc(l) + '</a></div>';
      }).join('') +
      (d.catatan_murid
        ? '<div class="kecil lembut mt-8">Catatan Anda: ' +
          esc(d.catatan_murid) + '</div>' : '') +
      (d.bisa_batalkan
        ? '<button class="btn btn-hantu mt-16" id="btn-batal-lkpd">' +
          'Batalkan Penyerahan</button>'
        : '');
  } else {
    html += '<p class="bantuan mb-16">Unggah pekerjaan ke Google Drive, ' +
      'atur berbagi menjadi <b>Siapa saja yang memiliki tautan</b>, ' +
      'lalu tempel tautannya di sini. Maksimal ' + d.maks_link + ' tautan.</p>' +
      '<div id="daftar-tautan"></div>' +
      '<button class="btn btn-hantu btn-kecil" id="btn-tambah-tautan">' +
        '+ Tambah Tautan</button>' +
      '<div class="grup mt-16"><label>Catatan untuk guru (opsional)</label>' +
        '<textarea class="isian" id="catatan-lkpd" rows="3">' +
        esc(d.catatan_murid) + '</textarea></div>' +
      '<div class="baris sela-kecil mt-16">' +
        '<button class="btn btn-hantu" id="btn-simpan-lkpd">Simpan Draf</button>' +
        '<button class="btn" id="btn-kumpul-lkpd">Kumpulkan</button>' +
      '</div>';
  }
  html += '</div>';

  html += navBilahItem(d.item_id);

  isi.innerHTML = html;
  renderRumus($('#petunjuk-lkpd', isi));

  if (kunci) {
    var bb = $('#btn-batal-lkpd', isi);
    if (bb) bb.onclick = function () {
      konfirmasi('Batalkan Penyerahan',
        'Pekerjaan kembali menjadi draf dan dapat Anda ubah.',
        { labelYa: 'Batalkan' }).then(function (ya) {
          if (!ya) return;
          callApi('batalkanLkpd', [d.item_id]).then(function () {
            toast('Penyerahan dibatalkan.', 'sukses');
            navSegarkan();
            router();
          });
        });
    };
    return;
  }

  /* --- editor tautan --- */
  var wadah = $('#daftar-tautan', isi);

  function barisTautan(nilai) {
    var div = document.createElement('div');
    div.className = 'kotak-tautan';
    div.innerHTML =
      '<input class="isian" type="url" placeholder="https://drive.google.com/…" ' +
        'value="' + esc(nilai || '') + '">' +
      '<button class="btn-hapus-tautan" title="Hapus">✕</button>';
    div.querySelector('button').onclick = function () {
      div.remove();
      if (!wadah.children.length) barisTautan('');
    };
    wadah.appendChild(div);
    return div;
  }

  if (d.links.length) d.links.forEach(function (l) { barisTautan(l); });
  else barisTautan('');

  $('#btn-tambah-tautan', isi).onclick = function () {
    if (wadah.children.length >= d.maks_link) {
      toast('Maksimal ' + d.maks_link + ' tautan.', 'peringatan');
      return;
    }
    barisTautan('').querySelector('input').focus();
  };

  function kumpulTautan() {
    return $$('input', wadah)
      .map(function (i) { return i.value.trim(); })
      .filter(function (v) { return v.length > 0; });
  }

  $('#btn-simpan-lkpd', isi).onclick = function () {
    callApi('simpanDrafLkpd',
            [d.item_id, kumpulTautan(), $('#catatan-lkpd', isi).value],
            { tombol: this })
      .then(function () { toast('Draf tersimpan.', 'sukses'); });
  };

  $('#btn-kumpul-lkpd', isi).onclick = function () {
    var links = kumpulTautan();
    if (!links.length) {
      toast('Tempelkan minimal satu tautan.', 'peringatan');
      return;
    }
    var tombol = this;
    konfirmasi('Kumpulkan Pekerjaan',
      'Setelah dikumpulkan, tautan terkunci sampai guru menilai. ' +
      'Anda masih dapat membatalkan selama guru belum mulai menilai.',
      { labelYa: 'Kumpulkan' }).then(function (ya) {
        if (!ya) return;
        callApi('simpanDrafLkpd',
                [d.item_id, links, $('#catatan-lkpd', isi).value],
                { diam: true })
          .then(function () {
            return callApi('kumpulkanLkpd', [d.item_id], { tombol: tombol });
          })
          .then(function (r) {
            toast('Pekerjaan dikumpulkan' +
                  (r.terlambat ? ' (terlambat)' : '') + '.', 'sukses');
            /* status item berubah → sidebar wajib ikut diperbarui */
            navSegarkan();
            router();
          });
      });
  };
}

/* ---------------------------------------------- RUTE: guru */

daftarRute('nilai-lkpd', function () {
  if (!State.user || State.user.role !== 'guru') { pergiKe('#/beranda'); return; }

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  /* Sidebar menu guru (v1.13.2) — layar ini dijangkau DARI sidebar,
     jadi tanpa ini sidebarnya lenyap begitu guru sampai di sini.
     Penjaga typeof: tetap bekerja bila js_menu belum tersalin. */
  var isi = (typeof menuRangka === 'function')
    ? menuRangka(app, 'lkpd') : $('#isi-halaman', app);
  isi.innerHTML = rangkaMuat(70, 3);

  callApi('getAntreanLkpd', [''], { diam: true }).then(function (list) {
    /* Tombol segarkan (v1.14.3): antrean ini berubah karena murid
       mengumpulkan, bukan karena guru. Tanpa tombol, satu-satunya
       cara melihat pekerjaan baru adalah pindah layar lalu kembali. */
    var kepala =
      '<button class="tautan-balik" onclick="pergiKe(\'#/beranda\')">‹ Beranda</button>' +
      '<div class="kepala-halaman baris-antara">' +
        '<div><h1>Penilaian LKPD</h1>' +
        '<p class="lembut kecil">' + list.length + ' pekerjaan menunggu</p></div>' +
        (typeof btnSegarkan === 'function' ? btnSegarkan('btn-segar-lkpd') : '') +
      '</div>';

    if (!list.length) {
      isi.innerHTML = kepala + kosongkan('✅', 'Tidak ada yang menunggu',
        'Semua pekerjaan sudah dinilai.');
      if (typeof pasangSegarkan === 'function') {
        pasangSegarkan(isi, 'btn-segar-lkpd');
      }
      return;
    }

    isi.innerHTML = kepala + '<div class="kolom sela-kecil">' +
      list.map(function (s) {
        return '<div class="baris-antrean' +
          (s.terlambat ? ' terlambat' : '') +
          '" data-sub="' + esc(s.submission_id) + '">' +
          '<span class="ikon-tipe lkpd">📝</span>' +
          '<span class="tumbuh" style="min-width:0">' +
            '<span class="tebal kecil" style="display:block">' +
              esc(s.nama) + '</span>' +
            '<span class="kecil lembut">' + esc(s.judul_lkpd) + ' · ' +
              esc(s.kelas) + ' · ' + s.jml_link + ' tautan' +
              (s.revisi_ke > 1 ? ' · revisi ' + s.revisi_ke : '') +
              (s.terlambat ? ' · <b>terlambat</b>' : '') + '</span>' +
          '</span>' +
          (s.status === 'dinilai_proses'
            ? '<span class="lencana lencana-peringatan">dibuka</span>'
            : '<span class="kecil lembut">›</span>') +
        '</div>';
      }).join('') + '</div>';

    if (typeof pasangSegarkan === 'function') {
      pasangSegarkan(isi, 'btn-segar-lkpd');
    }

    isi.onclick = function (e) {
      var b = e.target.closest('[data-sub]');
      if (b) panelNilai(b.dataset.sub, '');
    };
  });
});

/* ---------------------------------------------- RUTE: daftar per-LKPD */

var LENCANA_LKPD = {
  belum:          ['lencana-terkunci',  'belum mengumpulkan'],
  draft:          ['lencana',           'sedang dikerjakan'],
  menunggu:       ['lencana-peringatan','menunggu dinilai'],
  dinilai_proses: ['lencana-peringatan','sedang dinilai'],
  diterima:       ['lencana-sukses',    'diterima'],
  ditolak:        ['lencana-bahaya',    'perlu revisi']
};

daftarRute('lkpd-kelas', function (arg) {
  if (!State.user || State.user.role !== 'guru') { pergiKe('#/beranda'); return; }
  var id = arg && arg[0];
  if (!id) { pergiKe('#/beranda'); return; }
  muatDaftarLkpd(id);
});

function muatDaftarLkpd(itemId) {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  /* Sidebar menu guru (v1.13.2). */
  var isi = (typeof menuRangka === 'function')
    ? menuRangka(app, 'lkpd') : $('#isi-halaman', app);
  isi.innerHTML = rangkaMuat(58, 6);

  callApi('getDaftarLkpdKelas', [itemId], { diam: true }).then(function (d) {
    var it = d.item, r = d.rekap;

    isi.innerHTML =
      '<button class="tautan-balik" onclick="pergiKe(\'#/pertemuan/' +
        esc(it.pertemuan_id) + '\')">‹ Pertemuan ' + it.pertemuan_urutan +
        '</button>' +
      /* Tombol segarkan (v1.14.4): daftar ini berubah karena MURID
         mengumpulkan selagi guru menilai satu per satu. */
      '<div class="kepala-halaman baris-antara">' +
        '<div><h1>📝 ' + esc(it.judul) + '</h1>' +
        '<p class="lembut kecil">' + esc(it.nama_kelas) +
        (it.batas_waktu ? ' · batas ' + esc(it.batas_waktu) : '') + '</p></div>' +
        (typeof btnSegarkan === 'function'
          ? btnSegarkan('btn-segar-lkpd-item') : '') +
      '</div>' +

      /* rekap */
      '<div class="kisi-statistik">' +
        kartuStat('📥', r.sudah_kumpul + '/' + r.total, 'Mengumpulkan') +
        kartuStat('⏳', r.menunggu, 'Menunggu dinilai') +
        kartuStat('✅', r.diterima, 'Diterima') +
        kartuStat('📊', r.rata_nilai === '' ? '—' : r.rata_nilai, 'Rata-rata') +
      '</div>' +

      '<div class="kartu mb-16">' +
        bilahProgres(r.persen_kumpul) +
        '<div class="kecil lembut mt-8">' + r.persen_kumpul +
          '% murid sudah mengumpulkan' +
          (r.belum ? ' · <b>' + r.belum + ' belum menyentuh</b>' : '') +
          (r.ditolak ? ' · ' + r.ditolak + ' perlu revisi' : '') +
          (r.terlambat ? ' · ' + r.terlambat + ' terlambat' : '') +
        '</div>' +
      '</div>' +

      /* penyaring */
      '<div class="baris sela-kecil mb-16" style="flex-wrap:wrap">' +
        tombolSaring('semua', 'Semua', r.total) +
        tombolSaring('menunggu', '⏳ Menunggu', r.menunggu) +
        tombolSaring('diterima', '✅ Diterima', r.diterima) +
        tombolSaring('ditolak', '↩ Revisi', r.ditolak) +
        tombolSaring('belum', '○ Belum', r.belum) +
      '</div>' +

      '<div class="kolom sela-kecil" id="daftar-murid-lkpd">' +
        d.murid.map(barisMuridLkpd).join('') +
      '</div>';

    /* penyaring status */
    var aktif = 'semua';
    function saring() {
      var n = 0;
      $$('[data-status]', isi).forEach(function (el) {
        var st = el.dataset.status;
        var cocok = aktif === 'semua' ||
          (aktif === 'menunggu' && (st === 'menunggu' || st === 'dinilai_proses')) ||
          st === aktif;
        el.style.display = cocok ? '' : 'none';
        if (cocok) n++;
      });
      if (!n) {
        var kosong = $('#pesan-kosong', isi);
        if (!kosong) {
          var div = document.createElement('div');
          div.id = 'pesan-kosong';
          div.className = 'kosong';
          div.innerHTML = '<div class="ikon">✓</div><p class="kecil">' +
            'Tidak ada murid dengan status ini.</p>';
          $('#daftar-murid-lkpd', isi).appendChild(div);
        }
      } else {
        var k2 = $('#pesan-kosong', isi);
        if (k2) k2.remove();
      }
    }

    if (typeof pasangSegarkan === 'function') {
      pasangSegarkan(isi, 'btn-segar-lkpd-item');
    }

    isi.onclick = function (e) {
      var f = e.target.closest('[data-saring]');
      if (f) {
        aktif = f.dataset.saring;
        $$('[data-saring]', isi).forEach(function (b) {
          b.classList.toggle('btn', b === f);
          b.classList.toggle('btn-hantu', b !== f);
        });
        saring();
        return;
      }
      var b = e.target.closest('[data-nilai-sub]');
      if (b) { panelNilai(b.dataset.nilaiSub, itemId); return; }

      var u = e.target.closest('[data-lihat]');
      if (u) toast('Murid ini belum mengumpulkan apa pun.', 'peringatan');
    };
  });
}

function tombolSaring(nilai, label, jml) {
  return '<button class="' + (nilai === 'semua' ? 'btn' : 'btn-hantu') +
    ' btn-kecil" data-saring="' + nilai + '">' + label +
    ' <b>' + jml + '</b></button>';
}

function barisMuridLkpd(m) {
  var l = LENCANA_LKPD[m.status] || LENCANA_LKPD.belum;
  var bisaDinilai = m.status === 'menunggu' || m.status === 'dinilai_proses' ||
                    m.status === 'diterima' || m.status === 'ditolak';

  return '<div class="baris-antrean' + (m.terlambat ? ' terlambat' : '') +
    '" data-status="' + esc(m.status) + '"' +
    (bisaDinilai
      ? ' data-nilai-sub="' + esc(m.submission_id) + '"'
      : ' data-lihat="1"') + '>' +
    '<span class="ikon-tipe' + (m.status === 'belum' ? '' : ' lkpd') + '">' +
      (m.status === 'diterima' ? '✅'
        : m.status === 'ditolak' ? '↩'
        : m.status === 'belum' ? '○' : '📝') + '</span>' +
    '<span class="tumbuh" style="min-width:0">' +
      '<span class="tebal kecil" style="display:block">' + esc(m.nama) + '</span>' +
      '<span class="kecil lembut">' +
        '<span class="lencana ' + l[0] + '">' + l[1] + '</span>' +
        (m.jml_link ? ' · ' + m.jml_link + ' tautan' : '') +
        (m.revisi_ke > 1 ? ' · revisi ' + m.revisi_ke : '') +
        (m.terlambat ? ' · <b>terlambat</b>' : '') +
        (m.waktu_kumpul ? ' · ' + esc(m.waktu_kumpul) : '') +
      '</span>' +
    '</span>' +
    (m.nilai !== ''
      ? '<span class="lencana lencana-sukses">' + m.nilai + '</span>'
      : (bisaDinilai ? '<span class="kecil lembut">›</span>' : '')) +
    '</div>';
}

function panelNilai(submissionId, kembaliKeItem) {
  Promise.all([
    callApi('getDetailLkpd', [submissionId], { diam: true }),
    callApi('getTemplateFeedback', [], { diam: true })
  ]).then(function (hasil) {
    var d = hasil[0], tpl = hasil[1] || [];
    callApi('mulaiMenilaiLkpd', [submissionId], { diam: true }).catch(function () {});

    panel('Nilai — ' + d.nama,
      '<div class="kartu kartu-rapat mb-16">' +
        '<div class="kecil lembut">' + esc(d.judul_lkpd) + ' · ' +
          esc(d.kelas) + '</div>' +
        '<div class="kecil lembut">Dikumpulkan ' + esc(d.waktu_kumpul) +
          (d.terlambat ? ' · <b style="color:var(--peringatan)">terlambat</b>' : '') +
          (d.revisi_ke > 1 ? ' · revisi ke-' + d.revisi_ke : '') + '</div>' +
      '</div>' +

      '<h3 class="mb-8">Tautan Pekerjaan</h3>' +
      d.links.map(function (l) {
        return '<div class="tautan-baca">🔗<a href="' + esc(l) +
          '" target="_blank" rel="noopener">' + esc(l) + '</a></div>';
      }).join('') +

      (d.catatan_murid
        ? '<div class="kartu kartu-rapat mt-16"><div class="kecil lembut">' +
          'Catatan murid</div><div class="kecil">' +
          esc(d.catatan_murid) + '</div></div>'
        : '') +

      '<div class="grup mt-16"><label>Nilai (0–100, opsional)</label>' +
        '<input class="isian" id="n-nilai" type="number" min="0" max="100" ' +
        'value="' + (d.nilai !== '' ? esc(d.nilai) : '') + '"></div>' +

      '<div class="grup"><label>Catatan untuk murid</label>' +
        '<textarea class="isian" id="n-catatan" rows="4">' +
        esc(d.catatan_guru) + '</textarea>' +
        '<span class="bantuan">Wajib diisi bila menolak pekerjaan.</span></div>' +

      (tpl.length
        ? '<div class="baris sela-kecil" style="flex-wrap:wrap">' +
          tpl.map(function (t, i) {
            return '<button class="btn btn-teks btn-kecil" data-tpl="' + i +
              '" title="' + esc(t) + '">' +
              esc(t.length > 28 ? t.slice(0, 28) + '…' : t) + '</button>';
          }).join('') + '</div>'
        : ''),

      '<button class="btn btn-hantu" data-tutup="1">Tutup</button>' +
      (d.status === 'diterima'
        ? '<button class="btn btn-hantu" id="btn-feedback">Tambah Catatan</button>'
        : '<button class="btn btn-bahaya" id="btn-tolak">Tolak</button>' +
          '<button class="btn" id="btn-terima">Terima</button>')
    );

    var elCat = $('#n-catatan');
    $$('[data-tpl]').forEach(function (b) {
      b.onclick = function () {
        var t = tpl[Number(b.dataset.tpl)];
        elCat.value = (elCat.value ? elCat.value.trim() + ' ' : '') + t;
        elCat.focus();
      };
    });

    function kirim(keputusan, tombol) {
      var catatan = elCat.value.trim();
      if (keputusan === 'ditolak' && !catatan) {
        toast('Catatan wajib diisi saat menolak.', 'peringatan');
        elCat.focus();
        return;
      }
      callApi('nilaiLkpd',
              [submissionId, keputusan, $('#n-nilai').value, catatan],
              { tombol: tombol })
        .then(function (r) {
          _panelKotor = false;
          tutupPanel(false);
          /* Antrean "LKPD menunggu penilaian" di beranda baru saja
             berubah — cache 30 detiknya wajib dibuang SEKETIKA, kalau
             tidak guru kembali ke beranda dan melihat angka lama
             (v1.12.8). Penjaga `typeof`: js_beranda mungkin belum
             tersalin di editor (§6.2 no. 82). */
          if (typeof bataliBeranda === 'function') bataliBeranda();
          toast(keputusan === 'diterima'
            ? 'Pekerjaan diterima.' : 'Dikembalikan untuk diperbaiki.', 'sukses');
          /* Tawaran kirim WhatsApp muncul HANYA saat menolak; `r.wa`
             diisi server hanya pada keputusan itu (v1.11.4).

             Dijaga `typeof`: bila js_core belum tersalin ke editor,
             penilaiannya TETAP selesai — hanya tawaran WhatsApp yang
             hilang. Tanpa penjaga ini seluruh layar mati padahal
             nilainya sudah tersimpan di server. */
          var lanjut = function () {
            if (kembaliKeItem) muatDaftarLkpd(kembaliKeItem);
            else router();
          };
          if (typeof dialogPerbaikanWa === 'function') {
            dialogPerbaikanWa(r && r.wa, lanjut);
          } else lanjut();
        });
    }

    var bT = $('#btn-terima');
    if (bT) bT.onclick = function () { kirim('diterima', this); };
    var bK = $('#btn-tolak');
    if (bK) bK.onclick = function () { kirim('ditolak', this); };

    var bF = $('#btn-feedback');
    if (bF) bF.onclick = function () {
      var catatan = elCat.value.trim();
      if (!catatan) { toast('Catatan tidak boleh kosong.', 'peringatan'); return; }
      callApi('beriFeedbackLkpd', [submissionId, catatan], { tombol: this })
        .then(function () {
          tutupPanel(false);
          toast('Catatan terkirim ke murid.', 'sukses');
          if (kembaliKeItem) muatDaftarLkpd(kembaliKeItem);
        });
    };
  });
}
</script>
