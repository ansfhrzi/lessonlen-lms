<script>
/* ============================================================
   LMS v2 — js_mapel.html
   Mapel, Penugasan, Topik & Materi (guru) + alur belajar murid
   (Kelas Saya → Materi → Topik → Baca).
   Pola tampilan v1: baris-item + ikon-tipe, dialog global, toast.
   ============================================================ */

var TIPE_ITEM = {
  materi:         { ikon: '📄', label: 'Materi',         kelas: '' },
  quiz:           { ikon: '🎯', label: 'Quiz',           kelas: 'quiz' },
  tugas_individu: { ikon: '📝', label: 'Tugas Individu', kelas: 'tugas' },
  tugas_kelompok: { ikon: '👫', label: 'Tugas Kelompok', kelas: 'tugas' },
  refleksi:       { ikon: '🪞', label: 'Refleksi',       kelas: 'refleksi' }
};

function ikonTipe(tipe) {
  var t = TIPE_ITEM[tipe] || { ikon: '📄', label: tipe, kelas: '' };
  return '<span class="ikon-tipe ' + t.kelas + '" title="' + esc(t.label) +
         '">' + t.ikon + '</span>';
}
function lencanaPublikasi(status) {
  return status === 'publish'
    ? '<span class="lencana lencana-sukses">publish</span>'
    : '<span class="lencana lencana-peringatan">draf</span>';
}

/* ============================================================
   RUTE: mapel (guru)
   ============================================================ */
daftarRute('mapel', function () {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = menuRangka(app, 'mapel');

  isi.innerHTML =
    '<div class="kepala-halaman baris-antara">' +
      '<div><h1>📗 Mapel</h1>' +
      '<p class="lembut kecil">Mapel dipakai bersama lewat penugasan mengajar.</p></div>' +
      '<button class="btn" id="btn-mapel-baru">+ Mapel Baru</button>' +
    '</div>' +
    '<div id="daftar-mapel">' + rangkaMuat(56, 3) + '</div>';

  $('#btn-mapel-baru', isi).onclick = function () { dialogMapel(null, router); };

  callApi('mapelDaftar', [State.token], { diam: true })
    .then(function (daftar) {
      var wadah = $('#daftar-mapel', isi);
      if (!daftar.length) {
        wadah.innerHTML = kosongkan('📗', 'Belum ada mapel',
          'Buat mapel pertama Anda.');
        return;
      }
      wadah.innerHTML = '<div class="kartu"><div class="tabel-gulir">' +
        '<table class="tabel">' +
        '<thead><tr><th>Mapel</th><th>Kode</th><th>Pemilik</th>' +
        '<th>Penugasan</th><th>Status</th><th></th></tr></thead><tbody>' +
        daftar.map(function (s) {
          return '<tr>' +
            '<td><b>' + esc(s.name) + '</b></td>' +
            '<td>' + esc(s.code || '—') + '</td>' +
            '<td>' + esc(s.owner || '—') + '</td>' +
            '<td>' + s.jml_penugasan + '</td>' +
            '<td>' + (s.status === 'aktif'
              ? '<span class="lencana lencana-sukses">aktif</span>'
              : '<span class="lencana lencana-bahaya">nonaktif</span>') + '</td>' +
            '<td style="white-space:nowrap">' +
              '<button class="btn btn-teks btn-kecil" data-edit="' +
                esc(s.subject_id) + '">✏️</button>' +
              '<button class="btn btn-teks btn-kecil" data-status="' +
                esc(s.subject_id) + '" data-nama="' + esc(s.name) + '">' +
                (s.status === 'aktif' ? 'Nonaktifkan' : 'Aktifkan') + '</button>' +
            '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div></div>';

      $$('[data-edit]', wadah).forEach(function (b) {
        b.onclick = function () {
          var s = daftar.filter(function (x) {
            return x.subject_id === b.dataset.edit; })[0];
          dialogMapel(s, router);
        };
      });
      $$('[data-status]', wadah).forEach(function (b) {
        b.onclick = function () {
          var s = daftar.filter(function (x) {
            return x.subject_id === b.dataset.status; })[0];
          var ke = s.status === 'aktif' ? 'nonaktif' : 'aktif';
          konfirmasi('Ubah Status Mapel',
            (ke === 'nonaktif'
              ? 'Nonaktifkan mapel "' + b.dataset.nama + '"? Penugasan baru ' +
                'dengan mapel ini akan ditolak.'
              : 'Aktifkan kembali mapel "' + b.dataset.nama + '"?'),
            { labelYa: ke === 'nonaktif' ? 'Nonaktifkan' : 'Aktifkan',
              bahaya: ke === 'nonaktif' })
            .then(function (ya) {
              if (!ya) return;
              callApi('mapelUbahStatus', [State.token, s.subject_id, ke])
                .then(function () {
                  toast('Status mapel diperbarui.', 'sukses');
                  router();
                })
                .catch(function () {});
            });
        };
      });
    })
    .catch(function () {
      $('#daftar-mapel', isi).innerHTML =
        kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
});

function dialogMapel(s, sesudah) {
  dialog({
    judul: s ? '✏️ Edit Mapel' : '📗 Mapel Baru',
    pesan: s ? '' : 'Pemilik mapel otomatis: Anda.',
    html:
      '<div class="grup"><label for="d-sb-nama">Nama mapel <span class="wajib">*</span></label>' +
        '<input class="isian" id="d-sb-nama" value="' + esc(s ? s.name : '') +
        '" placeholder="mis. Jaringan Dasar"></div>' +
      '<div class="grup"><label for="d-sb-kode">Kode</label>' +
        '<input class="isian" id="d-sb-kode" value="' + esc(s ? s.code : '') +
        '" placeholder="mis. JD">' +
        '<span class="bantuan">Singkatan bebas — opsional.</span></div>',
    lebar: 'sedang',
    labelYa: s ? 'Simpan' : 'Buat'
  }).then(function (ya) {
    if (!ya) return;
    var p = {
      name: document.getElementById('d-sb-nama').value,
      code: document.getElementById('d-sb-kode').value
    };
    if (s) p.subject_id = s.subject_id;

    tampilkanMuat(true, 'Menyimpan mapel…');
    callApi('mapelSimpan', [State.token, p])
      .then(function () {
        tampilkanMuat(false);
        toast('Mapel tersimpan.', 'sukses');
        if (sesudah) sesudah();
      })
      .catch(function (res) {
        tampilkanMuat(false);
        toast((res && res.pesan) || 'Gagal menyimpan.', 'bahaya');
      });
  });
}

/* ============================================================
   RUTE: penugasan (guru)
   ============================================================ */
daftarRute('penugasan', function () {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = menuRangka(app, 'penugasan');

  isi.innerHTML =
    '<div class="kepala-halaman baris-antara">' +
      '<div><h1>🧑‍🏫 Penugasan Mengajar</h1>' +
      '<p class="lembut kecil">Relasi <b>guru + kelas + mapel</b>. ' +
      'Topik selalu dibuat di bawah penugasan ini.</p></div>' +
      '<button class="btn" id="btn-ta-baru">+ Penugasan Baru</button>' +
    '</div>' +
    '<div id="daftar-ta">' + rangkaMuat(56, 3) + '</div>';

  $('#btn-ta-baru', isi).onclick = function () { dialogPenugasan(null, router); };

  callApi('penugasanDaftar', [State.token, {}], { diam: true })
    .then(function (daftar) {
      var wadah = $('#daftar-ta', isi);
      if (!daftar.length) {
        wadah.innerHTML = kosongkan('🧑‍🏫', 'Belum ada penugasan',
          'Hubungkan kelas dengan mapel untuk mulai menyusun topik.',
          '<button class="btn btn-kecil mt-16" id="btn-ta-kosong">+ Penugasan Baru</button>');
        var b = $('#btn-ta-kosong', wadah);
        if (b) b.onclick = function () { dialogPenugasan(null, router); };
        return;
      }
      wadah.innerHTML = '<div class="kartu"><div class="tabel-gulir">' +
        '<table class="tabel">' +
        '<thead><tr><th>Kelas</th><th>Mapel</th><th>Guru</th><th>Tahun</th>' +
        '<th>Topik</th><th>Status</th><th></th></tr></thead><tbody>' +
        daftar.map(function (t) {
          return '<tr>' +
            '<td><b>' + esc(t.kelas) + '</b></td>' +
            '<td>' + esc(t.mapel) + '</td>' +
            '<td>' + esc(t.guru) + '</td>' +
            '<td class="kecil lembut">' + esc(t.academic_year || '—') + '</td>' +
            '<td>' + t.jml_topik + '</td>' +
            '<td>' + (t.status === 'aktif'
              ? '<span class="lencana lencana-sukses">aktif</span>'
              : '<span class="lencana lencana-bahaya">nonaktif</span>') + '</td>' +
            '<td style="white-space:nowrap">' +
              '<button class="btn btn-hantu btn-kecil" data-topik="' +
                esc(t.teaching_assignment_id) + '">Topik</button> ' +
              '<button class="btn btn-teks btn-kecil" data-edit="' +
                esc(t.teaching_assignment_id) + '">✏️</button> ' +
              '<button class="btn btn-teks btn-kecil" data-status="' +
                esc(t.teaching_assignment_id) + '" data-nama="' +
                esc(t.kelas + ' · ' + t.mapel) + '">' +
                (t.status === 'aktif' ? 'Nonaktifkan' : 'Aktifkan') + '</button>' +
            '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div></div>';

      $$('[data-topik]', wadah).forEach(function (b) {
        b.onclick = function () { pergiKe('#/topik/' + b.dataset.topik); };
      });
      $$('[data-edit]', wadah).forEach(function (b) {
        b.onclick = function () {
          var t = daftar.filter(function (x) {
            return x.teaching_assignment_id === b.dataset.edit; })[0];
          dialogPenugasan(t, router);
        };
      });
      $$('[data-status]', wadah).forEach(function (b) {
        b.onclick = function () {
          var t = daftar.filter(function (x) {
            return x.teaching_assignment_id === b.dataset.status; })[0];
          var ke = t.status === 'aktif' ? 'nonaktif' : 'aktif';
          konfirmasi('Ubah Status Penugasan',
            (ke === 'nonaktif'
              ? 'Nonaktifkan "' + b.dataset.nama + '"? Bacaan murid di ' +
                'mapel ini ikut tertutup.'
              : 'Aktifkan kembali "' + b.dataset.nama + '"?'),
            { labelYa: ke === 'nonaktif' ? 'Nonaktifkan' : 'Aktifkan',
              bahaya: ke === 'nonaktif' })
            .then(function (ya) {
              if (!ya) return;
              callApi('penugasanUbahStatus',
                      [State.token, t.teaching_assignment_id, ke])
                .then(function () {
                  toast('Status penugasan diperbarui.', 'sukses');
                  router();
                })
                .catch(function () {});
            });
        };
      });
    })
    .catch(function () {
      $('#daftar-ta', isi).innerHTML =
        kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
});

function dialogPenugasan(t, sesudah) {
  tampilkanMuat(true, 'Memuat pilihan…');
  Promise.all([
    callApi('kelasDaftar', [State.token, false], { diam: true }),
    callApi('mapelDaftar', [State.token], { diam: true }),
    callApi('guruDaftar', [State.token], { diam: true })
  ]).then(function (hasil) {
    tampilkanMuat(false);
    var kelas = hasil[0] || [], mapel = hasil[1] || [], guru = hasil[2] || [];

    var html = '';
    if (t) {
      html += '<div class="grup"><label>Kelas & mapel</label>' +
        '<input class="isian" value="' + esc(t.kelas + ' · ' + t.mapel) +
        '" disabled><span class="bantuan">Tidak bisa diubah — nonaktifkan ' +
        'penugasan ini lalu buat yang baru.</span></div>';
    } else {
      html +=
        '<div class="grup"><label for="d-ta-kelas">Kelas <span class="wajib">*</span></label>' +
        '<select class="isian" id="d-ta-kelas">' +
        kelas.map(function (k) {
          return '<option value="' + esc(k.class_id) + '">' + esc(k.name) + '</option>';
        }).join('') + '</select></div>' +
        '<div class="grup"><label for="d-ta-mapel">Mapel <span class="wajib">*</span></label>' +
        '<select class="isian" id="d-ta-mapel">' +
        mapel.filter(function (m) { return m.status === 'aktif'; })
          .map(function (m) {
            return '<option value="' + esc(m.subject_id) + '">' +
              esc(m.name + (m.code ? ' (' + m.code + ')' : '')) + '</option>';
          }).join('') + '</select></div>';
    }
    if (guru.length > 1) {
      html +=
        '<div class="grup"><label for="d-ta-guru">Guru pengampu</label>' +
        '<select class="isian" id="d-ta-guru">' +
        guru.map(function (g) {
          return '<option value="' + esc(g.user_id) + '"' +
            (t && t.teacher_id === g.user_id ? ' selected' : '') + '>' +
            esc(g.nama) + '</option>';
        }).join('') + '</select></div>';
    }
    html +=
      '<div class="grup"><label for="d-ta-tahun">Tahun ajaran</label>' +
      '<input class="isian" id="d-ta-tahun" value="' +
      esc(t ? (t.academic_year || '') : '') + '" placeholder="mis. 2026/2027">' +
      '<span class="bantuan">Kosongkan untuk mengikuti kelas. Bertulis 2026/2027.</span></div>';

    dialog({
      judul: t ? '✏️ Edit Penugasan' : '🧑‍🏫 Penugasan Baru',
      html: html,
      lebar: 'sedang',
      labelYa: t ? 'Simpan' : 'Buat'
    }).then(function (ya) {
      if (!ya) return;
      var el = function (id) { return document.getElementById(id); };
      var p = {};
      if (t) {
        p.teaching_assignment_id = t.teaching_assignment_id;
        if (el('d-ta-guru')) p.teacher_id = el('d-ta-guru').value;
        p.academic_year = el('d-ta-tahun').value;
      } else {
        p.class_id = el('d-ta-kelas').value;
        p.subject_id = el('d-ta-mapel').value;
        if (el('d-ta-guru')) p.teacher_id = el('d-ta-guru').value;
        p.academic_year = el('d-ta-tahun').value;
      }

      tampilkanMuat(true, 'Menyimpan penugasan…');
      callApi('penugasanSimpan', [State.token, p])
        .then(function () {
          tampilkanMuat(false);
          toast('Penugasan tersimpan.', 'sukses');
          if (sesudah) sesudah();
        })
        .catch(function (res) {
          tampilkanMuat(false);
          toast((res && res.pesan) || 'Gagal menyimpan.', 'bahaya');
        });
    });
  }).catch(function () { tampilkanMuat(false); });
}

/* ============================================================
   RUTE: topik (+/<taId>) (guru)
   ============================================================ */
daftarRute('topik', function (bagian) {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = menuRangka(app, 'topik');
  var taId = bagian && bagian[0] ? bagian[0] : '';

  isi.innerHTML = rangkaMuat(56, 2);

  callApi('penugasanDaftar', [State.token, {}], { diam: true })
    .then(function (daftar) {
      if (!daftar.length) {
        isi.innerHTML =
          '<div class="kepala-halaman"><h1>🧩 Topik & Materi</h1></div>' +
          kosongkan('🧩', 'Belum ada penugasan aktif',
            'Buat dulu di layar Penugasan.',
            '<button class="btn btn-kecil mt-16" onclick="pergiKe(\'#/penugasan\')">' +
            'Buka Penugasan</button>');
        return;
      }
      if (!taId) taId = daftar[0].teaching_assignment_id;
      var pilihan = daftar.map(function (t) {
        return '<option value="' + esc(t.teaching_assignment_id) + '"' +
          (t.teaching_assignment_id === taId ? ' selected' : '') + '>' +
          esc(t.kelas + ' · ' + t.mapel) + '</option>';
      }).join('');

      isi.innerHTML =
        '<div class="kepala-halaman"><h1>🧩 Topik & Materi</h1></div>' +
        '<div class="grup" style="max-width:520px">' +
          '<label for="sel-ta">Penugasan mengajar</label>' +
          '<select class="isian" id="sel-ta">' + pilihan + '</select>' +
        '</div>' +
        '<div id="isi-topik"></div>';

      $('#sel-ta', isi).onchange = function () {
        pergiKe('#/topik/' + this.value);
      };
      gambarTopik($('#isi-topik', isi), taId);
    })
    .catch(function () {
      isi.innerHTML = kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
});

function gambarTopik(wadah, taId) {
  wadah.innerHTML = rangkaMuat(70, 3);

  callApi('topikDaftar', [State.token, taId], { diam: true })
    .then(function (hasil) {
      var html =
        '<div class="baris-antara mb-12">' +
          '<span class="kecil lembut">' + hasil.jml_topik + ' topik — ' +
          'urutan teratas tampil lebih dulu di murid.</span>' +
          '<button class="btn btn-kecil" id="btn-topik-baru">+ Topik Baru</button>' +
        '</div>';

      if (!hasil.topik.length) {
        html += kosongkan('🧩', 'Belum ada topik',
          'Topik = bab / unit pembelajaran.');
      } else {
        html += '<div class="kolom sela-kecil">' + hasil.topik.map(function (t) {
          return '<div class="kartu kartu-rapat">' +
            '<div class="baris-antara mb-8">' +
              '<div style="min-width:0">' +
                '<b>' + esc(t.title) + '</b> ' + lencanaPublikasi(t.status) +
                '<div class="kecil lembut">' +
                  esc(t.description || 'Tanpa deskripsi') +
                  ' · ' + t.jml_item + ' item</div>' +
              '</div>' +
              '<div class="baris sela-kecil" style="flex-wrap:nowrap">' +
                '<button class="btn btn-hantu btn-kecil" data-buka="' +
                  esc(t.topic_id) + '">Isi item</button>' +
                '<button class="btn btn-teks btn-mini" data-atas="' +
                  esc(t.topic_id) + '" title="Naikkan">↑</button>' +
                '<button class="btn btn-teks btn-mini" data-bawah="' +
                  esc(t.topic_id) + '" title="Turunkan">↓</button>' +
                '<button class="btn btn-teks btn-mini" data-edit="' +
                  esc(t.topic_id) + '" title="Edit">✏️</button>' +
                '<button class="btn btn-teks btn-mini" data-status="' +
                  esc(t.topic_id) + '" title="' +
                  (t.status === 'publish' ? 'Jadikan draf' : 'Terbitkan') + '">' +
                  (t.status === 'publish' ? '🙈' : '📢') + '</button>' +
                '<button class="btn btn-teks btn-mini btn-bahaya-hantu" ' +
                  'data-hapus="' + esc(t.topic_id) + '" title="Hapus">🗑</button>' +
              '</div>' +
            '</div>' +
            '<div id="item-' + esc(t.topic_id) + '" class="sembunyi"></div>' +
          '</div>';
        }).join('') + '</div>';
      }
      wadah.innerHTML = html;

      $('#btn-topik-baru', wadah).onclick = function () {
        dialogTopik({ teaching_assignment_id: taId },
                    function () { gambarTopik(wadah, taId); });
      };

      $$('[data-buka]', wadah).forEach(function (b) {
        b.onclick = function () {
          var w = document.getElementById('item-' + b.dataset.buka);
          if (w.classList.contains('sembunyi')) {
            w.classList.remove('sembunyi');
            gambarItem(w, b.dataset.buka);
          } else {
            w.classList.add('sembunyi');
          }
        };
      });
      $$('[data-atas],[data-bawah]', wadah).forEach(function (b) {
        b.onclick = function () {
          var arah = b.dataset.atas ? 'atas' : 'bawah';
          var id = b.dataset.atas || b.dataset.bawah;
          callApi('topikPindah', [State.token, id, arah])
            .then(function () { gambarTopik(wadah, taId); })
            .catch(function () {});
        };
      });
      $$('[data-edit]', wadah).forEach(function (b) {
        b.onclick = function () {
          var t = hasil.topik.filter(function (x) {
            return x.topic_id === b.dataset.edit; })[0];
          dialogTopik(t, function () { gambarTopik(wadah, taId); });
        };
      });
      $$('[data-status]', wadah).forEach(function (b) {
        b.onclick = function () {
          var t = hasil.topik.filter(function (x) {
            return x.topic_id === b.dataset.status; })[0];
          var ke = t.status === 'publish' ? 'draft' : 'publish';
          callApi('topikUbahStatus', [State.token, t.topic_id, ke])
            .then(function () {
              toast(ke === 'publish'
                ? 'Topik diterbitkan — murid melihatnya.'
                : 'Topik dijadikan draf.', 'sukses');
              gambarTopik(wadah, taId);
            })
            .catch(function () {});
        };
      });
      $$('[data-hapus]', wadah).forEach(function (b) {
        b.onclick = function () {
          konfirmasi('Hapus Topik',
            'Hanya topik kosong yang boleh dihapus. Lanjut?',
            { labelYa: 'Hapus', bahaya: true })
            .then(function (ya) {
              if (!ya) return;
              callApi('topikHapus', [State.token, b.dataset.hapus])
                .then(function () {
                  toast('Topik dihapus.', 'sukses');
                  gambarTopik(wadah, taId);
                })
                .catch(function () {});
            });
        };
      });
    })
    .catch(function () {
      wadah.innerHTML = kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
}

function dialogTopik(t, sesudah) {
  dialog({
    judul: t.topic_id ? '✏️ Edit Topik' : '🧩 Topik Baru',
    html:
      '<div class="grup"><label for="d-tp-judul">Judul <span class="wajib">*</span></label>' +
        '<input class="isian" id="d-tp-judul" value="' + esc(t.title || '') +
        '" placeholder="mis. Bab 1 — Pengenalan"></div>' +
      '<div class="grup"><label for="d-tp-desk">Deskripsi</label>' +
        '<textarea class="isian" id="d-tp-desk" rows="3" ' +
        'placeholder="Deskripsi singkat (opsional)">' +
        esc(t.description || '') + '</textarea></div>',
    lebar: 'sedang',
    labelYa: t.topic_id ? 'Simpan' : 'Buat'
  }).then(function (ya) {
    if (!ya) return;
    var p = {
      title: document.getElementById('d-tp-judul').value,
      description: document.getElementById('d-tp-desk').value
    };
    if (t.topic_id) p.topic_id = t.topic_id;
    else p.teaching_assignment_id = t.teaching_assignment_id;

    tampilkanMuat(true, 'Menyimpan topik…');
    callApi('topikSimpan', [State.token, p])
      .then(function () {
        tampilkanMuat(false);
        toast('Topik tersimpan.', 'sukses');
        if (sesudah) sesudah();
      })
      .catch(function (res) {
        tampilkanMuat(false);
        toast((res && res.pesan) || 'Gagal menyimpan.', 'bahaya');
      });
  });
}

/* ---------------- item dalam topik (guru) ---------------- */
function gambarItem(wadah, topicId) {
  wadah.innerHTML = rangkaMuat(48, 2);

  callApi('itemDaftar', [State.token, topicId], { diam: true })
    .then(function (daftar) {
      var html =
        '<div class="baris-antara mt-8 mb-8">' +
          '<span class="kecil lembut">' + daftar.length + ' item</span>' +
          '<button class="btn btn-hantu btn-kecil" id="btn-item-baru">+ Item Baru</button>' +
        '</div>';

      if (!daftar.length) {
        html += kosongkan('🗂', 'Belum ada item',
          'Item = materi / quiz / tugas / refleksi.');
      } else {
        html += '<div class="kolom sela-kecil">' + daftar.map(function (i) {
          var t = TIPE_ITEM[i.type] || { label: i.type };
          return '<div class="baris-item' + (i.status === 'draft' ? ' draf' : '') + '">' +
            ikonTipe(i.type) +
            '<div class="tumbuh" style="min-width:0">' +
              '<div><b>' + esc(i.title) + '</b> ' + lencanaPublikasi(i.status) +
                (i.related_id ? ' <span class="lencana lencana-terkunci">tertaut</span>' : '') +
                (i.ai_source ? ' <span class="lencana lencana-peringatan">AI</span>' : '') +
              '</div>' +
              '<div class="kecil lembut">' + esc(t.label) +
                (i.description ? ' · ' + esc(i.description) : '') + '</div>' +
            '</div>' +
            '<div class="baris sela-kecil" style="flex-wrap:nowrap">' +
              '<button class="btn btn-teks btn-mini" data-atas="' + esc(i.item_id) +
                '" title="Naikkan">↑</button>' +
              '<button class="btn btn-teks btn-mini" data-bawah="' + esc(i.item_id) +
                '" title="Turunkan">↓</button>' +
              '<button class="btn btn-teks btn-mini" data-edit="' + esc(i.item_id) +
                '" title="Edit">✏️</button>' +
              '<button class="btn btn-teks btn-mini" data-status="' + esc(i.item_id) +
                '" title="' + (i.status === 'publish' ? 'Jadikan draf' : 'Terbitkan') +
                '">' + (i.status === 'publish' ? '🙈' : '📢') + '</button>' +
              (i.related_id ? '' :
                '<button class="btn btn-teks btn-mini btn-bahaya-hantu" ' +
                'data-hapus="' + esc(i.item_id) + '" title="Hapus">🗑</button>') +
            '</div>' +
          '</div>';
        }).join('') + '</div>';
      }
      wadah.innerHTML = html;

      $('#btn-item-baru', wadah).onclick = function () {
        dialogItem({ topic_id: topicId }, function () { gambarItem(wadah, topicId); });
      };
      $$('[data-atas],[data-bawah]', wadah).forEach(function (b) {
        b.onclick = function () {
          var arah = b.dataset.atas ? 'atas' : 'bawah';
          var id = b.dataset.atas || b.dataset.bawah;
          callApi('itemPindah', [State.token, id, arah])
            .then(function () { gambarItem(wadah, topicId); })
            .catch(function () {});
        };
      });
      $$('[data-edit]', wadah).forEach(function (b) {
        b.onclick = function () {
          var i = daftar.filter(function (x) {
            return x.item_id === b.dataset.edit; })[0];
          dialogItem(i, function () { gambarItem(wadah, topicId); });
        };
      });
      $$('[data-status]', wadah).forEach(function (b) {
        b.onclick = function () {
          var i = daftar.filter(function (x) {
            return x.item_id === b.dataset.status; })[0];
          var ke = i.status === 'publish' ? 'draft' : 'publish';
          callApi('itemUbahStatus', [State.token, i.item_id, ke])
            .then(function () {
              toast(ke === 'publish'
                ? 'Item diterbitkan — murid kelas diberi tahu.'
                : 'Item dijadikan draf.', 'sukses');
              gambarItem(wadah, topicId);
            })
            .catch(function () {});
        };
      });
      $$('[data-hapus]', wadah).forEach(function (b) {
        b.onclick = function () {
          konfirmasi('Hapus Item', 'Hapus item ini?',
            { labelYa: 'Hapus', bahaya: true })
            .then(function (ya) {
              if (!ya) return;
              callApi('itemHapus', [State.token, b.dataset.hapus])
                .then(function () {
                  toast('Item dihapus.', 'sukses');
                  gambarItem(wadah, topicId);
                })
                .catch(function () {});
            });
        };
      });
    })
    .catch(function () {
      wadah.innerHTML = kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
}

function dialogItem(i, sesudah) {
  var pilihanTipe = Object.keys(TIPE_ITEM).map(function (k) {
    return '<option value="' + k + '"' +
      (i.type === k ? ' selected' : '') + '>' +
      TIPE_ITEM[k].ikon + ' ' + TIPE_ITEM[k].label + '</option>';
  }).join('');

  dialog({
    judul: i.item_id ? '✏️ Edit Item' : '🗂 Item Baru',
    html:
      (i.item_id && i.related_id
        ? '<div class="grup"><label>Jenis</label>' +
          '<input class="isian" value="' +
          esc((TIPE_ITEM[i.type] || {}).label || i.type) +
          '" disabled><span class="bantuan">Item sudah tertaut — jenisnya ' +
          'tidak bisa diubah.</span></div>'
        : '<div class="grup"><label for="d-it-tipe">Jenis item</label>' +
          '<select class="isian" id="d-it-tipe">' + pilihanTipe + '</select></div>') +
      '<div class="grup"><label for="d-it-judul">Judul <span class="wajib">*</span></label>' +
        '<input class="isian" id="d-it-judul" value="' + esc(i.title || '') +
        '" placeholder="mis. Pengenalan LAN"></div>' +
      '<div class="grup"><label for="d-it-desk">Deskripsi</label>' +
        '<textarea class="isian" id="d-it-desk" rows="2" ' +
        'placeholder="Instruksi / ringkasan (opsional)">' +
        esc(i.description || '') + '</textarea></div>' +
      '<div class="grup"><label for="d-it-konten">Konten materi</label>' +
        '<textarea class="isian" id="d-it-konten" rows="9" ' +
        'placeholder="<p>Konten (HTML)…</p>\n' +
        '<iframe src=\\"https://www.youtube.com/embed/…\\"></iframe>">' +
        esc(i.content || '') + '</textarea>' +
        '<span class="bantuan">Untuk jenis 📄 Materi. HTML sederhana + video ' +
        'YouTube/Drive. Quiz/tugas diisi di tahap berikutnya.</span></div>',
    lebar: 'sedang',
    labelYa: i.item_id ? 'Simpan' : 'Buat'
  }).then(function (ya) {
    if (!ya) return;
    var el = function (id) { return document.getElementById(id); };
    var p = {
      title: el('d-it-judul').value,
      description: el('d-it-desk').value,
      content: el('d-it-konten').value
    };
    if (i.item_id) {
      p.item_id = i.item_id;
      if (el('d-it-tipe')) p.type = el('d-it-tipe').value;
    } else {
      p.topic_id = i.topic_id;
      p.type = el('d-it-tipe').value;
    }

    tampilkanMuat(true, 'Menyimpan item…');
    callApi('itemSimpan', [State.token, p])
      .then(function () {
        tampilkanMuat(false);
        toast('Item tersimpan.', 'sukses');
        if (sesudah) sesudah();
      })
      .catch(function (res) {
        tampilkanMuat(false);
        toast((res && res.pesan) || 'Gagal menyimpan.', 'bahaya');
      });
  });
}

/* ============================================================
   RUTE: kelas-saya (murid)
   ============================================================ */
daftarRute('kelas-saya', function (bagian) {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = (State.user && State.user.role === 'guru')
    ? menuRangka(app, 'kelas')
    : menuRangka(app, 'kelas-saya');

  var classId = bagian && bagian[0] ? bagian[0] : '';

  isi.innerHTML = rangkaMuat(90, 3);

  callApi('kelasSaya', [State.token], { diam: true })
    .then(function (daftar) {
      Menu.kelas = daftar || [];
      Menu.diisi = Date.now();

      var kelas = classId
        ? (daftar || []).filter(function (k) { return k.class_id === classId; })
        : (daftar || []);

      var html = '';
      if (classId && !kelas.length) {
        html = kosongkan('🚫', 'Kelas tidak ditemukan',
          'Kelas mungkin sudah diarsipkan atau Anda tidak terdaftar lagi.',
          '<button class="btn btn-hantu btn-kecil mt-16" ' +
          'onclick="pergiKe(\'#/kelas-saya\')">Semua kelas</button>');
      } else if (!kelas.length) {
        html = kosongkan('📚', 'Belum terdaftar di kelas mana pun',
          'Hubungi guru Anda untuk didaftarkan.');
      } else {
        html = '<div class="kolom">' + kelas.map(function (k) {
          var pil = (k.mapel || []).map(function (m) {
            return m.ta_id
              ? '<button class="pil pil-kelas pil-tautan" data-ta="' +
                esc(m.ta_id) + '">▶ ' + esc(m.nama) +
                (m.guru ? ' · ' + esc(m.guru) : '') + '</button>'
              : '<span class="pil">' + esc(m.nama) +
                (m.guru ? ' · ' + esc(m.guru) : '') + '</span>';
          }).join('');
          return '<div class="kartu-kelas" style="cursor:default">' +
            '<div class="baris-antara mb-8">' +
              '<div style="min-width:0"><div class="judul">' + esc(k.name) + '</div>' +
              '<div class="kecil lembut">' + esc(k.academic_year || '') + '</div></div>' +
            '</div>' +
            '<div class="kecil lembut mb-4">MAPEL — ketuk untuk membuka</div>' +
            (pil ? '<div class="baris-pil">' + pil + '</div>'
                 : '<span class="kecil lembut">belum ada mapel</span>') +
          '</div>';
        }).join('') + '</div>';
      }

      isi.innerHTML = html;
      $$('[data-ta]', isi).forEach(function (c) {
        c.onclick = function () { pergiKe('#/materi/' + c.dataset.ta); };
      });
    })
    .catch(function () {
      isi.innerHTML = kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
});

/* ============================================================
   RUTE: materi/<taId> (murid) — daftar topik publish
   ============================================================ */
daftarRute('materi', function (bagian) {
  if (!bagian || !bagian[0]) { pergiKe('#/kelas-saya'); return; }
  var taId = bagian[0];

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = $('#isi-halaman', app);

  isi.innerHTML = rangkaMuat(80, 3);

  callApi('topikKelasSaya', [State.token, taId], { diam: true })
    .then(function (data) {
      var html =
        '<button class="tautan-balik" onclick="pergiKe(\'#/kelas-saya\')">← Kelas Saya</button>' +
        '<div class="kepala-halaman">' +
          '<h1>📗 ' + esc(data.mapel.name) + '</h1>' +
          '<p class="lembut kecil">' + esc(data.kelas.name) +
            (data.guru ? ' · ' + esc(data.guru) : '') +
            (data.academic_year ? ' · ' + esc(data.academic_year) : '') + '</p>' +
        '</div>';

      if (!data.topik.length) {
        html += kosongkan('🧩', 'Belum ada topik yang diterbitkan',
          'Materi akan muncul di sini setelah gurunya menerbitkannya.');
      } else {
        html += '<div class="kolom">' + data.topik.map(function (t) {
          return '<button class="kartu-kelas" data-topik="' + esc(t.topic_id) + '">' +
            '<div class="baris-antara mb-8">' +
              '<div style="min-width:0"><div class="judul">' + esc(t.title) + '</div>' +
              '<div class="mapel">' + esc(t.description || '') + '</div></div>' +
            '</div>' +
            '<div class="baris kecil lembut" style="gap:14px">' +
              '<span>🗂 ' + t.jml_item + ' item</span>' +
              '<span class="lencana">Buka →</span>' +
            '</div>' +
          '</button>';
        }).join('') + '</div>';
      }

      isi.innerHTML = html;
      $$('[data-topik]', isi).forEach(function (b) {
        b.onclick = function () { pergiKe('#/buka/' + b.dataset.topik); };
      });
    })
    .catch(function () {
      isi.innerHTML = kosongkan('⚠️', 'Gagal memuat',
        'Periksa koneksi Anda.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
        'onclick="pergiKe(\'#/kelas-saya\')">Kembali</button>');
    });
});

            '" data-item="' + esc(i.item_id) + '" data-tipe="' + esc(i.type) + '">' +
            ikonTipe(i.type) +
            '<div class="tumbuh" style="min-width:0">' +
              '<div><b>' + esc(i.title) + '</b></div>' +
              '<div class="kecil lembut">' + esc(t.label) +
                (i.description ? ' · ' + esc(i.description) : '') + '</div>' +
            '</div>' +
            '<span class="lencana' + (bisa ? '' : ' lencana-terkunci') + '">' +
              (bisa ? 'Baca →' : 'Segera') + '</span>' +
          '</button>';
        }).join('') + '</div>';
      }

      isi.innerHTML = html;
      $$('[data-item]', isi).forEach(function (b) {
        b.onclick = function () {
          if (b.dataset.tipe !== 'materi') {
            toast('Fitur "' + (TIPE_ITEM[b.dataset.tipe] || {}).label +
                  '" menyusul di tahap berikutnya.', 'peringatan');
            return;
          }
          pergiKe('#/baca/' + b.dataset.item);
        };
      });

    .catch(function () {
      isi.innerHTML = kosongkan('⚠️', 'Gagal memuat',
        'Periksa koneksi Anda.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
