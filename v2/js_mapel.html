<script>
/* ============================================================
   LMS v2 — js_mapel.html
   Mapel, Penugasan, Topik & Materi (guru) + alur belajar murid
   (Kelas Saya → Materi → Topik → Baca).
   Pola tampilan v1: baris-item + ikon-tipe, dialog global, toast.
   ============================================================ */

var TIPE_ITEM = {
  materi:         { ikon: '📄', label: 'Materi',         kelas: '' },
  quiz:           { ikon: '🎯', label: 'Quiz',           kelas: 'quiz' },
  tugas_individu: { ikon: '📝', label: 'Tugas Individu', kelas: 'tugas' },
  tugas_kelompok: { ikon: '👫', label: 'Tugas Kelompok', kelas: 'tugas' },
  refleksi:       { ikon: '🪞', label: 'Refleksi',       kelas: 'refleksi' }
};

function ikonTipe(tipe) {
  var t = TIPE_ITEM[tipe] || { ikon: '📄', label: tipe, kelas: '' };
  return '<span class="ikon-tipe ' + t.kelas + '" title="' + esc(t.label) +
         '">' + t.ikon + '</span>';
}
function lencanaPublikasi(status) {
  return status === 'publish'
    ? '<span class="lencana lencana-sukses">publish</span>'
    : '<span class="lencana lencana-peringatan">draf</span>';
}

/* ============================================================
   RUTE: mapel (guru)
   ============================================================ */
daftarRute('mapel', function () {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = menuRangka(app, 'mapel');

  isi.innerHTML =
    '<div class="kepala-halaman baris-antara">' +
      '<div><h1>📗 Mapel</h1>' +
      '<p class="lembut kecil">Mapel dipakai bersama lewat penugasan mengajar.</p></div>' +
      '<button class="btn" id="btn-mapel-baru">+ Mapel Baru</button>' +
    '</div>' +
    '<div id="daftar-mapel">' + rangkaMuat(56, 3) + '</div>';

  $('#btn-mapel-baru', isi).onclick = function () { dialogMapel(null, router); };

  callApi('mapelDaftar', [State.token], { diam: true })
    .then(function (daftar) {
      var wadah = $('#daftar-mapel', isi);
      if (!daftar.length) {
        wadah.innerHTML = kosongkan('📗', 'Belum ada mapel',
          'Buat mapel pertama Anda.');
        return;
      }
      wadah.innerHTML = '<div class="kartu"><div class="tabel-gulir">' +
        '<table class="tabel">' +
        '<thead><tr><th>Mapel</th><th>Kode</th><th>Pemilik</th>' +
        '<th>Penugasan</th><th>Status</th><th></th></tr></thead><tbody>' +
        daftar.map(function (s) {
          return '<tr>' +
            '<td><b>' + esc(s.name) + '</b></td>' +
            '<td>' + esc(s.code || '—') + '</td>' +
            '<td>' + esc(s.owner || '—') + '</td>' +
            '<td>' + s.jml_penugasan + '</td>' +
            '<td>' + (s.status === 'aktif'
              ? '<span class="lencana lencana-sukses">aktif</span>'
              : '<span class="lencana lencana-bahaya">nonaktif</span>') + '</td>' +
            '<td style="white-space:nowrap">' +
              '<button class="btn btn-teks btn-kecil" data-edit="' +
                esc(s.subject_id) + '">✏️</button>' +
              '<button class="btn btn-teks btn-kecil" data-status="' +
                esc(s.subject_id) + '" data-nama="' + esc(s.name) + '">' +
                (s.status === 'aktif' ? 'Nonaktifkan' : 'Aktifkan') + '</button>' +
            '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div></div>';

      $$('[data-edit]', wadah).forEach(function (b) {
        b.onclick = function () {
          var s = daftar.filter(function (x) {
            return x.subject_id === b.dataset.edit; })[0];
          dialogMapel(s, router);
        };
      });
      $$('[data-status]', wadah).forEach(function (b) {
        b.onclick = function () {
          var s = daftar.filter(function (x) {
            return x.subject_id === b.dataset.status; })[0];
          var ke = s.status === 'aktif' ? 'nonaktif' : 'aktif';
          konfirmasi('Ubah Status Mapel',
            (ke === 'nonaktif'
              ? 'Nonaktifkan mapel "' + b.dataset.nama + '"? Penugasan baru ' +
                'dengan mapel ini akan ditolak.'
              : 'Aktifkan kembali mapel "' + b.dataset.nama + '"?'),
            { labelYa: ke === 'nonaktif' ? 'Nonaktifkan' : 'Aktifkan',
              bahaya: ke === 'nonaktif' })
            .then(function (ya) {
              if (!ya) return;
              callApi('mapelUbahStatus', [State.token, s.subject_id, ke])
                .then(function () {
                  toast('Status mapel diperbarui.', 'sukses');
                  router();
                })
                .catch(function () {});
            });
        };
      });
    })
    .catch(function () {
      $('#daftar-mapel', isi).innerHTML =
        kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
});

function dialogMapel(s, sesudah) {
  dialog({
    judul: s ? '✏️ Edit Mapel' : '📗 Mapel Baru',
    pesan: s ? '' : 'Pemilik mapel otomatis: Anda.',
    html:
      '<div class="grup"><label for="d-sb-nama">Nama mapel <span class="wajib">*</span></label>' +
        '<input class="isian" id="d-sb-nama" value="' + esc(s ? s.name : '') +
        '" placeholder="mis. Jaringan Dasar"></div>' +
      '<div class="grup"><label for="d-sb-kode">Kode</label>' +
        '<input class="isian" id="d-sb-kode" value="' + esc(s ? s.code : '') +
        '" placeholder="mis. JD">' +
        '<span class="bantuan">Singkatan bebas — opsional.</span></div>',
    lebar: 'sedang',
    labelYa: s ? 'Simpan' : 'Buat'
  }).then(function (ya) {
    if (!ya) return;
    var p = {
      name: document.getElementById('d-sb-nama').value,
      code: document.getElementById('d-sb-kode').value
    };
    if (s) p.subject_id = s.subject_id;

    tampilkanMuat(true, 'Menyimpan mapel…');
    callApi('mapelSimpan', [State.token, p])
      .then(function () {
        tampilkanMuat(false);
        toast('Mapel tersimpan.', 'sukses');
        if (sesudah) sesudah();
      })
      .catch(function (res) {
        tampilkanMuat(false);
        toast((res && res.pesan) || 'Gagal menyimpan.', 'bahaya');
      });
  });
}

/* ============================================================
   RUTE: penugasan (guru)
   ============================================================ */
daftarRute('penugasan', function () {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = menuRangka(app, 'penugasan');

  isi.innerHTML =
    '<div class="kepala-halaman baris-antara">' +
      '<div><h1>🧑‍🏫 Penugasan Mengajar</h1>' +
      '<p class="lembut kecil">Relasi <b>guru + kelas + mapel</b>. ' +
      'Topik selalu dibuat di bawah penugasan ini.</p></div>' +
      '<button class="btn" id="btn-ta-baru">+ Penugasan Baru</button>' +
    '</div>' +
    '<div id="daftar-ta">' + rangkaMuat(56, 3) + '</div>';

  $('#btn-ta-baru', isi).onclick = function () { dialogPenugasan(null, router); };

  callApi('penugasanDaftar', [State.token, {}], { diam: true })
    .then(function (daftar) {
      var wadah = $('#daftar-ta', isi);
      if (!daftar.length) {
        wadah.innerHTML = kosongkan('🧑‍🏫', 'Belum ada penugasan',
          'Hubungkan kelas dengan mapel untuk mulai menyusun topik.',
          '<button class="btn btn-kecil mt-16" id="btn-ta-kosong">+ Penugasan Baru</button>');
        var b = $('#btn-ta-kosong', wadah);
        if (b) b.onclick = function () { dialogPenugasan(null, router); };
        return;
      }
      wadah.innerHTML = '<div class="kartu"><div class="tabel-gulir">' +
        '<table class="tabel">' +
        '<thead><tr><th>Kelas</th><th>Mapel</th><th>Guru</th><th>Tahun</th>' +
        '<th>Topik</th><th>Status</th><th></th></tr></thead><tbody>' +
        daftar.map(function (t) {
          return '<tr>' +
            '<td><b>' + esc(t.kelas) + '</b></td>' +
            '<td>' + esc(t.mapel) + '</td>' +
            '<td>' + esc(t.guru) + '</td>' +
            '<td class="kecil lembut">' + esc(t.academic_year || '—') + '</td>' +
            '<td>' + t.jml_topik + '</td>' +
            '<td>' + (t.status === 'aktif'
              ? '<span class="lencana lencana-sukses">aktif</span>'
              : '<span class="lencana lencana-bahaya">nonaktif</span>') + '</td>' +
            '<td style="white-space:nowrap">' +
              '<button class="btn btn-hantu btn-kecil" data-topik="' +
                esc(t.teaching_assignment_id) + '">Topik</button> ' +
              '<button class="btn btn-teks btn-kecil" data-edit="' +
                esc(t.teaching_assignment_id) + '">✏️</button> ' +
              '<button class="btn btn-teks btn-kecil" data-status="' +
                esc(t.teaching_assignment_id) + '" data-nama="' +
                esc(t.kelas + ' · ' + t.mapel) + '">' +
                (t.status === 'aktif' ? 'Nonaktifkan' : 'Aktifkan') + '</button>' +
            '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div></div>';

      $$('[data-topik]', wadah).forEach(function (b) {
        b.onclick = function () { pergiKe('#/topik/' + b.dataset.topik); };
      });
      $$('[data-edit]', wadah).forEach(function (b) {
        b.onclick = function () {
          var t = daftar.filter(function (x) {
            return x.teaching_assignment_id === b.dataset.edit; })[0];
          dialogPenugasan(t, router);
        };
      });
      $$('[data-status]', wadah).forEach(function (b) {
        b.onclick = function () {
          var t = daftar.filter(function (x) {
            return x.teaching_assignment_id === b.dataset.status; })[0];
          var ke = t.status === 'aktif' ? 'nonaktif' : 'aktif';
          konfirmasi('Ubah Status Penugasan',
            (ke === 'nonaktif'
              ? 'Nonaktifkan "' + b.dataset.nama + '"? Bacaan murid di ' +
                'mapel ini ikut tertutup.'
              : 'Aktifkan kembali "' + b.dataset.nama + '"?'),
            { labelYa: ke === 'nonaktif' ? 'Nonaktifkan' : 'Aktifkan',
              bahaya: ke === 'nonaktif' })
            .then(function (ya) {
              if (!ya) return;
              callApi('penugasanUbahStatus',
                      [State.token, t.teaching_assignment_id, ke])
                .then(function () {
                  toast('Status penugasan diperbarui.', 'sukses');
                  router();
                })
                .catch(function () {});
            });
        };
      });
    })
    .catch(function () {
      $('#daftar-ta', isi).innerHTML =
        kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
});

function dialogPenugasan(t, sesudah) {
  tampilkanMuat(true, 'Memuat pilihan…');
  Promise.all([
    callApi('kelasDaftar', [State.token, false], { diam: true }),
    callApi('mapelDaftar', [State.token], { diam: true }),
    callApi('guruDaftar', [State.token], { diam: true })
  ]).then(function (hasil) {
    tampilkanMuat(false);
    var kelas = hasil[0] || [], mapel = hasil[1] || [], guru = hasil[2] || [];

    var html = '';
    if (t) {
      html += '<div class="grup"><label>Kelas & mapel</label>' +
        '<input class="isian" value="' + esc(t.kelas + ' · ' + t.mapel) +
        '" disabled><span class="bantuan">Tidak bisa diubah — nonaktifkan ' +
        'penugasan ini lalu buat yang baru.</span></div>';
    } else {
      html +=
        '<div class="grup"><label for="d-ta-kelas">Kelas <span class="wajib">*</span></label>' +
        '<select class="isian" id="d-ta-kelas">' +
        kelas.map(function (k) {
          return '<option value="' + esc(k.class_id) + '">' + esc(k.name) + '</option>';
        }).join('') + '</select></div>' +
        '<div class="grup"><label for="d-ta-mapel">Mapel <span class="wajib">*</span></label>' +
        '<select class="isian" id="d-ta-mapel">' +
        mapel.filter(function (m) { return m.status === 'aktif'; })
          .map(function (m) {
            return '<option value="' + esc(m.subject_id) + '">' +
              esc(m.name + (m.code ? ' (' + m.code + ')' : '')) + '</option>';
          }).join('') + '</select></div>';
    }
    if (guru.length > 1) {
      html +=
        '<div class="grup"><label for="d-ta-guru">Guru pengampu</label>' +
        '<select class="isian" id="d-ta-guru">' +
        guru.map(function (g) {
          return '<option value="' + esc(g.user_id) + '"' +
            (t && t.teacher_id === g.user_id ? ' selected' : '') + '>' +
            esc(g.nama) + '</option>';
        }).join('') + '</select></div>';
    }
    html +=
      '<div class="grup"><label for="d-ta-tahun">Tahun ajaran</label>' +
      '<input class="isian" id="d-ta-tahun" value="' +
      esc(t ? (t.academic_year || '') : '') + '" placeholder="mis. 2026/2027">' +
      '<span class="bantuan">Kosongkan untuk mengikuti kelas. Bertulis 2026/2027.</span></div>';

    dialog({
      judul: t ? '✏️ Edit Penugasan' : '🧑‍🏫 Penugasan Baru',
      html: html,
      lebar: 'sedang',
      labelYa: t ? 'Simpan' : 'Buat'
    }).then(function (ya) {
      if (!ya) return;
      var el = function (id) { return document.getElementById(id); };
      var p = {};
      if (t) {
        p.teaching_assignment_id = t.teaching_assignment_id;
        if (el('d-ta-guru')) p.teacher_id = el('d-ta-guru').value;
        p.academic_year = el('d-ta-tahun').value;
      } else {
        p.class_id = el('d-ta-kelas').value;
        p.subject_id = el('d-ta-mapel').value;
        if (el('d-ta-guru')) p.teacher_id = el('d-ta-guru').value;
        p.academic_year = el('d-ta-tahun').value;
      }

      tampilkanMuat(true, 'Menyimpan penugasan…');
      callApi('penugasanSimpan', [State.token, p])
        .then(function () {
          tampilkanMuat(false);
          toast('Penugasan tersimpan.', 'sukses');
          if (sesudah) sesudah();
        })
        .catch(function (res) {
          tampilkanMuat(false);
          toast((res && res.pesan) || 'Gagal menyimpan.', 'bahaya');
        });
    });
  }).catch(function () { tampilkanMuat(false); });
}

/* ============================================================
   RUTE: topik (+/<taId>) (guru)
   ============================================================ */
daftarRute('topik', function (bagian) {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = menuRangka(app, 'topik');
  var taId = bagian && bagian[0] ? bagian[0] : '';

  isi.innerHTML = rangkaMuat(56, 2);

  callApi('penugasanDaftar', [State.token, {}], { diam: true })
    .then(function (daftar) {
      if (!daftar.length) {
        isi.innerHTML =
          '<div class="kepala-halaman"><h1>🧩 Topik & Materi</h1></div>' +
          kosongkan('🧩', 'Belum ada penugasan aktif',
            'Buat dulu di layar Penugasan.',
            '<button class="btn btn-kecil mt-16" onclick="pergiKe(\'#/penugasan\')">' +
            'Buka Penugasan</button>');
        return;
      }
      if (!taId) taId = daftar[0].teaching_assignment_id;
      var pilihan = daftar.map(function (t) {
        return '<option value="' + esc(t.teaching_assignment_id) + '"' +
          (t.teaching_assignment_id === taId ? ' selected' : '') + '>' +
          esc(t.kelas + ' · ' + t.mapel) + '</option>';
      }).join('');

      isi.innerHTML =
        '<div class="kepala-halaman"><h1>🧩 Topik & Materi</h1></div>' +
        '<div class="grup" style="max-width:520px">' +
          '<label for="sel-ta">Penugasan mengajar</label>' +
          '<select class="isian" id="sel-ta">' + pilihan + '</select>' +
        '</div>' +
        '<div id="isi-topik"></div>';

      $('#sel-ta', isi).onchange = function () {
        pergiKe('#/topik/' + this.value);
      };
      gambarTopik($('#isi-topik', isi), taId);
    })
    .catch(function () {
      isi.innerHTML = kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
});

function gambarTopik(wadah, taId) {
  wadah.innerHTML = rangkaMuat(70, 3);

  callApi('topikDaftar', [State.token, taId], { diam: true })
    .then(function (hasil) {
      var html =
        '<div class="baris-antara mb-12">' +
          '<span class="kecil lembut">' + hasil.jml_topik + ' topik — ' +
          'urutan teratas tampil lebih dulu di murid.</span>' +
          '<button class="btn btn-kecil" id="btn-topik-baru">+ Topik Baru</button>' +
        '</div>';

      if (!hasil.topik.length) {
        html += kosongkan('🧩', 'Belum ada topik',
          'Topik = bab / unit pembelajaran.');
      } else {
        html += '<div class="kolom sela-kecil">' + hasil.topik.map(function (t, idx) {
          return '<div class="baris-pertemuan" style="cursor:default">' +
            '<span class="nomor-pertemuan">' + (idx + 1) + '</span>' +
            '<div class="tumbuh" style="min-width:0">' +
              '<div><b>' + esc(t.title) + '</b> ' + lencanaPublikasi(t.status) + '</div>' +
              '<div class="kecil lembut">' +
                esc(t.description || 'Tanpa deskripsi') +
                ' · ' + t.jml_item + ' item</div>' +
            '</div>' +
            '<div class="baris sela-kecil" style="flex-wrap:nowrap">' +
              '<button class="btn btn-hantu btn-kecil" data-buka="' +
                esc(t.topic_id) + '">Isi item</button>' +
              '<button class="btn btn-teks btn-mini" data-atas="' +
                esc(t.topic_id) + '" title="Naikkan">↑</button>' +
              '<button class="btn btn-teks btn-mini" data-bawah="' +
                esc(t.topic_id) + '" title="Turunkan">↓</button>' +
              '<button class="btn btn-teks btn-mini" data-edit="' +
                esc(t.topic_id) + '" title="Edit">✏️</button>' +
              '<button class="btn btn-teks btn-mini" data-status="' +
                esc(t.topic_id) + '" title="' +
                (t.status === 'publish' ? 'Jadikan draf' : 'Terbitkan') + '">' +
                (t.status === 'publish' ? '🙈' : '📢') + '</button>' +
              '<button class="btn btn-teks btn-mini btn-bahaya-hantu" ' +
                'data-hapus="' + esc(t.topic_id) + '" title="Hapus">🗑</button>' +
            '</div>' +
            '<div id="item-' + esc(t.topic_id) + '" class="sembunyi"></div>' +
          '</div>';
        }).join('') + '</div>';
      }
      wadah.innerHTML = html;

      $('#btn-topik-baru', wadah).onclick = function () {
        dialogTopik({ teaching_assignment_id: taId },
                    function () { gambarTopik(wadah, taId); });
      };

      $$('[data-buka]', wadah).forEach(function (b) {
        b.onclick = function () {
          var w = document.getElementById('item-' + b.dataset.buka);
          if (w.classList.contains('sembunyi')) {
            w.classList.remove('sembunyi');
            gambarItem(w, b.dataset.buka, taId);
          } else {
            w.classList.add('sembunyi');
          }
        };
      });
      $$('[data-atas],[data-bawah]', wadah).forEach(function (b) {
        b.onclick = function () {
          var arah = b.dataset.atas ? 'atas' : 'bawah';
          var id = b.dataset.atas || b.dataset.bawah;
          callApi('topikPindah', [State.token, id, arah])
            .then(function () { gambarTopik(wadah, taId); })
            .catch(function () {});
        };
      });
      $$('[data-edit]', wadah).forEach(function (b) {
        b.onclick = function () {
          var t = hasil.topik.filter(function (x) {
            return x.topic_id === b.dataset.edit; })[0];
          dialogTopik(t, function () { gambarTopik(wadah, taId); });
        };
      });
      $$('[data-status]', wadah).forEach(function (b) {
        b.onclick = function () {
          var t = hasil.topik.filter(function (x) {
            return x.topic_id === b.dataset.status; })[0];
          var ke = t.status === 'publish' ? 'draft' : 'publish';
          callApi('topikUbahStatus', [State.token, t.topic_id, ke])
            .then(function () {
              toast(ke === 'publish'
                ? 'Topik diterbitkan — murid melihatnya.'
                : 'Topik dijadikan draf.', 'sukses');
              gambarTopik(wadah, taId);
            })
            .catch(function () {});
        };
      });
      $$('[data-hapus]', wadah).forEach(function (b) {
        b.onclick = function () {
          konfirmasi('Hapus Topik',
            'Hanya topik kosong yang boleh dihapus. Lanjut?',
            { labelYa: 'Hapus', bahaya: true })
            .then(function (ya) {
              if (!ya) return;
              callApi('topikHapus', [State.token, b.dataset.hapus])
                .then(function () {
                  toast('Topik dihapus.', 'sukses');
                  gambarTopik(wadah, taId);
                })
                .catch(function () {});
            });
        };
      });
    })
    .catch(function () {
      wadah.innerHTML = kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
}

function dialogTopik(t, sesudah) {
  dialog({
    judul: t.topic_id ? '✏️ Edit Topik' : '🧩 Topik Baru',
    html:
      '<div class="grup"><label for="d-tp-judul">Judul <span class="wajib">*</span></label>' +
        '<input class="isian" id="d-tp-judul" value="' + esc(t.title || '') +
        '" placeholder="mis. Bab 1 — Pengenalan"></div>' +
      '<div class="grup"><label for="d-tp-desk">Deskripsi</label>' +
        '<textarea class="isian" id="d-tp-desk" rows="3" ' +
        'placeholder="Deskripsi singkat (opsional)">' +
        esc(t.description || '') + '</textarea></div>',
    lebar: 'sedang',
    labelYa: t.topic_id ? 'Simpan' : 'Buat'
  }).then(function (ya) {
    if (!ya) return;
    var p = {
      title: document.getElementById('d-tp-judul').value,
      description: document.getElementById('d-tp-desk').value
    };
    if (t.topic_id) p.topic_id = t.topic_id;
    else p.teaching_assignment_id = t.teaching_assignment_id;

    tampilkanMuat(true, 'Menyimpan topik…');
    callApi('topikSimpan', [State.token, p])
      .then(function () {
        tampilkanMuat(false);
        toast('Topik tersimpan.', 'sukses');
        if (sesudah) sesudah();
      })
      .catch(function (res) {
        tampilkanMuat(false);
        toast((res && res.pesan) || 'Gagal menyimpan.', 'bahaya');
      });
  });
}

/* ---------------- item dalam topik (guru) ---------------- */
function gambarItem(wadah, topicId, taId) {
  wadah.innerHTML = rangkaMuat(48, 2);

  callApi('itemDaftar', [State.token, topicId], { diam: true })
    .then(function (daftar) {
      var html =
        '<div class="baris-antara mt-8 mb-8">' +
          '<span class="kecil lembut">' + daftar.length + ' item</span>' +
          '<button class="btn btn-hantu btn-kecil" id="btn-item-baru">+ Item Baru</button>' +
        '</div>';

      if (!daftar.length) {
        html += kosongkan('🗂', 'Belum ada item',
          'Item = materi / quiz / tugas / refleksi.');
      } else {
        html += '<div class="kolom sela-kecil">' + daftar.map(function (i) {
          var t = TIPE_ITEM[i.type] || { label: i.type };
          return '<div class="baris-item' + (i.status === 'draft' ? ' draf' : '') + '">' +
            ikonTipe(i.type) +
            '<div class="tumbuh" style="min-width:0">' +
              '<div><b>' + esc(i.title) + '</b> ' + lencanaPublikasi(i.status) +
                (i.related_id ? ' <span class="lencana lencana-terkunci">tertaut</span>' : '') +
                (i.ai_source ? ' <span class="lencana lencana-peringatan">AI</span>' : '') +
              '</div>' +
              '<div class="kecil lembut">' + esc(t.label) +
                (i.description ? ' · ' + esc(i.description) : '') + '</div>' +
            '</div>' +
            '<div class="baris sela-kecil" style="flex-wrap:nowrap">' +
              '<button class="btn btn-teks btn-mini" data-atas="' + esc(i.item_id) +
                '" title="Naikkan">↑</button>' +
              '<button class="btn btn-teks btn-mini" data-bawah="' + esc(i.item_id) +
                '" title="Turunkan">↓</button>' +
              '<button class="btn btn-teks btn-mini" data-edit="' + esc(i.item_id) +
                '" title="Buka editor">✏️</button>' +
              '<button class="btn btn-teks btn-mini" data-status="' + esc(i.item_id) +
                '" title="' + (i.status === 'publish' ? 'Jadikan draf' : 'Terbitkan') +
                '">' + (i.status === 'publish' ? '🙈' : '📢') + '</button>' +
              (i.related_id ? '' :
                '<button class="btn btn-teks btn-mini btn-bahaya-hantu" ' +
                'data-hapus="' + esc(i.item_id) + '" title="Hapus">🗑</button>') +
            '</div>' +
          '</div>';
        }).join('') + '</div>';
      }
      wadah.innerHTML = html;

      $('#btn-item-baru', wadah).onclick = function () {
        pergiKe('#/editor/' + taId + '/' + topicId);
      };
      $$('[data-atas],[data-bawah]', wadah).forEach(function (b) {
        b.onclick = function () {
          var arah = b.dataset.atas ? 'atas' : 'bawah';
          var id = b.dataset.atas || b.dataset.bawah;
          callApi('itemPindah', [State.token, id, arah])
            .then(function () { gambarItem(wadah, topicId); })
            .catch(function () {});
        };
      });
      $$('[data-edit]', wadah).forEach(function (b) {
        b.onclick = function () {
          pergiKe('#/editor/' + taId + '/' + topicId + '/' + b.dataset.edit);
        };
      });
      $$('[data-status]', wadah).forEach(function (b) {
        b.onclick = function () {
          var i = daftar.filter(function (x) {
            return x.item_id === b.dataset.status; })[0];
          var ke = i.status === 'publish' ? 'draft' : 'publish';
          callApi('itemUbahStatus', [State.token, i.item_id, ke])
            .then(function () {
              toast(ke === 'publish'
                ? 'Item diterbitkan — murid kelas diberi tahu.'
                : 'Item dijadikan draf.', 'sukses');
              gambarItem(wadah, topicId, taId);
            })
            .catch(function () {});
        };
      });
      $$('[data-hapus]', wadah).forEach(function (b) {
        b.onclick = function () {
          konfirmasi('Hapus Item', 'Hapus item ini?',
            { labelYa: 'Hapus', bahaya: true })
            .then(function (ya) {
              if (!ya) return;
              callApi('itemHapus', [State.token, b.dataset.hapus])
                .then(function () {
                  toast('Item dihapus.', 'sukses');
                  gambarItem(wadah, topicId, taId);
                })
                .catch(function () {});
            });
        };
      });
    })
    .catch(function () {
      wadah.innerHTML = kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
}

/* ============================================================
   EDITOR ITEM (guru) — port layar editor v1 (tpl-editor + alat)
   Rute: #/editor/<taId>/<topicId>            → item baru
         #/editor/<taId>/<topicId>/<itemId>   → ubah item
   ============================================================ */
daftarRute('editor', function (bagian) {
  if (!bagian[0] || !bagian[1]) { pergiKe('#/topik'); return; }
  bukaEditorItem(bagian[0], bagian[1], bagian[2] || '');
});

function bukaEditorItem(taId, topicId, itemId) {
  var muat = itemId
    ? callApi('getItemGuru', [State.token, itemId], { diam: true })
    : Promise.resolve(null);

  muat.then(function (it) {
    var baru = !it;
    var app = render('tpl-editor');
    pasangTopbar(app);

    $('#ed-judul-layar', app).textContent = baru ? '🗂 Item Baru' : '✏️ Ubah Item';
    $('#ed-balik', app).onclick = function () { pergiKe('#/topik/' + taId); };

    /* jenis item */
    var selTipe = $('#ed-tipe', app);
    selTipe.innerHTML = Object.keys(TIPE_ITEM).map(function (k) {
      return '<option value="' + k + '">' + TIPE_ITEM[k].ikon + ' ' +
             TIPE_ITEM[k].label + '</option>';
    }).join('');
    if (baru) { selTipe.value = 'materi'; }
    else {
      selTipe.value = it.type;
      if (it.related_id) selTipe.disabled = true;   /* sudah tertaut */
    }
    function bantuTipe() {
      var b = {
        quiz: 'Soal quiz dikelola setelah item tersimpan — tahap berikutnya.',
        refleksi: 'Pertanyaan refleksi menyusul di tahap berikutnya.',
        tugas_individu: 'Petunjuk pengerjaan ditulis di Konten. Pengumpulan tugas menyusul.',
        tugas_kelompok: 'Petunjuk pengerjaan ditulis di Konten. Pengumpulan tugas menyusul.',
        materi: ''
      };
      $('#ed-tipe-bantu', app).textContent = b[selTipe.value] || '';
    }
    selTipe.onchange = bantuTipe;
    bantuTipe();

    $('#ed-judul', app).value = it ? (it.title || '') : '';
    $('#ed-desk', app).value = it ? (it.description || '') : '';

    var ed = $('#ed-isi', app);
    ed.innerHTML = it ? (it.content || '') : '';

    pasangAlatEditor(app, ed);
    pasangModeHtml(app, ed);

    $('#ed-pratinjau', app).onclick = function () {
      samakanDariHtml(app, ed);
      pratinjauKontenEditor(ed, $('#ed-judul', app).value || 'Tanpa Judul',
                            selTipe.value);
    };

    function simpan(status, tombol) {
      /* WAJIB sebelum membaca konten: bila guru masih di mode HTML,
         suntingannya ada di textarea, belum di editor visual. */
      if (modeHtmlAktif(app)) samakanDariHtml(app, ed);
      var judul = $('#ed-judul', app).value.trim();
      if (!judul) { toast('Judul wajib diisi.', 'peringatan'); return; }

      var p = {
        title: judul,
        description: $('#ed-desk', app).value,
        content: ed.innerHTML
      };
      if (baru) {
        p.topic_id = topicId;
        p.type = selTipe.value;
        p.status = status;             /* server memberi tahu murid */
      } else {
        p.item_id = it.item_id;
        if (!it.related_id && selTipe.value !== it.type) p.type = selTipe.value;
      }

      tombol.disabled = true;
      tampilkanMuat(true, 'Menyimpan item…');
      callApi('itemSimpan', [State.token, p], { diam: true })
        .then(function () {
          /* itemSimpan EDIT tidak menerima status — beri tahu server
             lewat itemUbahStatus (draf→terbit menotify murid). */
          if (!baru && (it.status || 'draft') !== status) {
            return callApi('itemUbahStatus', [State.token, it.item_id, status]);
          }
        })
        .then(function () {
          tampilkanMuat(false);
          toast(status === 'publish'
            ? 'Item diterbitkan — murid kelas diberi tahu.'
            : 'Item tersimpan sebagai draf.', 'sukses');
          pergiKe('#/topik/' + taId);
        })
        .catch(function (res) {
          tampilkanMuat(false);
          tombol.disabled = false;
          toast((res && res.pesan) || 'Gagal menyimpan.', 'bahaya');
        });
    }
    $('#ed-simpan-draf', app).onclick = function () { simpan('draft', this); };
    $('#ed-simpan-terbit', app).onclick = function () { simpan('publish', this); };
  }).catch(function (res) {
    toast((res && res.pesan) || 'Gagal memuat item.', 'bahaya');
    pergiKe('#/topik/' + taId);
  });
}

function pratinjauKontenEditor(ed, judul, tipe) {
  var t = TIPE_ITEM[tipe] || { ikon: '👁' };
  dialog({
    judul: t.ikon + ' ' + judul,
    pesan: 'Pratinjau — isi ditampilkan apa adanya.',
    lebar: 'penuh',
    html: '<div class="pv-gulir"><div class="isi-materi">' +
          (ed.innerHTML || '<p class="kecil lembut">Konten masih kosong.</p>') +
          '</div></div>',
    tanpaBatal: true, labelYa: 'Tutup'
  });
}

/* -------------------------------------------------- alat editor (v1) */
function pasangAlatEditor(app, ed) {
  var bar = $('#ed-alat', app);

  function perintah(cmd, nilai) {
    ed.focus();
    document.execCommand(cmd, false, nilai || null);
  }

  bar.onclick = function (e) {
    var b = e.target.closest('[data-cmd]');
    if (!b) return;
    e.preventDefault();
    var c = b.dataset.cmd;

    if (c === 'link') {
      var u = prompt('Alamat tautan:', 'https://');
      if (u) perintah('createLink', u);
    } else if (c === 'gambar') {
      var g = prompt('URL gambar:', 'https://');
      if (g) perintah('insertHTML',
        '<img src="' + esc(g) + '" style="max-width:100%">');
    } else if (c === 'video') {
      var v = prompt('Tempel tautan YouTube:', 'https://');
      if (v) {
        var id = idYouTube(v);
        if (!id) {
          toast('Tautan YouTube tidak dikenali. Salin dari bilah ' +
                'alamat atau tombol Bagikan.', 'peringatan', 5);
        } else {
          /* penanda waktu ikut dibawa: guru sering menunjuk menit
             tertentu, bukan awal video */
          perintah('insertHTML', embedYouTube(id, mulaiYouTube(v)));
        }
      }
    } else if (c === 'kode') {
      perintah('formatBlock', 'pre');
    } else if (c === 'h3' || c === 'h4') {
      perintah('formatBlock', c);
    } else if (c === 'tabel') {
      /* Simpan posisi kursor SEBELUM dialog terbuka — membuka dialog
         memindahkan fokus, dan execCommand menyisipkan di posisi
         kursor. Tanpa jangkar, tabel mendarat di awal dokumen (v1). */
      var jangkar = simpanKursor(ed);
      dialogTabel(function (baris, kolom, pakaiKepala) {
        pulihkanKursor(jangkar);
        perintah('insertHTML', htmlTabel(baris, kolom, pakaiKepala));
      });
    } else if (c === 'baris-tambah')  { ubahTabel(ed, 'baris', 1); }
      else if (c === 'baris-hapus')   { ubahTabel(ed, 'baris', -1); }
      else if (c === 'kolom-tambah')  { ubahTabel(ed, 'kolom', 1); }
      else if (c === 'kolom-hapus')   { ubahTabel(ed, 'kolom', -1); }
    else {
      perintah(c);
    }
  };
}

/* -------------------------------------------------- mode HTML (v1) */
function modeHtmlAktif(app) {
  var ta = $('#ed-html', app);
  return !!ta && !ta.classList.contains('sembunyi');
}

/**
 * Salin isi textarea HTML kembali ke editor visual.
 * WAJIB dipanggil sebelum Simpan & Pratinjau — tanpa ini guru yang
 * menyimpan saat masih di mode HTML kehilangan seluruh suntingannya.
 * Aman dipanggil kapan saja: bila tidak di mode HTML, tidak melakukan apa-apa.
 */
function samakanDariHtml(app, ed) {
  if (!modeHtmlAktif(app)) return false;
  var ta = $('#ed-html', app);
  ed.innerHTML = ta.value;
  return true;
}

function pasangModeHtml(app, ed) {
  var tombol = $('#ed-mode-html', app);
  var ta = $('#ed-html', app);
  if (!tombol || !ta) return;

  tombol.onclick = function (e) {
    e.preventDefault();
    var keHtml = !modeHtmlAktif(app);

    if (keHtml) {
      /* visual → HTML: tampilkan kode yang SUNGGUH akan disimpan */
      ta.value = ed.innerHTML;
      ed.classList.add('sembunyi');
      ta.classList.remove('sembunyi');
      tombol.classList.add('aktif');
      tombol.innerHTML = '👁 Visual';
      tombol.title = 'Kembali ke tampilan visual';
      ta.focus();
    } else {
      /* HTML → visual */
      samakanDariHtml(app, ed);
      ta.classList.add('sembunyi');
      ed.classList.remove('sembunyi');
      tombol.classList.remove('aktif');
      tombol.innerHTML = '&lt;/&gt; HTML';
      tombol.title = 'Sunting kode HTML';
      ed.focus();
    }

    /* Tombol format tidak berlaku pada teks mentah — dikelabukan
       supaya guru tidak mengira editornya rusak (v1). */
    $$('#ed-alat [data-cmd]', app).forEach(function (b) {
      b.disabled = keHtml;
    });
  };
}

/* -------------------------------------------------- tabel (v1) */
var TABEL_MAKS = 12;   /* di atas ini tabel tidak terbaca di ponsel */

/** Ingat posisi kursor di dalam editor — dialog memindahkan fokus. */
function simpanKursor(ed) {
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  var r = sel.getRangeAt(0);
  return ed && ed.contains(r.commonAncestorContainer) ? r.cloneRange() : null;
}

function pulihkanKursor(r) {
  if (!r) return;
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

/** Dialog kecil: berapa baris, berapa kolom, pakai baris kepala? */
function dialogTabel(sesudah) {
  dialog({
    judul: '▦ Sisipkan Tabel',
    html:
      '<div class="grid-2">' +
        '<div class="grup"><label for="tbl-baris">Jumlah baris ' +
          '<span class="lembut">(isi, tanpa kepala)</span></label>' +
          '<input class="isian" id="tbl-baris" type="number" ' +
            'min="1" max="' + TABEL_MAKS + '" value="3"></div>' +
        '<div class="grup"><label for="tbl-kolom">Jumlah kolom</label>' +
          '<input class="isian" id="tbl-kolom" type="number" ' +
            'min="1" max="' + TABEL_MAKS + '" value="3"></div>' +
      '</div>' +
      '<label class="baris sela-kecil mt-8" style="cursor:pointer">' +
        '<input type="checkbox" id="tbl-kepala" checked> ' +
        'Pakai baris kepala (judul kolom)</label>' +
      '<p class="bantuan mt-8">Maksimal ' + TABEL_MAKS + '×' + TABEL_MAKS +
      '. Baris & kolom masih bisa ditambah setelah tabel dibuat.</p>',
    labelYa: 'Sisipkan'
  }).then(function (ya) {
    if (!ya) return;
    var b = jepitAngka($('#tbl-baris'), 3);
    var k = jepitAngka($('#tbl-kolom'), 3);
    var kepala = !!($('#tbl-kepala') && $('#tbl-kepala').checked);
    sesudah(b, k, kepala);
  });
}

/**
 * Baca angka dari isian, jepit ke rentang yang masuk akal.
 * Angka di luar rentang DIJEPIT, bukan diganti bawaan — guru yang
 * mengetik 0 bermaksud "sekecil mungkin", bukan "3" (v1).
 */
function jepitAngka(el, bawaan) {
  var teks = String((el && el.value) || '').trim();
  if (teks === '') return bawaan;
  var n = Number(teks);
  if (!isFinite(n)) return bawaan;
  return Math.max(1, Math.min(TABEL_MAKS, Math.round(n)));
}

/** HTML tabel untuk disisipkan ke editor lewat insertHTML. */
function htmlTabel(baris, kolom, pakaiKepala) {
  var h = '<table>';
  if (pakaiKepala) {
    h += '<thead><tr>';
    for (var k = 0; k < kolom; k++) h += '<th>Kolom ' + (k + 1) + '</th>';
    h += '</tr></thead>';
  }
  h += '<tbody>';
  for (var b = 0; b < baris; b++) {
    h += '<tr>';
    for (var j = 0; j < kolom; j++) h += '<td>&nbsp;</td>';
    h += '</tr>';
  }
  return h + '</tbody></table><p><br></p>';
}

/** Tambah/hapus baris atau kolom pada tabel tempat kursor berada. */
function ubahTabel(ed, jenis, arah) {
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) { toast('Klik dulu di dalam tabel.', 'peringatan'); return; }

  var node = sel.getRangeAt(0).startContainer;
  var sel1 = node.nodeType === 1 ? node : node.parentNode;
  var td = sel1 && sel1.closest ? sel1.closest('td,th') : null;
  var tabel = sel1 && sel1.closest ? sel1.closest('table') : null;

  if (!tabel || !ed.contains(tabel)) {
    toast('Klik dulu di dalam tabel yang ingin diubah.', 'peringatan');
    return;
  }

  var semuaBaris = tabel.rows;
  var idxKolom = td ? td.cellIndex : 0;
  var idxBaris = td && td.parentNode ? td.parentNode.rowIndex : 0;

  if (jenis === 'baris') {
    var body = tabel.tBodies[0] || tabel;
    if (arah > 0) {
      if (semuaBaris.length >= TABEL_MAKS + 1) {
        toast('Maksimal ' + TABEL_MAKS + ' baris.', 'peringatan'); return;
      }
      var jml = semuaBaris[0] ? semuaBaris[0].cells.length : 1;
      var tr = document.createElement('tr');
      for (var i = 0; i < jml; i++) {
        var sel2 = document.createElement('td');
        sel2.innerHTML = '&nbsp;';
        tr.appendChild(sel2);
      }
      /* sisipkan TEPAT di bawah baris tempat kursor berada */
      var acuan = semuaBaris[idxBaris];
      if (acuan && acuan.parentNode === body) {
        body.insertBefore(tr, acuan.nextSibling);
      } else {
        body.appendChild(tr);
      }
    } else {
      /* Baris kepala tidak boleh terhapus lewat tombol ini. */
      var trHapus = semuaBaris[idxBaris];
      if (!trHapus || trHapus.parentNode.tagName === 'THEAD') {
        toast('Baris kepala tidak dapat dihapus di sini.', 'peringatan');
        return;
      }
      if ((tabel.tBodies[0] || tabel).rows.length <= 1) {
        toast('Tabel harus punya minimal satu baris isi.', 'peringatan');
        return;
      }
      trHapus.parentNode.removeChild(trHapus);
    }
  } else {
    var jmlKolom = semuaBaris[0] ? semuaBaris[0].cells.length : 0;
    if (arah > 0 && jmlKolom >= TABEL_MAKS) {
      toast('Maksimal ' + TABEL_MAKS + ' kolom.', 'peringatan'); return;
    }
    if (arah < 0 && jmlKolom <= 1) {
      toast('Tabel harus punya minimal satu kolom.', 'peringatan');
      return;
    }
    for (var r = 0; r < semuaBaris.length; r++) {
      var baris2 = semuaBaris[r];
      if (arah > 0) {
        var kepala = baris2.parentNode.tagName === 'THEAD';
        var selBaru = document.createElement(kepala ? 'th' : 'td');
        selBaru.innerHTML = kepala
          ? 'Kolom ' + (jmlKolom + 1) : '&nbsp;';
        var setelah = baris2.cells[idxKolom];
        if (setelah) baris2.insertBefore(selBaru, setelah.nextSibling);
        else baris2.appendChild(selBaru);
      } else {
        if (baris2.cells[idxKolom]) baris2.deleteCell(idxKolom);
      }
    }
  }

  ed.dispatchEvent(new Event('input', { bubbles: true }));
}

/* -------------------------------------------------- YouTube (v1) */

/**
 * Ambil ID video dari bentuk tautan YouTube apa pun:
 * watch?v=, youtu.be/, /shorts/, /embed/, /live/, m.youtube.com,
 * dengan penanda waktu, atau ID 11 karakter saja.
 * Mengembalikan '' bila bukan tautan YouTube.
 */
function idYouTube(url) {
  var u = String(url || '').trim();
  if (!u) return '';

  /* ID YouTube selalu 11 karakter: huruf, angka, - dan _ */
  var pola = [
    /[?&]v=([A-Za-z0-9_-]{11})/,          /* watch?v= */
    /youtu\.be\/([A-Za-z0-9_-]{11})/,      /* youtu.be/ */
    /\/shorts\/([A-Za-z0-9_-]{11})/,       /* /shorts/ */
    /\/embed\/([A-Za-z0-9_-]{11})/,        /* /embed/ */
    /\/live\/([A-Za-z0-9_-]{11})/          /* /live/ */
  ];
  for (var i = 0; i < pola.length; i++) {
    var m = pola[i].exec(u);
    if (m) return m[1];
  }

  if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  return '';
}

/** Detik mulai dari penanda waktu, mis. `&t=90s` atau `?t=1m30s`. */
function mulaiYouTube(url) {
  var m = /[?&]t=(?:(\d+)h)?(?:(\d+)m)?(\d+)s?/.exec(String(url || ''));
  if (!m) return 0;
  return (Number(m[1]) || 0) * 3600 + (Number(m[2]) || 0) * 60 +
         (Number(m[3]) || 0);
}

/**
 * iframe yang lolos sanitasi server & aman dipakai murid:
 * youtube-nocookie.com + rel=0 (tanpa saran video lain).
 */
function embedYouTube(id, mulai) {
  var src = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0';
  if (mulai) src += '&start=' + mulai;
  return '<div class="bingkai-video">' +
    '<iframe src="' + src + '" title="Video pembelajaran" ' +
    'loading="lazy" allowfullscreen ' +
    'allow="accelerometer; encrypted-media; gyroscope; picture-in-picture">' +
    '</iframe></div><p><br></p>';
}

/* ============================================================
   RUTE: kelas-saya (murid)
   ============================================================ */
daftarRute('kelas-saya', function (bagian) {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = (State.user && State.user.role === 'guru')
    ? menuRangka(app, 'kelas')
    : menuRangka(app, 'kelas-saya');

  var classId = bagian && bagian[0] ? bagian[0] : '';

  isi.innerHTML = rangkaMuat(90, 3);

  callApi('kelasSaya', [State.token], { diam: true })
    .then(function (daftar) {
      Menu.kelas = daftar || [];
      Menu.diisi = Date.now();

      var kelas = classId
        ? (daftar || []).filter(function (k) { return k.class_id === classId; })
        : (daftar || []);

      var html = '';
      if (classId && !kelas.length) {
        html = kosongkan('🚫', 'Kelas tidak ditemukan',
          'Kelas mungkin sudah diarsipkan atau Anda tidak terdaftar lagi.',
          '<button class="btn btn-hantu btn-kecil mt-16" ' +
          'onclick="pergiKe(\'#/kelas-saya\')">Semua kelas</button>');
      } else if (!kelas.length) {
        html = kosongkan('📚', 'Belum terdaftar di kelas mana pun',
          'Hubungi guru Anda untuk didaftarkan.');
      } else {
        html = '<div class="kolom">' + kelas.map(function (k) {
          var pil = (k.mapel || []).map(function (m) {
            return m.ta_id
              ? '<button class="pil pil-kelas pil-tautan" data-ta="' +
                esc(m.ta_id) + '">▶ ' + esc(m.nama) +
                (m.guru ? ' · ' + esc(m.guru) : '') + '</button>'
              : '<span class="pil">' + esc(m.nama) +
                (m.guru ? ' · ' + esc(m.guru) : '') + '</span>';
          }).join('');
          return '<div class="kartu-kelas" style="cursor:default">' +
            '<div class="baris-antara mb-8">' +
              '<div style="min-width:0"><div class="judul">' + esc(k.name) + '</div>' +
              '<div class="kecil lembut">' + esc(k.academic_year || '') + '</div></div>' +
            '</div>' +
            '<div class="kecil lembut mb-4">MAPEL — ketuk untuk membuka</div>' +
            (pil ? '<div class="baris-pil">' + pil + '</div>'
                 : '<span class="kecil lembut">belum ada mapel</span>') +
          '</div>';
        }).join('') + '</div>';
      }

      isi.innerHTML = html;
      $$('[data-ta]', isi).forEach(function (c) {
        c.onclick = function () { pergiKe('#/materi/' + c.dataset.ta); };
      });
    })
    .catch(function () {
      isi.innerHTML = kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
});

/* ============================================================
   RUTE: materi/<taId> (murid) — daftar topik publish
   ============================================================ */
daftarRute('materi', function (bagian) {
  if (!bagian || !bagian[0]) { pergiKe('#/kelas-saya'); return; }
  var taId = bagian[0];

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = $('#isi-halaman', app);

  isi.innerHTML = rangkaMuat(80, 3);

  callApi('topikKelasSaya', [State.token, taId], { diam: true })
    .then(function (data) {
      var html =
        '<button class="tautan-balik" onclick="pergiKe(\'#/kelas-saya\')">← Kelas Saya</button>' +
        '<div class="kepala-halaman">' +
          '<h1>📗 ' + esc(data.mapel.name) + '</h1>' +
          '<p class="lembut kecil">' + esc(data.kelas.name) +
            (data.guru ? ' · ' + esc(data.guru) : '') +
            (data.academic_year ? ' · ' + esc(data.academic_year) : '') + '</p>' +
        '</div>';

      if (!data.topik.length) {
        html += kosongkan('🧩', 'Belum ada topik yang diterbitkan',
          'Materi akan muncul di sini setelah gurunya menerbitkannya.');
      } else {
      html += '<div class="kolom sela-kecil">' + data.topik.map(function (t, idx) {
        return '<button class="baris-pertemuan" data-topik="' + esc(t.topic_id) + '">' +
          '<span class="nomor-pertemuan">' + (idx + 1) + '</span>' +
          '<div class="tumbuh" style="min-width:0">' +
            '<div><b>' + esc(t.title) + '</b></div>' +
            '<div class="kecil lembut">' + esc(t.description || '') + '</div>' +
          '</div>' +
          '<span class="lencana">🗂 ' + t.jml_item + ' · Buka →</span>' +
        '</button>';
      }).join('') + '</div>';
      }

      isi.innerHTML = html;
      $$('[data-topik]', isi).forEach(function (b) {
        b.onclick = function () { pergiKe('#/buka/' + b.dataset.topik); };
      });
    })
    .catch(function () {
      isi.innerHTML = kosongkan('⚠️', 'Gagal memuat',
        'Periksa koneksi Anda.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
        'onclick="pergiKe(\'#/kelas-saya\')">Kembali</button>');
    });
});

/* ============================================================
   RUTE: buka/<topicId> (murid) — isi topik
   ============================================================ */
daftarRute('buka', function (bagian) {
  if (!bagian || !bagian[0]) { pergiKe('#/kelas-saya'); return; }
  var topicId = bagian[0];

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = $('#isi-halaman', app);

  isi.innerHTML = rangkaMuat(64, 3);

  callApi('bukaTopik', [State.token, topicId], { diam: true })
    .then(function (data) {
      var html =
        '<button class="tautan-balik" onclick="history.back()">← Kembali</button>' +
        '<div class="kepala-halaman">' +
          '<h1>🧩 ' + esc(data.title) + '</h1>' +
          '<p class="lembut kecil">' + esc(data.kelas) + ' · ' +
            esc(data.mapel) + '</p>' +
          (data.description ? '<p class="kecil">' + esc(data.description) + '</p>' : '') +
        '</div>';

      if (!data.item.length) {
        html += kosongkan('🗂', 'Belum ada item yang diterbitkan', '');
      } else {
        html += '<div class="kolom sela-kecil">' + data.item.map(function (i) {
          var bisa = i.type === 'materi';
          var t = TIPE_ITEM[i.type] || { label: i.type };
          return '<button class="item-murid' + (bisa ? '' : ' terkunci') +
            '" data-item="' + esc(i.item_id) + '" data-tipe="' + esc(i.type) + '">' +
            ikonTipe(i.type) +
            '<div class="tumbuh" style="min-width:0">' +
              '<div><b>' + esc(i.title) + '</b></div>' +
              '<div class="kecil lembut">' + esc(t.label) +
                (i.description ? ' · ' + esc(i.description) : '') + '</div>' +
            '</div>' +
            '<span class="lencana' + (bisa ? '' : ' lencana-terkunci') + '">' +
              (bisa ? 'Baca →' : 'Segera') + '</span>' +
          '</button>';
        }).join('') + '</div>';
      }

      isi.innerHTML = html;
      $$('[data-item]', isi).forEach(function (b) {
        b.onclick = function () {
          if (b.dataset.tipe !== 'materi') {
            toast('Fitur "' + (TIPE_ITEM[b.dataset.tipe] || {}).label +
                  '" menyusul di tahap berikutnya.', 'peringatan');
            return;
          }
          pergiKe('#/baca/' + b.dataset.item);
        };
      });
    })
    .catch(function () {
      isi.innerHTML = kosongkan('⚠️', 'Gagal memuat',
        'Periksa koneksi Anda.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
        'onclick="history.back()">Kembali</button>');
    });
});

/* ============================================================
   RUTE: baca/<itemId> (murid) — pembaca materi
   ============================================================ */
daftarRute('baca', function (bagian) {
  if (!bagian || !bagian[0]) { pergiKe('#/kelas-saya'); return; }
  var itemId = bagian[0];

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = $('#isi-halaman', app);

  isi.innerHTML = rangkaMuat(200, 2);

  callApi('bacaMateri', [State.token, itemId], { diam: true })
    .then(function (m) {
      isi.innerHTML =
        '<button class="tautan-balik" onclick="history.back()">← ' +
          esc(m.topik) + '</button>' +
        '<div class="kepala-halaman">' +
          '<h1>📄 ' + esc(m.title) + '</h1>' +
          (m.description ? '<p class="kecil lembut">' + esc(m.description) + '</p>' : '') +
        '</div>' +
        '<div class="kartu"><div class="isi-materi">' +
          (m.content || '<p class="kecil lembut">Materi ini belum berisi konten.</p>') +
        '</div></div>';
      window.scrollTo(0, 0);
    })
    .catch(function (res) {
      isi.innerHTML = kosongkan('⚠️',
        res && res.error === 'FITUR_BELUM_ADA' ? 'Belum tersedia'
                                               : 'Gagal memuat',
        (res && res.pesan) || 'Periksa koneksi Anda.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
        'onclick="history.back()">Kembali</button>');
    });
});
</script>
