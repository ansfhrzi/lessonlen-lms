<script>
/* ============================================================
 *  LMS v2 — js_core.html
 *  Inti klien: token sesi, pembungkus google.script.run,
 *  escape HTML, router layar, dialog & toast global,
 *  cangkang dashboard (sidebar/topbar/lonceng)
 * ============================================================ */

var Core = (function () {

  var KUNCI_TOKEN = 'lmsv2_token';

  var state = {
    token: null,
    user: null,          /* hasil cekSesi */
    ringkas: null        /* hasil ringkasDashboard */
  };

  /* ---------- token ---------- */

  function ambilToken() {
    try { return sessionStorage.getItem(KUNCI_TOKEN) || ''; } catch (e) { return ''; }
  }
  function simpanToken(t) {
    try { sessionStorage.setItem(KUNCI_TOKEN, t); } catch (e) {}
    state.token = t;
  }
  function buangToken() {
    try { sessionStorage.removeItem(KUNCI_TOKEN); } catch (e) {}
    state.token = null;
    state.user = null;
    state.ringkas = null;
  }

  /* ---------- api ---------- */

  /**
   * Panggil fungsi server lewat google.script.run.
   * Mengembalikan Promise; resolusi = data (bukan seluruh {ok,...}).
   * SESI_INVALID otomatis memaksa kembali ke layar login.
   */
  function api(namaFn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok === false) {
            if (res.error === 'SESI_INVALID') {
              buangToken();
              Auth.tampilkanLogin('Sesi berakhir. Silakan masuk kembali.');
            }
            reject(new Error(res.pesan || res.error || 'Gagal'));
            return;
          }
          resolve(res ? res.data : null);
        })
        .withFailureHandler(function (err) {
          reject(new Error((err && err.message) || 'Kesalahan jaringan'));
        });
      runner[namaFn].apply(runner, args);
    });
  }

  /* ---------- util ---------- */

  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function $(id) { return document.getElementById(id); }

  function inisial(nama) {
    var bagian = String(nama || '').trim().split(/\s+/);
    var huruf = (bagian[0] || '?').charAt(0) +
                (bagian.length > 1 ? bagian[bagian.length - 1].charAt(0) : '');
    return huruf.toUpperCase();
  }

  /** Instansiasi <template> ke #app. */
  function pasangTemplate(idTpl) {
    var tpl = $(idTpl);
    var app = $('app');
    app.innerHTML = '';
    app.appendChild(tpl.content.cloneNode(true));
  }

  function kirimForm(btn, sedang, teksAksi) {
    if (btn) {
      btn.disabled = sedang;
      if (sedang) {
        btn.dataset.teks = btn.textContent;
        btn.textContent = teksAksi || 'Memproses…';
      } else if (btn.dataset.teks) {
        btn.textContent = btn.dataset.teks;
      }
    }
  }

  function tampilkanPesanError(el, pesan) {
    if (!el) return;
    el.textContent = pesan || 'Terjadi kesalahan.';
    el.classList.add('tampil');
  }
  function sembunyikanPesanError(el) {
    if (!el) return;
    el.textContent = '';
    el.classList.remove('tampil');
  }

  /* ---------- salin ke papan klip ---------- */

  function salin(teks) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(teks).then(function () {
        toast('Disalin ke papan klip.', 'sukses');
      }).catch(function () { salinCadangan(teks); });
    } else salinCadangan(teks);
  }
  function salinCadangan(teks) {
    var ta = document.createElement('textarea');
    ta.value = teks;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('Disalin.', 'sukses'); }
    catch (e) { toast('Gagal menyalin — salin manual.', 'bahaya'); }
    ta.remove();
  }

  /* ---------- toast ---------- */

  function toast(pesan, jenis) {
    var wadah = $('toast-wadah');
    if (!wadah) {
      wadah = document.createElement('div');
      wadah.id = 'toast-wadah';
      document.body.appendChild(wadah);
    }
    var t = document.createElement('div');
    t.className = 'toast' + (jenis ? ' ' + jenis : '');
    t.textContent = pesan;
    wadah.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  /* ---------- dialog ---------- */

  /**
   * Dialog seragam. opsi = { judul, pesan, html, labelYa, labelBatal,
   * bahaya, tanpaBatal, tanpaYa, tombol: [{aksi,label,kelas}],
   * saatBuka(tirai), saatYa(tirai) }
   * Promise → resolve(true) utk tombol Ya, false utk batal/tirai,
   * atau string aksi utk tombol khusus (opsi.tombol).
   */
  function dialog(opsi) {
    opsi = opsi || {};
    return new Promise(function (resolve) {
      var tirai = document.createElement('div');
      tirai.className = 'tirai';

      var tombolKhusus = (opsi.tombol || []).map(function (t) {
        return '<button class="btn ' + (t.kelas || 'btn-sekunder') +
               '" data-aksi="' + esc(t.aksi) + '">' + esc(t.label) + '</button>';
      }).join('');

      var kotak = document.createElement('div');
      kotak.className = 'kotak-dialog';
      kotak.innerHTML = '<h3>' + esc(opsi.judul || '') + '</h3>' +
        (opsi.pesan ? '<p>' + esc(opsi.pesan) + '</p>' : '') +
        (opsi.html || '') +
        '<div class="aksi">' +
          tombolKhusus +
          (opsi.tanpaBatal ? '' :
            '<button class="btn btn-sekunder" data-aksi="batal">' +
            esc(opsi.labelBatal || 'Batal') + '</button>') +
          (opsi.tanpaYa ? '' :
            '<button class="btn' + (opsi.bahaya ? ' btn-bahaya' : '') +
            '" data-aksi="ya">' + esc(opsi.labelYa || 'OK') + '</button>') +
        '</div>';

      function tutup(hasil) {
        /* Jangan langsung menghapus DOM: .then() penelepon membaca isian
           form lewat Core.$() — microtask promise harus jalan lebih dulu,
           maka penghapusan ditunda satu tick. */
        setTimeout(function () { tirai.remove(); }, 0);
        resolve(hasil);
      }

      tirai.appendChild(kotak);
      document.body.appendChild(tirai);
      if (opsi.saatBuka) opsi.saatBuka(tirai);

      kotak.addEventListener('click', function (e) {
        var b = e.target.closest('[data-aksi]');
        if (!b) return;
        var aksi = b.dataset.aksi;
        if (aksi === 'ya' && opsi.saatYa) {
          /* saatYa boleh mengembalikan false utk menahan dialog terbuka
             (mis. validasi gagal → pesan tampil di tempat) */
          if (opsi.saatYa(tirai) === false) return;
        }
        tutup(aksi === 'ya' ? true : (aksi === 'batal' ? false : aksi));
      });
      tirai.addEventListener('click', function (e) {
        if (e.target === tirai) tutup(false);
      });
    });
  }

  /** Dialog konfirmasi ya/tidak. */
  function konfirmasi(judul, pesan, opsi) {
    opsi = opsi || {};
    opsi.judul = judul;
    opsi.pesan = pesan;
    opsi.labelYa = opsi.labelYa || 'Ya, lanjut';
    return dialog(opsi);
  }

  /* ---------- merek ---------- */

  function pasangMerek() {
    var ikon = TYDATA.ikon, nama = TYDATA.nama;
    ['merek-ikon-login', 'merek-ikon-topbar'].forEach(function (id) {
      var el = $(id);
      if (el) el.textContent = ikon;
    });
    ['merek-nama-login', 'merek-nama-topbar'].forEach(function (id) {
      var el = $(id);
      if (el) el.textContent = nama;
    });
    var v = $('versi-app');
    if (v) v.textContent = 'v' + TYDATA.versi;
  }

  /* ---------- router layar ---------- */

  var RUTE = {};          /* nama → fungsi render(params) */
  var RUTE_AKTIF = '';
  var JUDUL_RUTE = {
    beranda: 'Beranda', murid: 'Kelola Murid', kelas: 'Kelola Kelas',
    kelas_detail: 'Detail Kelas', course: 'Kelola Course',
    rekap: 'Rekap Nilai', apikey: 'Status API Key',
    biodata: 'Biodata Saya', course_detail: 'Kelola Topik & Item'
  };

  function daftarRute(nama, render) { RUTE[nama] = render; }

  function pergiKe(nama, params) {
    if (!RUTE[nama]) return;
    RUTE_AKTIF = nama;
    var layar = $('layar');
    if (!layar) return;
    layar.innerHTML = '<div class="pemuat"><span class="ikon">⏳</span>Memuat…</div>';
    document.querySelectorAll('#menu-utama a').forEach(function (a) {
      var milik = a.dataset.rute === nama ||
        (nama === 'kelas_detail' && a.dataset.rute === 'kelas');
      a.classList.toggle('aktif', milik);
    });
    var judul = $('topbar-judul');
    if (judul) judul.textContent = JUDUL_RUTE[nama] || 'LessonLen';
    tutupSidebar();
    var pm = $('profil-menu');
    if (pm) pm.classList.remove('tampil');
    window.scrollTo(0, 0);
    RUTE[nama](params || {});
  }

  /* ---------- sidebar & lonceng ---------- */

  function bukaSidebar() {
    var s = $('sidebar'), o = $('overlay-samping');
    if (s) s.classList.add('tampil');
    if (o) o.classList.add('tampil');
    document.body.style.overflow = 'hidden';   /* ponsel: latar tak ikut menggulir */
  }
  function tutupSidebar() {
    var s = $('sidebar'), o = $('overlay-samping');
    if (s) s.classList.remove('tampil');
    if (o) o.classList.remove('tampil');
    document.body.style.overflow = '';
  }

  function muatLonceng() {
    var isi = $('lonceng-isi');
    if (!isi) return;
    api('daftarNotifikasi', ambilToken()).then(function (daftar) {
      isi.innerHTML = '';
      if (!daftar || !daftar.length) {
        isi.innerHTML = '<div class="pemuat">Belum ada notifikasi.</div>';
        return;
      }
      daftar.slice(0, 10).forEach(function (n) {
        var div = document.createElement('div');
        div.className = 'notif-item' + (n.dibaca ? '' : ' belum');
        div.innerHTML = '<span class="titik"></span>' +
          '<div><b>' + esc(n.judul) + '</b>' +
          '<div class="kecil">' + esc(n.created_at) + '</div></div>';
        isi.appendChild(div);
      });
    }).catch(function () {
      isi.innerHTML = '<div class="pemuat">Notifikasi gagal dimuat.</div>';
    });
  }

  function pasangCangkang() {
    pasangTemplate('tpl-dashboard');
    pasangMerek();

    var user = state.user || {};
    var nama = user.nama || user.username || 'Pengguna';
    var ini = $('profil-nama');
    if (ini) ini.textContent = nama;
    var peran = $('profil-peran');
    if (peran) peran.textContent = user.role === 'guru' ? 'guru' : 'murid';
    var av = $('profil-inisial');
    if (av) av.textContent = inisial(nama);

    /* menu hanya utk role-nya (laporan: murid melihat menu guru) */
    var peran = (state.user && state.user.role) || 'murid';
    document.querySelectorAll('#menu-utama a[data-role]').forEach(function (a) {
      a.style.display = a.dataset.role === peran ? '' : 'none';
    });

    /* menu akun (profil): Biodata Saya (murid) + Keluar */
    var bio = $('btn-menu-biodata');
    if (bio) bio.style.display = peran === 'murid' ? '' : 'none';
    var pa = $('profil-akun');
    if (pa) pa.addEventListener('click', function (e) {
      if (e.target.closest('#btn-keluar')) return;   /* keluar cepat */
      var pm = $('profil-menu');
      if (pm) pm.classList.toggle('tampil');
    });
    var pb = $('btn-menu-biodata');
    if (pb) pb.addEventListener('click', function () { pergiKe('biodata'); });
    var pk = $('btn-menu-keluar');
    if (pk) pk.addEventListener('click', function () { Auth.keluar(); });

    document.querySelectorAll('#menu-utama a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        pergiKe(a.dataset.rute);
      });
    });

    var bm = $('btn-menu');
    if (bm) bm.addEventListener('click', bukaSidebar);
    var ov = $('overlay-samping');
    if (ov) ov.addEventListener('click', tutupSidebar);
    var bk = $('btn-keluar');
    if (bk) bk.addEventListener('click', Auth.keluar);

    var bl = $('btn-lonceng');
    if (bl) {
      bl.addEventListener('click', function (e) {
        e.stopPropagation();
        var panel = $('lonceng-panel');
        if (!panel) return;
        var tampil = !panel.classList.contains('tampil');
        panel.classList.toggle('tampil', tampil);
        if (tampil) muatLonceng();
      });
    }
    document.addEventListener('click', function (e) {
      var panel = $('lonceng-panel');
      if (panel && !e.target.closest('.lonceng-wadah'))
        panel.classList.remove('tampil');
      var pmenu = $('profil-menu');
      if (pmenu && !e.target.closest('#profil-akun') &&
          !e.target.closest('#profil-menu'))
        pmenu.classList.remove('tampil');
    });

    /* layar melebar lagi (putar perangkat / ubah ukuran jendela):
       pastikan sidebar off-canvas tertutup */
    window.addEventListener('resize', function () {
      if (window.innerWidth > 900) tutupSidebar();
    });
  }

  /* ---------- boot ---------- */

  function muat() {
    pasangMerek();
    var t = ambilToken();
    if (!t) { Auth.tampilkanLogin(); return; }
    state.token = t;

    api('cekSesi', t).then(function (user) {
      state.user = user;
      if (!user) return;
      return api('ringkasDashboard', t).then(function (r) {
        state.ringkas = r;
        pasangCangkang();
        pergiKe('beranda');
        if (user.harus_ganti_password === true ||
            user.harus_ganti_password === 'TRUE') {
          Auth.bukaGantiSandi();
        } else if (user.role === 'murid' && r && r.biodata_kurang === true) {
          pergiKe('biodata');
        }
      });
    }).catch(function () {
      /* api() sudah mengarahkan ke login bila SESI_INVALID */
    });
  }

  return {
    state: state,
    ambilToken: ambilToken, simpanToken: simpanToken, buangToken: buangToken,
    api: api, esc: esc, $: $, inisial: inisial,
    pasangTemplate: pasangTemplate, pasangMerek: pasangMerek,
    kirimForm: kirimForm,
    tampilkanPesanError: tampilkanPesanError,
    sembunyikanPesanError: sembunyikanPesanError,
    toast: toast, dialog: dialog, konfirmasi: konfirmasi, salin: salin,
    daftarRute: daftarRute, pergiKe: pergiKe,
    pasangCangkang: pasangCangkang,
    muatLonceng: muatLonceng,
    muat: muat
  };
})();

/* Data merek diisi index.html (satu-satunya berkas dengan scriptlet —
 * berkas include tidak dievaluasi scriptlet-nya). Fallback bila absen. */
if (typeof TYDATA === 'undefined') {
  var TYDATA = { nama: 'LessonLen', versi: '', ikon: '\uD83C\uDF31' };
}

document.addEventListener('DOMContentLoaded', function () {
  Core.muat();
});
</script>
