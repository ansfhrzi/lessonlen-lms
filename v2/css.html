<style>
/* ============================================================
   LMS v2 — css.html
   Sistem desain UI Tahap 3, digayakan MENGIKUTI CSS v1
   (palet resmi KESEPAKATAN-SISTEM.md §1: --hijau lembut #7BC96F,
   latar --permukaan #F6FBF5, tombol sentuh 44px, Plus Jakarta Sans).
   Nama kelas v2 dipertahankan — js_* & template tidak berubah.
   Ganti tema cukup ubah blok :root.
   ============================================================ */
:root {
  /* token resmi v1 */
  --hijau:        #7BC96F;
  --hijau-tua:    #4E9A4A;
  --hijau-muda:   #D9F2D4;
  --permukaan:    #F6FBF5;
  --sukses:       #3FA34D;
  --peringatan:   #E0A82E;
  --bahaya:       #D9534F;
  --terkunci:     #B8C4B6;
  --teks:         #233524;
  --teks-lembut:  #5A6B5B;
  --garis:        #DDE7DC;
  --putih:        #FFFFFF;

  --radius:    12px;
  --radius-sm: 8px;
  --bayang:    0 1px 3px rgba(35,53,36,.08);
  --bayang-mn: 0 4px 12px rgba(35,53,36,.12);
  --bayang-bs: 0 8px 28px rgba(35,53,36,.16);
  --sela:      16px;
  --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont,
          'Segoe UI', system-ui, sans-serif;

  /* alias kelas v2 → token v1 */
  --primer:            var(--hijau);
  --primer-tua:        var(--hijau-tua);
  --primer-lembut:     var(--hijau-muda);
  --primer-teks:       var(--hijau-tua);
  --bg:                var(--permukaan);
  --panel:             var(--putih);
  --tepi:              var(--garis);
  --teks-pudar:        var(--terkunci);
  --sukses-lembut:     #DFF3E2;
  --bahaya-lembut:     #FBE3E2;
  --peringatan-lembut: #FBF0D8;
  --sidebar:           var(--putih);
  --sidebar-teks:      var(--teks-lembut);
  --radius-kecil:      var(--radius-sm);
  --bayangan:          var(--bayang);
  --bayangan-besar:    var(--bayang-bs);
}

* { box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent; }

/* JARING PENGAMAN v1 (v1.6.6): satu elemen meluber tak boleh
   menggeser seluruh halaman di ponsel. */
html, body {
  height: 100%;
  overflow-x: hidden;
  width: 100%;
}
body {
  font-family: var(--font);
  font-size: 15px; line-height: 1.6;
  color: var(--teks); background: var(--permukaan);
  -webkit-font-smoothing: antialiased;
}
img, video, iframe, svg, canvas { max-width: 100%; }

b, strong { font-weight: 700; }
button { font-family: var(--font); cursor: pointer; }
h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; }
h3 { font-size: 1.08rem; font-weight: 700; }
a { color: var(--hijau-tua); text-decoration: none; }
a:hover { text-decoration: underline; }
code { background: var(--permukaan); border-radius: 4px;
       padding: 1px 5px; font-size: .9em; }

.kecil   { font-size: .85rem; color: var(--teks-lembut); }
.tengah  { text-align: center; }
.mt-8    { margin-top: 8px; }
.mt-16   { margin-top: 16px; }

/* ---------- layar login (gaya v1) ---------- */
.layar-login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: linear-gradient(160deg, var(--hijau-muda) 0%, var(--permukaan) 55%);
}
.kotak-login {
  width: 100%; max-width: 400px; background: var(--putih);
  border-radius: 18px; padding: 32px 28px; box-shadow: var(--bayang-bs);
}
.login-merek { text-align: center; margin-bottom: 26px; }
.login-merek .ikon { font-size: 2.6rem; line-height: 1; }
.login-merek h1 { color: var(--hijau-tua); margin-top: 6px; }
.login-merek p { color: var(--teks-lembut); font-size: .88rem; margin: 0; }

/* ---------- formulir (gaya v1) ---------- */
.grup { margin-bottom: 13px; }
.grup label { display: block; font-size: .88rem; font-weight: 600;
              margin-bottom: 5px; }
.grup label .wajib { color: var(--bahaya); }
.isian {
  width: 100%; min-height: 44px; padding: 10px 14px;
  border: 1px solid var(--garis); border-radius: var(--radius-sm);
  background: var(--putih); color: var(--teks); outline: none;
  font-size: .95rem;
  transition: border-color .15s, box-shadow .15s;
}
.isian:focus { border-color: var(--hijau);
               box-shadow: 0 0 0 3px rgba(123,201,111,.22); }
.isian::placeholder { color: #9AAB9B; }
.bantuan { display: block; font-size: .8rem; color: var(--teks-lembut);
           margin-top: 4px; }
.baris-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
textarea.isian { min-height: 90px; resize: vertical; line-height: 1.5; }

.pesan-salah {
  display: none; background: var(--bahaya-lembut); color: var(--bahaya);
  border-radius: var(--radius-sm);
  padding: 8px 10px; font-size: .82rem; margin-bottom: 10px;
}
.pesan-salah.tampil { display: block; }

/* ---------- tombol (gaya v1: sentuh 44px) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  min-height: 44px; padding: 10px 18px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  background: var(--hijau); color: #fff;
  font-size: .95rem; font-weight: 600;
  transition: background .15s, transform .05s, opacity .15s;
  white-space: nowrap;
}
.btn:hover:not(:disabled)  { background: var(--hijau-tua); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-penuh { width: 100%; }
.btn-sekunder {
  background: transparent; color: var(--hijau-tua);
  border-color: var(--garis);
}
.btn-sekunder:hover:not(:disabled) { background: var(--hijau-muda); }
.btn-bahaya { background: var(--bahaya); }
.btn-bahaya:hover:not(:disabled) { background: #C0403C; }
.btn-bahaya-hantu {
  background: transparent; color: var(--bahaya);
  border-color: var(--garis);
}
.btn-bahaya-hantu:hover:not(:disabled) {
  background: var(--bahaya-lembut); border-color: var(--bahaya);
}
.btn-kecil { min-height: 36px; padding: 6px 12px; font-size: .87rem; }
.btn-teks {
  background: transparent; border: none; color: var(--teks-lembut);
  min-height: 36px; padding: 6px 10px; border-radius: var(--radius-sm);
  font-weight: 600; font-size: .87rem;
  display: inline-flex; align-items: center; gap: 5px;
}
.btn-teks:hover { background: var(--hijau-muda); color: var(--teks); }
.btn-teks.merah:hover { background: var(--bahaya-lembut); color: var(--bahaya); }
a.btn, a.btn:hover { text-decoration: none; }

/* ---------- cangkang aplikasi ---------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: 242px; z-index: 40;
  background: var(--sidebar); color: var(--sidebar-teks);
  border-right: 1px solid var(--garis);
  display: flex; flex-direction: column; padding: 18px 14px;
  transition: transform .22s ease;
}
.merek { display: flex; align-items: center; gap: 10px;
         padding: 4px 8px 14px; border-bottom: 1px solid var(--garis);
         margin-bottom: 12px; }
.merek-logo {
  width: 38px; height: 38px; border-radius: 11px; background: var(--hijau-muda);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; flex: none;
}
.merek-nama { font-weight: 800; color: var(--hijau-tua); font-size: 1.05rem;
              line-height: 1.25; }
.merek-nama small { display: block; font-weight: 500; font-size: .7rem;
                    color: var(--teks-lembut); }
.menu { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.menu-judul { font-size: .66rem; font-weight: 700; letter-spacing: .12em;
              text-transform: uppercase; color: var(--terkunci);
              padding: 8px 12px 4px; }
.menu a {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: var(--radius-sm); color: var(--teks-lembut); text-decoration: none;
  font-weight: 600; font-size: .9rem;
}
.menu a .ikon { width: 20px; text-align: center; flex: none; }
.menu a:hover { background: var(--permukaan); color: var(--teks);
                text-decoration: none; }
.menu a.aktif { background: var(--hijau-muda); color: var(--hijau-tua); }

/* menu akun (popover di atas blok profil) */
.profil { border-top: 1px solid var(--garis); padding-top: 12px;
          display: flex; align-items: center; gap: 10px;
          cursor: pointer; border-radius: var(--radius-sm); }
.profil:hover { background: var(--permukaan); }
.profil-avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--hijau-muda);
  color: var(--hijau-tua); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .78rem; flex: none;
}
.profil-nama { flex: 1; min-width: 0; }
.profil-nama b { display: block; color: var(--teks); font-size: .82rem;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profil-nama small { font-size: .72rem; }
.profil .btn-teks { color: var(--teks-lembut); }
.profil .btn-teks:hover { background: var(--hijau-muda); color: var(--teks); }
.profil-menu { display: none; position: absolute; left: 14px; right: 14px;
               bottom: 74px; background: var(--putih); border-radius: var(--radius);
               box-shadow: var(--bayang-mn); border: 1px solid var(--garis);
               padding: 6px; z-index: 45; }
.profil-menu.tampil { display: block; }
.profil-menu button { display: flex; align-items: center; gap: 9px; width: 100%;
                      border: none; background: none; text-align: left;
                      padding: 10px 12px; border-radius: var(--radius-sm);
                      font-weight: 600; font-size: .88rem; color: var(--teks); }
.profil-menu button:hover { background: var(--permukaan); }

.konten { margin-left: 242px; min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  display: none; position: sticky; top: 0; z-index: 30;
  background: var(--putih); border-bottom: 1px solid var(--garis);
  box-shadow: var(--bayang);
  padding: 10px 14px; align-items: center; gap: 10px;
}
.topbar .judul { font-weight: 700; flex: 1; font-size: .98rem; }
.topbar .btn-teks { font-size: 1rem; }
.overlay-samping {
  position: fixed; inset: 0; background: rgba(35,53,36,.42); z-index: 35;
  display: none;
}
.overlay-samping.tampil { display: block; }

.isi { flex: 1; padding: 26px 30px 60px; max-width: 1080px; width: 100%;
       margin: 0 auto; }
.kaki { padding: 14px; color: var(--teks-lembut); font-size: .75rem;
        text-align: center; }

/* ---------- kepala layar ---------- */
.kepala { display: flex; align-items: flex-start; gap: 14px;
          margin-bottom: 20px; flex-wrap: wrap; }
.kepala h1 { letter-spacing: -.02em; }
.kepala p  { color: var(--teks-lembut); font-size: .86rem; margin-top: 2px; }
.kepala-aksi { margin-left: auto; display: flex; gap: 9px; flex-wrap: wrap; }

/* ---------- kartu & kisi (gaya v1 .kartu) ---------- */
.kartu { background: var(--putih); border: 1px solid var(--garis);
         border-radius: var(--radius); box-shadow: var(--bayang); }
.kartu-isi { padding: 20px; }
.kisi-stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
             gap: 12px; margin-bottom: 20px; }
.stat { background: var(--putih); border: 1px solid var(--garis);
        border-radius: var(--radius); box-shadow: var(--bayang);
        padding: 15px 17px; display: flex; gap: 13px; align-items: center; }
.stat-ikon { width: 44px; height: 44px; border-radius: var(--radius-sm); flex: none;
             background: var(--hijau-muda);
             display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
.stat b { font-size: 1.35rem; font-weight: 800; display: block; line-height: 1.15; }
.stat small { color: var(--teks-lembut); font-size: .76rem; font-weight: 600; }

.kisi-kartu { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
              gap: 12px; }
.kartu-barang { background: var(--putih); border: 1px solid var(--garis);
                border-radius: var(--radius); box-shadow: var(--bayang);
                padding: 18px; display: flex; flex-direction: column; gap: 9px;
                transition: box-shadow .15s, border-color .15s; }
.kartu-barang:hover { border-color: var(--hijau); box-shadow: var(--bayang-mn); }
.kartu-judul { font-weight: 700; font-size: 1.02rem;
               display: flex; justify-content: space-between; gap: 8px;
               align-items: center; }
.kartu-sub { color: var(--teks-lembut); font-size: .84rem; }
.kartu-barang .kaki { margin-top: auto; padding: 0; text-align: left;
                      font-size: inherit; color: inherit; }

/* ---------- pintasan & seksi ---------- */
.pintasan { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
            gap: 12px; }
.pintasan a { background: var(--putih); border: 1px solid var(--garis);
              border-radius: var(--radius); box-shadow: var(--bayang);
              padding: 15px; text-decoration: none; color: var(--teks);
              display: flex; gap: 12px; align-items: center;
              transition: border-color .15s; }
.pintasan a:hover { border-color: var(--hijau); text-decoration: none; }
.pintasan-ikon { width: 40px; height: 40px; border-radius: var(--radius-sm); flex: none;
                 background: var(--hijau-muda);
                 display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
.pintasan b { display: block; font-size: .88rem; }
.pintasan small { color: var(--teks-lembut); font-size: .74rem; }
.judul-seksi { font-size: .78rem; font-weight: 700; letter-spacing: .06em;
               text-transform: uppercase; color: var(--teks-lembut);
               margin: 22px 0 10px; }
.judul-seksi.aksi { display: flex; align-items: center; justify-content: space-between;
                    gap: 10px; }
.judul-seksi.aksi .btn-teks { font-size: .78rem; text-transform: none;
                              letter-spacing: 0; }
.barang-course { display: flex; align-items: center; gap: 12px;
                 padding: 13px 16px; border-bottom: 1px solid var(--garis);
                 text-decoration: none; color: var(--teks);
                 transition: background .12s; }
.barang-course:last-child { border-bottom: none; }
.barang-course:hover { background: var(--permukaan); text-decoration: none; }
.barang-tengah { flex: 1; min-width: 0; }
.barang-tengah b { display: block; font-size: .9rem;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barang-tengah small { color: var(--teks-lembut); font-size: .76rem; }

/* ---------- tabel (gaya v1 .tabel) ---------- */
.tabel-alat { display: flex; gap: 10px; align-items: center;
              padding: 13px 16px; border-bottom: 1px solid var(--garis);
              flex-wrap: wrap; }
.cari { display: flex; align-items: center; gap: 8px; background: var(--putih);
        border: 1px solid var(--garis); border-radius: var(--radius-sm);
        padding: 8px 12px; flex: 1; min-width: 170px; max-width: 330px; }
.cari input { border: none; background: none; outline: none; flex: 1;
              min-width: 0; font-size: .95rem; color: var(--teks); }
.tabel-gulir { overflow-x: auto; max-width: 100%;
               -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; padding: 10px 12px; font-weight: 700;
     color: var(--teks-lembut); font-size: .82rem;
     border-bottom: 1px solid var(--garis); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--garis);
     vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--permukaan); }
.sel-orang { display: flex; align-items: center; gap: 11px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; flex: none;
          background: var(--hijau-muda); color: var(--hijau-tua);
          display: flex; align-items: center; justify-content: center;
          font-weight: 700; font-size: .74rem; }
.sel-orang small { display: block; color: var(--teks-lembut); }
.td-aksi { white-space: nowrap; text-align: right; }
.kosong { text-align: center; padding: 46px 20px; color: var(--teks-lembut); }
.kosong b { display: block; color: var(--teks); margin-bottom: 3px; }

/* ---------- lencana (gaya v1 .lencana) ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px;
         font-size: .78rem; font-weight: 700; padding: 3px 10px;
         white-space: nowrap; background: var(--hijau-muda); color: var(--hijau-tua); }
.badge-aktif     { background: var(--sukses-lembut); color: var(--sukses); }
.badge-nonaktif  { background: var(--bahaya-lembut); color: var(--bahaya); }
.badge-info      { background: var(--hijau-muda); color: var(--hijau-tua); }
.badge-tunggu    { background: var(--peringatan-lembut); color: #9A7414; }

/* ---------- dialog (gaya v1 .dialog, aksi menempel) ---------- */
.tirai { position: fixed; inset: 0; background: rgba(35,53,36,.42);
         display: flex; align-items: center; justify-content: center;
         padding: 20px; z-index: 50; overflow-y: auto; }
.kotak-dialog { background: var(--putih); border-radius: var(--radius);
                box-shadow: var(--bayang-bs); width: 100%; max-width: 420px;
                padding: 24px;
                max-height: calc(100vh - 40px); overflow-y: auto;
                -webkit-overflow-scrolling: touch; }
.kotak-dialog h3 { font-size: 1.08rem; margin-bottom: 8px; }
.kotak-dialog > p { color: var(--teks-lembut); font-size: .86rem; margin-bottom: 14px; }
.kotak-dialog .aksi { display: flex; gap: 10px; justify-content: flex-end;
                      flex-wrap: wrap;
                      position: sticky; bottom: -24px;
                      margin: 20px -24px 0; padding: 12px 24px 24px;
                      background: var(--putih);
                      border-top: 1px solid var(--garis); }
.sukses-sandi { background: var(--hijau-muda); border-radius: var(--radius-sm);
                padding: 14px; text-align: center;
                margin: 10px 0; user-select: all; }
.sukses-sandi code { font-size: 1.2rem; font-weight: 700; letter-spacing: .12em;
                     color: var(--hijau-tua); display: block; margin-bottom: 7px;
                     background: none; }
.sukses-sandi small { color: var(--teks-lembut); }
.baris-salin { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ---------- lonceng notifikasi ---------- */
.lonceng-wadah { position: relative; }
.lonceng-panel {
  position: absolute; right: 0; top: calc(100% + 8px); width: min(330px, 88vw);
  background: var(--putih); border: 1px solid var(--garis);
  border-radius: var(--radius);
  box-shadow: var(--bayang-mn); z-index: 60; display: none;
  max-height: 72vh; overflow: auto; -webkit-overflow-scrolling: touch;
}
.lonceng-panel.tampil { display: block; }
.lonceng-kepala { display: flex; align-items: center; justify-content: space-between;
                  padding: 12px 15px; border-bottom: 1px solid var(--garis);
                  font-weight: 700; font-size: .88rem; }
.notif-item { display: flex; gap: 10px; padding: 11px 15px;
              border-bottom: 1px solid var(--garis); font-size: .84rem; }
.notif-item:last-child { border-bottom: none; }
.notif-item .titik { width: 8px; height: 8px; border-radius: 50%;
                     background: var(--garis); margin-top: 6px; flex: none; }
.notif-item.belum .titik { background: var(--peringatan); }

/* ---------- api key ---------- */
.slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
             gap: 10px; margin-bottom: 18px; }
.slot { border: 1.5px dashed var(--garis); border-radius: var(--radius-sm);
        padding: 12px; text-align: center; color: var(--terkunci);
        font-size: .78rem; font-weight: 600; }
.slot.penuh { border-style: solid; background: var(--putih); color: var(--teks);
              box-shadow: var(--bayang); }
.slot .ikon-atas { font-size: 1.1rem; display: block; margin-bottom: 3px; }
.slot small { display: block; color: var(--teks-lembut); font-weight: 500;
              margin-top: 2px; }

/* ---------- kosong besar ---------- */
.kosong-besar { padding: 46px 24px; text-align: center;
                color: var(--teks-lembut); }
.kosong-besar .ikon { font-size: 2.6rem; opacity: .5; display: block;
                      margin-bottom: 8px; }
.kosong-besar b { display: block; color: var(--teks); margin-bottom: 4px; }
.kosong-besar h3 { margin-bottom: 6px; }

/* ---------- toast (gaya v1) ---------- */
#toast-wadah {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 90; display: flex; flex-direction: column; gap: 8px;
  width: calc(100% - 32px); max-width: 420px;
}
.toast {
  padding: 12px 16px; border-radius: var(--radius-sm);
  background: var(--teks); color: #fff;
  font-size: .9rem; box-shadow: var(--bayang-bs);
  animation: naik .22s ease;
}
.toast.sukses { background: var(--sukses); }
.toast.bahaya { background: var(--bahaya); }
@keyframes naik { from { opacity: 0; transform: translateY(12px); } }

/* ---------- pemuat ---------- */
.pemuat { text-align: center; color: var(--teks-lembut); padding: 40px 0;
          font-size: .9rem; }
.pemuat .ikon { display: block; font-size: 1.6rem; margin-bottom: 6px; }

/* ---------- responsif ---------- */
/* ≤1024 — layar sedang: isi lebih rapat */
@media (max-width: 1024px) {
  .isi { padding: 22px 20px 60px; }
}

/* ≤900 — tablet/menengah: sidebar jadi off-canvas, topbar muncul */
@media (max-width: 900px) {
