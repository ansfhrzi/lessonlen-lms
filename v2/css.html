<style>
/* ============================================================
   LMS v2 — gaya global
   Port dari sistem desain LessonLen v1 (css.html):
   palet, tipografi, tombol, formulir, topbar, sidebar menu,
   toast, tirai muat, dialog global, panel notifikasi.
   ============================================================ */

:root {
  --hijau:        #7BC96F;
  --hijau-tua:    #4E9A4A;
  --hijau-muda:   #D9F2D4;
  --permukaan:    #F6FBF5;
  --sukses:       #3FA34D;
  --peringatan:   #E0A82E;
  --bahaya:       #D9534F;
  --terkunci:     #B8C4B6;
  --teks:         #233524;
  --teks-lembut:  #5A6B5B;
  --garis:        #DDE7DC;
  --putih:        #FFFFFF;

  --radius:    12px;
  --radius-sm: 8px;
  --bayang:    0 1px 3px rgba(35,53,36,.08);
  --bayang-mn: 0 4px 12px rgba(35,53,36,.12);
  --bayang-bs: 0 8px 28px rgba(35,53,36,.16);
  --sela:      16px;
  --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont,
          'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font);
  color: var(--teks);
  background: var(--permukaan);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;

  /* Jaring pengaman v1: satu elemen yang meluber tidak boleh
     membuat seluruh halaman bisa digeser ke samping di ponsel. */
  overflow-x: hidden;
  width: 100%;
}

img, video, iframe, svg, canvas { max-width: 100%; }

/* ---------------------------------------------- tipografi */
h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
a  { color: var(--hijau-tua); text-decoration: none; }
a:hover { text-decoration: underline; }
.lembut { color: var(--teks-lembut); }
.kecil  { font-size: .85rem; }
.tebal  { font-weight: 700; }
.tengah { text-align: center; }
.wajib  { color: #dc2626; font-weight: 700; }

/* ---------------------------------------------- tata letak */
.wadah { max-width: 1080px; margin: 0 auto; padding: 0 var(--sela); }
.baris { display: flex; flex-wrap: wrap; gap: var(--sela); align-items: center; }
.baris-antara { display: flex; flex-wrap: wrap; gap: var(--sela);
                align-items: center; justify-content: space-between; }
.kolom { display: flex; flex-direction: column; gap: var(--sela); }
.tumbuh { flex: 1; min-width: 0; }
.sela-kecil { gap: 8px; }

/* ---------------------------------------------- kartu */
.kartu {
  background: var(--putih);
  border: 1px solid var(--garis);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--bayang);
}
.kartu-rapat { padding: 14px 16px; }
.judul-kartu {
  font-size: .95rem; font-weight: 700;
  margin-bottom: 10px; color: var(--teks);
}

/* ---------------------------------------------- tombol */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  min-height: 44px; padding: 10px 18px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  background: var(--hijau); color: #fff;
  font-family: var(--font); font-size: .95rem; font-weight: 600;
  cursor: pointer; transition: background .15s, transform .05s, opacity .15s;
  white-space: nowrap;
}
.btn:hover:not(:disabled)  { background: var(--hijau-tua); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.btn-hantu {
  background: transparent; color: var(--hijau-tua);
  border-color: var(--garis);
}
.btn-hantu:hover:not(:disabled) { background: var(--hijau-muda); }

.btn-teks {
  background: transparent; color: var(--teks-lembut);
  border: none; min-height: 36px; padding: 6px 10px;
}
.btn-teks:hover:not(:disabled) { background: var(--hijau-muda); color: var(--teks); }

.btn-bahaya { background: var(--bahaya); }
.btn-bahaya:hover:not(:disabled) { background: #C0403C; }

.btn-bahaya-hantu {
  background: transparent; color: var(--bahaya);
  border-color: var(--garis);
}
.btn-bahaya-hantu:hover:not(:disabled) {
  background: #FBE3E2; border-color: var(--bahaya); color: var(--bahaya);
}

.btn-penuh { width: 100%; }
.btn-kecil { min-height: 36px; padding: 6px 12px; font-size: .87rem; }
.btn-mini  { min-height: 36px; min-width: 36px;
             padding: 4px 8px; font-size: .82rem; }

a.btn, a.btn:hover, a.btn:visited { text-decoration: none; }
a.btn-hantu:visited { color: var(--hijau-tua); }

.tombol-profil { font-weight: 600; }
.tombol-profil:hover { color: var(--hijau-tua); }

/* ---------------------------------------------- formulir */
.grup { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.grup label { font-size: .88rem; font-weight: 600; color: var(--teks); }

.isian, .input {
  width: 100%; min-height: 44px; padding: 10px 14px;
  border: 1px solid var(--garis); border-radius: var(--radius-sm);
  background: var(--putih); color: var(--teks);
  font-family: var(--font); font-size: .95rem;
  transition: border-color .15s, box-shadow .15s;
}
@media (max-width: 640px) {
  .isian, textarea.isian, select.isian,
  .input, textarea.input, select.input { font-size: 16px; }
}
.isian:focus, .input:focus {
  outline: none; border-color: var(--hijau);
  box-shadow: 0 0 0 3px rgba(123,201,111,.22);
}
.isian::placeholder, .input::placeholder { color: #9AAB9B; }
.isian.salah, .input.salah { border-color: var(--bahaya); }
textarea.isian, textarea.input {
  min-height: 90px; resize: vertical; line-height: 1.5;
}

.bantuan { font-size: .8rem; color: var(--teks-lembut); }
.pesan-salah { font-size: .82rem; color: var(--bahaya); min-height: 1em; }

/* ---------------------------------------------- lencana & pil */
.lencana {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 999px;
  font-size: .78rem; font-weight: 700;
  background: var(--hijau-muda); color: var(--hijau-tua);
}
.lencana-sukses     { background: #DFF3E2; color: var(--sukses); }
.lencana-peringatan { background: #FBF0D8; color: #9A7414; }
.lencana-bahaya     { background: #FBE3E2; color: var(--bahaya); }
.lencana-terkunci   { background: #ECF0EB; color: #74836F; }

.pil {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  background: var(--permukaan); border: 1px solid var(--garis);
  font-size: .78rem; color: var(--teks-lembut); margin: 2px 3px 2px 0;
}
.pil-kelas {
  background: var(--hijau-muda); border-color: var(--hijau);
  color: var(--hijau-tua); font-weight: 600;
}
.pil-tautan { cursor: pointer; font-family: var(--font); }
.pil-tautan:hover { background: var(--hijau-muda); border-color: var(--hijau); }
.baris-pil { display: flex; flex-wrap: wrap; gap: 2px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ---------------------------------------------- header aplikasi */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--putih); border-bottom: 1px solid var(--garis);
  box-shadow: var(--bayang);
}
.topbar-isi {
  max-width: 1080px; margin: 0 auto;
  padding: 10px var(--sela);
  display: flex; align-items: center; gap: 12px;
}
.merek { display: flex; align-items: center; gap: 9px; font-weight: 800;
         color: var(--hijau-tua); font-size: 1.05rem; }
.merek-ikon { font-size: 1.3rem; }

.lonceng { position: relative; }
.lonceng-titik {
  position: absolute; top: 2px; right: 2px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 999px; background: var(--bahaya); color: #fff;
  font-size: .68rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* ---------------------------------------------- layar login */
.layar-login {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: linear-gradient(160deg, var(--hijau-muda) 0%, var(--permukaan) 55%);
}
.kotak-login {
  width: 100%; max-width: 400px;
  background: var(--putih);
  border-radius: 18px; padding: 32px 28px;
  box-shadow: var(--bayang-bs);
}
.login-merek { text-align: center; margin-bottom: 26px; }
.login-merek .ikon { font-size: 2.6rem; line-height: 1; }
.login-merek h1 { color: var(--hijau-tua); margin-top: 6px; }
.login-merek p  { color: var(--teks-lembut); font-size: .88rem; }

/* ---------------------------------------------- toast */
#toast-wadah {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  z-index: 90; display: flex; flex-direction: column; gap: 8px;
  width: calc(100% - 32px); max-width: 420px;
}
.toast {
  padding: 12px 16px; border-radius: var(--radius-sm);
  background: var(--teks); color: #fff;
  font-size: .9rem; box-shadow: var(--bayang-bs);
  animation: naik .22s ease;
}
.toast-sukses { background: var(--sukses); }
.toast-bahaya { background: var(--bahaya); }
.toast-peringatan { background: var(--peringatan); color: #2B2100; }
@keyframes naik { from { opacity: 0; transform: translateY(12px); } }

/* ---------------------------------------------- tirai muat */
#tirai-muat {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(246,251,245,.72);
  display: none; align-items: center; justify-content: center;
}
#tirai-muat.tampil { display: flex; }
.kotak-muat {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 24px 28px; max-width: 300px; text-align: center;
}
.pesan-muat {
  font-size: .92rem; font-weight: 700; color: var(--hijau-tua);
  line-height: 1.5;
}
.pesan-muat:empty { display: none; }
.putar {
  width: 34px; height: 34px;
  border: 3px solid var(--hijau-muda); border-top-color: var(--hijau);
  border-radius: 50%; animation: berputar .8s linear infinite;
}
@keyframes berputar { to { transform: rotate(360deg); } }

.rangka {
  background: linear-gradient(90deg, #EDF3EC 25%, #F7FAF6 50%, #EDF3EC 75%);
  background-size: 200% 100%;
  animation: kilau 1.3s infinite; border-radius: var(--radius-sm);
}
@keyframes kilau { to { background-position: -200% 0; } }

/* ---------------------------------------------- keadaan kosong */
.kosong { text-align: center; padding: 46px 20px; color: var(--teks-lembut); }
.kosong .ikon { font-size: 2.6rem; opacity: .5; }
.kosong h3 { margin: 10px 0 4px; color: var(--teks); }

/* ---------------------------------------------- dialog */
.tirai-dialog {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(35,53,36,.42);
  display: none; align-items: center; justify-content: center; padding: 20px;
  overflow-y: auto;
}
.tirai-dialog.tampil { display: flex; }
.dialog {
  background: var(--putih); border-radius: var(--radius);
  padding: 24px; width: 100%; max-width: 420px;
  box-shadow: var(--bayang-bs);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.dialog h3 { margin-bottom: 8px; }
.dialog label {
  display: block;
  margin-top: 12px;
  font-size: .88rem;
  font-weight: 600;
}
.dialog label .lembut { font-weight: 400; }

.dialog-aksi {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: flex-end; margin-top: 20px;
  position: sticky; bottom: -24px;
  background: var(--putih);
  padding: 12px 0 0;
  margin-bottom: -24px;
  padding-bottom: 24px;
}
.dialog.dialog-lebar { max-width: 620px; }
.dialog.dialog-penuh { max-width: min(900px, 100%); }

@media (max-width: 640px) {
  .tirai-dialog { padding: 10px; align-items: flex-start; }
  .dialog { padding: 18px; max-height: calc(100vh - 20px); }
  .dialog-aksi {
    bottom: -18px; margin-bottom: -18px;
    padding-bottom: 18px;
  }
  .dialog-aksi .btn { flex: 1 1 auto; }
}

/* ---------------------------------------------- utilitas */
.sembunyi { display: none !important; }
.mt-4  { margin-top: 4px; }
.mt-8  { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-4  { margin-bottom: 4px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.p-16  { padding: 16px; }
.mr-8  { margin-right: 8px; }
.ml-8  { margin-left: 8px; }

.kotak-kode {
  font-family: 'SF Mono', Consolas, monospace;
  background: var(--hijau-muda); color: var(--hijau-tua);
  padding: 14px; border-radius: var(--radius-sm);
  font-size: 1.2rem; font-weight: 700; letter-spacing: .12em;
  text-align: center; user-select: all;
}

/* ---------------------------------------------- kepala halaman */
.kepala-halaman { margin-bottom: 18px; }
.kepala-halaman h1 { margin-bottom: 2px; }
.tautan-balik {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .87rem; color: var(--teks-lembut);
  background: none; border: none; cursor: pointer;
  font-family: var(--font); padding: 4px 0; margin-bottom: 8px;
}
.tautan-balik:hover { color: var(--hijau-tua); }

/* ---------------------------------------------- kisi statistik */
.kisi-statistik {
  display: grid; gap: 12px; margin-bottom: 20px;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
}
.kartu-statistik { display: flex; flex-direction: column; gap: 2px; }
.kartu-statistik .ikon  { font-size: 1.5rem; }
.kartu-statistik .angka { font-size: 1.75rem; font-weight: 800; line-height: 1.15; }

/* ---------------------------------------------- bilah progres */
.bilah {
  height: 8px; border-radius: 999px;
  background: var(--hijau-muda); overflow: hidden;
}
.bilah-isi {
  height: 100%; border-radius: 999px;
  background: var(--hijau); transition: width .4s ease;
}
.bilah-isi.penuh { background: var(--sukses); }
.bilah-tipis { height: 6px; }

/* ---------------------------------------------- kartu kelas */
.kartu-kelas {
  display: block; width: 100%; text-align: left;
  background: var(--putih); border: 1px solid var(--garis);
  border-radius: var(--radius); padding: 18px;
  box-shadow: var(--bayang); cursor: pointer;
  font-family: var(--font); color: var(--teks);
  transition: box-shadow .15s, transform .08s, border-color .15s;
}
.kartu-kelas:hover {
  box-shadow: var(--bayang-mn); border-color: var(--hijau);
}
.kartu-kelas:active { transform: translateY(1px); }
.kartu-kelas .judul { font-weight: 700; font-size: 1.05rem; }
.kartu-kelas .mapel {
  font-size: .84rem; color: var(--teks-lembut);
  display: -webkit-box; -webkit-line-clamp: 1;
  -webkit-box-orient: vertical; overflow: hidden;
}

/* ---------------------------------------------- panel tindakan */
.panel-tindakan {
  border-left: 3px solid var(--peringatan);
  background: #FFFBF0;
}
.btn-tindakan {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left; padding: 10px 12px;
  border: 1px solid var(--garis); border-radius: var(--radius-sm);
  background: var(--putih); font-family: var(--font);
  color: var(--teks); cursor: pointer; transition: border-color .15s;
}
.btn-tindakan:hover { border-color: var(--peringatan); }
.btn-tindakan .jml {
  margin-left: auto; font-weight: 800; color: var(--peringatan);
}

/* ---------------------------------------------- daftar notifikasi */
.notif-baris {
  display: flex; gap: 12px; padding: 12px;
  border-radius: var(--radius-sm); cursor: pointer;
  transition: background .12s;
}
.notif-baris:hover { background: var(--permukaan); }
.notif-baris.belum { background: #FFFDF6; }
.notif-baris .ikon { font-size: 1.15rem; flex: 0 0 auto; }
.notif-titik {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--peringatan); flex: 0 0 auto; margin-top: 7px;
}

/* ---------------------------------------------- konten materi */
.isi-materi { line-height: 1.75; font-size: 1rem; }
.isi-materi h3 { margin: 22px 0 8px; color: var(--hijau-tua); }
.isi-materi h4 { margin: 18px 0 6px; }
.isi-materi p  { margin-bottom: 12px; }
.isi-materi ul, .isi-materi ol { margin: 0 0 12px 22px; }
.isi-materi li { margin-bottom: 5px; }
.isi-materi img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }
.isi-materi table {
  width: 100%; border-collapse: collapse; margin: 14px 0; font-size: .92rem;
}
.isi-materi th, .isi-materi td {
  border: 1px solid var(--garis); padding: 9px 12px; text-align: left;
}
.isi-materi th { background: var(--hijau-muda); font-weight: 700; }
.isi-materi pre {
  background: #F2F6F1; border: 1px solid var(--garis);
  border-radius: var(--radius-sm); padding: 14px;
  overflow-x: auto; font-size: .87rem; line-height: 1.55;
  font-family: 'SF Mono', Consolas, monospace;
}
.isi-materi code {
  background: var(--hijau-muda); padding: 2px 6px;
  border-radius: 4px; font-size: .89em;
  font-family: 'SF Mono', Consolas, monospace;
}
.isi-materi pre code { background: none; padding: 0; }
.tabel code, .dialog code, .toast code {
  font-family: 'SF Mono', Consolas, monospace;
  background: var(--hijau-muda); padding: 2px 6px;
  border-radius: 4px; font-size: .89em;
}
.isi-materi blockquote {
  border-left: 3px solid var(--hijau);
  padding-left: 14px; margin: 14px 0; color: var(--teks-lembut);
}
.isi-materi iframe {
  width: 100%; aspect-ratio: 16/9; border: 0;
  border-radius: var(--radius-sm);
}

/* ---------------------------------------------- tabel */
.tabel { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tabel th {
  text-align: left; padding: 10px 12px; font-weight: 700;
  color: var(--teks-lembut); font-size: .82rem;
  border-bottom: 1px solid var(--garis); white-space: nowrap;
}
.tabel td { padding: 11px 12px; border-bottom: 1px solid var(--garis); }
.tabel tr:last-child td { border-bottom: none; }
.tabel tbody tr:hover { background: var(--permukaan); }
.tabel-gulir {
  overflow-x: auto;
  max-width: 100%;
  -webkit-overflow-scrolling: touch;
}

/* ---------------------------------------------- baris item */
.baris-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border: 1px solid var(--garis);
  border-radius: var(--radius-sm); background: var(--putih);
  transition: border-color .15s;
}
.baris-item:hover { border-color: var(--hijau); }
.baris-item.draf { border-style: dashed; background: #FCFDFB; }

.ikon-tipe {
  flex: 0 0 34px; height: 34px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.05rem; background: var(--hijau-muda);
}
.ikon-tipe.quiz { background: #E3EDFB; }
.ikon-tipe.tugas { background: #FBF0D8; }
.ikon-tipe.refleksi { background: #F0E8F7; }

/* ---------------------------------------------- item murid */
.item-murid {
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left; padding: 14px 16px;
  border: 1px solid var(--garis); border-radius: var(--radius);
  background: var(--putih); font-family: var(--font); color: var(--teks);
  cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.item-murid:hover:not(.terkunci) {
  border-color: var(--hijau); box-shadow: var(--bayang);
}
.item-murid.terkunci {
  background: #FAFBFA; color: var(--terkunci); cursor: not-allowed;
}

/* ---------------------------------------------- panel gesir */
.tirai-panel {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(35,53,36,.42);
  display: none; justify-content: flex-end;
}
.tirai-panel.tampil { display: flex; }
.panel-gesir {
  width: 100%; max-width: 520px; height: 100%;
  background: var(--putih); overflow-y: auto;
  box-shadow: var(--bayang-bs);
  animation: geser .22s ease;
}
@keyframes geser { from { transform: translateX(30px); opacity: .6; } }
.panel-kepala {
  position: sticky; top: 0; z-index: 2;
  background: var(--putih); border-bottom: 1px solid var(--garis);
  padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.panel-isi { padding: 20px; }

/* ---------------------------------------------- pilih ganda */
.kotak-pilih {
  max-height: 300px; overflow-y: auto;
  border: 1px solid var(--garis); border-radius: var(--radius-sm);
  padding: 6px;
}
.pilih-baris {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
}
.pilih-baris:hover { background: var(--permukaan); }
.pilih-baris input { width: 17px; height: 17px; accent-color: var(--hijau); }
.pilih-baris .kecil { min-width: 0; }
.pilih-baris .baris-pil { margin-top: 2px; }

/* ============================================================
   SIDEBAR MENU (port js_menu v1) — dipakai guru & murid
   ============================================================ */
.tata-nav {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 24px;
