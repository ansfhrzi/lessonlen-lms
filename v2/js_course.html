<script>
/* ============================================================
 *  LMS v2 — js_course.html
 *  Kelola Course:
 *   · kisi KARTU course (buat/edit/hapus) — seperti kartu kelas;
 *   · course dibuka → layar KELOLA TOPIK & ITEM (Tahap 4 poin 1,
 *     §7.8b): SATU susunan bernomor gabungan berisi Topik +
 *     Quiz mandiri + Refleksi mandiri; tombol ＋ = BUKA FORM
 *     (pola "+ Pertemuan" v1); ▲▼ tukar+renumber; 👁/🙈;
 *     🕐 jadwal terbit; ✏️ ubah; 🗑 hapus dgn konfirmasi.
 *  Logika server: Topik.gs (endpoint course*Basis di Code.gs).
 * ============================================================ */

var CourseLayar = (function () {

  /* ---------- konstanta jenis (§7.8/§7.8b) ---------- */

  var IKON_BARIS = { topik: '🗂', quiz_mandiri: '🧮', refleksi_mandiri: '🪞' };
  var NAMA_BARIS = { topik: 'Topik', quiz_mandiri: 'Quiz mandiri',
                     refleksi_mandiri: 'Refleksi mandiri' };

  /* 5 jenis item dalam topik — persis enum §7.8 Items.type:
     materi, tugas_individu, tugas_kelompok, quiz, refleksi.
     (Materi & tugas WAJIB bertopik; quiz/refleksi boleh mandiri
     di course — §7.8b poin 1.) */
  var JENIS_ITEM = [
    { v: 'materi',          ikon: '📖', nama: 'Materi' },
    { v: 'tugas_individu',  ikon: '👤', nama: 'Tugas Individu' },
    { v: 'tugas_kelompok',  ikon: '👥', nama: 'Tugas Kelompok' },
    { v: 'quiz',            ikon: '❓', nama: 'Quiz' },
    { v: 'refleksi',        ikon: '🪞', nama: 'Refleksi' }
  ];
  var IKON_ITEM = {}, NAMA_ITEM = {};
  JENIS_ITEM.forEach(function (j) { IKON_ITEM[j.v] = j.ikon; NAMA_ITEM[j.v] = j.nama; });

  /* ---------- state layar detail ---------- */

  var TA_ID = '';        /* course yang sedang dibuka */
  var DATA = [];         /* salinan baris terakhir (prefill dialog) */
  var TERBUKA = {};      /* topicId → isi topik terbuka? */
  var PERTAMA = true;    /* buka topik pertama saat layar baru dibuka */

  function render() {
    Core.$('layar').innerHTML =
      '<div class="kepala"><div><h1>Kelola Course</h1>' +
        '<p>Course = gabungan satu kelas dan satu mata pelajaran yang Anda ampu.</p></div>' +
        '<div class="kepala-aksi">' +
          '<button class="btn" id="btn-tambah">＋ Buat course</button>' +
        '</div></div>' +
      '<div id="wadah-kisi" class="kisi-kartu">' +
        '<div class="pemuat"><span class="ikon">⏳</span>Memuat…</div>' +
      '</div>' +
      '<p class="bantuan mt-8">💡 Mapel yang diketik sama akan dipakai bersama ' +
      '(tidak dibuat ulang). Menghapus course = menonaktifkan; data nilainya ' +
      'tidak hilang.</p>';

    Core.$('btn-tambah').addEventListener('click', function () { dialogForm(null); });
    muatKisi();
  }

  /* ---------- kisi kartu course ---------- */

  function muatKisi() {
    var wadah = Core.$('wadah-kisi');
    Core.api('courseDaftar', Core.ambilToken()).then(function (daftar) {
      if (!wadah) return;
      if (!daftar || !daftar.length) {
        wadah.innerHTML = '<div class="kosong-besar"><span class="ikon">📚</span>' +
          '<b>Belum ada course</b>Buat course pertama: pilih kelas, lalu ketik ' +
          'mata pelajarannya.</div>';
        return;
      }
      wadah.innerHTML = daftar.map(function (c) {
        var aktif = c.status === 'aktif';
        return '<div class="kartu-barang">' +
          '<div class="kartu-judul"><span>📚 ' + Core.esc(c.subject_name) + '</span>' +
            (aktif
              ? '<span class="badge badge-aktif">● Aktif</span>'
              : '<span class="badge badge-nonaktif">● Nonaktif</span>') + '</div>' +
          '<div class="kartu-sub">' + Core.esc(c.class_name) +
            (c.academic_year ? ' · ' + Core.esc(c.academic_year) : '') +
            ' · 🧑‍🎓 ' + c.jml_murid + ' murid</div>' +
          '<div class="kaki">' +
            (aktif
              ? '<button class="btn-teks kecil" data-buka="' +
                Core.esc(c.teaching_assignment_id) + '">Buka →</button>'
              : '<span class="kecil">nonaktif</span>') +
            '<span style="margin-left:auto"></span>' +
            '<button class="btn-teks kecil" data-edit="' +
              Core.esc(c.teaching_assignment_id) + '">✏️ Edit</button>' +
            '<button class="btn-teks kecil merah" data-hapus="' +
              Core.esc(c.teaching_assignment_id) + '" data-nama="' +
              Core.esc(c.subject_name) + '">🗑 Hapus</button>' +
          '</div></div>';
      }).join('');

      wadah.querySelectorAll('[data-buka]').forEach(function (b) {
        b.addEventListener('click', function () {
          Core.pergiKe('course_detail', { id: b.dataset.buka });
        });
      });
      wadah.querySelectorAll('[data-edit]').forEach(function (b) {
        b.addEventListener('click', function () { dialogForm(b.dataset.edit); });
      });
      wadah.querySelectorAll('[data-hapus]').forEach(function (b) {
        b.addEventListener('click', function () {
          hapus(b.dataset.hapus, b.dataset.nama);
        });
      });
    }).catch(function (err) {
      wadah.innerHTML = '<div class="kosong-besar"><span class="ikon">⚠️</span>' +
        '<b>Gagal memuat</b>' + Core.esc(err.message) + '</div>';
    });
  }

  /* ============================================================
     DETAIL COURSE = KELOLA TOPIK & ITEM (susunan gabungan §7.8b)
     ============================================================ */

  function renderDetail(params) {
    TA_ID = params.id;
    DATA = [];
    PERTAMA = true;

    Core.$('layar').innerHTML =
      '<div class="kepala" id="course-detail">' +
        '<button class="btn-teks" id="btn-kembali-c">←</button>' +
        '<div><h1 id="jd-c">…</h1><p id="jd-c-sub"></p></div>' +
        '<div class="kepala-aksi">' +
          '<button class="btn btn-sekunder" id="btn-edit-c">✏️ Edit course</button>' +
        '</div></div>' +
      '<div class="judul-seksi">Susunan course <small class="kecil">' +
        '(bernomor gabungan — topik &amp; mandiri, §7.8b)</small></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px">' +
        '<button class="btn btn-sekunder btn-kecil" id="btn-buat-topik">＋ Topik</button>' +
        '<button class="btn btn-sekunder btn-kecil" id="btn-buat-quiz">＋ Quiz mandiri</button>' +
        '<button class="btn btn-sekunder btn-kecil" id="btn-buat-ref">＋ Refleksi mandiri</button>' +
      '</div>' +
      '<div id="wadah-susunan" class="kartu daftar-susunan">' +
        '<div class="pemuat"><span class="ikon">⏳</span>Memuat…</div>' +
      '</div>' +
      '<p class="bantuan mt-8">💡 ＋ = buat (membuka form), SELALU masuk ' +
      'paling dasar · ▲▼ menukar tetangga lalu dinomori ulang · 👁/🙈 ' +
      'terlihat/draf (menyembunyikan yang terjadwal membatalkan jadwalnya) · ' +
      '🕐 terlihat murid tepat pada waktunya, tanpa notifikasi · publish ' +
      'eksplisit mengirim notifikasi <i>pertemuan_baru</i> · item di dalam ' +
      'topik memakai urutan dalemnya sendiri.</p>';

    Core.$('btn-kembali-c').addEventListener('click', function () {
      Core.pergiKe('course');
    });
    Core.$('btn-edit-c').addEventListener('click', function () {
      dialogForm(TA_ID);
    });
    Core.$('btn-buat-topik').addEventListener('click', function () {
      dialogBuatBaris('topik');
    });
    Core.$('btn-buat-quiz').addEventListener('click', function () {
      dialogBuatBaris('quiz_mandiri');
    });
    Core.$('btn-buat-ref').addEventListener('click', function () {
      dialogBuatBaris('refleksi_mandiri');
    });

    var wadah = Core.$('wadah-susunan');
    wadah.addEventListener('click', function (e) {
      var tombol = e.target.closest('[data-aksi]');

      /* ＋ Item: tombol di dalam blok isi topik (di luar baris data) */
      if (tombol && tombol.dataset.aksi === 'tambah-item') {
        var blok = tombol.closest('.isi-topik');
        if (blok) dialogBuatItem(blok.dataset.topik);
        return;
      }

      var barisEl = e.target.closest('[data-tipe]');
      if (!barisEl) return;
      var aksi = tombol ? tombol.dataset.aksi : '';
      var tipe = barisEl.dataset.tipe;          /* topik | mandiri | item */
      var id = barisEl.dataset.id;
      var isi = barisEl.closest('.isi-topik');
      var topikId = tipe === 'item' ? (isi ? isi.dataset.topik : '') : id;

      if (!aksi) {
        if (tipe === 'item') {
          /* klik area baris item → editor konten (2a: materi;
             quiz/tugas/refleksi menyusul 2b–2d) */
          var itm = cariData(id) || {};
          if (itm.jenis === 'materi' || itm.jenis === 'quiz') {
            Core.pergiKe('item_editor', { id: id });
          } else {
            Core.toast('Editor ' + (NAMA_ITEM[itm.jenis] || 'item') +
              ' menyusul — Tahap 4 poin 2.', 'peringatan');
          }
          return;
        }
        /* klik area baris topik (bukan tombol) = buka/tutup */
        if (tipe === 'topik') {
          TERBUKA[id] = !TERBUKA[id];
          muatSusunan();
        }
        return;
      }

      var b = cariData(id);
      if (!b) return;
      if (tipe === 'item') {
        /* ✏️ pada item → editor konten (2a: materi; lainnya menyusul) */
        if (aksi === 'ubah') {
          if (b.jenis === 'materi' || b.jenis === 'quiz') {
            Core.pergiKe('item_editor', { id: id });
          } else {
            Core.toast('Editor ' + (NAMA_ITEM[b.jenis] || 'item') +
              ' menyusul — Tahap 4 poin 2.', 'peringatan');
          }
          return;
        }
        aksiItem(aksi, topikId, b);
      } else {
        aksiBaris(aksi, tipe, b);
      }
    });

    muatSusunan();
  }

  function cariData(id) {
    for (var i = 0; i < DATA.length; i++) {
      if (DATA[i].id === id) return DATA[i];
      if (DATA[i].item) {
        for (var j = 0; j < DATA[i].item.length; j++) {
          if (DATA[i].item[j].id === id) return DATA[i].item[j];
        }
      }
    }
    return null;
  }

  function muatSusunan() {
    var wadah = Core.$('wadah-susunan');
    if (!wadah || !TA_ID) return;
    Core.api('courseSusunan', Core.ambilToken(), TA_ID).then(function (d) {
      if (!wadah || !d) return;
      var jd = Core.$('jd-c');
      if (jd) jd.textContent = d.course.subject_name || 'Course';
      var sub = Core.$('jd-c-sub');
      if (sub) sub.textContent =
        (d.course.class_name || '—') +
        (d.course.academic_year ? ' · ' + d.course.academic_year : '') +
        ' · 🧑‍🎓 ' + (d.course.jml_murid || 0) + ' murid';

      DATA = d.baris || [];
      if (PERTAMA) {
        for (var i = 0; i < DATA.length; i++) {
          if (DATA[i].tipe === 'topik') { TERBUKA[DATA[i].id] = true; break; }
        }
        PERTAMA = false;
      }
      if (!DATA.length) {
        wadah.innerHTML = '<div class="kosong-besar"><span class="ikon">🗂</span>' +
          '<b>Course masih kosong</b>Buat Topik, Quiz mandiri, atau ' +
          'Refleksi mandiri lewat tombol di atas.</div>';
        return;
      }
      wadah.innerHTML = DATA.map(barisSusunanHtml).join('');
    }).catch(function (err) {
      wadah.innerHTML = '<div class="kosong-besar"><span class="ikon">⚠️</span>' +
        '<b>Gagal memuat</b>' + Core.esc(err.message) + '</div>';
    });
  }

  function badgeStatus(b) {
    if (b.status === 'scheduled') {
      return '<span class="badge badge-jadwal">🕐 ' + Core.esc(fmtJadwal(b.publish_at)) + '</span>';
    }
    if (b.status === 'draft') return '<span class="badge badge-draf">🙈 draf</span>';
    return '<span class="badge badge-aktif">👁 terlihat</span>';
  }

  function fmtJadwal(v) {
    if (!v) return '';
    var d = new Date(String(v).replace(' ', 'T'));
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) +
      ' ' + ('0' + d.getHours()).slice(-2) + '.' + ('0' + d.getMinutes()).slice(-2);
  }

  function barisSusunanHtml(b) {
    var terbuka = b.tipe === 'topik' && TERBUKA[b.id];
    var meta;
    if (b.tipe === 'topik') {
      meta = b.item.length
        ? b.item.length + ' item · ' + b.item.map(function (it) {
            return IKON_ITEM[it.jenis] || '•';
          }).join(' ')
        : 'belum ada item';
    } else {
      meta = NAMA_BARIS[b.jenis];
    }
    var html =
      '<div class="baris-susunan' + (b.status === 'draft' ? ' draf' : '') +
        (b.tipe === 'topik' ? ' buka-toggle' : '') +
        '" data-tipe="' + b.tipe + '" data-id="' + Core.esc(b.id) + '">' +
        '<span class="nomor-sus">' + b.urutan + '</span>' +
        '<span class="ikon-sus">' +
          (b.tipe === 'topik' ? (terbuka ? '📂' : '🗂') : IKON_BARIS[b.jenis]) + '</span>' +
        '<span class="sus-tengah"><span class="sus-judul">' + Core.esc(b.judul) + '</span>' +
          '<span class="sus-meta">' + meta + '</span></span>' +
        badgeStatus(b) +
        '<button class="btn-teks kecil" data-aksi="atas" title="Naik" ' +
          (b.urutan <= 1 ? 'disabled' : '') + '>▲</button>' +
        '<button class="btn-teks kecil" data-aksi="bawah" title="Turun" ' +
          (b.urutan >= DATA.length ? 'disabled' : '') + '>▼</button>' +
        '<button class="btn-teks kecil" data-aksi="status" title="Terlihat/draf">' +
          (b.status === 'draft' ? '🙈' : '👁') + '</button>' +
        '<button class="btn-teks kecil" data-aksi="jadwal" title="Jadwal terbit">🕐</button>' +
        '<button class="btn-teks kecil" data-aksi="ubah" title="Ubah">✏️</button>' +
        '<button class="btn-teks kecil merah" data-aksi="hapus" title="Hapus">🗑</button>' +
      '</div>';
    if (terbuka) html += isiTopikHtml(b);
    return html;
  }

  function isiTopikHtml(b) {
    var html = '<div class="isi-topik" data-topik="' + Core.esc(b.id) + '">';
    if (!b.item.length) {
      html += '<div class="baris-item-sus kosong-item">Belum ada item — buat lewat ＋ Item.</div>';
    }
    html += b.item.map(function (it) {
      return '<div class="baris-item-sus' + (it.status === 'draft' ? ' draf' : '') +
        '" data-tipe="item" data-id="' + Core.esc(it.id) + '">' +
        '<span class="ikon-sus kecil">' + (IKON_ITEM[it.jenis] || '•') + '</span>' +
        '<span class="sus-tengah"><span class="sus-judul">' + Core.esc(it.judul) + '</span>' +
          '<span class="sus-meta">' + Core.esc(NAMA_ITEM[it.jenis] || it.jenis) +
          (it.status === 'scheduled' ? ' · 🕐 ' + Core.esc(fmtJadwal(it.publish_at)) :
            (it.status === 'draft' ? ' · 🙈 draf' : '')) + '</span></span>' +
        '<button class="btn-teks kecil" data-aksi="atas" title="Naik">▲</button>' +
        '<button class="btn-teks kecil" data-aksi="bawah" title="Turun">▼</button>' +
        '<button class="btn-teks kecil" data-aksi="status" title="Terlihat/draf">' +
          (it.status === 'draft' ? '🙈' : '👁') + '</button>' +
        '<button class="btn-teks kecil" data-aksi="jadwal" title="Jadwal terbit">🕐</button>' +
        '<button class="btn-teks kecil" data-aksi="ubah" title="Ubah">✏️</button>' +
        '<button class="btn-teks kecil merah" data-aksi="hapus" title="Hapus">🗑</button>' +
        '</div>';
    }).join('');
    html += '<button class="btn btn-sekunder btn-kecil" data-aksi="tambah-item" ' +
      'style="margin:2px 0 6px 10px">＋ Item</button>' +
      '</div>';
    return html;
  }

  /* ---------- aksi baris & item ---------- */

  function aksiBaris(aksi, tipe, b) {
    if (aksi === 'atas' || aksi === 'bawah') {
      Core.api('coursePindahBaris', Core.ambilToken(), tipe, b.id, aksi)
        .then(muatSusunan)
        .catch(function (err) { Core.toast(err.message, 'bahaya'); });
      return;
    }
    if (aksi === 'status') {
      /* arah toggle: draf→terlihat; publish/scheduled→draf */
      var baru = b.status === 'draft' ? 'publish' : 'draft';
      Core.api('courseStatusBaris', Core.ambilToken(), tipe, b.id, baru)
        .then(function () {
          Core.toast(baru === 'publish'
            ? '👁 terlihat — notifikasi pertemuan_baru terkirim (publish eksplisit).'
            : (b.status === 'scheduled'
              ? '🙈 draf — jadwal terbit DIBATALKAN.'
              : '🙈 draf — murid tidak melihat baris ini.'), 'sukses');
          muatSusunan();
        })
        .catch(function (err) { Core.toast(err.message, 'bahaya'); });
      return;
    }
    if (aksi === 'jadwal') { dialogJadwal('baris', tipe, b); return; }
    if (aksi === 'ubah')   { dialogUbahBaris(tipe, b); return; }
    if (aksi === 'hapus')  { konfirmasiHapusBaris(tipe, b); return; }
  }

  function aksiItem(aksi, topikId, it) {
    if (aksi === 'tambah-item') { dialogBuatItem(topikId); return; }
    if (aksi === 'atas' || aksi === 'bawah') {
      Core.api('coursePindahItem', Core.ambilToken(), topikId, it.id, aksi)
        .then(muatSusunan)
        .catch(function (err) { Core.toast(err.message, 'bahaya'); });
      return;
    }
    if (aksi === 'status') {
      /* arah toggle: draf→terlihat; publish/scheduled→draf */
      var baru = it.status === 'draft' ? 'publish' : 'draft';
      Core.api('courseStatusItem', Core.ambilToken(), it.id, baru)
        .then(function () {
          Core.toast(baru === 'publish'
            ? '👁 terlihat — notifikasi pertemuan_baru terkirim (publish eksplisit).'
            : (it.status === 'scheduled'
              ? '🙈 draf — jadwal terbit DIBATALKAN.'
              : '🙈 draf — murid tidak melihat item ini.'), 'sukses');
          muatSusunan();
        })
        .catch(function (err) { Core.toast(err.message, 'bahaya'); });
      return;
    }
    if (aksi === 'jadwal') { dialogJadwal('item', '', it); return; }
    if (aksi === 'hapus')  { konfirmasiHapusItem(it); return; }
  }

  /* ---------- form: buat / ubah / jadwal / hapus ---------- */

  var FORM_STATUS =
    '<div class="grup"><label>Status</label>' +
    '<select class="isian" id="in-s-status">' +
      '<option value="draft">🙈 Draf — belum terlihat murid</option>' +
      '<option value="publish">👁 Terlihat — dapat diakses murid</option>' +
    '</select></div>';

  function formUmum(judulDlg, jenisTerkunciHtml, judulNilai, deskNilai, statusNilai, labelYa, bantuan) {
    return Core.dialog({
      judul: judulDlg,
      html: jenisTerkunciHtml +
        '<div class="grup"><label>Judul <span class="wajib">*</span></label>' +
        '<input class="isian" id="in-s-judul" value="' + Core.esc(judulNilai || '') + '"></div>' +
        '<div class="grup"><label>Deskripsi</label>' +
        '<textarea class="isian" id="in-s-desk" rows="2">' + Core.esc(deskNilai || '') +
        '</textarea></div>' +
        FORM_STATUS + (bantuan ? '<span class="bantuan">' + bantuan + '</span>' : ''),
      labelYa: labelYa || 'Simpan',
      saatBuka: function (tirai) {
        if (statusNilai) {
          var sel = tirai.querySelector('#in-s-status');
          if (sel) sel.value = statusNilai === 'publish' ? 'publish' : 'draft';
        }
      }
    });
  }

  /** ＋ Topik / ＋ Quiz mandiri / ＋ Refleksi mandiri = BUAT (form). */
  function dialogBuatBaris(jenisBaris) {
    formUmum('Buat ' + NAMA_BARIS[jenisBaris],
      '<div class="grup"><label>Jenis</label>' +
      '<input class="isian" value="' + IKON_BARIS[jenisBaris] + ' ' +
        NAMA_BARIS[jenisBaris] + '" disabled>' +
      '<span class="bantuan">Jenis tidak dapat diubah setelah dibuat.</span></div>',
      '', '', 'draft', 'Buat',
      'Baris baru SELALU masuk paling dasar (§7.8b). Jadwal terbit bisa ' +
      'diatur lewat 🕐 setelah dibuat.')
      .then(function (ya) {
        if (!ya) return;
        var p = { jenis_baris: jenisBaris, judul: Core.$('in-s-judul').value,
                  deskripsi: Core.$('in-s-desk').value,
                  status: Core.$('in-s-status').value };
        if (!p.judul.trim()) {
          Core.toast('Judul wajib diisi.', 'peringatan');
          dialogBuatBaris(jenisBaris);
          return;
        }
        Core.api('courseBuatBaris', Core.ambilToken(), TA_ID, p)
          .then(function () {
            Core.toast(NAMA_BARIS[jenisBaris] + ' dibuat di paling dasar.', 'sukses');
            muatSusunan();
          })
          .catch(function (err) {
            Core.toast(err.message, 'bahaya');
            dialogBuatBaris(jenisBaris);
          });
      });
  }

  /** ＋ Item dalam topik: form dgn pilihan jenis (5 jenis §7.8). */
  function dialogBuatItem(topicId) {
    Core.dialog({
      judul: 'Buat Item',
      html:
        '<div class="grup"><label>Jenis <span class="wajib">*</span></label>' +
        '<select class="isian" id="in-s-jenis">' +
        JENIS_ITEM.map(function (j) {

  function idYouTube(url) {
    var u = String(url || '').trim();
    if (!u) return '';
    var pola = [
      /[?&]v=([A-Za-z0-9_-]{11})/,
      /youtu\.be\/([A-Za-z0-9_-]{11})/,
      /\/shorts\/([A-Za-z0-9_-]{11})/,
      /\/embed\/([A-Za-z0-9_-]{11})/,
      /\/live\/([A-Za-z0-9_-]{11})/
    ];
    for (var i = 0; i < pola.length; i++) {
      var m = pola[i].exec(u);
      if (m) return m[1];
    }
    if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
    return '';
  }

  function mulaiYouTube(url) {
    var m = /[?&]t=(?:(\d+)h)?(?:(\d+)m)?(\d+)s?/.exec(String(url || ''));
    if (!m) return 0;
    return (Number(m[1]) || 0) * 3600 + (Number(m[2]) || 0) * 60 +
           (Number(m[3]) || 0);
  }

  function embedYouTube(id, mulai) {
    return '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
      (mulai ? '?start=' + mulai : '') +
      '" title="Video pembelajaran" frameborder="0" ' +
      'allowfullscreen loading="lazy"></iframe>';
  }

    { cmd: 'h4',         judul: 'H4', nama: 'Sub-bagian' },
    { cmd: 'p',          judul: '¶',  nama: 'Paragraf biasa' },
    { cmd: 'insertUnorderedList', judul: '•', nama: 'Daftar butir' },
    { cmd: 'insertOrderedList',   judul: '1.', nama: 'Daftar nomor' },
    { cmd: 'blockquote', judul: '❝',  nama: 'Kutipan' },
    { cmd: 'link',       judul: '🔗', nama: 'Tautan' },

    Core.$('ed-alat').addEventListener('click', function (e) {
      var b = e.target.closest('[data-cmd]');
      if (!b) return;
      e.preventDefault();
      var ed = Core.$('ed-konten');
      ed.focus();
      var c = b.dataset.cmd;
      if (c === 'link') {
        var u = window.prompt('Alamat tautan:', 'https://');
        if (u) document.execCommand('createLink', false, u);
      } else if (c === 'gambar') {
        var g = window.prompt('URL gambar:', 'https://');
        if (g) document.execCommand('insertHTML', false,
          '<img src="' + g + '" style="max-width:100%">');
      } else if (c === 'video') {

          } else {

              embedYouTube(id, mulaiYouTube(v)));
          }
        }
      } else if (c === 'h3' || c === 'h4' || c === 'p' || c === 'pre' ||
                 c === 'blockquote') {
        document.execCommand('formatBlock', false, c);
      } else {
        document.execCommand(c, false, null);
      }

    Core.$('btn-simpan-e').addEventListener('click', function () {
      var salah = Core.$('salah-editor');

      }
      Core.kirimForm(Core.$('btn-simpan-e'), true, 'Menyimpan…');
      Core.api('courseUbahItem', Core.ambilToken(), params.id, p)
        .then(function () {

          Core.toast('Materi tersimpan.', 'sukses');
          Core.pergiKe('course_detail', { id: TA_ID_E });
        })
        .catch(function (err) {
          Core.kirimForm(Core.$('btn-simpan-e'), false);
          Core.tampilkanPesanError(salah, err.message);
        });
    });

    TA_ID_E = d.ta_id || '';
    EDITOR_JENIS = d.jenis;
    var jd = Core.$('jd-e');
    if (jd) jd.textContent = d.judul || '(tanpa judul)';
    var sub = Core.$('jd-e-sub');
    if (sub) sub.textContent = 'Editor ' + (NAMA_ITEM[d.jenis] || d.jenis);
    Core.$('in-e-judul').value = d.judul || '';
    Core.$('in-e-desk').value = d.deskripsi || '';
    Core.$('in-e-status').value = d.status === 'publish' ? 'publish' : 'draft';
    Core.$('ed-konten').innerHTML = d.konten || '';
  }

  function gambarSoal() {
    var wadah = Core.$('qz-daftar-soal');
    if (!wadah || !QZ.data) return;
    var daftar = QZ.data.soal;
    if (!daftar.length) {
      wadah.innerHTML = '<div class="kosong"><b>Quiz ini belum punya soal</b>' +
        'Tekan “＋ Tambah soal” di kanan atas.</div>';
      return;
    }
    wadah.innerHTML = daftar.map(function (s, i) {
      var opsi = '';
      if (s.type === 'pg') {
        opsi = '<div class="qz-opsi">' + (s.options || []).map(function (o, ix) {
          return '<div' + (QZ.kunciTampil && s.answer_key === 'ABCDE'.charAt(ix)
            ? ' class="qz-opsi-benar"' : '') + '>' +
            '<b>' + 'ABCDE'.charAt(ix) + '.</b> ' + Core.esc(o) + '</div>';
        }).join('') + '</div>';
      } else if (s.type === 'benar_salah') {
        opsi = '<div class="qz-opsi"><div' +
          (QZ.kunciTampil ? ' class="qz-opsi-benar"' : '') + '>Benar / Salah</div></div>';
      } else if (s.type === 'esai') {
        opsi = '<div class="kecil lembut">Murid menulis jawaban bebas — dikoreksi guru.</div>';
      }
      var kunci = '';
      if (QZ.kunciTampil) {
        if (s.type === 'esai') {
          var potongan = [];
          if (s.rubric) potongan.push('<b>Rubrik:</b> ' + Core.esc(s.rubric));
          if (s.pembahasan) potongan.push('<i>Pembahasan: ' + Core.esc(s.pembahasan) + '</i>');
          if (potongan.length) kunci = '<div class="qz-kunci">' + potongan.join(' · ') + '</div>';
        } else {
          kunci = '<div class="qz-kunci"><b>Kunci:</b> ' + Core.esc(s.answer_key) +
            (s.pembahasan ? ' · <i>Pembahasan: ' + Core.esc(s.pembahasan) + '</i>' : '') +
            '</div>';
        }
      }
      return '<div class="kartu-soal-qz" data-soal="' + Core.esc(s.question_id) + '">' +
        '<div class="baris-antara">' +
          '<span class="badge badge-info">Soal ' + s.order_no + '</span>' +
          '<span class="kecil lembut">' + (NAMA_TIPE_SOAL[s.type] || s.type) +
            ' · bobot ' + s.points +
            (s.tingkat ? ' · ' + s.tingkat : '') + '</span>' +
          '<span style="margin-left:auto"></span>' +
          '<button class="btn-teks kecil" data-aksi="atas" title="Naik"' +
            (i === 0 ? ' disabled' : '') + '>▲</button>' +
          '<button class="btn-teks kecil" data-aksi="bawah" title="Turun"' +
            (i === daftar.length - 1 ? ' disabled' : '') + '>▼</button>' +
          '<button class="btn-teks kecil" data-aksi="ubah" title="Ubah">✏️</button>' +
          '<button class="btn-teks kecil merah" data-aksi="hapus" title="Hapus">🗑</button>' +
        '</div>' +
        '<div class="qz-pertanyaan">' + Core.esc(s.question) + '</div>' +
        (s.gambar_url ? '<img class="qz-gambar" src="' + Core.esc(s.gambar_url) +
          '" alt="gambar soal">' : '') +
        opsi + kunci +
      '</div>';
    }).join('');

    wadah.querySelectorAll('[data-aksi]').forEach(function (b) {
      b.addEventListener('click', function () {
        aksiSoalQz(b.dataset.aksi, b.closest('[data-soal]').dataset.soal);
      });
    });
  }

  function aksiSoalQz(aksi, soalId) {
    if (aksi === 'atas' || aksi === 'bawah') {
      Core.api('quizPindahSoal', Core.ambilToken(), QZ.itemId, soalId, aksi)
        .then(muatQz)
        .catch(function (err) { Core.toast(err.message, 'bahaya'); });
      return;
    }
    if (aksi === 'ubah') {
      var s = QZ.data.soal.filter(function (x) {
        return x.question_id === soalId; })[0];
      dialogSoalQz(s);
      return;
    }
    if (aksi === 'hapus') {
      Core.konfirmasi('Hapus soal ini?',
        'Soal dihapus dari quiz. Soal lain dinomori ulang.',
        { labelYa: 'Ya, hapus', bahaya: true })
        .then(function (ya) {
          if (!ya) return;
          Core.api('quizHapusSoal', Core.ambilToken(), QZ.itemId, soalId)
            .then(function () {
              Core.toast('Soal dihapus.', 'sukses');
              muatQz();
            })
            .catch(function (err) { Core.toast(err.message, 'bahaya'); });
        });
    }
  }

  function simpanPengaturanQz() {
    var salah = Core.$('salah-qz');
    Core.sembunyikanPesanError(salah);
    Core.api('quizSimpanPengaturan', Core.ambilToken(), QZ.itemId, {
      deadline: Core.$('in-qz-tenggat').value,
      max_attempts: Number(Core.$('in-qz-kesempatan').value) || 0,
      kkm: Number(Core.$('in-qz-kkm').value) || 0,
      show_score: Core.$('in-qz-nilai').checked,
      acak_soal: Core.$('in-qz-acak-soal').checked,
      acak_opsi: Core.$('in-qz-acak-opsi').checked,
      tampilkan_pembahasan: Core.$('in-qz-pembahasan').checked
    }).then(function () {
      Core.toast('Pengaturan quiz tersimpan.', 'sukses');
      muatQz();
    }).catch(function (err) {
      Core.tampilkanPesanError(salah, err.message);
    });
  }

  /* ---------- dialog tambah/ubah soal ---------- */

  function opsiHtmlSoal(s) {
    var tipe = s ? s.type : 'pg';
    var html =
      '<div class="baris-form">' +
        '<div class="grup"><label>Tipe soal</label>' +
        '<select class="isian" id="f-qz-tipe">' +
        ['pg', 'benar_salah', 'isian', 'esai'].map(function (t) {
          return '<option value="' + t + '"' +
            (tipe === t ? ' selected' : '') + '>' + NAMA_TIPE_SOAL[t] + '</option>';
        }).join('') + '</select></div>' +
        '<div class="grup"><label>Bobot (1–100)</label>' +
        '<input type="number" min="1" max="100" class="isian" id="f-qz-bobot" value="' +
        (s ? s.points : 1) + '"></div>' +
        '<div class="grup"><label>Tingkat kognitif</label>' +
        '<select class="isian" id="f-qz-tingkat"><option value="">—</option>' +
        ['C1','C2','C3','C4','C5','C6'].map(function (t) {
          return '<option value="' + t + '"' +
            (s && s.tingkat === t ? ' selected' : '') + '>' + t + '</option>';
        }).join('') + '</select></div>' +
      '</div>' +
      '<div class="grup"><label>Pertanyaan <span class="wajib">*</span></label>' +
      '<textarea class="isian" id="f-qz-pertanyaan" rows="3" ' +
      'placeholder="Tulis pertanyaan…">' +
      Core.esc(s ? s.question : '') + '</textarea></div>' +
      '<div class="grup"><label>Tautan gambar <span class="kecil">(opsional)</span></label>' +
      '<input class="isian" id="f-qz-gambar" placeholder="https://…" value="' +
      Core.esc(s ? s.gambar_url : '') + '"></div>' +
      '<div id="f-qz-area-kunci"></div>' +
      '<div class="grup"><label>Pembahasan <span class="kecil">(opsional)</span></label>' +
      '<textarea class="isian" id="f-qz-pembahasan" rows="2">' +
      Core.esc(s ? s.pembahasan : '') + '</textarea></div>' +
      '<div class="pesan-salah" id="salah-dialog-qz"></div>';
    return html;
  }

  function gambarKunciQz(tirai, s) {
    var tipe = tirai.querySelector('#f-qz-tipe').value;
    var area = tirai.querySelector('#f-qz-area-kunci');
    var opsi = (s && s.options && s.options.length) ? s.options
               : ['', '', '', ''];
    var html = '';
    if (tipe === 'pg') {
      html = '<div class="grup"><label>Opsi & kunci jawaban <span class="wajib">*</span>' +
        ' <span class="kecil">(tandai ⦿ pada opsi yang benar)</span></label>' +
        ['A','B','C','D','E'].map(function (h, i) {
          return '<div class="baris-form" style="gap:8px;margin-bottom:6px">' +
            '<input type="radio" name="f-qz-kunci" value="' + h + '"' +
            (s && s.answer_key === h ? ' checked' :
              (!s && i === 0 ? ' checked' : '')) + '>' +
            '<input class="isian" data-qz-opsi="1" data-h="' + h +
            '" placeholder="Opsi ' + h + '" value="' +
            Core.esc(opsi[i] || '') + '"></div>';
        }).join('') + '</div>';
    } else if (tipe === 'benar_salah') {
      html = '<div class="grup"><label>Kunci jawaban</label>' +
        '<select class="isian" id="f-qz-kunci-bs">' +
        '<option value="Benar"' + (s && s.answer_key === 'Salah' ? '' : ' selected') +
        '>Benar</option>' +
        '<option value="Salah"' + (s && s.answer_key === 'Salah' ? ' selected' : '') +
        '>Salah</option></select></div>';
    } else if (tipe === 'isian') {
      html = '<div class="grup"><label>Kunci jawaban <span class="wajib">*</span></label>' +
        '<input class="isian" id="f-qz-kunci-isian" value="' +
        Core.esc(s ? s.answer_key : '') +
        '" placeholder="mis. 2/3"><span class="bantuan">Pencocokan longgar ' +
        'saat koreksi otomatis.</span></div>';
    } else {
      html = '<div class="grup"><label>Rubrik / pedoman penilaian ' +
        '<span class="kecil">(opsional)</span></label>' +
        '<textarea class="isian" id="f-qz-rubrik" rows="2">' +
        Core.esc(s ? s.rubric : '') + '</textarea>' +
        '<span class="bantuan">Jawaban uraian dikoreksi guru.</span></div>';
    }
    area.innerHTML = html;
  }

  /** Validasi klien dialog soal — cermin aturan server (Quiz.simpanSoal).
      Return false = dialog tertahan terbuka + pesan tampil di dalamnya. */
  function sahkanDialogQz(tirai) {
    var kotak = tirai.querySelector('#salah-dialog-qz');
    function pesan(teks) { kotak.classList.add('tampil'); kotak.textContent = teks; return false; }
    kotak.classList.remove('tampil');

    var tanya = tirai.querySelector('#f-qz-pertanyaan').value.trim();
    if (!tanya) return pesan('Pertanyaan wajib diisi.');
    if (tanya.length > 2000) return pesan('Pertanyaan maksimal 2000 karakter.');

    var gambar = tirai.querySelector('#f-qz-gambar').value.trim();
    if (gambar && !/^https?:\/\//i.test(gambar))
      return pesan('Tautan gambar harus diawali http:// atau https://');
    if (gambar.length > 500) return pesan('Tautan gambar maksimal 500 karakter.');

    var tipe = tirai.querySelector('#f-qz-tipe').value;
    if (tipe === 'pg') {
      var terisi = [];
      tirai.querySelectorAll('[data-qz-opsi]').forEach(function (i) {
        if (i.value.trim()) terisi.push(i.dataset.h);
      });
      if (terisi.length < 2) return pesan('Pilihan ganda butuh minimal 2 opsi terisi.');
      var kunci = tirai.querySelector('input[name="f-qz-kunci"]:checked');
      if (!kunci) return pesan('Tandai dulu opsi yang benar (⦿).');
      if (terisi.indexOf(kunci.value) === -1)
        return pesan('Kunci harus salah satu opsi yang terisi.');
    } else if (tipe === 'isian') {
      var k = tirai.querySelector('#f-qz-kunci-isian').value.trim();
      if (!k) return pesan('Kunci jawaban isian wajib diisi.');
      if (k.length > 100) return pesan('Kunci isian maksimal 100 karakter.');
    } else if (tipe === 'esai') {
      var r = tirai.querySelector('#f-qz-rubrik').value;
      if (r.length > 1000) return pesan('Rubrik maksimal 1000 karakter.');
    }

    var bobot = Number(tirai.querySelector('#f-qz-bobot').value);
    if (!bobot || bobot < 1 || bobot > 100) return pesan('Bobot harus angka 1–100.');
    return true;
  }

  function dialogSoalQz(s, ulang) {
    Core.dialog({
      judul: s && s.question_id ? '✏️ Ubah Soal ' + s.order_no : '＋ Tambah Soal',
      html: opsiHtmlSoal(ulang || s || null),
      labelYa: s && s.question_id ? 'Simpan' : 'Tambah',
      /* Validasi klien: dialog TETAP TERBUKA saat gagal, pesan tampil di
         dalamnya — isian yang sudah diketik tidak hilang. */
      saatYa: sahkanDialogQz,
      saatBuka: function (tirai) {
        gambarKunciQz(tirai, ulang || s || null);
        tirai.querySelector('#f-qz-tipe').addEventListener('change', function () {
          gambarKunciQz(tirai, ulang || s || null);
        });
      }
    }).then(function (ya) {
      if (!ya) return;
      var tipe = Core.$('f-qz-tipe').value;
      var p = {
        type: tipe,
        question: Core.$('f-qz-pertanyaan').value,
        points: Number(Core.$('f-qz-bobot').value) || 1,
        tingkat: Core.$('f-qz-tingkat').value,
        pembahasan: Core.$('f-qz-pembahasan').value,
        gambar_url: Core.$('f-qz-gambar').value
      };
      if (s) p.question_id = s.question_id;
      if (tipe === 'pg') {
        p.options = Array.prototype.map.call(
          document.querySelectorAll('[data-qz-opsi]'), function (i) { return i.value; });
        var terpilih = document.querySelector('input[name="f-qz-kunci"]:checked');
        p.answer_key = terpilih ? terpilih.value : '';
      } else if (tipe === 'benar_salah') {
        p.answer_key = Core.$('f-qz-kunci-bs').value;
      } else if (tipe === 'isian') {
        p.answer_key = Core.$('f-qz-kunci-isian').value;
      } else {
        p.rubric = Core.$('f-qz-rubrik').value;
      }
      Core.api('quizSimpanSoal', Core.ambilToken(), QZ.itemId, p)
        .then(function (r) {
          Core.toast(r.baru ? 'Soal ditambahkan.' : 'Soal disimpan.', 'sukses');
          muatQz();
        })
        .catch(function (err) {
          Core.toast(err.message, 'bahaya');
          dialogSoalQz(s, p); /* buka ulang dengan isian yang barusan diketik */
        });
    });
  }

  /* ---------- buat / edit course (kartu) ---------- */

  /* ---------- buat / edit course (kartu) ---------- */

  function dialogForm(taId) {
    Core.api('kelasDaftar', Core.ambilToken()).then(function (kelas) {
      var html =
        '<div class="grup"><label>Kelas <span class="wajib">*</span></label>' +
        '<select class="isian" id="in-c-kelas">' +
        '<option value="">— pilih kelas —</option>' +
        (kelas || []).map(function (k) {
          return '<option value="' + Core.esc(k.class_id) + '">' +
            Core.esc(k.name) + '</option>';
        }).join('') +
        '</select></div>' +
        '<div class="grup"><label>Mata pelajaran <span class="wajib">*</span></label>' +
        '<input class="isian" id="in-c-mapel" placeholder="mis. Matematika" ' +
        'list="daftar-mapel">' +
        '<datalist id="daftar-mapel"></datalist>' +
        '<span class="bantuan">Ketik bebas — mapel yang sudah pernah dipakai ' +
        'muncul sebagai saran dan dipakai bersama.</span></div>' +
        '<div class="pesan-salah" id="salah-course"></div>';

      Core.dialog({
        judul: taId ? '✏️ Edit Course' : '＋ Buat Course',
        html: html,
        labelYa: taId ? 'Simpan' : 'Buat',
        saatBuka: function (tirai) {
          var mapel = new Set();
          Core.api('courseDaftar', Core.ambilToken()).then(function (daftar) {
            (daftar || []).forEach(function (c) { mapel.add(c.subject_name); });
            var dl = tirai.querySelector('#daftar-mapel');
            if (dl) dl.innerHTML = Array.from(mapel).map(function (m) {
              return '<option value="' + Core.esc(m) + '">';
            }).join('');
          }).catch(function () {});
          if (!taId) return;
          Core.api('courseDetail', Core.ambilToken(), taId).then(function (d) {
            tirai.querySelector('#in-c-kelas').value = d.class_id || '';
            tirai.querySelector('#in-c-mapel').value = d.subject_name || '';
          }).catch(function (err) { Core.toast(err.message, 'bahaya'); });
        }
      }).then(function (ya) {
        if (!ya) return;
        var salah = Core.$('salah-course');
        /* Catatan: backend Course.simpan menerima { class_id, name };
           `subject_name` hanya bentuk baca (daftar/detail). */
        var p = {
          class_id: Core.$('in-c-kelas').value,
          name: Core.$('in-c-mapel').value
        };
        if (taId) p.teaching_assignment_id = taId;

        Core.api('courseSimpan', Core.ambilToken(), p)
          .then(function () {
            Core.toast(taId ? 'Course diperbarui.' : 'Course dibuat.', 'sukses');
            muatKisi();
          })
          .catch(function (err) {
            Core.tampilkanPesanError(salah, err.message);
            dialogForm(taId);
          });
      });
    }).catch(function (err) { Core.toast(err.message, 'bahaya'); });
  }

  function hapus(taId, nama) {
    Core.konfirmasi('Hapus course?',
      'Course ' + nama + ' dinonaktifkan dan hilang dari daftar. Data nilai ' +
      'yang sudah ada tidak dihapus.',
      { labelYa: 'Ya, hapus', bahaya: true })
      .then(function (ya) {
        if (!ya) return;
        Core.api('courseHapus', Core.ambilToken(), taId)
          .then(function () {
            Core.toast('Course dihapus (dinonaktifkan).', 'sukses');
            muatKisi();
          })
          .catch(function (err) { Core.toast(err.message, 'bahaya'); });
      });
  }

  Core.daftarRute('course', render);
  Core.daftarRute('course_detail', renderDetail);
  Core.daftarRute('item_editor', renderEditor);
  return { render: render, renderDetail: renderDetail, renderEditor: renderEditor };
})();
</script>
