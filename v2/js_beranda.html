<script>
/* ============================================================
   LMS v2 — js_beranda.html
   Beranda guru & murid, antrean reset kata sandi, notifikasi.
   Pola tampilan port dari js_beranda v1: kisi statistik,
   panel perlu tindakan, kartu kelas, notif-baris.
   ============================================================ */

function kartuStat(ikon, angka, label) {
  return '<div class="kartu kartu-statistik">' +
    '<span class="ikon">' + ikon + '</span>' +
    '<span class="angka">' + (angka || 0) + '</span>' +
    '<span class="kecil lembut">' + esc(label) + '</span></div>';
}

function btnTindakan(ikon, label, jml, tautan) {
  return '<button class="btn-tindakan" data-tautan="' + esc(tautan) + '">' +
    '<span>' + ikon + '</span><span class="kecil">' + esc(label) + '</span>' +
    '<span class="jml">' + jml + '</span></button>';
}

function spandukBiodata() {
  if (!(State.user && State.user.role === 'murid' &&
        State.user.biodata_kurang === true)) return '';
  return '<div class="kartu panel-tindakan mb-16" id="spanduk-bio">' +
    '<div class="baris-antara" style="gap:12px;flex-wrap:wrap">' +
      '<div style="min-width:0">' +
        '<div class="tebal">🪪 Lengkapi biodata Anda</div>' +
        '<div class="kecil lembut">Email dan nomor WhatsApp — ' +
          'dipakai guru untuk menghubungi Anda.</div>' +
      '</div>' +
      '<div class="baris sela-kecil">' +
        '<button class="btn btn-kecil" id="bio-isi">Lengkapi</button>' +
      '</div>' +
    '</div></div>';
}

/* ---------------------------------------------- RUTE: beranda */
daftarRute('beranda', function () {
  if (!State.user) { pergiKe('#/login'); return; }

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = (State.user.role === 'guru')
    ? menuRangka(app, 'beranda')
    : $('#isi-halaman', app);

  callApi('kelasSaya', [State.token], { diam: true })
    .then(function (kelas) {
      Menu.kelas = kelas || [];
      Menu.diisi = Date.now();

      if (State.user.role === 'guru') {
        /* jumlah murid/mapel ringkas dari kelasDaftar (kelasSaya
           tidak memuatnya) */
        callApi('kelasDaftar', [State.token, true], { diam: true })
          .then(function (ringkas) {
            var peta = {};
            (ringkas || []).forEach(function (k) { peta[k.class_id] = k; });
            (kelas || []).forEach(function (k) {
              var r = peta[k.class_id];
              if (r) { k.jml_murid = r.jml_murid; k.jml_mapel = r.jml_mapel; }
            });
            gambarBerandaGuru(isi, kelas || []);
            _menuMuatKelas();
          })
          .catch(function () {
            gambarBerandaGuru(isi, kelas || []);
            _menuMuatKelas();
          });
      } else {
        gambarBerandaMurid(isi, kelas || []);
      }
    })
    .catch(function () {
      isi.innerHTML = kosongkan('⚠️', 'Gagal memuat',
        'Periksa koneksi Anda.',
        '<button class="btn btn-hantu btn-kecil mt-16" ' +
        'onclick="router()">Coba Lagi</button>');
    });
});

/* ---------------------------------------------- beranda guru */
function gambarBerandaGuru(isi, kelas) {
  var s = State.ringkasan || {};

  var html =
    '<div class="kepala-halaman">' +
      '<h1>Halo, ' + esc(State.user.nama) + '</h1>' +
      '<p class="lembut kecil">Ringkasan kelas yang Anda ampu.</p>' +
    '</div>' +

    '<div class="kisi-statistik">' +
      kartuStat('📚', s.kelas_aktif, 'Kelas aktif') +
      kartuStat('👥', s.murid_aktif, 'Murid aktif') +
      kartuStat('📗', s.mapel_aktif, 'Mapel aktif') +
      kartuStat('🧩', s.item, 'Item') +
    '</div>';

  /* perlu tindakan */
  if (s.reset_antre > 0) {
    html += '<div class="kartu panel-tindakan mb-16">' +
      '<h3 class="mb-8">⚡ Perlu Tindakan</h3><div class="kolom sela-kecil">' +
      btnTindakan('🔑', 'Permintaan reset kata sandi',
                  s.reset_antre, '#/reset') +
      '</div></div>';
  }

  /* pintasan kelola */
  html += '<div class="baris sela-kecil mb-16" style="flex-wrap:wrap">' +
    '<button class="btn btn-hantu btn-kecil" data-tautan="#/kelas">📚 Kelola Kelas</button>' +
    '<button class="btn btn-hantu btn-kecil" data-tautan="#/murid">👥 Kelola Murid</button>' +
    '<button class="btn btn-hantu btn-kecil" data-tautan="#/mapel">📗 Mapel</button>' +
    '<button class="btn btn-hantu btn-kecil" data-tautan="#/topik">🧩 Topik & Materi</button>' +
    '</div>';

  /* daftar kelas */
  html += '<h2 class="mb-8">Kelas Saya</h2>';
  if (!kelas.length) {
    html += kosongkan('📚', 'Belum ada kelas',
      'Buat kelas pertama Anda dari layar Kelola Kelas.',
      '<button class="btn btn-hantu btn-kecil mt-16" ' +
      'data-tautan="#/kelas">Buka Kelola Kelas</button>');
  } else {
    html += '<div class="kolom">' + kelas.map(function (k) {
      var jml = (k.mapel || []).length;
      var pil = (k.mapel || []).map(function (m) {
        return '<span class="pil pil-kelas">' + esc(m.nama) +
          (m.guru ? ' · ' + esc(m.guru) : '') + '</span>';
      }).join('');
      return '<button class="kartu-kelas" data-kelas="' + esc(k.class_id) + '">' +
        '<div class="baris-antara mb-8">' +
          '<div style="min-width:0"><div class="judul">' + esc(k.name) + '</div></div>' +
          '<span class="kecil lembut">' + esc(k.academic_year || '') + '</span>' +
        '</div>' +
        '<div class="baris kecil lembut" style="gap:14px">' +
          '<span>👥 ' + (k.jml_murid || 0) + ' murid</span>' +
          '<span>📗 ' + jml + ' mapel</span>' +
        '</div>' +
        (pil ? '<div class="baris-pil mt-8">' + pil + '</div>' : '') +
      '</button>';
    }).join('') + '</div>';
  }

  isi.innerHTML = html;

  isi.onclick = function (e) {
    var kk = e.target.closest('[data-kelas]');
    if (kk) { pergiKe('#/kelas/' + kk.dataset.kelas); return; }
    var bt = e.target.closest('[data-tautan]');
    if (bt) pergiKe(bt.dataset.tautan);
  };
}

/* ---------------------------------------------- beranda murid */
function gambarBerandaMurid(isi, kelas) {
  var s = State.ringkasan || {};

  var html =
    '<div class="kepala-halaman">' +
      '<h1>Halo, ' + esc(State.user.nama) + '</h1>' +
      '<p class="lembut kecil">Lanjutkan belajar dari kelas Anda.</p>' +
    '</div>';

  html += spandukBiodata();

  /* ringkasan singkat */
  html += '<div class="kisi-statistik">' +
    kartuStat('🏫', s.kelas_diikuti, 'Kelas diikuti') +
    kartuStat('🔔', s.notif_baru, 'Notifikasi baru') +
    '</div>';

  if (!kelas.length) {
    isi.innerHTML = html + kosongkan('📚', 'Belum terdaftar di kelas mana pun',
      'Hubungi guru Anda untuk didaftarkan.');
    return;
  }

  html += '<h2 class="mb-8">Kelas Saya</h2><div class="kolom">' +
    kelas.map(function (k) {
      var pil = (k.mapel || []).map(function (m) {
        return m.ta_id
          ? '<button class="pil pil-kelas pil-tautan" data-ta="' +
            esc(m.ta_id) + '" data-nama="' + esc(m.nama) + '">▶ ' +
            esc(m.nama) + (m.guru ? ' · ' + esc(m.guru) : '') + '</button>'
          : '<span class="pil">' + esc(m.nama) +
            (m.guru ? ' · ' + esc(m.guru) : '') + '</span>';
      }).join('');
      return '<div class="kartu-kelas" style="cursor:default">' +
        '<div class="baris-antara mb-8">' +
          '<div style="min-width:0"><div class="judul">' + esc(k.name) + '</div></div>' +
          '<span class="kecil lembut">' + esc(k.academic_year || '') + '</span>' +
        '</div>' +
        '<div class="kecil lembut mb-4">MAPEL</div>' +
        (pil ? '<div class="baris-pil">' + pil + '</div>'
             : '<span class="kecil lembut">belum ada mapel</span>') +
      '</div>';
    }).join('') + '</div>';

  isi.innerHTML = html;

  var bio = $('#bio-isi', isi);
  if (bio) bio.onclick = function () { dialogBiodata(); };

  isi.onclick = function (e) {
    var c = e.target.closest('[data-ta]');
    if (c) { pergiKe('#/materi/' + c.dataset.ta); }
  };
}

/* ---------------------------------------------- RUTE: notifikasi */
daftarRute('notifikasi', function () {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = (State.user.role === 'guru')
    ? menuRangka(app, 'notifikasi')
    : $('#isi-halaman', app);

  isi.innerHTML =
    '<div class="kepala-halaman"><h1>🔔 Notifikasi</h1></div>' +
    '<div class="kartu" id="daftar-notif">' + rangkaMuat(60, 3) + '</div>';

  callApi('daftarNotifikasi', [State.token], { diam: true })
    .then(function (daftar) {
      var wadah = $('#daftar-notif', isi);
      if (!daftar || !daftar.length) {
        wadah.innerHTML = kosongkan('🔕', 'Belum ada notifikasi',
          'Kabar dari guru akan muncul di sini.');
        return;
      }
      wadah.innerHTML = daftar.map(function (n) {
        return '<div class="notif-baris' + (n.dibaca ? '' : ' belum') +
          '" data-notif="' + esc(n.notif_id) + '">' +
          '<span class="ikon">' + esc(n.ikon || '🔔') + '</span>' +
          '<div class="tumbuh">' +
            '<div class="tebal">' + esc(n.judul) + '</div>' +
            '<div class="kecil">' + esc(n.pesan) + '</div>' +
            '<div class="kecil lembut">' + esc(n.relatif || n.created_at) + '</div>' +
          '</div>' +
          (n.dibaca ? '' : '<span class="notif-titik"></span>') +
        '</div>';
      }).join('');

      $$('#daftar-notif [data-notif]', isi).forEach(function (b) {
        b.onclick = function () {
          callApi('notifTandaiDibaca', [State.token, b.dataset.notif],
                  { diam: true })
            .then(function () {
              b.classList.remove('belum');
              var t = b.querySelector('.notif-titik');
              if (t) t.remove();
              if (State.ringkasan && State.user.role === 'murid') {
                State.ringkasan.notif_baru =
                  Math.max(0, (State.ringkasan.notif_baru || 0) - 1);
                pasangTopbar(document.getElementById('app'));
              }
            })
            .catch(function () {});
        };
      });
    })
    .catch(function () {
      $('#daftar-notif', isi).innerHTML =
        kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
    });
});

/* ---------------------------------------------- RUTE: antrean reset */
daftarRute('reset', function () {
  if (!State.user || State.user.role !== 'guru') { pergiKe('#/beranda'); return; }

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = menuRangka(app, 'beranda');

  isi.innerHTML =
    '<button class="tautan-balik" onclick="pergiKe(\'#/beranda\')">← Beranda</button>' +
    '<div class="kepala-halaman"><h1>🔑 Permintaan Reset Kata Sandi</h1>' +
    '<p class="lembut kecil">Reset memberi kata sandi sementara — tampil ' +
    'sekali di layar Anda, murid wajib menggantinya.</p></div>' +
    '<div id="isi-reset">' + rangkaMuat(60, 3) + '</div>';

  gambarAntreanReset();

  function gambarAntreanReset() {
    callApi('getPermintaanReset', [State.token], { diam: true })
      .then(function (daftar) {
        var wadah = $('#isi-reset', isi);
        if (!daftar || !daftar.length) {
          wadah.innerHTML = kosongkan('✅', 'Antrean kosong',
            'Tidak ada permintaan reset yang menunggu.');
          return;
        }
        wadah.innerHTML = '<div class="kartu"><div class="tabel-gulir">' +
          '<table class="tabel"><thead><tr>' +
          '<th>Nama</th><th>Pengguna</th><th>Waktu</th><th></th></tr></thead><tbody>' +
          daftar.map(function (r) {
            return '<tr><td><b>' + esc(r.nama) + '</b></td>' +
              '<td>@' + esc(r.username) + '</td>' +
              '<td class="kecil lembut">' + esc(r.dibuat_at) + '</td>' +
              '<td><button class="btn btn-kecil" data-reset="' +
              esc(r.user_id) + '" data-req="' + esc(r.request_id) +
              '">Reset</button></td></tr>';
          }).join('') +
          '</tbody></table></div></div>';

        $$('[data-reset]', wadah).forEach(function (b) {
          b.onclick = function () {
            konfirmasi('Reset Kata Sandi',
              'Reset kata sandi untuk ' + b.closest('tr').cells[0].textContent + '?',
              { labelYa: 'Reset', bahaya: true })
              .then(function (ya) {
                if (!ya) return;
                tampilkanMuat(true, 'Mereset kata sandi…');
                callApi('resetPasswordMurid',
                        [State.token, b.dataset.reset, b.dataset.req],
                        { diam: true })
                  .then(function (d) {
                    tampilkanMuat(false);
                    dialogHasilSandi(d);
                    gambarAntreanReset();
                  })
                  .catch(function () { tampilkanMuat(false); });
              });
          };
        });
      })
      .catch(function () {
        $('#isi-reset', isi).innerHTML =
          kosongkan('⚠️', 'Gagal memuat', 'Periksa koneksi Anda.');
      });
  }
});

/**
 * Dialog hasil reset — kotak kode + tombol WhatsApp (pola v1).
 * d = { username, nama, password_sementara, no_wa }
 */
function dialogHasilSandi(d) {
  var tombolWa = d.no_wa
    ? '<a class="btn btn-hantu btn-penuh mt-8" href="https://wa.me/' +
      esc(d.no_wa) + '?text=' + encodeURIComponent(
        'Halo ' + d.nama + ', kata sandi sementara akunmu:\n' +
        'Username: ' + d.username + '\nKata sandi: ' + d.password_sementara +
        '\nSegera ganti setelah masuk.') +
      '" target="_blank" rel="noopener">💬 Kirim lewat WhatsApp</a>'
    : '<p class="bantuan mt-8">Murid belum mengisi nomor WhatsApp, ' +
      'jadi sandi ini perlu diberikan langsung.</p>';

  return dialog({
    judul: 'Kata Sandi Sementara',
    pesan: 'Berikan kepada <b>' + esc(d.nama) + '</b> (@' +
           esc(d.username) + '). Kode ini hanya tampil sekali.',
    html: '<div class="kotak-kode mt-8">' + esc(d.password_sementara) +
          '</div>' + tombolWa +
          '<p class="bantuan mt-8">Murid wajib menggantinya saat masuk ' +
          'berikutnya.</p>',
    tanpaBatal: true, labelYa: 'Sudah Dicatat'
  });
}
</script>
