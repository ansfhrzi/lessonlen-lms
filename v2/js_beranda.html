<script>
/* ============================================================
 *  LMS v2 — js_beranda.html
 *  Beranda ringkas ala §22D:
 *  guru = 4 angka (kelas/course/murid/api key) + perlu tindakan
 *  + pintasan menu; murid = ringkas + pengingat biodata.
 * ============================================================ */

var Beranda = (function () {

  function render() {
    var r = Core.state.ringkas;
    var layar = Core.$('layar');
    if (!r) { layar.innerHTML = '<div class="pemuat">…</div>'; return; }
    if (r.role === 'guru') renderGuru(layar, r);
    else renderMurid(layar, r);
  }

  /* ---------------- guru ---------------- */

  function renderGuru(layar, r) {
    var user = Core.state.user || {};
    var jam = new Date().getHours();
    var sapa = jam < 11 ? 'Selamat pagi' : (jam < 15 ? 'Selamat siang' :
              (jam < 18 ? 'Selamat sore' : 'Selamat malam'));
    var ak = r.api_key || {};
    var pt = r.perlu_tindakan || { jml: 0, daftar: [] };

    var html =
      '<div class="kepala"><div>' +
        '<h1>' + Core.esc(sapa) + ', ' + Core.esc(user.nama || 'Guru') + ' 👋</h1>' +
        '<p>Ringkasan kelas & course Anda hari ini.</p>' +
      '</div></div>' +

      '<div class="kisi-stat">' +
        stat('🏫', r.kelas_aktif, 'Kelas aktif') +
        stat('📚', r.course_aktif, 'Course') +
        stat('🧑‍🎓', r.murid_aktif, 'Murid aktif') +
        stat('🔑', (ak.terpasang ? ak.jml + '/' + ak.maks : '—'), 'API key terpasang') +
      '</div>';

    if (pt.jml > 0) {
      /* tiap baris BISA DIKLIK → langsung proses (reset sandi);
         "Lihat" membuka daftar lengkap yang bisa digulir */
      html += '<div class="judul-seksi">Perlu tindakan</div><div class="kartu"><div class="kartu-isi">' +
        '<span class="badge badge-tunggu">' + pt.jml + ' permintaan reset</span>';
      pt.daftar.forEach(function (x) {
        html += '<button type="button" class="tindak-baris" ' +
          'data-rid="' + Core.esc(x.request_id) + '" ' +
          'data-uid="' + Core.esc(x.user_id) + '" ' +
          'data-nama="' + Core.esc(x.nama) + '" ' +
          'data-user="' + Core.esc(x.username) + '" title="Reset kata sandi">' +
          '<span class="avatar">' + Core.esc(Core.inisial(x.nama)) + '</span>' +
          '<span class="pilih-tengah"><b>' + Core.esc(x.nama) + '</b>' +
          '<small>meminta reset kata sandi · ' + Core.esc(x.username) +
          ' · ' + Core.esc(x.dibuat_at || '') + '</small></span>' +
          '<span class="tindak-aksi">Reset →</span></button>';
      });
      html += '<div class="mt-8"><button class="btn btn-sekunder btn-kecil" id="btn-pt-lihat">' +
              'Lihat</button></div></div></div>';
    }

    html +=
      '<div class="judul-seksi aksi"><span>Course saya</span>' +
        '<button class="btn-teks kecil" id="btn-course-semua">Kelola semua →</button></div>' +
      '<div class="kartu"><div id="wadah-course">' +
        '<div class="pemuat"><span class="ikon">⏳</span>Memuat…</div></div></div>';

    layar.innerHTML = html;

    /* baris "Perlu tindakan" → reset sandi langsung (request_id ikut,
       server menandai permintaan selesai otomatis) */
    layar.querySelectorAll('.tindak-baris').forEach(function (b) {
      b.addEventListener('click', function () {
        MuridLayar.resetSandi(
          { user_id: b.dataset.uid, nama: b.dataset.nama, username: b.dataset.user },
          b.dataset.rid,
          segarkan);
      });
    });
    var btnLihat = Core.$('btn-pt-lihat');
    if (btnLihat) btnLihat.addEventListener('click', dialogTindakan);
    var btnSemua = Core.$('btn-course-semua');
    if (btnSemua) btnSemua.addEventListener('click', function () { Core.pergiKe('course'); });

    muatCourseSaya();
  }

  /* Daftar course nyata milik guru (menggantikan pintasan statis).
     Klik course → layar Kelola Course; konten per course menyusul
     pada Tahap 4. */
  function muatCourseSaya() {
    var wadah = Core.$('wadah-course');
    Core.api('courseDaftar', Core.ambilToken()).then(function (daftar) {
      /* layar sudah berganti bila elemen tak ada lagi */
      if (!wadah || !Core.$('btn-course-semua')) return;
      daftar = (daftar || []).slice().sort(function (a, b) {
        if ((a.status === 'aktif') !== (b.status === 'aktif'))
          return a.status === 'aktif' ? -1 : 1;
        return String(a.label) < String(b.label) ? -1 : 1;
      });

      if (!daftar.length) {
        wadah.innerHTML = '<div class="kosong"><b>Belum ada course</b>' +
          'Course = gabungan kelas & mata pelajaran yang Anda ampu.' +
          '<div class="mt-8"><button class="btn btn-kecil" id="btn-course-buat">' +
          '＋ Buat course pertama</button></div></div>';
        var b = Core.$('btn-course-buat');
        if (b) b.addEventListener('click', function () { Core.pergiKe('course'); });
        return;
      }

      wadah.innerHTML = daftar.map(function (c) {
        return '<a href="#" class="barang-course" data-id="' +
          Core.esc(c.teaching_assignment_id) + '">' +
          '<span class="avatar">📚</span>' +
          '<span class="barang-tengah"><b>' + Core.esc(c.subject_name) + '</b>' +
          '<small>' + Core.esc(c.class_name) + ' · ' +
          Core.esc(c.academic_year || '—') + ' · ' + c.jml_murid + ' murid</small></span>' +
          (c.status === 'aktif'
            ? '<span class="badge badge-aktif">● Aktif</span>'
            : '<span class="badge badge-nonaktif">● Nonaktif</span>') +
          '</a>';
      }).join('');

      wadah.querySelectorAll('.barang-course').forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          Core.pergiKe('course');
        });
      });
    }).catch(function (err) {
      if (wadah) wadah.innerHTML = '<div class="kosong">' +
        Core.esc(err.message) + '</div>';
    });
  }

  /** Ambil ulang ringkasan lalu render beranda (dipakai setelah aksi). */
  function segarkan() {
    Core.api('ringkasDashboard', Core.ambilToken()).then(function (r) {
      Core.state.ringkas = r;
      render();
    }).catch(function () {});
  }

  /**
   * Daftar lengkap "Perlu tindakan" (tombol Lihat).
   * Menggulir bila panjang — beranda hanya menampilkan 5 terbaru.
   * Seksi per jenis: kini baru "reset kata sandi"; nilai tugas
   * individu/kelompok & uraian quiz otomatis muncul di sini saat
   * fiturnya aktif (Tahap 4–5).
   */
  function dialogTindakan() {
    Core.api('getPermintaanReset', Core.ambilToken()).then(function (daftar) {
      daftar = daftar || [];
      var html =
        '<div class="kecil" style="margin-bottom:8px">Klik siswa untuk ' +
        'memproses. Daftar menggulir bila panjang.</div>' +
        '<div class="pilih-list" id="tindak-list">' +
        (daftar.length
          ? daftar.map(function (x) {
              return '<button type="button" class="tindak-baris" ' +
                'data-rid="' + Core.esc(x.request_id) + '" ' +
                'data-uid="' + Core.esc(x.user_id) + '" ' +
                'data-nama="' + Core.esc(x.nama) + '" ' +
                'data-user="' + Core.esc(x.username) + '">' +
                '<span class="avatar">' + Core.esc(Core.inisial(x.nama)) + '</span>' +
                '<span class="pilih-tengah"><b>' + Core.esc(x.nama) + '</b>' +
                '<small>reset kata sandi · ' + Core.esc(x.username) +
                ' · ' + Core.esc(x.dibuat_at || '') + '</small></span>' +
                '<span class="tindak-aksi">Reset →</span></button>';
            }).join('')
          : '<div class="kosong">Semua tindakan sudah diproses 🎉</div>') +
        '</div>' +
        '<p class="bantuan mt-8">Jenis lain — nilai tugas individu, tugas ' +
        'kelompok, uraian quiz — muncul di daftar ini otomatis saat ' +
        'fiturnya aktif (Tahap 4–5).</p>';

      Core.dialog({
        judul: 'Perlu tindakan' + (daftar.length ? ' (' + daftar.length + ')' : ''),
        html: html,
        labelYa: 'Tutup',
        tanpaBatal: true,
        saatBuka: function (tirai) {
          tirai.querySelectorAll('.tindak-baris').forEach(function (b) {
            b.addEventListener('click', function () {
              MuridLayar.resetSandi(
                { user_id: b.dataset.uid, nama: b.dataset.nama,
                  username: b.dataset.user },
                b.dataset.rid,
                function () {
                  /* hapus baris + segarkan hitungan judul & beranda */
                  b.remove();
                  var sisa = tirai.querySelectorAll('.tindak-baris').length;
                  var wadah = tirai.querySelector('#tindak-list');
                  if (wadah && !sisa)
                    wadah.innerHTML = '<div class="kosong">Semua tindakan sudah diproses 🎉</div>';
                  var k = tirai.querySelector('h3');
                  if (k) k.textContent = 'Perlu tindakan' + (sisa ? ' (' + sisa + ')' : '');
                  segarkan();
                });
            });
          });
        }
      });
    }).catch(function (err) { Core.toast(err.message, 'bahaya'); });
  }

  function stat(ikon, angka, label) {
    return '<div class="stat"><div class="stat-ikon">' + ikon + '</div>' +
           '<div><b>' + Core.esc(String(angka)) + '</b><small>' +
           Core.esc(label) + '</small></div></div>';
  }

  /* ---------------- murid ---------------- */

  function renderMurid(layar, r) {
    var user = Core.state.user || {};
    var html =
      '<div class="kepala"><div>' +
        '<h1>Halo, ' + Core.esc(user.nama || 'Murid') + ' 👋</h1>' +
        '<p>Fitur belajar murid (Kelas Saya → Materi → Quiz) menyusul ' +
        'pada tahap berikutnya.</p>' +
      '</div></div>' +
      '<div class="kisi-stat">' +
        stat('🏫', r.kelas_diikuti, 'Kelas diikuti') +
        stat('🔔', r.notif_baru, 'Notifikasi baru') +
      '</div>' +

      /* kartu "Kelas Saya" (laporan pemilik produk) */
      '<div class="judul-seksi">Kelas saya</div>' +
      '<div class="kisi-kartu" id="wadah-kelas-saya">' +
        '<div class="pemuat"><span class="ikon">⏳</span>Memuat…</div></div>';

    if (r.biodata_kurang) {
      html += '<div class="kartu mt-16"><div class="kartu-isi">' +
        '<b>📋 Biodata Anda belum lengkap</b>' +
        '<p class="kecil">Lengkapi email, nomor WhatsApp, dan tanggal lahir agar Anda ' +
        'dapat memulihkan sandi/username sendiri bila lupa.</p>' +
        '<button class="btn btn-kecil mt-8" id="btn-isi-bio">Lengkapi sekarang</button>' +
        '</div></div>';
    }

    layar.innerHTML = html;
    var btn = Core.$('btn-isi-bio');
    if (btn) btn.addEventListener('click', function () { Core.pergiKe('biodata'); });
    muatKelasSaya();
  }

  /* Kartu kelas yang diikuti murid (endpoint kelasSaya).
     Klik kartu → rincian kelas menyusul pada Tahap 4. */
  function muatKelasSaya() {
    var wadah = Core.$('wadah-kelas-saya');
    Core.api('kelasSaya', Core.ambilToken()).then(function (daftar) {
      if (!wadah) return;
      if (!daftar || !daftar.length) {
        wadah.innerHTML = '<div class="kartu-barang">' +
          '<div class="kartu-judul">Belum terdaftar</div>' +
          '<div class="kartu-sub">Anda belum terdaftar di kelas mana pun — ' +
          'hubungi guru Anda untuk didaftarkan.</div></div>';
        return;
      }
      wadah.innerHTML = daftar.map(function (k) {
        return '<div class="kartu-barang">' +
          '<div class="kartu-judul"><span>🏫 ' + Core.esc(k.name) + '</span>' +
          '<span class="badge badge-info">' + Core.esc(k.academic_year || '—') + '</span></div>' +
          '<div class="kartu-sub">' + (k.jml_course
            ? '📚 ' + k.jml_course + ' course: ' + Core.esc((k.course || []).join(', '))
            : 'Belum ada course di kelas ini') + '</div>' +
          '</div>';
      }).join('');
    }).catch(function (err) {
      if (wadah) wadah.innerHTML = '<div class="kartu-barang">' +
        '<div class="kartu-sub">' + Core.esc(err.message) + '</div></div>';
    });
  }

  Core.daftarRute('beranda', render);
  return { render: render };
})();
</script>
