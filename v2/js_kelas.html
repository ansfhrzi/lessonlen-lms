<script>
/* ============================================================
 *  LMS v2 — js_kelas.html
 *  Layar Kelola Kelas (bentuk laporan pemilik produk):
 *  DROPDOWN pilih kelas → di bawahnya TABEL daftar nama siswa.
 *  Aksi per kelas (edit, tambah murid, ekspor) aktif setelah
 *  kelas dipilih. Form buat/edit, dialog tambah murid
 *  (daftar + filter rombel), keluarkan.
 * ============================================================ */

var KelasLayar = (function () {

  var KELAS_DIPILIH = '';

  function render() {
    Core.$('layar').innerHTML =
      '<div class="kepala"><div><h1>Kelola Kelas</h1>' +
        '<p>Rombongan belajar — murid masuk lewat kelas, course menautkan kelas ke mapel.</p></div>' +
        '<div class="kepala-aksi">' +
          '<button class="btn btn-sekunder" id="btn-ekspor">📄 Ekspor Excel</button>' +
          '<button class="btn" id="btn-tambah">＋ Buat kelas</button>' +
        '</div></div>' +
      '<div class="kartu">' +
        '<div class="tabel-alat">' +
          '<select class="isian" id="sel-kelas" style="width:auto;min-height:44px">' +
            '<option value="">— pilih kelas —</option></select>' +
          '<button class="btn btn-sekunder btn-kecil" id="btn-edit-kelas" disabled>✏️ Edit kelas</button>' +
          '<button class="btn btn-kecil" id="btn-enroll" disabled>＋ Tambah murid</button>' +
          '<span class="kecil" id="info-kelas" style="margin-left:auto"></span>' +
        '</div>' +
        '<div class="tabel-gulir" id="wadah-tabel">' +
          '<div class="kosong">Pilih kelas di atas untuk melihat daftar siswanya.</div>' +
        '</div>' +
      '</div>' +
      '<p class="bantuan mt-8">💡 Klik 👁 pada siswa untuk detail/edit/reset sandi. ' +
      'Keluarkan hanya melepas siswa dari kelas ini — akunnya tetap ada.</p>';

    Core.$('btn-tambah').addEventListener('click', function () { dialogForm(null); });
    Core.$('btn-ekspor').addEventListener('click', ekspor);
    Core.$('sel-kelas').addEventListener('change', function () {
      if (this.value) pilih(this.value);
      else {
        KELAS_DIPILIH = '';
        segarkanTombol();
        Core.$('wadah-tabel').innerHTML =
          '<div class="kosong">Pilih kelas di atas untuk melihat daftar siswanya.</div>';
        Core.$('info-kelas').textContent = '';
      }
    });
    Core.$('btn-edit-kelas').addEventListener('click', function () {
      if (KELAS_DIPILIH) dialogForm(KELAS_DIPILIH);
    });
    Core.$('btn-enroll').addEventListener('click', function () {
      if (KELAS_DIPILIH) dialogEnroll(KELAS_DIPILIH);
    });

    muatPilihan();
  }

  function segarkanTombol() {
    var ada = !!KELAS_DIPILIH;
    Core.$('btn-edit-kelas').disabled = !ada;
    Core.$('btn-enroll').disabled = !ada;
  }

  /* ---------- dropdown kelas ---------- */

  function muatPilihan() {
    Core.api('kelasDaftar', Core.ambilToken()).then(function (daftar) {
      var sel = Core.$('sel-kelas');
      if (!sel) return;
      sel.innerHTML = '<option value="">— pilih kelas —</option>' +
        (daftar || []).map(function (k) {
          return '<option value="' + Core.esc(k.class_id) + '">' +
            Core.esc(k.name) +
            (k.academic_year ? ' · ' + Core.esc(k.academic_year) : '') +
            ' — ' + k.jml_murid + ' siswa</option>';
        }).join('');
      if (KELAS_DIPILIH && (daftar || []).some(function (k) {
            return k.class_id === KELAS_DIPILIH; })) {
        sel.value = KELAS_DIPILIH;
        segarkanTombol();
      }
    }).catch(function (err) { Core.toast(err.message, 'bahaya'); });
  }

  function pilih(classId) {
    KELAS_DIPILIH = classId;
    segarkanTombol();
    muatDetail(classId);
  }

  /* ---------- tabel siswa kelas terpilih ---------- */

  function muatDetail(classId) {
    var wadah = Core.$('wadah-tabel');
    wadah.innerHTML = '<div class="pemuat"><span class="ikon">⏳</span>Memuat…</div>';
    Core.api('kelasDetail', Core.ambilToken(), classId).then(function (d) {
      var info = Core.$('info-kelas');
      if (info) info.textContent =
        (d.name || '—') +
        (d.academic_year ? ' · ' + d.academic_year : '') +
        ' · ' + (d.murid || []).length + ' siswa terdaftar';

      if (!d.murid || !d.murid.length) {
        wadah.innerHTML = '<div class="kosong"><b>Belum ada siswa di kelas ini</b>' +
          'Gunakan “＋ Tambah murid” untuk mendaftarkan murid yang sudah ada.</div>';
        return;
      }
      var html = '<table><thead><tr>' +
        '<th>Siswa</th><th>Status akun</th><th>Tanggal daftar</th><th></th>' +
        '</tr></thead><tbody>';
      d.murid.forEach(function (m) {
        html += '<tr>' +
          '<td><div class="sel-orang"><div class="avatar">' +
            Core.esc(Core.inisial(m.nama)) + '</div><div><b>' + Core.esc(m.nama) +
            '</b><small>' + Core.esc(m.username) + '</small></div></div></td>' +
          '<td>' + (m.sudah_ganti
            ? '<span class="badge badge-aktif">sandi diganti</span>'
            : '<span class="badge badge-tunggu">masih sandi sementara</span>') + '</td>' +
          '<td class="kecil">' + Core.esc(m.tanggal_daftar || '—') + '</td>' +
          '<td class="td-aksi">' +
            '<button class="btn-teks" data-detail="' + Core.esc(m.user_id) + '" title="Detail">👁</button>' +
            '<button class="btn-teks merah" data-keluar="' + Core.esc(m.enroll_id) + '" title="Keluarkan">🚪</button>' +
          '</td></tr>';
      });
      html += '</tbody></table>';
      wadah.innerHTML = html;

      wadah.querySelectorAll('[data-detail]').forEach(function (b) {
        b.addEventListener('click', function () {
          MuridLayar.detail(b.dataset.detail);
        });
      });
      wadah.querySelectorAll('[data-keluar]').forEach(function (b) {
        b.addEventListener('click', function () {
          keluarkan(b.dataset.keluar, d.murid.filter(function (x) {
            return x.enroll_id === b.dataset.keluar;
          })[0], classId);
        });
      });
    }).catch(function (err) {
      wadah.innerHTML = '<div class="kosong"><b>Gagal memuat</b>' +
        Core.esc(err.message) + '</div>';
    });
  }

  function keluarkan(enrollId, m, classId) {
    if (!m) return;
    Core.konfirmasi('Keluarkan murid?',
      m.nama + ' dilepas dari kelas ini. Akunnya tetap ada dan bisa ' +
      'didaftarkan lagi di kelas mana pun.',
      { labelYa: 'Ya, keluarkan', bahaya: true })
      .then(function (ya) {
        if (!ya) return;
        Core.api('kelasKeluarkan', Core.ambilToken(), enrollId)
          .then(function () {
            Core.toast('Murid dikeluarkan dari kelas.', 'sukses');
            muatDetail(classId);
            muatPilihan();          /* jml siswa pada dropdown ikut segar */
          })
          .catch(function (err) { Core.toast(err.message, 'bahaya'); });
      });
  }

  /* ---------- buat / edit ---------- */

  function dialogForm(classId) {
    var html =
      '<div class="grup"><label>Nama kelas <span class="wajib">*</span></label>' +
      '<input class="isian" id="in-k-nama" placeholder="mis. XI TKJ 1"></div>' +
      '<div class="grup"><label>Tahun ajaran</label>' +
      '<input class="isian" id="in-k-tahun" placeholder="mis. 2026/2027">' +
      '<span class="bantuan">Kosongkan bila tidak dipakai.</span></div>' +
      '<div class="pesan-salah" id="salah-kelas"></div>';

    Core.dialog({
      judul: classId ? '✏️ Edit Kelas' : '＋ Buat Kelas',
      html: html,
      labelYa: classId ? 'Simpan' : 'Buat',
      saatBuka: function (tirai) {
        if (!classId) return;
        Core.api('kelasDetail', Core.ambilToken(), classId).then(function (d) {
          tirai.querySelector('#in-k-nama').value = d.name || '';
          tirai.querySelector('#in-k-tahun').value = d.academic_year || '';
        }).catch(function (err) { Core.toast(err.message, 'bahaya'); });
      }
    }).then(function (ya) {
      if (!ya) return;
      var salah = Core.$('salah-kelas');
      var p = {
        name: Core.$('in-k-nama').value,
        academic_year: Core.$('in-k-tahun').value
      };
      if (classId) p.class_id = classId;

      Core.api('kelasSimpan', Core.ambilToken(), p)
        .then(function (hasil) {
          Core.toast(classId ? 'Kelas diperbarui.' : 'Kelas dibuat.', 'sukses');
          muatPilihan();
          if (!classId && hasil && hasil.class_id) {
            /* kelas baru → langsung dipilih agar bisa diisi murid */
            KELAS_DIPILIH = hasil.class_id;
            var sel = Core.$('sel-kelas');
            if (sel) sel.value = hasil.class_id;
            segarkanTombol();
          }
          muatDetail(KELAS_DIPILIH);
        })
        .catch(function (err) {
          Core.tampilkanPesanError(salah, err.message);
          dialogForm(classId);
        });
    });
  }

  /* ---------- enroll (tambah murid ke kelas) ---------- */

  function dialogEnroll(classId) {
    /* kontrak: kelasMuridTersedia(token, classId) — sudah mengecualikan
       murid yang terdaftar di kelas ini */
    Core.api('kelasMuridTersedia', Core.ambilToken(), classId).then(function (daftar) {
      if (!daftar.length) {
        Core.dialog({
          judul: 'Tambah murid',
          pesan: 'Semua murid aktif sudah ada di kelas ini. Buat murid baru ' +
                 'lewat menu Kelola Murid.',
          labelYa: 'Tutup',
          tanpaBatal: true
        });
        return;
      }
      /* rombel unik utk filter (Users.rombel) */
      var rombelSet = {};
      daftar.forEach(function (m) { if (m.rombel) rombelSet[m.rombel] = true; });
      var opsiRombel = Object.keys(rombelSet).sort(function (a, b) {
        return a.localeCompare(b, 'id', { numeric: true });
      }).map(function (r) {
        return '<option value="' + Core.esc(r) + '">' + Core.esc(r) + '</option>';
      }).join('');

      /* keadaan centang bertahan lintas penyaringan */
      var dipilih = {};   /* user_id → true */

      function barisPilih(m) {
        var lain = (m.kelas && m.kelas.length) ? ' · sudah di ' +
          m.kelas.map(function (k) { return k.name; }).join(', ') : '';
        return '<label class="pilih-baris">' +
          '<input type="checkbox" value="' + Core.esc(m.user_id) + '"' +
          (dipilih[m.user_id] ? ' checked' : '') + '>' +
          '<span class="avatar">' + Core.esc(Core.inisial(m.nama)) + '</span>' +
          '<span class="pilih-tengah"><b>' + Core.esc(m.nama) + '</b>' +
          '<small>' + Core.esc(m.username) +
          (m.rombel ? ' · ' + Core.esc(m.rombel) : '') + lain + '</small></span>' +
          '</label>';
      }

      function renderPilih() {
        var wadah = Core.$('pilih-list');
        if (!wadah) return;
        var rombel = Core.$('sel-rombel') ? Core.$('sel-rombel').value : '';
        var tampil = rombel
          ? daftar.filter(function (m) { return m.rombel === rombel; })
          : daftar;
        wadah.innerHTML = tampil.length
          ? tampil.map(barisPilih).join('')
          : '<div class="kosong">Tidak ada murid pada rombel ini.</div>';
        wadah.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.addEventListener('change', function () {
            if (cb.checked) dipilih[cb.value] = true;
            else delete dipilih[cb.value];
            hitung();
          });
        });
      }

      function hitung() {
        var n = Object.keys(dipilih).length;
        var el = Core.$('hitung-pilih');
        if (el) el.textContent = daftar.length + ' murid tersedia' +
          (n ? ' · ' + n + ' dipilih' : '');
      }

      Core.dialog({
        judul: '＋ Tambah murid ke kelas',
        pesan: 'Centang murid yang mau didaftarkan. Murid yang sudah di kelas ' +
               'lain bisa tetap dicentang — mereka ikut dua kelas sekaligus.',
        html:
          '<div class="pilih-alat">' +
            '<select class="isian" id="sel-rombel" style="width:auto">' +
              '<option value="">Semua rombel</option>' + opsiRombel + '</select>' +
            '<span class="kecil" id="hitung-pilih"></span>' +
          '</div>' +
          '<div class="pilih-list" id="pilih-list"></div>' +
          '<div class="pesan-salah" id="salah-enroll" style="margin-top:10px"></div>',
        labelYa: 'Daftarkan yang dicentang',
        saatBuka: function () {
          renderPilih();
          hitung();
          var sel = Core.$('sel-rombel');
          if (sel) sel.addEventListener('change', renderPilih);
        }
      }).then(function (ya) {
        if (!ya) return;
        /* kontrak: kelasEnroll(token, classId, userIds) — array STRING
           user_id, bukan objek (uji node uji-kelas memakai ['USR-…']) */
        var terpilih = Object.keys(dipilih);
        if (!terpilih.length) return;

        Core.api('kelasEnroll', Core.ambilToken(), classId, terpilih)
          .then(function (hasil) {
            Core.toast('Ditambahkan ' + (hasil.ditambah || 0) +
              ' murid · diaktifkan ' + (hasil.diaktifkan || 0) + '.', 'sukses');
            muatDetail(classId);
            muatPilihan();          /* jml siswa pada dropdown ikut segar */
          })
          .catch(function (err) {
            Core.tampilkanPesanError(Core.$('salah-enroll'), err.message);
          });
      });
    }).catch(function (err) { Core.toast(err.message, 'bahaya'); });
  }

  /* ---------- ekspor ----------
   * Endpoint ekspor Excel baru hadir bersama konten course
   * (tahap berikutnya); tombol tetap tampil sebagai penanda. */

  function ekspor() {
    Core.toast('Ekspor Excel tersedia setelah tahap konten course.');
  }

  Core.daftarRute('kelas', render);
  return { render: render };
})();
</script>
