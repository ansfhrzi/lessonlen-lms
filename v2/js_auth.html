<script>
/* ============================================================
   LMS v2 — js_auth.html
   Layar masuk, ganti kata sandi, lupa sandi, profil & biodata.
   Pola interaksi port dari js_auth v1: dialog global + toast,
   isian dipertahankan bila validasi gagal.
   ============================================================ */

/* ---------------------------------------------- RUTE: login */
daftarRute('login', function () {
  render('tpl-login');
  var app = document.getElementById('app');

  if (typeof APP_IKON !== 'undefined') $('#merek-ikon-login', app).textContent = APP_IKON;
  if (typeof APP_NAMA !== 'undefined') $('#merek-nama-login', app).textContent = APP_NAMA;
  if (typeof APP_VERSI !== 'undefined') $('#versi-login', app).textContent = 'v' + APP_VERSI;

  $('#btn-lupa', app).onclick = dialogLupa;

  $('#form-login', app).onsubmit = function (e) {
    e.preventDefault();
    var salah = $('#salah-login', app);
    salah.textContent = '';
    var btn = $('#btn-masuk', app);
    btn.disabled = true;
    btn.textContent = 'Memproses…';

    callApi('login', [
      $('#in-username', app).value.trim(),
      $('#in-password', app).value
    ], { diam: true }).then(function (d) {
      simpanToken(d.token);
      State.user = {
        user_id: d.user.user_id,
        username: d.user.username,
        nama: d.user.nama,
        role: d.user.role,
        harus_ganti_password: d.harus_ganti_password === true,
        biodata_kurang: d.biodata_kurang === true
      };
      State.biodata = d.biodata || null;
      State.ringkasan = null;

      if (d.harus_ganti_password) { location.hash = '#/ganti-password'; router(); return; }
      if (d.biodata_kurang) dialogBiodata(State.biodata || {});

      /* muat ringkasan dulu — beranda butuh angka statistik & lonceng */
      callApi('ringkasDashboard', [d.token], { diam: true })
        .then(function (r) {
          State.ringkasan = r;
          location.hash = '#/beranda';
          router();
        })
        .catch(function () {
          location.hash = '#/beranda';
          router();
        });
    }).catch(function (res) {
      salah.textContent = (res && res.pesan) || 'Gagal masuk.';
      btn.disabled = false;
      btn.textContent = 'Masuk';
    });
  };
});

/* ---------------------------------------------- lupa kata sandi */
function dialogLupa() {
  dialog({
    judul: '🔑 Lupa Kata Sandi',
    pesan: 'Isi nama pengguna atau email Anda.',
    html: ambilTemplate('tpl-lupa'),
    labelYa: 'Kirim Permintaan',
    labelBatal: 'Tutup'
  }).then(function (ya) {
    if (!ya) return;
    var isi = document.getElementById('in-lupa');
    var teks = isi ? isi.value.trim() : '';
    if (!teks) { toast('Isi dulu nama pengguna / email.', 'peringatan'); return; }

    callApi('ajukanReset', [teks], { diam: true })
      .then(function () {
        dialog({
          judul: 'Permintaan Terkirim',
          pesan: 'Permintaan Anda sudah diteruskan ke guru. ' +
                 'Anda akan diberi kata sandi sementara — ' +
                 'wajib diganti saat masuk berikutnya.',
          tanpaBatal: true, labelYa: 'Mengerti'
        });
      })
      .catch(function () { /* toast sudah tampil dari callApi */ });
  });
}

/* ---------------------------------------------- RUTE: ganti sandi */
daftarRute('ganti-password', function () {
  var app = render('tpl-dashboard');
  pasangTopbar(app);
  var isi = $('#isi-halaman', app);

  isi.innerHTML =
    '<div class="kepala-halaman"><h1>🔐 Ganti Kata Sandi</h1>' +
    '<p class="lembut kecil">Kata sandi Anda masih kata sandi sementara. ' +
    'Ganti dulu sebelum lanjut.</p></div>' +
    '<div class="kartu" style="max-width:480px">' +
      '<div class="grup"><label for="in-ganti-lama">Kata sandi lama</label>' +
        '<input class="isian" id="in-ganti-lama" type="password" ' +
        'autocomplete="current-password"></div>' +
      '<div class="grup"><label for="in-ganti-baru">Kata sandi baru</label>' +
        '<input class="isian" id="in-ganti-baru" type="password" ' +
        'autocomplete="new-password">' +
        '<span class="bantuan">Minimal 6 karakter, memuat huruf dan angka.</span></div>' +
      '<div class="pesan-salah" id="salah-ganti"></div>' +
      '<button class="btn btn-penuh mt-8" id="btn-ganti">Simpan kata sandi baru</button>' +
    '</div>';

  $('#btn-ganti', isi).onclick = function () {
    var btn = this;
    var salah = $('#salah-ganti', isi);
    salah.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Menyimpan…';

    callApi('gantiPassword', [State.token,
      $('#in-ganti-lama', isi).value,
      $('#in-ganti-baru', isi).value
    ], { diam: true }).then(function () {
      State.user.harus_ganti_password = false;
      toast('Kata sandi berhasil diganti.', 'sukses');
      pergiKe('#/beranda');
    }).catch(function (res) {
      salah.textContent = (res && res.pesan) || 'Gagal mengganti kata sandi.';
      btn.disabled = false;
      btn.textContent = 'Simpan kata sandi baru';
    });
  };
});

/* ---------------------------------------------- profil guru */
function dialogProfilGuru() {
  dialog({
    judul: '👤 Profil Saya',
    pesan: 'Akun guru sekaligus pengelola.',
    html:
      '<div class="kartu-rapat kartu" style="box-shadow:none">' +
        '<div class="baris-antara"><span class="kecil lembut">Nama</span>' +
          '<b>' + esc(State.user.nama) + '</b></div>' +
        '<div class="baris-antara mt-8"><span class="kecil lembut">Pengguna</span>' +
          '<b>@' + esc(State.user.username) + '</b></div>' +
        '<div class="baris-antara mt-8"><span class="kecil lembut">Peran</span>' +
          '<span class="lencana">Guru · Admin</span></div>' +
        (typeof APP_VERSI !== 'undefined'
          ? '<div class="baris-antara mt-8"><span class="kecil lembut">Versi</span>' +
            '<span class="kecil">v' + esc(APP_VERSI) + '</span></div>' : '') +
      '</div>',
    tombolTambahan:
      '<button class="btn btn-hantu" data-aksi="ganti-sandi">Ganti Kata Sandi</button>',
    tanpaYa: true, labelBatal: 'Tutup'
  }).then(function (hasil) {
    if (hasil === 'ganti-sandi') pergiKe('#/ganti-password');
  });
}

/* ---------------------------------------------- biodata murid */
function dialogBiodata(awal) {
  /* Tanpa data awal → coba dari benih login, lalu kosong. */
  if (!awal) awal = State.biodata || {};

  dialog({
    judul: '🪪 Lengkapi Biodata',
    pesan: 'Email dan nomor WhatsApp dipakai guru untuk menghubungi Anda.',
    html:
      '<div class="grup"><label for="d-email">Email <span class="wajib">*</span></label>' +
        '<input class="isian" id="d-email" type="email" value="' +
        esc(awal.email || '') + '" placeholder="nama@contoh.id"></div>' +
      '<div class="grup"><label for="d-wa">Nomor WhatsApp <span class="wajib">*</span></label>' +
        '<input class="isian" id="d-wa" type="tel" inputmode="numeric" value="' +
        esc(awal.no_wa || '') + '" placeholder="081234567890">' +
        '<span class="bantuan">Boleh ditulis 0812… atau +62812… — dirapikan otomatis.</span></div>' +
      '<div class="grup"><label for="d-nisn">NISN <span class="lembut">(opsional)</span></label>' +
        '<input class="isian" id="d-nisn" inputmode="numeric" value="' +
        esc(awal.nisn || '') + '" placeholder="mis. 0098765432"></div>',
    lebar: 'sedang',
    labelYa: 'Simpan',
    labelBatal: 'Nanti Saja'
  }).then(function (ya) {
    if (!ya) return;   /* ditunda — spanduk tetap mengingatkan */

    var el = function (id) { return document.getElementById(id); };
    var d = {
      email: el('d-email') ? el('d-email').value.trim() : '',
      no_wa: el('d-wa')    ? el('d-wa').value.trim()    : '',
      nisn:  el('d-nisn')  ? el('d-nisn').value.trim()  : ''
    };
    if (!d.email || !d.no_wa) {
      toast('Email dan nomor WhatsApp wajib diisi.', 'peringatan');
      dialogBiodata(d);      /* buka ulang — isian tidak hilang */
      return;
    }

    callApi('simpanBiodataSaya', [State.token, d], { diam: true })
      .then(function () {
        State.user.biodata_kurang = false;
        toast('Biodata tersimpan. Terima kasih.', 'sukses');
        router();     /* spanduk di beranda ikut hilang */
      })
      .catch(function (res) {
        toast((res && res.pesan) || 'Gagal menyimpan biodata.', 'bahaya');
        dialogBiodata(d);
      });
  });
}
</script>
