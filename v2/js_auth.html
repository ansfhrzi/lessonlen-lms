<script>
/* ============================================================
 *  LMS v2 — js_auth.html
 *  Layar masuk, lupa kata sandi, keluar,
 *  dialog ganti kata sandi & biodata murid
 *  (biodata: email + no WA + tanggal lahir wajib, NISN opsional)
 * ============================================================ */

var Auth = (function () {

  /* ---------- layar login ---------- */

  function tampilkanLogin(pesan) {
    Core.buangToken();
    Core.pasangTemplate('tpl-login');
    Core.pasangMerek();

    var salah = Core.$('salah-login');
    if (pesan) Core.tampilkanPesanError(salah, pesan);
    else Core.sembunyikanPesanError(salah);

    Core.$('in-username').focus();

    Core.$('form-login').addEventListener('submit', function (e) {
      e.preventDefault();
      masuk();
    });
    Core.$('btn-lupa').addEventListener('click', dialogLupa);
  }

  function masuk() {
    var u = Core.$('in-username').value;
    var p = Core.$('in-password').value;
    var salah = Core.$('salah-login');
    Core.sembunyikanPesanError(salah);
    Core.kirimForm(Core.$('btn-masuk'), true, 'Memeriksa…');

    Core.api('login', u, p).then(function (d) {
      Core.kirimForm(Core.$('btn-masuk'), false);
      Core.simpanToken(d.token);
      Core.muat();
    }).catch(function (err) {
      Core.kirimForm(Core.$('btn-masuk'), false);
      Core.tampilkanPesanError(salah, err.message);
    });
  }

  /* ---------- lupa kata sandi ---------- */

  function dialogLupa() {
    Core.dialog({
      judul: 'Lupa kata sandi / username?',
      pesan: 'Bila biodata Anda sudah lengkap (email, no WA, tanggal lahir), ' +
             'pemulihan mandiri tersedia di sini.',
      html:
        '<div class="grup"><label>Nama pengguna atau email</label>' +
        '<input class="isian" id="in-lupa" placeholder="mis. siswa01" ' +
        'autocapitalize="off" spellcheck="false">' +
        '<span class="bantuan">Permintaan diteruskan ke guru; guru akan ' +
        'memberi kata sandi sementara.</span></div>',
      labelYa: 'Kirim permintaan'
    }).then(function (ya) {
      if (!ya) return;
      var input = Core.$('in-lupa') ? Core.$('in-lupa').value : '';
      if (!String(input).trim()) return;
      Core.api('ajukanReset', input).then(function () {
        Core.toast('Permintaan terkirim. Hubungi guru untuk kata sandi sementara.', 'sukses');
      }).catch(function (err) {
        Core.toast(err.message, 'bahaya');
      });
    });
  }

  /* ---------- keluar ---------- */

  function keluar() {
    var t = Core.ambilToken();
    if (t) {
      Core.api('logout', t).catch(function () {}).then(function () {
        tampilkanLogin();
      });
    } else {
      tampilkanLogin();
    }
  }

  /* ---------- ganti kata sandi (wajib / mandiri) ---------- */

  function bukaGantiSandi() {
    Core.dialog({
      judul: '🔐 Wajib ganti kata sandi',
      pesan: 'Kata sandi Anda masih kata sandi sementara. Ganti sebelum lanjut.',
      html:
        '<div class="grup"><label>Kata sandi lama</label>' +
        '<input class="isian" id="in-ganti-lama" type="password" ' +
        'autocomplete="current-password"></div>' +
        '<div class="grup"><label>Kata sandi baru</label>' +
        '<input class="isian" id="in-ganti-baru" type="password" ' +
        'autocomplete="new-password">' +
        '<span class="bantuan">Minimal 6 karakter, memuat huruf dan angka.</span></div>' +
        '<div class="pesan-salah" id="salah-ganti"></div>',
      labelYa: 'Ganti kata sandi',
      tanpaBatal: true
    }).then(function (ya) {
      if (!ya) return;
      var lama = Core.$('in-ganti-lama').value;
      var baru = Core.$('in-ganti-baru').value;
      var salah = Core.$('salah-ganti');
      Core.sembunyikanPesanError(salah);
      if (!lama || !baru) {
        Core.tampilkanPesanError(salah, 'Isi kedua kata sandi.');
        bukaGantiSandi();
        return;
      }
      Core.api('gantiPassword', Core.ambilToken(), lama, baru)
        .then(function () {
          if (Core.state.user) Core.state.user.harus_ganti_password = false;
          Core.toast('Kata sandi diganti. Selamat datang!', 'sukses');
        })
        .catch(function (err) {
          Core.tampilkanPesanError(salah, err.message);
          bukaGantiSandi();
        });
    });
  }

  /* ---------- biodata murid (lupa akses mandiri) ---------- */

  function bukaBiodata(dariBeranda) {
    var biodata = (Core.state.ringkas && Core.state.ringkas.role === 'murid' &&
                   Core.state.user && Core.state.user.user_id)
      ? null : null;
    /* nilai terisi ikut dikirim supaya tidak diketik ulang */
    var b = (Core.state.user && Core.state.user.biodata) || {};

    Core.dialog({
      judul: '📋 Lengkapi biodata',
      pesan: 'Email, nomor WhatsApp, dan tanggal lahir dipakai agar Anda dapat ' +
             'memulihkan sandi/username sendiri bila lupa. NISN opsional.',
      html:
        '<div class="grup"><label>Email <span class="wajib">*</span></label>' +
        '<input class="isian" id="in-bio-email" type="email" value="' +
        Core.esc(b.email || '') + '" placeholder="nama@contoh.id"></div>' +
        '<div class="baris-form">' +
        '<div class="grup"><label>No. WhatsApp <span class="wajib">*</span></label>' +
        '<input class="isian" id="in-bio-wa" inputmode="numeric" value="' +
        Core.esc(b.no_wa || '') + '" placeholder="08xxxxxxxxxx"></div>' +
        '<div class="grup"><label>Tanggal lahir <span class="wajib">*</span></label>' +
        '<input class="isian" id="in-bio-tgl" type="date" value="' +
        Core.esc(b.tanggal_lahir || '') + '"></div>' +
        '</div>' +
        '<div class="grup"><label>NISN <span class="kecil">(opsional)</span></label>' +
        '<input class="isian" id="in-bio-nisn" inputmode="numeric" value="' +
        Core.esc(b.nisn || '') + '" placeholder="boleh dikosongkan"></div>' +
        '<div class="pesan-salah" id="salah-biodata"></div>',
      labelYa: 'Simpan biodata',
      tanpaBatal: !dariBeranda
    }).then(function (ya) {
      if (!ya) return;
      var salah = Core.$('salah-biodata');
      Core.sembunyikanPesanError(salah);
      Core.api('simpanBiodata', Core.ambilToken(), {
        email: Core.$('in-bio-email').value,
        no_wa: Core.$('in-bio-wa').value,
        tanggal_lahir: Core.$('in-bio-tgl').value,
        nisn: Core.$('in-bio-nisn').value
      }).then(function () {
        Core.toast('Biodata tersimpan.', 'sukses');
        if (Core.state.ringkas) Core.state.ringkas.biodata_kurang = false;
      }).catch(function (err) {
        Core.tampilkanPesanError(salah, err.message);
        bukaBiodata(dariBeranda);
      });
    });
  }

  return {
    tampilkanLogin: tampilkanLogin,
    keluar: keluar,
    bukaGantiSandi: bukaGantiSandi,
    bukaBiodata: bukaBiodata
  };
})();
</script>
