<script>
/* ============================================================
   LessonLen — js_kelola
   Kelola kelas, murid, enrollment  (guru)
   ============================================================ */

/* ---------------------------------------------- panel geser */

function panel(judul, isiHtml, aksiHtml) {
  var t = document.getElementById('tirai-panel');
  t.innerHTML =
    '<div class="panel">' +
      '<div class="panel-kepala">' +
        '<h3>' + esc(judul) + '</h3>' +
        '<button class="btn btn-teks" data-tutup="1">✕</button>' +
      '</div>' +
      '<div class="panel-isi">' + isiHtml + '</div>' +
      (aksiHtml ? '<div class="panel-kaki">' + aksiHtml + '</div>' : '') +
    '</div>';
  t.classList.add('tampil');

  t.onclick = function (e) {
    if (e.target === t || e.target.closest('[data-tutup]')) {
      var perlu = _panelKotor;
      _panelKotor = false;
      tutupPanel(perlu);
    }
  };
  return t;
}

/**
 * @param {boolean} segarkan  gambar ulang halaman di belakang panel.
 *   Wajib true bila panel mengubah data yang ikut tampil di halaman
 *   latar (mis. jumlah murid pada kartu kelas).
 */
function tutupPanel(segarkan) {
  var t = document.getElementById('tirai-panel');
  t.classList.remove('tampil');
  t.innerHTML = '';
  if (segarkan) router();
}

/* Menandai bahwa isi panel mengubah data halaman latar, sehingga saat
   panel ditutup dengan cara apa pun (tombol ✕, klik luar, Batal)
   halaman tetap disegarkan. */
var _panelKotor = false;
function tandaiPanelKotor() { _panelKotor = true; }

/* ---------------------------------------------- RUTE: daftar kelas */

daftarRute('kelas', function (arg) {
  if (!State.user || State.user.role !== 'guru') { pergiKe('#/beranda'); return; }
  if (arg && arg[0]) { layarPertemuan(arg[0]); return; }

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  /* Sidebar menu guru (v1.13.0) — penjaga typeof: layar tetap
     bekerja bila js_menu belum tersalin (§6.2 no. 82). */
  var isi = (typeof menuRangka === 'function')
    ? menuRangka(app, 'kelas') : $('#isi-halaman', app);
  isi.innerHTML = rangkaMuat(84, 3);

  (typeof daftarKelasBersama === 'function'
    ? daftarKelasBersama()
    : callApi('getDaftarKelas', [], { diam: true })).then(function (list) {
    /* daftar tingkat unik untuk filter */
    var tingkat = [];
    list.forEach(function (k) {
      if (k.tingkat && tingkat.indexOf(k.tingkat) === -1) tingkat.push(k.tingkat);
    });

    var html =
      '<button class="tautan-balik" onclick="pergiKe(\'#/beranda\')">‹ Beranda</button>' +
      '<div class="baris-antara mb-16">' +
        '<div><h1>Kelola Kelas</h1>' +
        '<p class="lembut kecil" id="cacah-kelas">' + list.length +
          ' kelas aktif</p></div>' +
        '<button class="btn" id="btn-kelas-baru">+ Kelas</button>' +
      '</div>' +
      (list.length > 3
        ? '<div class="grid-2 mb-16">' +
            '<div class="grup" style="margin:0"><input class="isian" id="cari-kelas" ' +
              'placeholder="Cari nama kelas atau mapel…"></div>' +
            (tingkat.length > 1
              ? '<div class="grup" style="margin:0">' +
                '<select class="isian" id="filter-tingkat">' +
                '<option value="">Semua tingkat</option>' +
                tingkat.sort().map(function (t) {
                  return '<option value="' + esc(t) + '">Kelas ' + esc(t) + '</option>';
                }).join('') + '</select></div>'
              : '') +
          '</div>'
        : '');

    html += list.length
      ? '<div class="kolom" id="daftar-kelas">' + list.map(function (k) {
          return '<div class="kartu kartu-kelas-baris" data-cari="' +
            esc((k.nama_kelas + ' ' + (k.mapel || '')).toLowerCase()) +
            '" data-tingkat="' + esc(k.tingkat || '') + '">' +
            '<div class="baris-antara mb-8">' +
              '<div style="min-width:0">' +
                '<div class="tebal" style="font-size:1.05rem">' +
                  esc(namaKelasLengkap(k)) + '</div>' +
                '<div class="mt-8">' +
                  (k.jenjang ? '<span class="pil">' + esc(k.jenjang) + '</span>' : '') +
                  (k.fase ? '<span class="pil">Fase ' + esc(k.fase) + '</span>' : '') +
                  (k.tingkat ? '<span class="pil">Kelas ' + esc(k.tingkat) + '</span>' : '') +
                  (k.kompetensi_keahlian
                    ? '<span class="pil">' + esc(k.kompetensi_keahlian) + '</span>' : '') +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="baris kecil lembut" style="gap:14px">' +
              '<span>👥 ' + k.jml_murid + ' murid</span>' +
              '<span>📅 ' + k.jml_pertemuan + ' pertemuan</span>' +
            '</div>' +
            '<div class="baris sela-kecil mt-16" style="flex-wrap:wrap">' +
              '<button class="btn btn-kecil" data-ptm="' + esc(k.kelas_id) + '">' +
                'Pertemuan</button>' +
              '<button class="btn btn-hantu btn-kecil" data-murid="' +
                esc(k.kelas_id) + '">Murid</button>' +
              '<button class="btn btn-hantu btn-kecil" data-rekap="' +
                esc(k.kelas_id) + '" title="Nilai LKPD, Quiz, dan Tugas ' +
                'Kelompok seluruh murid kelas ini">' +
                '📊 Rekap</button>' +
              '<button class="btn btn-hantu btn-kecil" data-refleksi="' +
                esc(k.kelas_id) + '" title="Rekap refleksi seluruh kelas">' +
                '🪞 Refleksi</button>' +
              '<button class="btn btn-hantu btn-kecil" data-edit="' +
                esc(k.kelas_id) + '">Ubah</button>' +
              '<button class="btn btn-hantu btn-kecil" data-dup="' +
                esc(k.kelas_id) + '" data-nama="' + esc(k.nama_kelas) +
                '" title="Buat kelas baru dengan pengaturan sama">⧉ Duplikat</button>' +
              '<button class="btn btn-teks btn-kecil" data-hapus="' +
                esc(k.kelas_id) + '" data-nama="' + esc(k.nama_kelas) + '">Hapus</button>' +
            '</div></div>';
        }).join('') + '</div>'
      : kosongkan('📚', 'Belum ada kelas',
          'Buat kelas pertama Anda untuk mulai menyusun materi.');

    isi.innerHTML = html;

    $('#btn-kelas-baru', isi).onclick = function () { formKelas(null); };

    var elCari = $('#cari-kelas', isi);
    var elTk = $('#filter-tingkat', isi);
    function saringKelas() {
      var q = (elCari ? elCari.value : '').toLowerCase();
      var tk = elTk ? elTk.value : '';
      var n = 0;
      $$('.kartu-kelas-baris', isi).forEach(function (el) {
        var ok = el.dataset.cari.indexOf(q) !== -1 &&
                 (!tk || el.dataset.tingkat === tk);
        el.style.display = ok ? '' : 'none';
        if (ok) n++;
      });
      var c = $('#cacah-kelas', isi);
      if (c) c.textContent = (q || tk) ? n + ' kelas ditampilkan'
                                       : n + ' kelas aktif';
    }
    if (elCari) elCari.oninput = saringKelas;
    if (elTk) elTk.onchange = saringKelas;

    isi.onclick = function (e) {
      var b;
      if ((b = e.target.closest('[data-ptm]')))
        pergiKe('#/kelas/' + b.dataset.ptm);
      else if ((b = e.target.closest('[data-murid]')))
        panelMuridKelas(b.dataset.murid);
      else if ((b = e.target.closest('[data-rekap]')))
        pergiKe('#/rekap/' + b.dataset.rekap);
      else if ((b = e.target.closest('[data-refleksi]')))
        pergiKe('#/refleksi-kelas/' + b.dataset.refleksi);
      else if ((b = e.target.closest('[data-edit]')))
        formKelas(b.dataset.edit);
      else if ((b = e.target.closest('[data-dup]')))
        panelDuplikat(b.dataset.dup, b.dataset.nama);
      else if ((b = e.target.closest('[data-hapus]')))
        hapusKelasKonfirmasi(b.dataset.hapus, b.dataset.nama);
    };
  });
});

/* ---------------------------------------------- form kelas */

function formKelas(kelasId) {
  var muat = kelasId
    ? callApi('getDetailKelas', [kelasId], { diam: true })
    : Promise.resolve({});

  muat.then(function (k) {
    k = k || {};
    var opsi = function (arr, terpilih) {
      return arr.map(function (v) {
        return '<option value="' + v + '"' +
               (String(terpilih) === v ? ' selected' : '') + '>' + v + '</option>';
      }).join('');
    };

    panel(kelasId ? 'Ubah Kelas' : 'Kelas Baru',
      '<div class="grup"><label>Nama Kelas *</label>' +
        '<input class="isian" id="f-nama" value="' + esc(k.nama_kelas || '') +
        '" placeholder="mis. XI TJKT 1"></div>' +
      '<div class="grup"><label>Mata Pelajaran *</label>' +
        '<input class="isian" id="f-mapel" value="' + esc(k.mapel || '') +
        '" placeholder="mis. Pemasangan dan Konfigurasi Peralatan Jaringan"></div>' +
      '<div class="grid-2">' +
        '<div class="grup"><label>Jenjang</label><select class="isian" id="f-jenjang">' +
          '<option value="">—</option>' + opsi(['SD','SMP','SMA','SMK'], k.jenjang) +
        '</select></div>' +
        '<div class="grup"><label>Fase</label><select class="isian" id="f-fase">' +
          '<option value="">—</option>' + opsi(['A','B','C','D','E','F'], k.fase) +
        '</select></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="grup"><label>Tingkat</label><select class="isian" id="f-tingkat">' +
          '<option value="">—</option>' +
          opsi(['VII','VIII','IX','X','XI','XII'], k.tingkat) +
        '</select></div>' +
        '<div class="grup"><label>Alokasi JP</label>' +
          '<input class="isian" id="f-jp" type="number" min="0" value="' +
          esc(k.alokasi_jp || '') + '"></div>' +
      '</div>' +
      '<div class="grup"><label>Kompetensi Keahlian</label>' +
        '<input class="isian" id="f-keahlian" value="' +
        esc(k.kompetensi_keahlian || '') + '" placeholder="mis. TJKT"></div>' +
      '<div class="grup"><label>Capaian Pembelajaran</label>' +
        '<textarea class="isian" id="f-cp" rows="6" placeholder="Tempel CP dari kurikulum…">' +
        esc(k.capaian_pembelajaran || '') + '</textarea>' +
        '<span class="bantuan">Dipakai AI sebagai konteks saat membuat materi.</span></div>' +
      '<div class="grup"><label>Catatan Gaya (untuk AI)</label>' +
        '<textarea class="isian" id="f-gaya" rows="3" placeholder="mis. Gunakan contoh MikroTik dan Cisco Packet Tracer">' +
        esc(k.catatan_gaya || '') + '</textarea></div>',

      '<button class="btn btn-hantu" data-tutup="1">Batal</button>' +
      '<button class="btn" id="btn-simpan-kelas">Simpan</button>'
    );

    $('#btn-simpan-kelas').onclick = function () {
      var p = {
        kelas_id: kelasId || '',
        nama_kelas: $('#f-nama').value.trim(),
        mapel: $('#f-mapel').value.trim(),
        jenjang: $('#f-jenjang').value,
        fase: $('#f-fase').value,
        tingkat: $('#f-tingkat').value,
        alokasi_jp: $('#f-jp').value,
        kompetensi_keahlian: $('#f-keahlian').value.trim(),
        capaian_pembelajaran: $('#f-cp').value.trim(),
        catatan_gaya: $('#f-gaya').value.trim()
      };
      if (!p.nama_kelas || !p.mapel) {
        toast('Nama kelas dan mata pelajaran wajib diisi.', 'peringatan');
        return;
      }
      callApi('simpanKelas', [p], { tombol: $('#btn-simpan-kelas') })
        .then(function (r) {
          _panelKotor = false;
          tutupPanel(true);
          /* Daftar kelas di sidebar berubah (v1.13.0). */
          if (typeof bataliMenuKelas === 'function') bataliMenuKelas();
          toast(r.baru ? 'Kelas dibuat.' : 'Perubahan disimpan.', 'sukses');
        });
    };
  });
}

/* ---------------------------------------------- duplikat kelas */

function panelDuplikat(kelasId, nama) {
  panel('Duplikat Kelas',
    '<p class="bantuan mb-16">Seluruh pengaturan <b>' + esc(nama) + '</b> — ' +
    'mata pelajaran, jenjang, fase, kompetensi keahlian, capaian ' +
    'pembelajaran, dan catatan gaya AI — disalin ke kelas baru.</p>' +

    '<div class="grup"><label>Jumlah salinan</label>' +
      '<select class="isian" id="dup-jml">' +
        '<option value="1">1 kelas — tentukan namanya</option>' +
        '<option value="3">3 kelas — penomoran otomatis</option>' +
        '<option value="5">5 kelas — penomoran otomatis</option>' +
        '<option value="11">11 kelas — penomoran otomatis</option>' +
      '</select></div>' +

    '<div class="grup" id="grup-nama"><label>Nama kelas baru</label>' +
      '<input class="isian" id="dup-nama" placeholder="mis. ' +
      esc(_namaTebakan(nama)) + '" value="' + esc(_namaTebakan(nama)) + '"></div>' +

    '<div class="kartu kartu-rapat mb-16 sembunyi" id="info-otomatis">' +
      '<div class="kecil lembut">Nama dibuat otomatis dengan menaikkan ' +
      'angka pada nama kelas, melewati nama yang sudah dipakai.</div></div>' +

    '<label class="baris sela-kecil" style="cursor:pointer">' +
      '<input type="checkbox" id="dup-isi">' +
      '<span><b>Sertakan pertemuan dan materi</b><br>' +
      '<span class="kecil lembut">Seluruh isi disalin sebagai draf. ' +
      'Kosongkan bila hanya ingin pengaturan kelasnya.</span></span></label>',

    '<button class="btn btn-hantu" data-tutup="1">Batal</button>' +
    '<button class="btn" id="btn-dup-jalan">Duplikat</button>'
  );

  $('#dup-jml').onchange = function () {
    var satu = this.value === '1';
    $('#grup-nama').classList.toggle('sembunyi', !satu);
    $('#info-otomatis').classList.toggle('sembunyi', satu);
  };

  $('#btn-dup-jalan').onclick = function () {
    var jml = Number($('#dup-jml').value);
    var namaBaru = jml === 1 ? $('#dup-nama').value.trim() : '';
    if (jml === 1 && !namaBaru) {
      toast('Isi nama kelas baru.', 'peringatan');
      return;
    }
    callApi('duplikatKelas',
            [kelasId, namaBaru, $('#dup-isi').checked, jml],
            { tombol: this })
      .then(function (r) {
        _panelKotor = false;
        tutupPanel(true);
        if (typeof bataliMenuKelas === 'function') bataliMenuKelas();
        dialog({
          judul: r.jumlah + ' Kelas Dibuat',
          pesan: r.nama.map(function (n) { return '• ' + esc(n); }).join('<br>') +
            (r.isi.pertemuan
              ? '<br><br>Termasuk ' + r.isi.pertemuan + ' pertemuan dan ' +
                r.isi.item + ' item — semuanya berstatus <b>draf</b>.'
              : '<br><br>Kelas masih kosong. Tambahkan pertemuan lewat ' +
                'menu Pertemuan.'),
          tanpaBatal: true, labelYa: 'Mengerti'
        });
      });
  };
}

/** Tebak nama berikutnya: "XI TJKT 1" → "XI TJKT 2" */
function _namaTebakan(nama) {
  var m = String(nama).match(/^(.*?)(\d+)(\D*)$/);
  return m ? m[1] + (Number(m[2]) + 1) + m[3] : nama + ' 2';
}

function hapusKelasKonfirmasi(kelasId, nama) {
  konfirmasi('Hapus Kelas',
    'Kelas <b>' + esc(nama) + '</b> beserta SELURUH pertemuan, item, soal, ' +
    'dan progres murid akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.',
    { labelYa: 'Hapus Permanen', bahaya: true })
    .then(function (ya) {
      if (!ya) return;
      callApi('hapusKelas', [kelasId]).then(function () {
        if (typeof bataliMenuKelas === 'function') bataliMenuKelas();
        toast('Kelas dihapus.', 'sukses');
        router();
      });
    });
}

/* ---------------------------------------------- panel murid kelas */

function panelMuridKelas(kelasId) {
  callApi('getMuridKelas', [kelasId], { diam: true }).then(function (list) {
    panel('Murid di Kelas',
      '<div class="baris-antara mb-16">' +
        '<span class="kecil lembut">' + list.length + ' murid terdaftar</span>' +
        '<button class="btn btn-kecil" id="btn-tambah-murid">+ Daftarkan</button>' +
      '</div>' +
      (list.length
        ? '<div class="kolom sela-kecil">' + list.map(function (m) {
            return '<div class="baris-antara kartu kartu-rapat">' +
              '<div style="min-width:0"><div class="tebal kecil">' +
                esc(m.nama) + '</div>' +
              '<div class="kecil lembut"><code>' + esc(m.username) + '</code>' +
              (m.sudah_ganti
                ? ' · 🔒 sandi diganti'
                : ' · <code class="salin" data-salin="' + esc(m.pwd_awal) +
                  '">' + esc(m.pwd_awal) + '</code>') +
              '</div></div>' +
              '<div class="baris" style="gap:2px">' +
              '<button class="btn btn-teks btn-kecil" data-kunci="' +
                esc(m.user_id) + '" title="Buka kunci item untuk murid ini">' +
                '🔓</button>' +
              '<button class="btn btn-teks btn-kecil" data-keluar="' +
                esc(m.user_id) + '" data-nama="' + esc(m.nama) + '">Keluarkan</button>' +
              '</div>' +
            '</div>';
          }).join('') + '</div>'
        : '<div class="kosong"><div class="ikon">👥</div>' +
          '<p class="kecil">Belum ada murid di kelas ini.</p></div>'),
      '<button class="btn btn-hantu" data-tutup="1">Tutup</button>' +
      (list.length ? '<button class="btn btn-hantu" id="btn-unduh-kelas">' +
                     '⬇ CSV</button>' : '')
    );

    $('#btn-tambah-murid').onclick = function () { panelPilihMurid(kelasId); };
    var bu = $('#btn-unduh-kelas');
    if (bu) bu.onclick = function () {
      callApi('unduhCsvMurid', [kelasId], { tombol: bu }).then(function (d) {
        unduhBerkas(d.nama_berkas, d.csv);
        toast(d.jumlah + ' murid diekspor.', 'sukses');
      });
    };

    $('.panel-isi').onclick = function (e) {
      var sl = e.target.closest('[data-salin]');
      if (sl) { salinTeks(sl.dataset.salin); return; }
      var bk = e.target.closest('[data-kunci]');
      if (bk) { panelKunciMurid(bk.dataset.kunci, kelasId); return; }
      var b = e.target.closest('[data-keluar]');
      if (!b) return;
      konfirmasi('Keluarkan Murid',
        esc(b.dataset.nama) + ' akan dikeluarkan dari kelas ini. ' +
        'Progres belajarnya tetap tersimpan.',
        { labelYa: 'Keluarkan' }).then(function (ya) {
          if (!ya) return;
          callApi('keluarkanMurid', [kelasId, b.dataset.keluar]).then(function () {
            toast('Murid dikeluarkan.', 'sukses');
            tandaiPanelKotor();
            panelMuridKelas(kelasId);
          });
        });
    };
  });
}

function panelPilihMurid(kelasId) {
  callApi('getMuridTersedia', [kelasId], { diam: true }).then(function (list) {
    panel('Daftarkan Murid',
      '<div class="grup"><input class="isian" id="cari-murid" ' +
        'placeholder="Cari nama, username, rombel, atau kelas…">' +
        '<span class="bantuan">Ketik rombel untuk menyaring satu ' +
        'rombongan sekaligus — mis. "XII TKJ 1".</span></div>' +
      (function () {
        var ada = {}, urut = [];
        list.forEach(function (m) {
          if (m.rombel && !ada[m.rombel]) { ada[m.rombel] = 1; urut.push(m.rombel); }
        });
        if (!urut.length) return '';
        urut.sort();
        return '<div class="grup"><select class="isian" id="saring-rombel">' +
          '<option value="">Semua rombel</option>' +
          urut.map(function (r) {
            return '<option value="' + esc(r) + '">' + esc(r) + '</option>';
          }).join('') + '</select></div>';
      })() +
      (list.length
        ? '<div class="kotak-pilih" id="kotak-murid">' + list.map(function (m) {
            /* Kelas murid WAJIB terlihat. Nama murid tidak unik —
               "Ahmad" bisa anak XII TKJ 1 atau XII TKJ 2 — dan tanpa
               penanda ini guru salah mendaftarkan (laporan v1.6.3). */
            var kls = m.kelas || [];
            var pilRombel = m.rombel
              ? '<span class="pil">' + esc(m.rombel) + '</span>' : '';
            var ketKelas = kls.length
              ? kls.map(function (k) {
                  return '<span class="pil pil-kelas">' +
                    esc(k.nama_kelas) +
                    (k.mapel ? ' <span class="lembut">· ' + esc(k.mapel) +
                               '</span>' : '') +
                    '</span>';
                }).join('')
              : '<span class="lencana lencana-peringatan">belum punya kelas</span>';

            /* ikut tersaring saat guru mengetik nama kelas */
            var cari = String(m.nama) + ' ' + String(m.username) + ' ' +
              String(m.rombel || '') + ' ' +
              kls.map(function (k) {
                return k.nama_kelas + ' ' + (k.mapel || '');
              }).join(' ');

            return '<label class="pilih-baris" data-rombel="' +
              esc(m.rombel || '') + '" data-nama="' +
              esc(cari.toLowerCase()) + '">' +
              '<input type="checkbox" value="' + esc(m.user_id) + '">' +
              '<span class="tumbuh"><span class="kecil tebal">' + esc(m.nama) +
              '</span><br><span class="kecil lembut">' + esc(m.username) +
              '</span><div class="baris-pil mt-4">' + pilRombel + ketKelas +
              '</div>' +
              '</span></label>';
          }).join('') + '</div>' +
          '<div class="baris-antara mt-8">' +
            '<button class="btn btn-teks btn-kecil" id="pilih-semua">Pilih semua</button>' +
            '<span class="kecil lembut" id="jml-pilih">0 dipilih</span>' +
          '</div>'
        : '<div class="kosong"><div class="ikon">✅</div>' +
          '<p class="kecil">Semua murid sudah terdaftar di kelas ini.</p></div>') +
      '<hr style="margin:20px 0;border:none;border-top:1px solid var(--garis)">' +
      '<button class="btn btn-hantu btn-penuh" id="btn-impor">' +
        '⬆ Impor Murid Baru ke Kelas Ini</button>',

      '<button class="btn btn-hantu" data-tutup="1">Batal</button>' +
      (list.length ? '<button class="btn" id="btn-daftarkan">Daftarkan</button>' : '')
    );

    var kotak = $('#kotak-murid');
    function hitung() {
      var n = kotak ? $$('input:checked', kotak).length : 0;
      var el = $('#jml-pilih');
      if (el) el.textContent = n + ' dipilih';
    }
    if (kotak) {
      kotak.onchange = hitung;
      $('#pilih-semua').onclick = function () {
        var semua = $$('input', kotak);
        var adaYangKosong = semua.some(function (c) { return !c.checked; });
        semua.forEach(function (c) {
          if (c.closest('.pilih-baris').style.display !== 'none') c.checked = adaYangKosong;
        });
        hitung();
      };
      function saringMurid() {
        var q = ($('#cari-murid').value || '').toLowerCase();
        var elR = $('#saring-rombel');
        var rb = elR ? elR.value : '';
        $$('.pilih-baris', kotak).forEach(function (l) {
          var cocokQ = l.dataset.nama.indexOf(q) !== -1;
          var cocokR = !rb || (l.dataset.rombel || '') === rb;
          l.style.display = (cocokQ && cocokR) ? '' : 'none';
        });
      }
      $('#cari-murid').oninput = saringMurid;
      if ($('#saring-rombel')) $('#saring-rombel').onchange = saringMurid;
    }

    var bd = $('#btn-daftarkan');
    if (bd) bd.onclick = function () {
      var ids = $$('input:checked', kotak).map(function (c) { return c.value; });
      if (!ids.length) { toast('Pilih minimal satu murid.', 'peringatan'); return; }
      callApi('enrollMurid', [kelasId, ids], { tombol: bd }).then(function (r) {
        toast(r.ditambah + r.diaktifkan + ' murid didaftarkan.', 'sukses');
        tandaiPanelKotor();          /* jumlah murid di kartu kelas berubah */
        panelMuridKelas(kelasId);
      });
    };

    $('#btn-impor').onclick = function () {
      (typeof daftarKelasBersama === 'function'
    ? daftarKelasBersama()
    : callApi('getDaftarKelas', [], { diam: true })).then(function (kls) {
        panelImpor(kls, kelasId);
      });
    };
  });
}

        '<code>Citra Dewi, XII TKJ 1</code> — username &amp; sandi otomatis<br>' +

        '<code>1. Budi Santoso</code> — nomor urut dibuang otomatis<br><br>' +

function gambarPratinjau(pv) {
  var h = '<hr style="margin:16px 0;border:none;border-top:1px solid var(--garis)">';

  h += '<div class="baris sela-kecil mb-8" style="flex-wrap:wrap">' +
    '<span class="lencana lencana-sukses">' + pv.siap.length + ' siap</span>' +
    (pv.jml_diubah ? '<span class="lencana lencana-peringatan">' +
       pv.jml_diubah + ' pengguna disesuaikan</span>' : '') +
    (pv.masalah.length ? '<span class="lencana lencana-bahaya">' +
       pv.masalah.length + ' dilewati</span>' : '') +
    '</div>';

  if (pv.masalah.length) {
    h += '<div class="kartu kartu-rapat mb-8" ' +
      'style="border-color:var(--bahaya)"><div class="kecil tebal mb-8">' +
      'Baris yang dilewati</div>' +
      pv.masalah.map(function (m) {
        return '<div class="kecil lembut">Baris ' + m.baris + ': ' +
               esc(m.teks.slice(0, 40)) + ' — ' + esc(m.alasan) + '</div>';
      }).join('') + '</div>';
  }

  if (pv.siap.length) {
    h += '<div class="tabel-gulir" style="max-height:260px;overflow-y:auto">' +
      '<table class="tabel"><thead><tr><th>#</th><th>Nama</th>' +
      '<th>Rombel</th><th>Nama Pengguna</th><th>Sandi</th>' +
      '</tr></thead><tbody>' +
      pv.siap.map(function (x, i) {
        return '<tr><td class="kecil lembut">' + (i + 1) + '</td>' +
          '<td class="tebal">' + esc(x.nama) + '</td>' +
          '<td>' + (x.rombel
            ? '<span class="pil">' + esc(x.rombel) + '</span>'
            : '<span class="kecil lembut">—</span>') + '</td>' +
          '<td><code>' + esc(x.username) + '</code>' +
          (x.diubah ? '<br><span class="kecil" style="color:var(--peringatan)">' +
            esc(x.catatan) + '</span>' : '') + '</td>' +
          '<td class="kecil lembut">' +
            (x.sandi_sendiri ? 'dari Anda' : 'otomatis') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="bantuan mt-8">Periksa kolom <b>Rombel</b> — bila terisi ' +
      'nama pengguna, berarti urutan kolomnya belum sesuai. Sandi ' +
      '"otomatis" ditampilkan setelah impor; salin sebelum menutup.</p>';
  }
  return h;
}

function tampilkanHasilImpor(r, kelasId) {
  var baris = r.daftar.map(function (d) {
    return '<tr><td>' + esc(d.nama) + '</td><td><code>' + esc(d.username) +
           '</code></td><td><code>' + esc(d.password) + '</code></td></tr>';
  }).join('');

  var csv = 'Nama,Nama Pengguna,Kata Sandi\r\n' +
    r.daftar.map(function (d) {
      return [d.nama, d.username, d.password].map(function (v) {
        var t = String(v);
        return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
      }).join(',');
    }).join('\r\n');

  dialog({
    judul: r.berhasil + ' Murid Ditambahkan',
    pesan: 'Kata sandi tetap dapat dilihat di daftar murid sampai murid ' +
           'menggantinya sendiri.',
    html: '<div class="tabel-gulir mt-8" style="max-height:280px;overflow-y:auto">' +
          '<table class="tabel"><thead><tr><th>Nama</th><th>Pengguna</th>' +
          '<th>Kata Sandi</th></tr></thead><tbody>' + baris + '</tbody></table></div>' +
          (r.gagal.length
            ? '<p class="pesan-salah mt-8">' + r.gagal.length + ' baris gagal: ' +
              esc(r.gagal.join('; ')) + '</p>' : ''),
    labelBatal: '⬇ Unduh CSV', labelYa: 'Selesai'
  }).then(function (ya) {
    if (!ya) {
      unduhBerkas('Murid_Baru_' +
        new Date().toISOString().slice(0, 10).replace(/-/g, '') + '.csv', csv);
      tampilkanHasilImpor(r, kelasId);
      return;
    }
    if (kelasId) panelMuridKelas(kelasId);
    else { _panelKotor = false; tutupPanel(true); }

      /* Rombel adalah LABEL murid, bukan kelas-mapel — filternya

      (function () {

        });

            return '<option value="' + esc(r) + '">' + esc(r) + '</option>';
          }).join('') +
          '</select><span class="bantuan">Rombel hanya label untuk ' +
          'menyaring — tidak menentukan kelas-mapel murid.</span></div>';
      })() +
      '<label class="baris sela-kecil kecil lembut mb-16" style="cursor:pointer">' +
        '<input type="checkbox" id="tampil-sandi"> Tampilkan kata sandi</label>' +

          '<table class="tabel"><thead><tr><th>Nama</th><th>Rombel</th>' +
          '<th>Kelas-Mapel</th>' +
          '<th>Pengguna</th><th class="kol-sandi sembunyi">Kata Sandi</th>' +
          '<th>Biodata</th>' +
          '<th>Status</th><th></th></tr></thead><tbody id="tbody-murid">' +
          list.map(barisMurid).join('') + '</tbody></table></div></div>'
        : kosongkan('👥', 'Belum ada murid', 'Tambahkan murid pertama Anda.'));

    $('#btn-unduh', isi).onclick = function () { dialogUnduh(kelas); };
    $('#btn-unduh-bio', isi).onclick = function () { dialogUnduhBiodata(kelas); };
    $('#btn-impor-murid', isi).onclick = function () { panelImpor(kelas, ''); };

    function saring() {
      var q = ($('#cari', isi).value || '').toLowerCase();
      var kid = $('#filter-kelas', isi).value;
      var elR = $('#filter-rombel', isi);
      var rb = elR ? elR.value : '';
      var n = 0;
      $$('#tbody-murid tr').forEach(function (tr) {
        var cocokQ = tr.dataset.cari.indexOf(q) !== -1;
        var daftarKelas = tr.dataset.kelas || '';
        var cocokK = !kid ||
          (kid === '__none__' ? daftarKelas === ''
                              : daftarKelas.indexOf(kid) !== -1);
        var rombel = tr.dataset.rombel || '';
        var cocokR = !rb ||
          (rb === '__none__' ? rombel === '' : rombel === rb);
        var tampil = cocokQ && cocokK && cocokR;
        tr.style.display = tampil ? '' : 'none';
        if (tampil) n++;
      });
      $('#cacah-murid', isi).textContent = n + ' murid ditampilkan';
    }
    $('#cari', isi).oninput = saring;
    $('#filter-kelas', isi).onchange = saring;
    if ($('#filter-rombel', isi)) $('#filter-rombel', isi).onchange = saring;

    $('#tampil-sandi', isi).onchange = function () {
      var tampil = this.checked;
      $$('.kol-sandi', isi).forEach(function (el) {
        el.classList.toggle('sembunyi', !tampil);
      });
    };

    isi.onclick = function (e) {
      var b;
      if ((b = e.target.closest('[data-edit-murid]'))) formMurid(b.dataset.editMurid);
      else if ((b = e.target.closest('[data-reset]')))
        resetMuridLangsung(b.dataset.reset, b.dataset.nama);
      else if ((b = e.target.closest('[data-salin]'))) {
        salinTeks(b.dataset.salin);
      }
    };
  });
});

/** Picu unduhan berkas dari string di sisi klien. */
function unduhBerkas(nama, isi) {
  var bom = '\uFEFF';                       /* agar Excel membaca UTF-8 */
  var blob = new Blob([bom + isi], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = nama;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function salinTeks(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () {
      toast('Disalin: ' + t, 'sukses', 2);
    }).catch(function () { toast('Gagal menyalin.', 'peringatan'); });
  } else {
    toast(t, 'sukses', 4);
  }
}

/* ---------------------------------------------- sel biodata (v1.11.0)

   Ringkas dengan sengaja: satu lencana status, lalu tautan WhatsApp
   yang langsung dapat diklik. NISN & email lengkapnya ada di form
   Ubah — menampilkan semuanya membuat tabel terlalu lebar di ponsel,
   dan yang paling sering dibutuhkan guru adalah menghubungi murid. */
function selBiodata(m) {
  if (!m.biodata_lengkap) {
    return '<span class="lencana lencana-peringatan" ' +
      'title="Murid belum melengkapi email atau nomor WhatsApp">' +
      'belum</span>';
  }
  var wa = m.no_wa
    ? '<a class="kecil" href="https://wa.me/' + esc(m.no_wa) + '" ' +
      'target="_blank" rel="noopener" title="Hubungi lewat WhatsApp" ' +
      'onclick="event.stopPropagation()">💬 WA</a>'
    : '';
  return '<span class="lencana lencana-sukses">lengkap</span> ' + wa;
}

function barisMurid(m) {
  var sandi = m.sudah_ganti
    ? '<span class="kecil lembut" title="Murid sudah mengganti sandinya sendiri">' +
      '🔒 sudah diganti</span>'
    : '<code class="salin" data-salin="' + esc(m.pwd_awal) + '" ' +
      'title="Klik untuk menyalin">' + esc(m.pwd_awal) + '</code>';

  return '<tr data-cari="' +
    esc((m.nama + ' ' + m.username + ' ' + (m.rombel || '')).toLowerCase()) +
    '" data-kelas="' + esc(m.kelas_id.join(' ')) +
    '" data-rombel="' + esc(m.rombel || '') + '">' +
    '<td class="tebal">' + esc(m.nama) + '</td>' +
    '<td>' + (m.rombel
      ? '<span class="pil">' + esc(m.rombel) + '</span>'
      : '<span class="kecil lembut">—</span>') + '</td>' +
    '<td>' + ((m.kelas_mapel || []).length
      ? m.kelas_mapel.map(function (k) {
          return '<span class="pil pil-kelas">' + labelKelas(k) + '</span>';
        }).join('')
      : '<span class="lencana lencana-peringatan">tanpa kelas</span>') + '</td>' +
    '<td><code class="salin" data-salin="' + esc(m.username) + '">' +
      esc(m.username) + '</code></td>' +
    '<td class="kol-sandi sembunyi">' + sandi + '</td>' +
    '<td>' + selBiodata(m) + '</td>' +
    '<td>' + (m.status === 'aktif'
      ? '<span class="lencana lencana-sukses">aktif</span>'
      : '<span class="lencana lencana-terkunci">nonaktif</span>') +
      (m.harus_ganti_password
        ? ' <span class="lencana lencana-peringatan">belum ganti</span>' : '') + '</td>' +
    '<td style="white-space:nowrap">' +
      '<button class="btn btn-teks btn-kecil" data-edit-murid="' +
        esc(m.user_id) + '">Ubah</button>' +
      '<button class="btn btn-teks btn-kecil" data-reset="' + esc(m.user_id) +
        '" data-nama="' + esc(m.nama) + '">Reset</button>' +
    '</td></tr>';
}

function formMurid(userId, kelasTerpilih) {
  var data = null;
  if (userId) {
    var semua = State.cache.murid || [];
    for (var i = 0; i < semua.length; i++) {
      if (semua[i].user_id === userId) { data = semua[i]; break; }
    }
  }
  (typeof daftarKelasBersama === 'function'
    ? daftarKelasBersama()
    : callApi('getDaftarKelas', [], { diam: true })).then(function (kelas) {
    gambarFormMurid(userId, data, kelas, kelasTerpilih);
  });
}

function gambarFormMurid(userId, data, kelas, kelasTerpilih) {
  panel(userId ? 'Ubah Murid' : 'Murid Baru',
    '<div class="grup"><label>Nama Lengkap *</label>' +
      '<input class="isian" id="m-nama" value="' + esc(data ? data.nama : '') + '"></div>' +
    (userId ? '' :
      '<div class="grup"><label>Nama Pengguna *</label>' +
      '<input class="isian" id="m-username" placeholder="mis. siswa01" ' +
      'autocapitalize="off"><span class="bantuan">Huruf kecil tanpa spasi. ' +
      'Dipakai untuk masuk.</span></div>') +
    '<div class="grup"><label>Rombel (opsional)</label>' +
      '<input class="isian" id="m-rombel" list="daftar-rombel" ' +
      'placeholder="mis. XII TKJ 1" value="' +
      esc(data ? (data.rombel || '') : '') + '">' +
      '<datalist id="daftar-rombel">' +
        ((State.cache && State.cache.murid ? State.cache.murid : [])
          .map(function (m) { return m.rombel; })
          .filter(function (r, i, a) { return r && a.indexOf(r) === i; })
          .sort()
          .map(function (r) { return '<option value="' + esc(r) + '">'; })
          .join('')) +
      '</datalist>' +
      '<span class="bantuan">Label rombongan belajar untuk menyaring ' +
      'daftar murid. <b>Bukan</b> kelas-mapel.</span></div>' +
    '<div class="grup"><label>Email (opsional)</label>' +
      '<input class="isian" id="m-email" type="email" value="' +
      esc(data ? (data.email || '') : '') + '"></div>' +
    /* Biodata (v1.11.0). Guru boleh MENGOSONGKAN — berbeda dari layar
       murid yang mewajibkan email & WA. Guru perlu bisa menghapus
       data yang salah ketik. */
    '<div class="grup"><label>NISN (opsional)</label>' +
      '<input class="isian" id="m-nisn" inputmode="numeric" value="' +
      esc(data ? (data.nisn || '') : '') + '" placeholder="mis. 0098765432">' +
      '<span class="bantuan">Angka saja, 4–20 digit.</span></div>' +
    '<div class="grup"><label>Nomor WhatsApp (opsional)</label>' +
      '<input class="isian" id="m-wa" type="tel" inputmode="tel" value="' +
      esc(data ? (data.no_wa || '') : '') + '" placeholder="081234567890">' +
      '<span class="bantuan">Boleh 0812… atau +62812… — dirapikan ' +
      'otomatis menjadi 62…</span></div>' +
    (userId
      ? '<div class="grup"><label>Kelas-Mapel Saat Ini</label><div>' +
        (data && data.kelas_mapel && data.kelas_mapel.length
          ? data.kelas_mapel.map(function (k) {
              return '<span class="pil pil-kelas">' + labelKelas(k) + '</span>';
            }).join('')
          : '<span class="lencana lencana-peringatan">tanpa kelas</span>') +
        '</div><span class="bantuan">Ubah keanggotaan kelas lewat ' +
        'menu Kelola Kelas → Murid.</span></div>'
      : '<div class="grup"><label>Daftarkan ke Kelas</label>' +
        '<select class="isian" id="m-kelas">' +
          '<option value="">— tidak sekarang —</option>' +
          kelas.map(function (k) {
            return '<option value="' + esc(k.kelas_id) + '"' +
              (kelasTerpilih === k.kelas_id ? ' selected' : '') + '>' +
              labelKelas(k) + '</option>';
          }).join('') +
        '</select><span class="bantuan">Murid langsung terdaftar di kelas ' +
        'yang dipilih.</span></div>') +
    (userId
      ? '<div class="grup"><label>Status</label><select class="isian" id="m-status">' +
        '<option value="aktif">Aktif</option>' +
        '<option value="nonaktif"' +
        (data && data.status === 'nonaktif' ? ' selected' : '') +
        '>Nonaktif</option></select>' +
        '<span class="bantuan">Nonaktif membuat murid tidak bisa masuk.</span></div>'
      : '<p class="bantuan">Kata sandi sementara dibuat otomatis dan ' +
        'ditampilkan setelah disimpan.</p>'),

    '<button class="btn btn-hantu" data-tutup="1">Batal</button>' +
    '<button class="btn" id="btn-simpan-murid">Simpan</button>'
  );

  $('#btn-simpan-murid').onclick = function () {
    var p = {
      user_id: userId || '',
      nama: $('#m-nama').value.trim(),
      rombel: $('#m-rombel').value.trim(),
      email: $('#m-email').value.trim(),
      nisn: $('#m-nisn').value.trim(),
      no_wa: $('#m-wa').value.trim()
    };
    if (!userId) {
      p.username = $('#m-username').value.trim();
      p.kelas_id = $('#m-kelas').value;
    } else {
      p.status = $('#m-status').value;
    }

    if (!p.nama) { toast('Nama wajib diisi.', 'peringatan'); return; }
    if (!userId && !p.username) {
      toast('Nama pengguna wajib diisi.', 'peringatan'); return;
    }

    callApi('simpanMurid', [p], { tombol: $('#btn-simpan-murid') })
      .then(function (r) {
        _panelKotor = false;
        tutupPanel(false);
        if (r.baru) {
          dialog({
            judul: 'Murid Ditambahkan',
            pesan: 'Berikan kredensial berikut kepada murid. ' +
                   'Kata sandi hanya tampil sekali.',
            html: '<div class="kotak-kode mt-8">' + esc(r.username) + '</div>' +
                  '<div class="kotak-kode mt-8">' + esc(r.password_sementara) + '</div>' +
                  '<p class="bantuan mt-8">Kata sandi ini tetap dapat dilihat ' +
                  'di daftar murid sampai murid menggantinya sendiri.</p>',
            tanpaBatal: true, labelYa: 'Sudah Dicatat'
          }).then(function () { router(); });
        } else {
          toast('Perubahan disimpan.', 'sukses');
          router();
        }
      });
  };
}

function resetMuridLangsung(userId, nama) {
  konfirmasi('Reset Kata Sandi',
    'Kata sandi baru akan dibuat untuk <b>' + esc(nama) +
    '</b> dan seluruh sesinya diakhiri.',
    { labelYa: 'Reset' }).then(function (ya) {
      if (!ya) return;
      callApi('resetPasswordMurid', [userId, '']).then(function (d) {
        /* Dialognya milik js_core — dipakai bersama layar Permintaan
           Reset supaya tombol WhatsApp tidak perlu ditulis dua kali
           dan kalimatnya tidak pernah berbeda (v1.11.3). */
        if (typeof dialogHasilReset === 'function') {
          dialogHasilReset(d, function () { router(); });
        } else { toast('Sandi: ' + d.password_sementara, 'sukses', 12); }
      });
    });
}
</script>
