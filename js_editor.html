/* ============================================================
   MODE HTML (v1.9.10)

   Editor visual (`contenteditable`) tidak pernah cukup untuk semua
   hal: menyisipkan embed dari layanan lain, merapikan tabel yang
   terlanjur berantakan, atau menyalin materi dari sumber lain tanpa
   membawa gaya yang aneh.

   Dibuat sebagai PENGALIH TAMPILAN pada editor yang sama — bukan
   dialog terpisah. Dialog memaksa guru menyalin-tempel bolak-balik,
   dan pekerjaan mudah hilang bila lupa menekan Terapkan.

   Yang diketik guru TETAP melewati `Util.sanitasi()` di server:
   mode ini memberi kendali lebih, bukan melewati penjaga.
   ============================================================ */

/** Sedang di mode HTML atau tidak — per layar editor. */
function modeHtmlAktif(app) {
  var ta = $('#ed-html', app);
  return !!ta && !ta.classList.contains('sembunyi');
}

/**
 * Salin isi textarea HTML kembali ke editor visual.
 *
 * WAJIB dipanggil sebelum Simpan & Pratinjau. Tanpa ini, guru yang
 * menekan Simpan saat masih di mode HTML kehilangan seluruh
 * suntingannya — kelas bug paling menyakitkan (§6.2 no. 57).
 *
 * Aman dipanggil kapan saja: bila tidak sedang di mode HTML, ia
 * tidak melakukan apa-apa.
 */
function samakanDariHtml(app, ed) {
  if (!modeHtmlAktif(app)) return false;
  var ta = $('#ed-html', app);
  ed.innerHTML = kontenKeEditor(ta.value);
  return true;
}

function pasangModeHtml(app, ed) {
  var tombol = $('#ed-mode-html', app);
  var ta = $('#ed-html', app);
  if (!tombol || !ta) return;

  tombol.onclick = function (e) {
    e.preventDefault();
    var keHtml = !modeHtmlAktif(app);

    if (keHtml) {
      /* visual → HTML: tampilkan kode yang SUNGGUH akan disimpan,
         termasuk penanda <!--bagian--> yang di layar visual berupa
         garis pemisah. */
      ta.value = editorKeKonten(ed);
      ed.classList.add('sembunyi');
      ta.classList.remove('sembunyi');
      tombol.classList.add('aktif');
      tombol.innerHTML = '👁 Visual';
      tombol.title = 'Kembali ke tampilan visual';
      ta.focus();
    } else {
      /* HTML → visual */
      samakanDariHtml(app, ed);
      ta.classList.add('sembunyi');
      ed.classList.remove('sembunyi');
      tombol.classList.remove('aktif');
      tombol.innerHTML = '&lt;/&gt; HTML';
      tombol.title = 'Sunting kode HTML';
      ed.focus();
    }

    /* Tombol format tidak berlaku pada teks mentah — dikelabukan
       supaya guru tidak mengira editornya rusak (§6.2 no. 20). */
    $$('#ed-alat [data-cmd]', app).forEach(function (b) {
      b.disabled = keHtml;
    });

    perbaruiCacahBagian(app, ed);
  };

  /* Cacah bagian ikut diperbarui saat guru mengetik di mode HTML —
     ia bisa menambah <!--bagian--> langsung di kodenya. */
  ta.addEventListener('input', function () {
    var klon = document.createElement('div');
    klon.innerHTML = kontenKeEditor(ta.value);
    var n = klon.querySelectorAll('.pisah-bagian').length + 1;
    var el = $('#ed-cacah', app);
    if (el) el.textContent = n + ' bagian';
  });
}

/* ============================================================
   TABEL (v1.9.9)

   Sebelumnya tombol ▦ menyisipkan tabel yang DIPAKU 2×2, dan tidak
   ada cara mengubahnya sesudahnya — guru harus menyunting HTML
   mentah (laporan lapangan: "tidak bisa menentukan jumlah kolom dan
   baris").

   Dua perbaikan:
     1. dialog ukuran sebelum menyisipkan
     2. empat tombol untuk menambah/menghapus baris & kolom pada
        tabel yang SUDAH ada
   ============================================================ */

var TABEL_MAKS = 12;   /* di atas ini tabel tidak terbaca di ponsel */

/**
 * Ingat posisi kursor di dalam editor.
 *
 * Dialog memindahkan fokus, sedangkan `execCommand` menyisipkan di
 * posisi kursor saat itu. Tanpa jangkar, tabel mendarat di awal
 * dokumen.
 */
function simpanKursor(ed) {
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  var r = sel.getRangeAt(0);
  /* hanya rentang DI DALAM editor yang layak dipulihkan */
  return ed && ed.contains(r.commonAncestorContainer) ? r.cloneRange() : null;
}

function pulihkanKursor(r) {
  if (!r) return;
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

/** Dialog kecil: berapa baris, berapa kolom, pakai baris kepala? */
function dialogTabel(sesudah) {
  dialog({
    judul: '▦ Sisipkan Tabel',
    html:
      '<div class="grid-2">' +
        '<div class="grup"><label>Jumlah baris <span class="lembut">' +
          '(isi, tanpa kepala)</span></label>' +
          '<input class="isian" id="tbl-baris" type="number" ' +
            'min="1" max="' + TABEL_MAKS + '" value="3"></div>' +
        '<div class="grup"><label>Jumlah kolom</label>' +
          '<input class="isian" id="tbl-kolom" type="number" ' +
            'min="1" max="' + TABEL_MAKS + '" value="3"></div>' +
      '</div>' +
      '<label class="baris sela-kecil mt-8" style="cursor:pointer">' +
        '<input type="checkbox" id="tbl-kepala" checked> ' +
        'Pakai baris kepala (judul kolom)</label>' +
      '<p class="bantuan mt-8">Maksimal ' + TABEL_MAKS + '×' + TABEL_MAKS +
      '. Baris & kolom masih bisa ditambah setelah tabel dibuat.</p>',
    labelYa: 'Sisipkan'
  }).then(function (ya) {
    if (!ya) return;
    var b = jepitAngka($('#tbl-baris'), 3);
    var k = jepitAngka($('#tbl-kolom'), 3);
    var kepala = !!($('#tbl-kepala') && $('#tbl-kepala').checked);
    sesudah(b, k, kepala);
  });
}

/**
 * Baca angka dari isian, jepit ke rentang yang masuk akal.
 *
 * Bawaan HANYA dipakai bila isiannya kosong atau bukan angka. Angka
 * yang sungguh diketik tetapi di luar rentang DIJEPIT, bukan
 * diganti bawaan — guru yang mengetik 0 bermaksud "sekecil
 * mungkin", bukan "3". Mengembalikan 3 di situ terasa seperti
 * isiannya diabaikan.
 */
function jepitAngka(el, bawaan) {
  var teks = String((el && el.value) || '').trim();
  if (teks === '') return bawaan;
  var n = Number(teks);
  if (!isFinite(n)) return bawaan;
  return Math.max(1, Math.min(TABEL_MAKS, Math.round(n)));
}

/**
 * Susun HTML tabel untuk disisipkan ke editor lewat `insertHTML`.
 *
 * Tabel ini BUKAN tabel antarmuka — ia menjadi bagian konten materi,
 * dirender di `.editor-isi` (guru) lalu `.konten-kaya` (murid).
 * Keduanya sudah punya penggulir mendatar sendiri, jadi pembungkus
 * `.tabel-gulir` tidak diperlukan di sini (§6.2 no. 29).
 */
function htmlTabel(baris, kolom, pakaiKepala) {
  /* insertHTML — penanda bagi penjaga responsif run46 */
  var h = '<table>';
  if (pakaiKepala) {
    h += '<thead><tr>';
    for (var k = 0; k < kolom; k++) h += '<th>Kolom ' + (k + 1) + '</th>';
    h += '</tr></thead>';
  }
  h += '<tbody>';
  for (var b = 0; b < baris; b++) {
    h += '<tr>';
    for (var j = 0; j < kolom; j++) h += '<td>&nbsp;</td>';
    h += '</tr>';
  }
  return h + '</tbody></table><p><br></p>';
}

/**
 * Tambah / hapus baris atau kolom pada tabel tempat kursor berada.
 *
 * Bekerja pada tabel yang SUDAH ada — termasuk tabel lama yang dibuat
 * sebelum v1.9.9, dan tabel hasil AI.
 */
function ubahTabel(ed, jenis, arah) {
  var sel = window.getSelection();
  if (!sel || !sel.rangeCount) { toast('Klik dulu di dalam tabel.', 'peringatan'); return; }

  var node = sel.getRangeAt(0).startContainer;
  var sel1 = node.nodeType === 1 ? node : node.parentNode;
  var td = sel1 && sel1.closest ? sel1.closest('td,th') : null;
  var tabel = sel1 && sel1.closest ? sel1.closest('table') : null;

  if (!tabel || !ed.contains(tabel)) {
    toast('Klik dulu di dalam tabel yang ingin diubah.', 'peringatan');
    return;
  }

  var semuaBaris = tabel.rows;
  var idxKolom = td ? td.cellIndex : 0;
  var idxBaris = td && td.parentNode ? td.parentNode.rowIndex : 0;

  if (jenis === 'baris') {
    var body = tabel.tBodies[0] || tabel;
    if (arah > 0) {
      if (semuaBaris.length >= TABEL_MAKS + 1) {
        toast('Maksimal ' + TABEL_MAKS + ' baris.', 'peringatan'); return;
      }
      var jml = semuaBaris[0] ? semuaBaris[0].cells.length : 1;
      var tr = document.createElement('tr');
      for (var i = 0; i < jml; i++) {
        var sel2 = document.createElement('td');
        sel2.innerHTML = '&nbsp;';
        tr.appendChild(sel2);
      }
      /* sisipkan TEPAT di bawah baris tempat kursor berada */
      var acuan = semuaBaris[idxBaris];
      if (acuan && acuan.parentNode === body) {
        body.insertBefore(tr, acuan.nextSibling);
      } else {
        body.appendChild(tr);
      }
    } else {
      /* Baris kepala tidak boleh terhapus lewat tombol ini — guru
         mengira tabelnya rusak. */
      var trHapus = semuaBaris[idxBaris];
      if (!trHapus || trHapus.parentNode.tagName === 'THEAD') {
        toast('Baris kepala tidak dapat dihapus di sini.', 'peringatan');
        return;
      }
      if ((tabel.tBodies[0] || tabel).rows.length <= 1) {
        toast('Tabel harus punya minimal satu baris isi.', 'peringatan');
        return;
      }
      trHapus.parentNode.removeChild(trHapus);
    }
  } else {
    var jmlKolom = semuaBaris[0] ? semuaBaris[0].cells.length : 0;
    if (arah > 0 && jmlKolom >= TABEL_MAKS) {
      toast('Maksimal ' + TABEL_MAKS + ' kolom.', 'peringatan'); return;
    }
    if (arah < 0 && jmlKolom <= 1) {
      toast('Tabel harus punya minimal satu kolom.', 'peringatan'); return;
    }
    for (var r = 0; r < semuaBaris.length; r++) {
      var baris2 = semuaBaris[r];
      if (arah > 0) {
        var kepala = baris2.parentNode.tagName === 'THEAD';
        var selBaru = document.createElement(kepala ? 'th' : 'td');
        selBaru.innerHTML = kepala
          ? 'Kolom ' + (jmlKolom + 1) : '&nbsp;';
        var setelah = baris2.cells[idxKolom];
        if (setelah) baris2.insertBefore(selBaru, setelah.nextSibling);
        else baris2.appendChild(selBaru);
      } else {
        if (baris2.cells[idxKolom]) baris2.deleteCell(idxKolom);
      }
    }
  }

  ed.dispatchEvent(new Event('input', { bubbles: true }));
}

/* ============================================================
   VIDEO YOUTUBE (v1.9.8)

   Guru menyisipkan video dari YouTube ke dalam materi. TIDAK ada
   pencarian di dalam LMS: guru mencari sendiri di YouTube lalu
   menempel tautannya.

   Keputusan itu diambil sadar. Pencarian menuntut API key baru
   (YouTube Data API, kuota 100 pencarian/hari) sementara yang
   benar-benar menghemat waktu adalah MENYISIPKAN — mengubah
   `youtu.be/ABC` menjadi iframe yang benar itu merepotkan bila
   manual. Mencari video tetap menuntut guru menontonnya lebih dulu;
   panel pencarian hanya memindahkan tempat pekerjaan itu.

   Sanitasi `Util.gs` sudah mengizinkan iframe YouTube sejak awal,
   dan CSS sudah memberi rasio 16:9 di layar guru maupun murid.
   Fullscreen bawaan pemutar YouTube — tidak perlu dibuat.
   ============================================================ */

/**
 * Ambil ID video dari bentuk tautan YouTube apa pun.
 *
 * Guru menyalin dari mana saja: bilah alamat, tombol Bagikan,
 * aplikasi HP, hasil pencarian. Bentuknya berbeda-beda:
 *
 *     youtube.com/watch?v=ABC          bilah alamat laptop
 *     youtu.be/ABC                     tombol Bagikan
 *     youtube.com/shorts/ABC           video pendek
 *     youtube.com/embed/ABC            sudah berupa embed
 *     youtube.com/live/ABC             siaran langsung
 *     m.youtube.com/watch?v=ABC        peramban HP
 *     ...&t=90s                        dengan penanda waktu
 *
 * Mengembalikan '' bila bukan tautan YouTube — pemanggil yang
 * memberi tahu guru, bukan diam-diam menyisipkan iframe rusak.
 */
function idYouTube(url) {
  var u = String(url || '').trim();
  if (!u) return '';

  /* ID YouTube selalu 11 karakter: huruf, angka, - dan _ */
  var pola = [
    /[?&]v=([A-Za-z0-9_-]{11})/,          /* watch?v= */
    /youtu\.be\/([A-Za-z0-9_-]{11})/,      /* youtu.be/ */
    /\/shorts\/([A-Za-z0-9_-]{11})/,       /* /shorts/ */
    /\/embed\/([A-Za-z0-9_-]{11})/,        /* /embed/ */
    /\/live\/([A-Za-z0-9_-]{11})/          /* /live/ */
  ];
  for (var i = 0; i < pola.length; i++) {
    var m = pola[i].exec(u);
    if (m) return m[1];
  }

  /* Guru menempel ID-nya saja — diterima, sebab itu yang tersalin
     bila ia menyorot sebagian tautan. */
  if (/^[A-Za-z0-9_-]{11}$/.test(u)) return u;

  return '';
}

/** Detik mulai dari penanda waktu, mis. `&t=90s` atau `?t=1m30s`. */
function mulaiYouTube(url) {
  var m = /[?&]t=(?:(\d+)h)?(?:(\d+)m)?(\d+)s?/.exec(String(url || ''));
  if (!m) return 0;
  return (Number(m[1]) || 0) * 3600 + (Number(m[2]) || 0) * 60 +
         (Number(m[3]) || 0);
}

/**
 * Bangun iframe yang lolos sanitasi dan aman dipakai murid.
 *
 * `youtube-nocookie.com` dipilih, bukan `youtube.com`: murid tidak
 * ditandai untuk iklan personal. Domain ini sudah ada di
 * `IFRAME_IZIN` sejak awal.
 *
 * `rel=0` menahan video sarankan dari kanal lain setelah selesai —
 * tanpa itu murid bisa terlempar ke video yang tidak ada
 * hubungannya dengan pelajaran.
 */
function embedYouTube(id, mulai) {
  var src = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0';
  if (mulai) src += '&start=' + mulai;
  return '<div class="bingkai-video">' +
    '<iframe src="' + src + '" title="Video pembelajaran" ' +
    'loading="lazy" allowfullscreen ' +
    'allow="accelerometer; encrypted-media; gyroscope; picture-in-picture">' +
    '</iframe></div><p><br></p>';
}

function pratinjauKonten(html, judul) {
  var bagian = String(html).split('<!--bagian-->');
  var isi = bagian.map(function (b, i) {
    return '<div class="mb-16"><span class="lencana">Bagian ' + (i + 1) +
           '</span><div class="isi-materi mt-8">' + b + '</div></div>';
  }).join('<hr style="border:none;border-top:1px dashed var(--garis);margin:20px 0">');

  dialog({
    judul: 'Pratinjau — ' + (judul || 'Tanpa Judul'),
    html: '<div style="max-height:60vh;overflow-y:auto;text-align:left">' +
          isi + '</div>',
    tanpaBatal: true, labelYa: 'Tutup'
  });
  setTimeout(function () { renderRumus(document.getElementById('isi-dialog')); }, 60);
}

/* ============================================================
   GENERATOR AI — susun materi
   ============================================================ */

/**
 * Panggil AI lalu masukkan hasilnya ke editor.
 *
 * Isi editor yang sudah ada TIDAK ditimpa diam-diam — bila sudah ada
 * tulisan, guru diminta memastikan dulu. Pekerjaan yang hilang tanpa
 * peringatan jauh lebih menyakitkan daripada satu klik tambahan.
 */
/**
 * Generator isi kegiatan LKPD / Tugas Kelompok (v1.7.6).
 *
 * Sengaja TERPISAH dari jalankanGenerateMateri(): keduanya berbeda
 * dalam tiga hal yang mudah tertukar bila digabung — API yang
 * dipanggil, ada/tidaknya pembagian bagian, dan laporan penyimpangan
 * AI. Menyatukannya menjadi satu fungsi bercabang justru membuat
 * keduanya rapuh.
 */
/**
 * Generator pertanyaan refleksi (v1.8.1).
 *
 * BERBEDA dari dua generator lain: hasilnya tidak masuk ke editor
 * konten melainkan ke PANEL PENYUSUN pertanyaan. Editor kontennya
 * memang disembunyikan untuk tipe refleksi — `item.konten` menyimpan
 * JSON, bukan HTML.
 *
 * Hasil AI DITAMBAHKAN ke daftar yang sudah ada, bukan menimpanya.
 * Guru yang sudah menulis satu-dua pertanyaan sendiri tidak boleh
 * kehilangannya hanya karena menekan Generate.
 */
function jalankanGenerateRefleksi(app, itemId, catatan) {
  var tombol = $('#ed-gen-btn', app);
  var status = $('#ed-gen-status', app);
  var wadah = $('#ref-daftar', app);
  if (!wadah) return;

  /* Baris kosong tidak dihitung sebagai pertanyaan guru — panel
     selalu menyisakan satu baris hampa. */
  function barisTerisi() {
    return $$('.baris-tanya-ref', wadah).filter(function (b) {
      return b.querySelector('.ref-teks').value.trim() !== '';
    });
  }
  var sudahAda = barisTerisi().length;
  var sisa = MAKS_TANYA_REF - sudahAda;

  if (sisa <= 0) {
    toast('Sudah ' + MAKS_TANYA_REF + ' pertanyaan — hapus dahulu ' +
          'bila ingin diganti.', 'peringatan');
    return;
  }

  var minta = Math.min(3, sisa);
  var t0 = Date.now();

  tombol.disabled = true;
  status.innerHTML = '<span class="putar putar-kecil"></span> ' +
    'AI sedang menyusun pertanyaan refleksi… biasanya 10–30 detik.';

  var jam = setInterval(function () {
    var d = Math.round((Date.now() - t0) / 1000);
    var el = $('#ed-gen-status', app);
    if (!el) { clearInterval(jam); return; }
    el.innerHTML = '<span class="putar putar-kecil"></span> ' +
      'AI sedang menyusun pertanyaan refleksi… ' + d + ' detik';
  }, 1000);

  callApi('generateRefleksiAI', [itemId, minta, catatan || ''],
          { diam: true })
    .then(function (d) {
      clearInterval(jam);

      /* Buang baris hampa dahulu supaya hasil AI tidak berselang-seling
         dengan isian kosong. */
      $$('.baris-tanya-ref', wadah).forEach(function (b) {
        if (b.querySelector('.ref-teks').value.trim() === '') b.remove();
      });

      d.pertanyaan.forEach(function (q) {
        if ($$('.baris-tanya-ref', wadah).length >= MAKS_TANYA_REF) return;
        var kotak = document.createElement('div');
        kotak.innerHTML = barisTanyaRefleksi(q);
        wadah.appendChild(kotak.firstChild);
      });

      /* panel wajib menyisakan minimal satu baris */
      if (!wadah.children.length) {
        var d0 = document.createElement('div');
        d0.innerHTML = barisTanyaRefleksi({ t: '', wajib: true });
        wadah.appendChild(d0.firstChild);
      }

      window._itemDariAI = true;
      var kartuAi = $('#ed-ai', app);
      if (kartuAi) kartuAi.classList.remove('sembunyi');
      var cb = $('#ed-ai-tinjau', app);
      if (cb) cb.checked = false;

      var tombol2 = $('#ed-gen-btn', app);
      if (tombol2) {
        tombol2.disabled = false;
        tombol2.textContent = '✨ Tambah Lagi';
      }

      /* Penyimpangan AI DILAPORKAN, bukan didiamkan (§6.2 no. 26).
         Yang paling penting: pertanyaan ya/tidak — bentuknya benar
         tetapi tidak menggali apa pun. */
      var peringatan = '';
      if (d.penyimpangan && d.penyimpangan.length) {
        peringatan = '<div class="kotak-peringatan kartu kartu-rapat mt-8">' +
          '<div class="kecil">⚠ ' +
          d.penyimpangan.map(esc).join('<br>⚠ ') + '</div></div>';
      }

      var st = $('#ed-gen-status', app);
      if (st) {
        st.innerHTML = '✅ ' + d.jml + ' pertanyaan ditambahkan — ' +
          Math.round(d.durasi_ms / 1000) + ' detik. ' +
          '<b>Tinjau dan sunting</b> sesuai kelas Anda, centang kotak ' +
          'di bawah, baru terbitkan.' + peringatan;
      }

      toast(d.jml + ' pertanyaan refleksi ditambahkan.', 'sukses');
    })
    .catch(function (res) {
      clearInterval(jam);
      var tombol3 = $('#ed-gen-btn', app);
      if (tombol3) tombol3.disabled = false;
      var st2 = $('#ed-gen-status', app);
      if (st2) {
        st2.innerHTML = '<span class="pesan-salah">⚠️ ' +
          esc((res && res.pesan) || 'Gagal menghubungi AI.') +
          '</span> Anda tetap dapat menulis pertanyaan sendiri.';
      }
    });
}

function jalankanGenerateKegiatan(app, ed, itemId, tipe, catatan) {
  var isiSekarang = String(ed.textContent || '').trim();
  var label = tipe === 'tugas_kelompok' ? 'kegiatan kelompok' : 'LKPD';

  function mulai() {
    var tombol = $('#ed-gen-btn', app);
    var status = $('#ed-gen-status', app);
    var t0 = Date.now();

    tombol.disabled = true;
    status.innerHTML = '<span class="putar putar-kecil"></span> ' +
      'AI sedang menyusun ' + label + '… biasanya 15–45 detik.';

    var jam = setInterval(function () {
      var d = Math.round((Date.now() - t0) / 1000);
      var el = $('#ed-gen-status', app);
      if (!el) { clearInterval(jam); return; }
      el.innerHTML = '<span class="putar putar-kecil"></span> ' +
        'AI sedang menyusun ' + label + '… ' + d + ' detik';
    }, 1000);

    callApi('generateKegiatanAI', [itemId, catatan || ''], { diam: true })
      .then(function (d) {
        clearInterval(jam);
        ed.innerHTML = kontenKeEditor(d.konten);
        perbaruiCacahBagian(app, ed);
        renderRumus(ed);

        /* tandai sebagai hasil AI supaya guard "wajib ditinjau" aktif */
        window._itemDariAI = true;
        var kartuAi = $('#ed-ai', app);
        if (kartuAi) kartuAi.classList.remove('sembunyi');
        var cb = $('#ed-ai-tinjau', app);
        if (cb) cb.checked = false;

        var tombol2 = $('#ed-gen-btn', app);
        if (tombol2) {
          tombol2.disabled = false;
          tombol2.textContent = '✨ Generate Ulang';
        }

        /* Penyimpangan AI DILAPORKAN, bukan diperbaiki diam-diam
           (KONVENSI §6.2 no. 26). Guru berhak tahu bila LKPD-nya
           keluar tanpa Langkah Kerja sebelum ia menerbitkannya. */
        var peringatan = '';
        if (d.bagian_hilang && d.bagian_hilang.length) {
          peringatan += '<div class="kotak-peringatan kartu kartu-rapat mt-8">' +
            '<span class="kecil">⚠ AI tidak menuliskan bagian: <b>' +
            d.bagian_hilang.map(esc).join(', ') + '</b>. ' +
            'Tambahkan sendiri atau tekan Generate Ulang.</span></div>';
        }
        if (d.ada_pemisah_dibuang) {
          peringatan += '<div class="kotak-peringatan kartu kartu-rapat mt-8">' +
            '<span class="kecil">⚠ AI menyisipkan pemisah bagian ' +
            '(milik tipe Materi). Sudah dibuang otomatis — periksa ' +
            'apakah alurnya masih runtut.</span></div>';
        }

        var st = $('#ed-gen-status', app);
        if (st) {
          st.innerHTML = '✅ Draf ' + label + ' siap — ' +
            Math.round(d.durasi_ms / 1000) + ' detik. ' +
            '<b>Tinjau isinya</b>, centang kotak di bawah, baru ' +
            'terbitkan.' + peringatan;
        }

        toast(d.bagian_hilang && d.bagian_hilang.length
          ? 'Draf siap, tetapi ada bagian yang belum lengkap.'
          : 'Draf ' + label + ' siap ditinjau.',
          d.bagian_hilang && d.bagian_hilang.length ? 'peringatan' : 'sukses');
      })
      .catch(function (res) {
        clearInterval(jam);
        var tombol3 = $('#ed-gen-btn', app);
        if (tombol3) tombol3.disabled = false;
        var st2 = $('#ed-gen-status', app);
        if (st2) {
          st2.innerHTML = '<span class="pesan-salah">⚠️ ' +
            esc((res && res.pesan) || 'Gagal menghubungi AI.') +
            '</span> Anda tetap dapat menulis ' + label +
            ' secara manual.';
        }
      });
  }

  if (!isiSekarang) { mulai(); return; }

  konfirmasi('Timpa isi editor?',
    'Editor sudah berisi tulisan. Hasil AI akan menggantikannya. ' +
    'Salin dahulu bila ada bagian yang ingin dipertahankan.',
    { labelYa: 'Ya, timpa', bahaya: true })
    .then(function (ya) { if (ya) mulai(); });
}

function jalankanGenerateMateri(app, ed, itemId, catatan) {
  var isiSekarang = String(ed.textContent || '').trim();

  function mulai() {
    var tombol = $('#ed-gen-btn', app);
    var status = $('#ed-gen-status', app);
    var t0 = Date.now();

    tombol.disabled = true;
    status.innerHTML = '<span class="putar putar-kecil"></span> ' +
      'AI sedang menyusun materi… biasanya 15–45 detik.';

    var jam = setInterval(function () {
      var d = Math.round((Date.now() - t0) / 1000);
      var el = $('#ed-gen-status', app);
      if (!el) { clearInterval(jam); return; }
      el.innerHTML = '<span class="putar putar-kecil"></span> ' +
        'AI sedang menyusun materi… ' + d + ' detik';
    }, 1000);

    callApi('generateMateriAI', [itemId, catatan || ''], { diam: true })
      .then(function (d) {
        clearInterval(jam);
        ed.innerHTML = kontenKeEditor(d.konten);
        perbaruiCacahBagian(app, ed);
        renderRumus(ed);

        /* tandai sebagai materi AI supaya guard tinjau ikut aktif */
        window._itemDariAI = true;
        var kartuAi = $('#ed-ai', app);
        if (kartuAi) kartuAi.classList.remove('sembunyi');
        var cb = $('#ed-ai-tinjau', app);
        if (cb) cb.checked = false;

        /* Catatan: editor item tidak punya medan deskripsi, jadi
           d.deskripsi sengaja tidak dipakai di sini. */

        var tombol2 = $('#ed-gen-btn', app);
        if (tombol2) {
          tombol2.disabled = false;
          tombol2.textContent = '✨ Generate Ulang';
        }
        var st = $('#ed-gen-status', app);
        if (st) {
          st.innerHTML = '✅ Draf siap — ' + d.jml_bagian + ' bagian, ' +
            Math.round(d.durasi_ms / 1000) + ' detik. ' +
            '<b>Tinjau isinya</b>, centang kotak di bawah, baru terbitkan.' +
            (d.saran_soal || d.saran_lkpd
              ? ' <button class="btn btn-teks btn-kecil" ' +
                'onclick="lihatSaranAI()">Lihat saran soal &amp; LKPD</button>'
              : '');
        }
        window._saranAI = { soal: d.saran_soal, lkpd: d.saran_lkpd };
        toast('Draf materi siap ditinjau.', 'sukses');
      })
      .catch(function (res) {
        clearInterval(jam);
        var tombol3 = $('#ed-gen-btn', app);
        if (tombol3) tombol3.disabled = false;
        var st2 = $('#ed-gen-status', app);
        if (st2) {
          st2.innerHTML = '<span class="pesan-salah">⚠️ ' +
            esc((res && res.pesan) || 'Gagal menghubungi AI.') +
            '</span> Anda tetap dapat menulis materi secara manual.';
        }
      });
  }

  if (!isiSekarang) { mulai(); return; }

  konfirmasi('Timpa isi editor?',
    'Editor sudah berisi tulisan. Hasil AI akan menggantikannya. ' +
    'Salin dahulu bila ada bagian yang ingin dipertahankan.',
    { labelYa: 'Ya, timpa', bahaya: true })
    .then(function (ya) { if (ya) mulai(); });
}

/** Tampilkan saran soal & LKPD dari hasil generate terakhir. */
function lihatSaranAI() {
  var s = window._saranAI || {};
  dialog({
    judul: '✨ Saran dari AI',
    pesan: 'Bahan mentah — salin ke item LKPD atau bank soal bila cocok.',
    html:
      (s.soal
        ? '<div class="grup"><label>Saran soal</label>' +
          '<textarea class="isian" rows="8" readonly>' + esc(s.soal) +
          '</textarea></div>' : '') +
      (s.lkpd
        ? '<div class="grup"><label>Saran LKPD</label>' +
          '<textarea class="isian" rows="5" readonly>' + esc(s.lkpd) +
          '</textarea></div>' : ''),
    tanpaBatal: true, labelYa: 'Tutup'
  });
}

/* ============================================================
   RUTE: Status API Key
   ============================================================ */

daftarRute('api-key', function () {
  if (!State.user || State.user.role !== 'guru') { pergiKe('#/beranda'); return; }

  var app = render('tpl-dashboard');
  pasangTopbar(app);
  /* Sidebar menu guru (v1.13.2). */
  var isi = (typeof menuRangka === 'function')
    ? menuRangka(app, 'beranda') : $('#isi-halaman', app);
  isi.innerHTML = rangkaMuat(60, 3);

  muatStatusApiKey(isi);
});

function muatStatusApiKey(isi) {
  callApi('getStatusApiKey', [], { diam: true })
    .then(function (d) {
      var html =
        '<button class="tautan-balik" onclick="pergiKe(\'#/beranda\')">‹ Beranda</button>' +
        '<div class="kepala-halaman"><h1>🔑 Status API Key</h1>' +
        '<p class="lembut kecil">Key Gemini untuk generator materi &amp; soal</p></div>';

      if (!d.terpasang) {
        html += kosongkan('🔑', 'Belum ada API key',
          'Generator AI belum dapat dipakai. Pasang key Gemini terlebih dahulu.',
          '<button class="btn mt-16" onclick="dialogPasangKey()">Pasang API Key</button>');
        isi.innerHTML = html;
        return;
      }

      html += '<div class="kartu mb-16"><div class="grid-info">' +
        '<div><div class="lembut kecil">Jumlah key</div>' +
          '<div class="tebal">' + d.jml + '</div></div>' +
        '<div><div class="lembut kecil">Siap dipakai</div><div class="tebal">' +
          d.key.filter(function (x) { return x.status === 'siap'; }).length +
          '</div></div>' +
        '<div><div class="lembut kecil">Bermasalah</div><div class="tebal">' +
          d.jml_bermasalah + '</div></div>' +
        '</div></div>';

      var istirahat = d.jml - d.jml_siap - d.jml_bermasalah;
      if (istirahat > 0) {
        html += '<div class="kartu sorot-menunggu mb-16">' +
          '<b>⏳ ' + istirahat + ' key sedang istirahat.</b>' +
          '<p class="kecil mt-8">Kuotanya habis pada semua model. ' +
          'Kuota per menit pulih sekitar 60 detik; kuota harian pulih ' +
          'tengah malam waktu Pasifik (±14.00 WIB). ' +
          'Generator tetap berjalan memakai ' + d.jml_siap + ' key lain.</p>' +
          '</div>';
      }

      if (d.jml_bermasalah > 0) {
        html += '<div class="kartu sorot-gagal mb-16">' +
          '<b>⚠️ ' + d.jml_bermasalah + ' key ditolak Google.</b>' +
          '<p class="kecil mt-8">Kemungkinan key salah tempel, dicabut, ' +
          'atau project-nya belum mengaktifkan Generative Language API. ' +
          'Pasang ulang daftar key untuk mencobanya lagi.</p></div>';
      }

      html += '<div class="tabel-gulir">' +
        '<table class="tabel"><thead><tr><th>#</th><th>Key</th>' +
        '<th>Status</th></tr></thead><tbody>';
      d.key.forEach(function (x) {
        var lbl = { siap: ['Siap', 'diterima'],
                    istirahat: ['Istirahat sebentar', 'menunggu'],
                    bermasalah: ['Bermasalah', 'ditolak'] }[x.status] ||
                  ['—', ''];
        html += '<tr><td>' + (x.index + 1) + '</td>' +
          '<td><code>••••••••' + esc(x.ekor) + '</code></td>' +
          '<td><span class="lencana ' + lbl[1] + '">' + lbl[0] + '</span></td></tr>';
      });
      html += '</tbody></table></div>';

      /* model aktif + tombol pemulihan cepat */
      html += '<div class="kartu mb-16">' +
        '<div class="baris-antara">' +
          '<div style="min-width:0">' +
            '<b>Model AI</b>' +
            '<p class="bantuan mt-4">Dicoba berurutan: ' +
            esc((d.model || []).join(' → ')) + '</p>' +
            '<p class="bantuan">Kuota gratis dihitung per model, jadi saat ' +
            'satu model habis sistem otomatis pindah ke model berikutnya.</p>' +
          '</div>' +
          '<button class="btn btn-hantu btn-kecil" onclick="resetIstirahatAI()">' +
          '↺ Coba Lagi Sekarang</button>' +
        '</div></div>';

      html += '<div class="baris-tombol mt-16">' +
        '<button class="btn btn-hantu btn-kecil" onclick="dialogPasangKey()">' +
        'Ganti Daftar Key</button></div>' +
        '<p class="bantuan mt-12">Nilai key tidak pernah ditampilkan — ' +
        'hanya 4 digit terakhir. Key disimpan di Script Properties, ' +
        'tidak pernah masuk ke spreadsheet maupun browser.</p>';

      isi.innerHTML = html;
    })
    .catch(function () {});
}

/**
 * Buang seluruh masa istirahat key & model.
 *
 * Berguna setelah memasang key baru atau saat yakin kuota sudah pulih —
 * tanpa ini sistem menunggu cooldown habis sendiri.
 */
function resetIstirahatAI() {
  callApi('resetCooldownAI', [])
    .then(function () {
      toast('Semua key siap dicoba lagi.', 'sukses');
      muatStatusApiKey($('#isi-halaman'));
    })
    .catch(function () {});
}

function dialogPasangKey() {
  dialog({
    judul: 'Pasang API Key Gemini',
    pesan: 'Tempel satu key per baris. Daftar lama akan diganti seluruhnya.',
    html: '<div class="grup"><textarea class="isian" id="f-keys" rows="10" ' +
          'placeholder="AIza...&#10;AIza...&#10;AIza..."></textarea>' +
          '<span class="bantuan">Disarankan 10 key dari 10 project berbeda ' +
          'agar kuota harian tidak cepat habis.</span></div>',
    labelYa: 'Simpan'
  }).then(function (ya) {
    if (!ya) return;
    var el = $('#f-keys');
    if (!el) return;
    var daftar = String(el.value || '').split('\n')
      .map(function (x) { return x.trim(); })
      .filter(function (x) { return x.length > 0; });
    if (!daftar.length) { toast('Belum ada key ditempel.', 'bahaya'); return; }

    callApi('simpanApiKeys', [daftar])
      .then(function (r) {
        toast(r.jml + ' key tersimpan.', 'sukses');
        muatStatusApiKey($('#isi-halaman'));
      })
      .catch(function () {});
  });
}
