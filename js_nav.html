<script>
/* ============================================================
   LessonLen — js_nav
   Sidebar navigasi kelas (bergaya course index) + tombol
   Sebelumnya / Berikutnya lintas pertemuan.

   Dipakai bersama oleh: js_belajar (pertemuan & baca materi),
   js_lkpd, dan js_quiz.
   ============================================================ */

var Nav = {
  kelasId: null,
  data: null,          /* hasil getIndeksKelas */
  aktifItem: null,     /* item_id yang sedang dibuka */
  aktifPtm: null,      /* pertemuan_id yang sedang dibuka */
  terbuka: false,      /* status laci pada layar sempit */
  lipat: {},           /* {pertemuan_id: true} = disembunyikan */
  lipatMp: {}          /* {mp_id: true} = materi pokok disembunyikan */
};

var IKON_ITEM = { materi: '📄', lkpd: '📝', quiz: '🎯', refleksi: '🪞',
                  tugas_kelompok: '👥' };

/**
 * Kosongkan seluruh keadaan navigasi.
 *
 * WAJIB dipanggil saat logout. Nav.data hidup di memori halaman dan
 * TIDAK ikut terhapus oleh simpanToken('') — tanpa ini, murid yang
 * masuk berikutnya pada perangkat yang sama (mis. komputer lab)
 * melihat sidebar milik murid sebelumnya sampai halaman dimuat ulang.
 */
function navReset() {
  Nav.kelasId = null;
  Nav.data = null;
  Nav.aktifItem = null;
  Nav.aktifPtm = null;
  Nav.terbuka = false;
  Nav.lipat = {};
  Nav.lipatMp = {};
  _navBuangSesi();
}

/* ---------------------------------------------- cache antar halaman */

/**
 * Indeks juga disimpan di sessionStorage, bukan hanya di memori.
 *
 * Setiap perpindahan rute menggambar ulang halaman, tetapi objek Nav
 * tetap hidup — jadi cache memori sudah cukup untuk navigasi biasa.
 * sessionStorage menutup kasus yang tersisa: murid menekan F5, membuka
 * tautan dari notifikasi, atau kembali lewat tombol Back. Tanpa ini,
 * setiap muat ulang halaman berarti menunggu satu round-trip penuh
 * (~1,2 detik) sebelum sidebar muncul.
 *
 * Isinya bukan rahasia (judul & status yang memang tampil di layar),
 * dan sessionStorage otomatis hilang saat tab ditutup. Tetap dibuang
 * saat logout lewat navReset().
 */
var NAV_KUNCI = 'll_nav_';
var NAV_UMUR = 300000;        /* 5 menit — cukup untuk satu sesi belajar */

function _navSimpanSesi(kelasId, data) {
  try {
    sessionStorage.setItem(NAV_KUNCI + kelasId,
      JSON.stringify({ t: Date.now(), d: data }));
  } catch (e) { /* penyimpanan penuh / mode privat → lewati */ }
}

function _navAmbilSesi(kelasId) {
  try {
    var mentah = sessionStorage.getItem(NAV_KUNCI + kelasId);
    if (!mentah) return null;
    var o = JSON.parse(mentah);
    if (!o || !o.d) return null;
    if (Date.now() - o.t > NAV_UMUR) return null;   /* kedaluwarsa */
    return o.d;
  } catch (e) { return null; }
}

function _navBuangSesi() {
  try {
    var buang = [];
    for (var i = 0; i < sessionStorage.length; i++) {
      var k = sessionStorage.key(i);
      if (k && k.indexOf(NAV_KUNCI) === 0) buang.push(k);
    }
    buang.forEach(function (k) { sessionStorage.removeItem(k); });
  } catch (e) {}
}

/* ---------------------------------------------- pemuatan data */

/**
 * Ambil indeks kelas, pakai ulang bila kelas & isinya belum berubah.
 * @param {boolean} paksa muat ulang walau sudah ada
 */
function navMuat(kelasId, paksa) {
  if (!kelasId) return Promise.resolve(null);
  if (!paksa && Nav.data && Nav.kelasId === kelasId) {
    /* Cache memori dipakai supaya sidebar tampil seketika, TETAPI tetap
       disegarkan di latar — sama seperti jalur sessionStorage di bawah.

       Tanpa ini, perubahan yang datang dari LUAR sesi murid tidak pernah
       terlihat: guru menilai LKPD, statusnya di sidebar tetap "menunggu
       nilai" sampai murid memuat ulang halaman. navSegarkan() hanya
       dipanggil setelah murid sendiri yang bertindak, jadi tidak
       menolong untuk perubahan dari guru. */
    _navSegarkanLatar(kelasId);
    return Promise.resolve(Nav.data);
  }
  var kelasBerganti = Nav.kelasId !== kelasId;
  if (kelasBerganti) { Nav.lipat = {}; Nav.lipatMp = {}; }

  /* Tampilkan lebih dulu dari cache sesi supaya sidebar tidak menunggu
     jaringan, lalu segarkan diam-diam di latar. Murid melihat isi
     seketika; bila ada perubahan, sidebar memperbarui dirinya sendiri
     satu detik kemudian tanpa kedipan kosong. */
  if (!paksa) {
    var tersimpan = _navAmbilSesi(kelasId);
    if (tersimpan) {
      Nav.kelasId = kelasId;
      Nav.data = tersimpan;
      _navSegarkanLatar(kelasId);
      return Promise.resolve(tersimpan);
    }
  }

  return _navAmbilServer(kelasId);
}

function _navAmbilServer(kelasId) {
  /* Stempel penyegaran ikut diperbarui di sini: pengambilan penuh
     (termasuk `navSegarkan()` yang memaksa) sudah menghasilkan data
     terbaru, jadi penyegaran latar tidak perlu menyusul beberapa
     milidetik kemudian (v1.14.1). */
  _navSegarTerakhir[kelasId] = Date.now();
  return callApi('getIndeksKelas', [kelasId], { diam: true })
    .then(function (d) {
      Nav.kelasId = kelasId;
      Nav.data = d;
      _navSimpanSesi(kelasId, d);
      return d;
    })
    .catch(function () { return null; });
}

/** Ambil versi terbaru di latar; gambar ulang hanya bila berubah. */
/* Kapan terakhir indeks disegarkan dari server, per kelas. */
var _navSegarTerakhir = {};

/* Jeda minimum antar penyegaran latar (v1.14.1).
 *
 * 🔴 LAPORAN LAPANGAN 24 Agu 2026:
 *
 *     14.11.57  getIndeksKelas  1,590 dtk
 *     14.12.16  getIndeksKelas  5,773 dtk   ← 19 detik kemudian
 *
 * `_navSegarkanLatar()` dipanggil SETIAP KALI sidebar dipasang, dan
 * sidebar dipasang ulang di tiap layar: daftar pertemuan, buka
 * materi, pindah bagian, LKPD, quiz. Cache-nya memang bekerja —
 * yang tidak dibatasi adalah penyegarannya.
 *
 * Tujuannya sah: perubahan dari guru (mis. LKPD baru dinilai) harus
 * terlihat tanpa memuat ulang halaman. Tetapi 30 detik sekali sudah
 * jauh lebih cepat daripada yang bisa disadari murid, dan
 * `navSegarkan()` tetap memaksa segar setiap kali murid sendiri
 * menyelesaikan sesuatu. */
var JEDA_SEGAR_NAV = 30000;

function _navSegarkanLatar(kelasId) {
  var t = _navSegarTerakhir[kelasId] || 0;
  if (Date.now() - t < JEDA_SEGAR_NAV) return;
  _navSegarTerakhir[kelasId] = Date.now();

  callApi('getIndeksKelas', [kelasId], { diam: true })
    .then(function (d) {
      if (!d || Nav.kelasId !== kelasId) return;
      var lama = JSON.stringify(Nav.data);
      var baru = JSON.stringify(d);
      Nav.data = d;
      _navSimpanSesi(kelasId, d);
      if (lama !== baru) navGambar();      /* ada perubahan → perbarui */
    })
    .catch(function () {});
}

/**
 * Muat indeks lebih awal, sebelum halaman item dibuka.
 *
 * Dipanggil saat murid masih di daftar pertemuan: begitu ia mengeklik
 * satu item, indeksnya sudah siap di memori sehingga sidebar langsung
 * tergambar tanpa round-trip tambahan.
 */
function navPramuat(kelasId) {
  if (!kelasId) return;
  if (Nav.data && Nav.kelasId === kelasId) return;
  navMuat(kelasId);
}

/** Buang data tersimpan — dipanggil setelah progres berubah. */
function navSegarkan() {
  if (!Nav.kelasId) return Promise.resolve(null);
  /* paksa: progres baru saja berubah, cache sesi pasti basi */
  return navMuat(Nav.kelasId, true).then(function (d) {
    navGambar();
    return d;
  });
}

/* ---------------------------------------------- kerangka halaman */

/**
 * Bungkus isi halaman dengan sidebar.
 * Memanggil ini menggantikan penulisan langsung ke #isi-halaman.
 *
 * @param {Element} induk  elemen #isi-halaman
 * @returns {Element} wadah tempat isi halaman digambar
 */
function navRangka(induk) {
  induk.innerHTML =
    '<div class="tata-nav">' +
      '<aside class="sisi-nav" id="sisi-nav">' + _navRangkaMuat() + '</aside>' +
      '<div class="isi-nav" id="isi-nav"></div>' +
    '</div>' +
    '<div class="tirai-sisi" id="tirai-sisi" onclick="navTutup()"></div>';
  /* Bila indeks sudah ada di memori, gambar SEKARANG juga — jangan
     menunggu Promise, karena satu putaran event loop pun terlihat
     sebagai kedipan. */
  if (Nav.data) navGambar();
  return document.getElementById('isi-nav');
}

/** Kerangka abu-abu selagi indeks dimuat. */
function _navRangkaMuat() {
  var h = '<div class="sisi-kepala"><div class="rangka" style="height:14px;' +
          'width:60%"></div><div class="rangka mt-8" style="height:10px;' +
          'width:40%"></div></div><div class="sisi-daftar">';
  for (var i = 0; i < 5; i++) {
    h += '<div class="rangka" style="height:32px;margin:6px 8px"></div>';
  }
  return h + '</div>';
}

/** Tombol pembuka laci untuk layar sempit. */
function navTombolLaci() {
  return '<button class="btn btn-hantu btn-kecil tombol-laci" ' +
    'onclick="navBuka()">☰ Daftar Isi</button>';
}

function navBuka() {
  Nav.terbuka = true;
  var s = document.getElementById('sisi-nav');
  var t = document.getElementById('tirai-sisi');
  if (s) s.classList.add('tampil');
  if (t) t.classList.add('tampil');
}

function navTutup() {
  Nav.terbuka = false;
  var s = document.getElementById('sisi-nav');
  var t = document.getElementById('tirai-sisi');
  if (s) s.classList.remove('tampil');
  if (t) t.classList.remove('tampil');
}

/* ---------------------------------------------- penggambaran */

function navGambar() {
  var el = document.getElementById('sisi-nav');
  if (!el || !Nav.data) return;

  var d = Nav.data;
  var h = '<div class="sisi-kepala">' +
    '<div class="tebal kecil">' + esc(d.kelas.nama_kelas) + '</div>' +
    '<div class="lembut kecil">' + esc(d.kelas.mapel || '') + '</div>' +
    '<button class="tutup-laci" onclick="navTutup()" ' +
    'aria-label="Tutup daftar isi">✕</button>' +
  '</div>';

  /* kemajuan seluruh kelas */
  var semuaPtm = d.pertemuan || [];
  var wajib = semuaPtm.filter(function (p) { return p.wajib; });
  var beres = wajib.filter(function (p) { return p.selesai; });
  var persen = wajib.length
    ? Math.round(beres.length / wajib.length * 100) : 0;
  h += '<div class="sisi-progres">' +
    '<div class="baris-antara kecil mb-4">' +
      '<span class="lembut">Kemajuan kelas</span>' +
      '<span class="tebal">' + persen + '%</span>' +
    '</div>' +
    '<div class="bilah"><div class="bilah-isi" style="width:' + persen + '%"></div></div>' +
  '</div>';

  h += '<nav class="sisi-daftar">';

  /* --- daftar isi: materi pokok → pertemuan → item --- */
  var daftarMp = d.materi_pokok || [];

  if (daftarMp.length) {
    daftarMp.forEach(function (m) {
      h += navBlokMateriPokok(m);
    });
  } else {
    /* Kelas lama yang belum punya materi pokok, atau payload dari
       versi sebelumnya. Tampilkan pertemuan langsung — sidebar tidak
       boleh kosong hanya karena strukturnya belum dimutakhirkan. */
    semuaPtm.forEach(function (p) { h += navBlokPertemuan(p, ''); });
  }


  h += '</nav>';
  el.innerHTML = h;
}

/**
 * Satu blok pertemuan di sidebar.
 * Dipisah dari navGambar() supaya bisa dipakai baik di dalam
 * pembungkus Materi Pokok maupun langsung (kelas tanpa bab).
 *
 * @param {Object} p        pertemuan
 * @param {string} nomorMp  nomor materi pokok ('2') atau '' bila datar
 */
function navBlokPertemuan(p, nomorMp) {
  var s = '';
    var iniPtm = p.pertemuan_id === Nav.aktifPtm;
    /* Pelipatan sepenuhnya mengikuti pilihan pengguna — termasuk untuk
       pertemuan yang sedang dibuka, supaya daftar panjang bisa
       diringkas. Pertemuan lain default terbuka. */
    var dilipat = Nav.lipat[p.pertemuan_id] === true;

    var tanda = !p.terbuka ? '<span class="tanda-kunci">🔒</span>'
      : p.selesai ? '<span class="tanda-beres">✓</span>'
      : '<span class="tanda-angka">' + p.item_selesai + '/' +
        (p.jml_wajib || p.jml_item) + '</span>';

    s += '<div class="sisi-ptm' + (iniPtm ? ' aktif' : '') +
           (!p.terbuka ? ' terkunci' : '') + '">' +
      '<button class="sisi-ptm-judul" onclick="navKlikPtm(\'' +
        esc(p.pertemuan_id) + '\', ' + (p.terbuka ? 'true' : 'false') + ')">' +
        '<span class="panah' + (dilipat ? '' : ' turun') + '">›</span>' +
        '<span class="tumbuh"><span class="kecil lembut">' +
          esc(labelPtm(p, nomorMp)) + '</span>' +
        '<span class="sisi-ptm-teks">' + esc(p.judul) + '</span></span>' +
        tanda +
      '</button>';

    if (!dilipat) {
      /* `item` bisa tidak ada bila payload lama/terpotong — jangan
         biarkan seluruh sidebar gagal digambar karena satu pertemuan. */
      var daftarItem = p.item || [];
      if (!p.terbuka) {
        s += '<div class="sisi-kunci-ket">Selesaikan pertemuan sebelumnya</div>';
      } else if (!daftarItem.length) {
        s += '<div class="sisi-kunci-ket">Belum ada isi</div>';
      } else {
        s += '<ul class="sisi-item">';
        daftarItem.forEach(function (i) {
          var ini = i.item_id === Nav.aktifItem;
          var kelas = 'sisi-item-baris' + (ini ? ' aktif' : '') +
                      (!i.terbuka ? ' terkunci' : '');
          var ikon = !i.terbuka ? '🔒'
            : i.status === 'selesai' ? '✅'
            : i.status === 'menunggu' ? '⏳'
            : (IKON_ITEM[i.tipe] || '📌');

          var ket = '';
          if (i.tipe === 'materi' && i.jml_bagian > 1 && i.terbuka &&
              i.status !== 'selesai') {
            ket = '<span class="sisi-ket">bagian ' +
              Math.min(i.bagian_terakhir + 1, i.jml_bagian) + '/' +
              i.jml_bagian + '</span>';
          } else if (i.status === 'menunggu') {
            ket = '<span class="sisi-ket">menunggu nilai</span>';
          } else if (i.nilai !== '' && i.nilai !== null &&
                     i.nilai !== undefined) {
            ket = '<span class="sisi-ket">nilai ' + esc(i.nilai) + '</span>';
          }

          s += '<li><button class="' + kelas + '" onclick="navKlikItem(\'' +
            esc(i.item_id) + '\',\'' + esc(i.tipe) + '\',' +
            (i.terbuka ? 'true' : 'false') + ')">' +
            '<span class="sisi-ikon">' + ikon + '</span>' +
            '<span class="tumbuh"><span class="sisi-item-teks">' +
              esc(i.judul) + '</span>' + ket + '</span>' +
            (i.wajib ? '' : '<span class="sisi-opsional">opsional</span>') +
            '</button></li>';
        });
        s += '</ul>';
      }
    }
    s += '</div>';
  return s;
}

/** Nomor bertingkat "2.3" bila ada materi pokok, "Pertemuan 3" bila tidak. */
function labelPtm(p, nomorMp) {
  var jenis = p.jenis || 'biasa';
  var nama = jenis === 'ujian' ? 'Ujian' :
             jenis === 'refleksi' ? 'Refleksi' : 'Pertemuan';
  return nomorMp ? nama + ' ' + nomorMp + '.' + p.urutan
                 : nama + ' ' + p.urutan;
}

/** Satu Materi Pokok beserta pertemuan di dalamnya. */
function navBlokMateriPokok(m) {
  var dilipat = Nav.lipatMp[m.mp_id] === true;
  var tanda = !m.terbuka ? '<span class="tanda-kunci">\uD83D\uDD12</span>'
    : m.selesai ? '<span class="tanda-beres">\u2713</span>'
    : '<span class="tanda-angka">' + m.pertemuan_selesai + '/' +
      (m.jml_wajib || m.jml_pertemuan) + '</span>';

  var s = '<div class="sisi-mp' + (!m.terbuka ? ' terkunci' : '') + '">' +
    '<button class="sisi-mp-judul" onclick="navKlikMp(\'' +
      esc(m.mp_id) + '\')">' +
      '<span class="panah' + (dilipat ? '' : ' turun') + '">\u203A</span>' +
      '<span class="tumbuh">' +
        '<span class="kecil lembut">Materi Pokok ' + m.urutan + '</span>' +
        '<span class="sisi-mp-teks">' + esc(m.judul) + '</span>' +
      '</span>' + tanda +
    '</button>';

  if (!dilipat) {
    if (!m.terbuka) {
      s += '<div class="sisi-kunci-ket">Selesaikan materi pokok sebelumnya</div>';
    } else if (!m.pertemuan || !m.pertemuan.length) {
      s += '<div class="sisi-kunci-ket">Belum ada pertemuan</div>';
    } else {
      s += '<div class="sisi-mp-isi">';
      m.pertemuan.forEach(function (p) {
        s += navBlokPertemuan(p, String(m.urutan));
      });
      s += '</div>';
    }
  }
  return s + '</div>';
}

/** Lipat / buka satu Materi Pokok. */
function navKlikMp(mpId) {
  Nav.lipatMp[mpId] = !Nav.lipatMp[mpId];
  navGambar();
}

function navKlikPtm(pertemuanId, terbuka) {
  if (!terbuka) {
    toast('Selesaikan pertemuan sebelumnya dahulu.', 'peringatan');
    return;
  }
  /* Klik pertemuan yang SEDANG dibuka = lipat/buka daftar itemnya.
     Penanda aktif TIDAK boleh dikosongkan — dulu begitu, akibatnya
     pertemuan yang sudah dilipat tidak pernah bisa dibuka lagi
     karena cabang ini tak pernah tercapai lagi. */
  if (pertemuanId === Nav.aktifPtm) {
    Nav.lipat[pertemuanId] = !Nav.lipat[pertemuanId];
    navGambar();
    return;
  }
  navTutup();
  pergiKe('#/belajar/' + pertemuanId);
}

function navKlikItem(itemId, tipe, terbuka) {
  if (!terbuka) {
    toast('Item ini masih terkunci.', 'peringatan');
    return;
  }
  navTutup();
  if (tipe === 'materi') pergiKe('#/baca/' + itemId);
  else if (tipe === 'lkpd') pergiKe('#/lkpd/' + itemId);
  else if (tipe === 'quiz') pergiKe('#/quiz/' + itemId);
  else if (tipe === 'refleksi') pergiKe('#/refleksi/' + itemId);
  else if (tipe === 'tugas_kelompok') pergiKe('#/tugas-kelompok/' + itemId);
}

/* ---------------------------------------------- Sebelumnya / Berikutnya */

/** Tetangga satu item dalam rantai datar seluruh kelas. */
function navTetangga(itemId) {
  var kosong = { sebelum: null, sesudah: null, posisi: 0, total: 0 };
  if (!Nav.data || !Nav.data.rantai) return kosong;

  var r = Nav.data.rantai;
  var idx = -1;
  for (var i = 0; i < r.length; i++) {
    if (r[i].item_id === itemId) { idx = i; break; }
  }
  if (idx < 0) return kosong;
  return {
    sebelum: idx > 0 ? r[idx - 1] : null,
    sesudah: idx < r.length - 1 ? r[idx + 1] : null,
    posisi: idx + 1,
    total: r.length
  };
}

/**
 * Bilah tombol Sebelumnya / Berikutnya untuk halaman item.
 * @param {string} itemId item yang sedang dibuka
 * @param {Object} opsi   { labelSesudah } untuk mengganti teks tombol kanan
 */
function navBilahItem(itemId, opsi) {
  opsi = opsi || {};
  var t = navTetangga(itemId);
  if (!t.total) return '';

  var kiri = t.sebelum
    ? '<button class="btn btn-hantu btn-kecil" onclick="navKe(\'' +
      esc(t.sebelum.item_id) + '\',\'' + esc(t.sebelum.tipe) + '\')">' +
      '← ' + esc(_potong(t.sebelum.judul, 22)) + '</button>'
    : '<span></span>';

  var kanan = t.sesudah
    ? '<button class="btn btn-kecil" onclick="navKe(\'' +
      esc(t.sesudah.item_id) + '\',\'' + esc(t.sesudah.tipe) + '\')">' +
      esc(opsi.labelSesudah || _potong(t.sesudah.judul, 22)) + ' →</button>'
    : '<span class="kecil lembut">Item terakhir</span>';

  return '<div class="bilah-nav">' + kiri +
    '<span class="kecil lembut">' + t.posisi + ' dari ' + t.total + '</span>' +
    kanan + '</div>';
}

function navKe(itemId, tipe) {
  if (tipe === 'materi') pergiKe('#/baca/' + itemId);
  else if (tipe === 'lkpd') pergiKe('#/lkpd/' + itemId);
  else if (tipe === 'quiz') pergiKe('#/quiz/' + itemId);
  else if (tipe === 'refleksi') pergiKe('#/refleksi/' + itemId);
  else if (tipe === 'tugas_kelompok') pergiKe('#/tugas-kelompok/' + itemId);
}

function _potong(t, n) {
  t = String(t || '');
  return t.length > n ? t.slice(0, n - 1) + '…' : t;
}

/**
 * Pasang sidebar pada halaman item (baca / LKPD / quiz).
 * Menandai item aktif, memuat indeks bila perlu, lalu menggambar.
 *
 * @param {string} kelasId
 * @param {string} pertemuanId
 * @param {string} itemId
 * @returns {Promise}
 */
function navPasangItem(kelasId, pertemuanId, itemId) {
  Nav.aktifItem = itemId;
  Nav.aktifPtm = pertemuanId;
  return navMuat(kelasId).then(function () { navGambar(); });
}
</script>
