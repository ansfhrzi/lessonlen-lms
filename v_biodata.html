<template id="tpl-biodata">
  <div class="layar-login">
    <div class="kotak-login">

      <div class="login-merek">
        <div class="ikon">🪪</div>
        <h1>Lengkapi Biodata</h1>
        <p id="bio-sapaan">Data ini dipakai guru untuk menghubungi Anda</p>
      </div>

      <form id="form-biodata">
        <div class="grup">
          <label for="in-nisn">NISN</label>
          <input class="isian" id="in-nisn" type="text"
                 inputmode="numeric" autocomplete="off"
                 placeholder="mis. 0098765432">
          <span class="bantuan">Angka saja. Kosongkan bila NISN Anda
            belum terbit.</span>
        </div>

        <div class="grup">
          <label for="in-email">Email <span class="wajib">*</span></label>
          <input class="isian" id="in-email" type="email"
                 autocomplete="email" placeholder="nama@gmail.com" required>
        </div>

        <div class="grup">
          <label for="in-wa">Nomor WhatsApp <span class="wajib">*</span></label>
          <input class="isian" id="in-wa" type="tel"
                 inputmode="tel" autocomplete="tel"
                 placeholder="081234567890" required>
          <span class="bantuan">Boleh ditulis 0812… atau +62812…
            Nomor akan dirapikan otomatis.</span>
        </div>

        <div class="pesan-salah" id="salah-biodata"></div>

        <button class="btn btn-penuh mt-8" type="submit" id="btn-simpan-bio">
          Simpan Biodata
        </button>
        <button class="btn btn-hantu btn-penuh mt-8" type="button"
                id="btn-nanti-bio">Nanti Saja</button>
      </form>

    </div>
  </div>
</template>
