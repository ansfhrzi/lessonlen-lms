<template id="tpl-login">
  <div class="layar-login">
    <div class="kotak-login">

      <div class="login-merek">
        <!-- Diisi js_auth dari APP_IKON / APP_NAMA (v1.15.6).
             Nilai di sini hanya cadangan bila Code.gs belum
             tersalin — layar masuk tidak boleh kosong. -->
        <div class="ikon" id="merek-ikon-login">🌱</div>
        <h1 id="merek-nama-login">LessonLen</h1>
        <p>Belajar bertahap, tuntas per pertemuan</p>
      </div>

      <form id="form-login" autocomplete="on">
        <div class="grup">
          <label for="in-username">Nama Pengguna</label>
          <input class="isian" id="in-username" name="username"
                 autocomplete="username" placeholder="mis. siswa01"
                 autocapitalize="off" spellcheck="false" required>
        </div>

        <div class="grup">
          <label for="in-password">Kata Sandi</label>
          <input class="isian" id="in-password" name="password" type="password"
                 autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <div class="pesan-salah" id="salah-login"></div>

        <button class="btn btn-penuh mt-8" type="submit" id="btn-masuk">Masuk</button>
      </form>

      <div class="tengah mt-16">
        <button class="btn btn-teks kecil" id="btn-lupa">Lupa kata sandi?</button>
        <!-- v1.17.0 — jalur pemulihan username. Dipisah dari "Lupa kata
             sandi?" karena dua masalah ini berbeda: yang ini SELESAI di
             sini tanpa melibatkan guru, yang itu tidak. -->
        <button class="btn btn-teks kecil" id="btn-pulihkan">Lupa nama pengguna?</button>
      </div>

    </div>
  </div>
</template>


<template id="tpl-lupa">
  <div>
    <div class="grup">
      <label for="in-lupa">Nama pengguna atau email</label>
      <input class="isian" id="in-lupa" placeholder="mis. siswa01"
             autocapitalize="off" spellcheck="false">
      <span class="bantuan">
        Permintaan akan diteruskan ke guru. Anda akan diberi
        kata sandi sementara.
      </span>
    </div>
  </div>
</template>


<!-- ============ potongan: pulihkan nama pengguna (v1.17.0) ============ -->
<template id="tpl-pulihkan">
  <div>
    <div class="grup">
      <label for="in-pulih-email">Email yang Anda daftarkan</label>
      <input class="isian" id="in-pulih-email" type="email"
             placeholder="mis. nama@gmail.com"
             autocapitalize="off" spellcheck="false" autocomplete="email">
    </div>
    <div class="grup">
      <label for="in-pulih-wa">Nomor WhatsApp yang Anda daftarkan</label>
      <input class="isian" id="in-pulih-wa" type="tel"
             placeholder="mis. 081234567890"
             autocapitalize="off" spellcheck="false" autocomplete="tel">
      <span class="bantuan">
        Keduanya harus sama persis dengan yang Anda isi di
        <b>Lengkapi Biodata</b>. Bila belum pernah mengisi, temui
        guru Anda langsung.
      </span>
    </div>
  </div>
</template>
