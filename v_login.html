<template id="tpl-login">
  <div class="layar-masuk">
    <div class="kartu kartu-masuk">
      <div class="merek-besar"><span class="merek-ikon" id="login-ikon"></span><span id="login-nama"></span></div>
      <p class="lembut kecil mb-16" id="login-sub">Masuk untuk belajar atau mengajar.</p>
      <form id="form-masuk">
        <label>Nama pengguna</label>
        <input type="text" id="in-user" autocomplete="username" required>
        <label>Kata sandi</label>
        <input type="password" id="in-sandi" autocomplete="current-password" required>
        <button class="btn btn-penuh mt-16" type="submit">Masuk</button>
      </form>
      <p class="kecil lembut mt-16" style="text-align:center">Lupa akun? Hubungi guru.</p>
    </div>
  </div>
</template>

<template id="tpl-ganti">
  <div class="layar-masuk">
    <div class="kartu kartu-masuk">
      <h2>Ganti kata sandi</h2>
      <p class="lembut kecil mb-16">Akun baru wajib mengganti kata sandi sementara.</p>
      <form id="form-ganti">
        <label>Kata sandi lama</label>
        <input type="password" id="in-lama" required>
        <label>Kata sandi baru</label>
        <input type="password" id="in-baru" required>
        <p class="bantuan">Minimal 6 karakter, memuat huruf dan angka.</p>
        <button class="btn btn-penuh mt-16" type="submit">Simpan</button>
      </form>
    </div>
  </div>
</template>
